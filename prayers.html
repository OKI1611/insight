<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="/content-loader.js"></script>
  <script src="/site-header.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>위대한 기도자 — BIBLY 바이블 인사이트</title>
  <meta name="description" content="삶의 자리별 대표 기도, 시편의 기도, 예수님의 기도, 기도의 사람들 — 위대한 믿음 시리즈, 위대한 기도자." />
  <link rel="canonical" href="https://biblynote.com/prayers" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BIBLY 바이블 인사이트" />
  <meta property="og:title" content="위대한 기도자 — Great Prayers" />
  <meta property="og:description" content="삶의 굽이마다 드리는 성경의 기도 — 시편·예수님의 기도와 기도의 사람들." />
  <meta property="og:url" content="https://biblynote.com/prayers" />
  <meta property="og:image" content="https://biblynote.com/images/og-cover.png?v=2" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://biblynote.com/images/og-cover.png?v=2" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#15203a" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#15203a', navy:'#1b2a4a', gold:'#b8923f', sand:'#e9edf3', paper:'#f5f7fa' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'], display:['"Noto Serif KR"','Pretendard','serif'] },
      boxShadow: { soft:'0 2px 10px -4px rgba(21,32,58,.10)', card:'0 14px 40px -18px rgba(21,32,58,.22)' }
    }}}
  </script>
  <style>h1,h2,.serif{font-family:'Noto Serif KR',Pretendard,serif}</style>
</head>
<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <div id="siteHeader" data-active="prayers.html"></div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="text-center mb-7">
      <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">GREAT FAITH · 위대한 믿음</p>
      <h1 class="text-3xl md:text-4xl font-bold leading-tight">위대한 기도자</h1>
      <p id="introText" class="text-ink/60 text-base md:text-lg mt-4 max-w-2xl mx-auto leading-relaxed">삶의 굽이마다 드리는 성경의 기도 — 시편과 예수님의 기도, 그리고 기도의 사람들.</p>
    </div>

    <div class="grid lg:grid-cols-[220px_1fr] gap-6">
      <!-- 좌측 사이드 (위대한 믿음) -->
      <aside class="lg:sticky lg:top-20 h-fit space-y-4">
        <div>
          <p class="text-[11px] font-bold text-gold tracking-[0.2em] mb-2 px-1">위대한 믿음</p>
          <div class="bg-white rounded-2xl border border-ink/8 shadow-soft overflow-hidden">
            <a href="preachers.html" class="flex items-center gap-2.5 px-4 py-3 text-sm font-semibold hover:bg-ink/[0.03] transition border-b border-ink/6"><span>🎙️</span> 위대한 설교자</a>
            <a href="prayers.html" class="flex items-center gap-2.5 px-4 py-3 text-sm font-bold bg-gold/10 text-gold"><span>🙏</span> 위대한 기도자</a>
          </div>
        </div>
        <div id="sectionNav" class="hidden lg:block bg-white rounded-2xl border border-ink/8 shadow-soft overflow-hidden"></div>
      </aside>

      <!-- 본문 -->
      <div id="content" class="min-w-0 space-y-10">
        <p class="text-ink/40 text-sm text-center py-16">불러오는 중…</p>
      </div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    fetch('content/prayers.json?t='+Date.now()).then(r=>r.json()).then(d=>{
      if(d.intro){ const t=$('introText'); if(t) t.textContent = d.intro; }
      const secs = d.sections || [];
      // 섹션 바로가기(좌측)
      $('sectionNav').innerHTML = '<p class="px-4 py-2.5 text-xs font-bold text-ink/45 border-b border-ink/8">기도 모음</p>' + secs.map(s=>
        `<a href="#sec-${s.id}" onclick="event.preventDefault();var el=document.getElementById('sec-${s.id}');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});" class="block px-4 py-2.5 text-sm hover:bg-ink/[0.03] border-b border-ink/5 last:border-0">${esc(s.icon||'')} ${esc(s.title)}</a>`).join('');
      // 본문
      $('content').innerHTML = secs.map(s=>`
        <section id="sec-${s.id}" class="scroll-mt-24">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-2xl">${esc(s.icon||'🙏')}</span>
            <h2 class="text-2xl font-bold">${esc(s.title)}</h2>
            <span class="text-ink/35 text-xs ml-auto">${(s.items||[]).length}개</span>
          </div>
          ${s.desc?`<p class="text-ink/55 text-[15px] mb-4 leading-relaxed">${esc(s.desc)}</p>`:''}
          <div class="${s.id==='figures'?'grid sm:grid-cols-2 gap-3':'space-y-3'}">
            ${(s.items||[]).map(it=>itemCard(it, s.id)).join('')}
          </div>
        </section>`).join('');
    }).catch(()=>{ $('content').innerHTML = '<p class="text-red-500 text-sm text-center py-16">기도 콘텐츠를 불러오지 못했습니다.</p>'; });

    function itemCard(it, sid){
      const meta = it.meta ? `<p class="text-xs text-ink/45 mt-0.5">${esc(it.meta)}</p>` : '';
      const ref  = it.ref ? `<span class="text-gold text-sm font-semibold shrink-0">${esc(it.ref)}</span>` : '';
      const ko   = it.ko ? `<p class="${sid==='figures'?'text-[14.5px] text-ink/70 leading-relaxed mt-2':'serif text-[16.5px] text-ink/85 leading-[1.85] mt-2.5'}">${esc(it.ko)}</p>` : '';
      const note = it.note ? `<p class="text-[13px] text-ink/55 mt-2.5 border-l-2 border-gold/30 pl-3 leading-relaxed">${esc(it.note)}</p>` : '';
      return `<div class="bg-white rounded-2xl border border-ink/8 shadow-soft p-5">
        <div class="flex items-baseline justify-between gap-2">
          <p class="font-bold text-[16px] leading-snug">${esc(it.label||'')}</p>
          ${ref}
        </div>${meta}${ko}${note}
      </div>`;
    }
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="auth-header.js"></script>
</body>
</html>

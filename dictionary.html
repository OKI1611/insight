<body class="font-sans bg-paper text-neutral-900 antialiased min-h-screen">

  <div id="siteHeader" data-active="dictionary.html"></div>

  <!-- 히어로 + 검색 -->
  <section class="bg-white border-b border-ink/8">
    <div class="max-w-3xl mx-auto px-5 py-12 md:py-14 text-center">
      <img src="/images/bible-insight-emblem.png" alt="Bible Insight" style="height:46px;width:auto;margin:0 auto 12px;display:block" />
      <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-3">Bible Dictionary · 성경사전</p>
      <h1 class="text-2xl md:text-[32px] font-bold leading-tight">바이블 인사이트 <span class="text-gold">성경사전</span></h1>
      <p class="text-neutral-900/60 text-sm md:text-[15px] mt-3 leading-relaxed max-w-xl mx-auto">성경 속 단어를 <b class="text-neutral-900">원어·영어 용어·관련 성구</b>와 함께 깊이 있게 찾아보세요. 궁금한 말씀, 언제든 검색하는 나만의 키워드 사전.</p>
      <div class="relative mt-6 max-w-lg mx-auto">
        <input id="q" type="search" autocomplete="off" placeholder="단어를 검색하세요 (예: 은혜, 언약, grace…)" oninput="render()" class="w-full border border-ink/15 rounded-full pl-12 pr-4 py-3.5 text-[15px] outline-none focus:border-gold shadow-soft bg-white" />
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-900/35 text-lg"></span>
      </div>
      <p class="text-neutral-900/40 text-xs mt-3"><span id="count">–</span>개의 표제어 · 원어와 성구로 깊이 있게</p>
    </div>
  </section>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <!-- 분류 필터 -->
    <div id="cats" class="flex flex-wrap gap-2 mb-3"></div>
    <!-- 자모 인덱스 -->
    <div id="index" class="flex flex-wrap gap-1 mb-5 text-sm"></div>

    <div id="results" class="space-y-3"></div>
    <div id="empty" class="hidden text-center text-neutral-900/45 py-16">
      <p class="text-4xl mb-3"></p>
      <p class="font-semibold">찾으시는 단어가 아직 없어요.</p>
      <p class="text-sm mt-1">다른 검색어로 찾아보시거나, 곧 더 많은 표제어가 추가됩니다.</p>
    </div>

    <p class="text-[11px] text-neutral-900/35 text-center mt-10 leading-relaxed">
      ※ 바이블 인사이트 성경사전은 히브리어·헬라어 원어와 성경 본문을 직접 참고하여 <b class="text-neutral-900/55">자체 집필</b>한 사전입니다.
      뜻풀이·영어 용어·관련 성구를 함께 제공하며, 표제어는 계속 추가됩니다.
    </p>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    let DATA=[], CAT='전체', INITIAL='', FAQ_TOPIC='';
    let BROWSE=24, LASTSIG='';   // '전체' 둘러보기 시 24개씩 '더 보기'로 점진 표시(스크롤 단축)
    function showMore(){ BROWSE+=24; render(); }
    const CATS=['전체','자주 묻는 질문','교리','인물','지명','사물·자연','절기·제도','종말론','기타'];
    const FAQ_TOPICS=[
      {n:'구원·믿음', ic:''},{n:'하나님·예수·삼위일체', ic:''},{n:'성경·창조', ic:''},
      {n:'신앙생활', ic:''},{n:'교회·예배·헌금', ic:''},{n:'성령·은사', ic:''},
      {n:'윤리·관계·문화', ic:''},{n:'죽음·종말·천국', ic:''}
    ];
    function setFaqTopic(t){ FAQ_TOPIC=t; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function renderFaqTopics(){
      const counts={}; DATA.forEach(e=>{ if(e.category==='자주 묻는 질문') counts[e.faqTopic||'기타']=(counts[e.faqTopic||'기타']||0)+1; });
      const total=Object.values(counts).reduce((a,b)=>a+b,0);
      $('count').textContent=total.toLocaleString(); $('empty').classList.add('hidden');
      const cards=FAQ_TOPICS.filter(t=>counts[t.n]).map(t=>
        `<button onclick="setFaqTopic('${t.n.replace(/'/g,"\\'")}')" class="group bg-white rounded-2xl border border-ink/8 shadow-soft p-5 text-left hover:-translate-y-0.5 hover:border-gold/40 hover:shadow-card transition">
          <div class="text-3xl mb-2.5">${t.ic}</div>
          <p class="font-bold text-neutral-900 text-[15px] group-hover:text-gold transition">${esc(t.n)}</p>
          <p class="text-xs text-neutral-900/45 mt-1">질문 ${counts[t.n]}개 →</p></button>`).join('');
      $('results').innerHTML=`<p class="text-sm text-neutral-900/55 mb-4">궁금한 <b class="text-neutral-900">주제를 선택</b>하면 관련 질문을 모아서 볼 수 있어요.</p>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cards}</div>`;
    }
    // 한글 초성
    const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const IDX=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','A-Z'];
    function initialOf(s){ const c=(s||'').charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3){ return CHO[Math.floor((c-0xAC00)/588)].replace(/[ㄲ]/,'ㄱ').replace(/[ㄸ]/,'ㄷ').replace(/[ㅃ]/,'ㅂ').replace(/[ㅆ]/,'ㅅ').replace(/[ㅉ]/,'ㅈ'); } if(/[A-Za-z]/.test(s||'')) return 'A-Z'; return ''; }

    $('results').innerHTML='<div class="text-center text-neutral-900/40 py-16"><p class="text-3xl mb-3 animate-pulse"></p><p class="text-sm">성경사전을 불러오는 중…</p></div>';
    // 캐시 무력화(?t=Date.now) 제거 — 서버의 ETag/304 재검증으로 변경 없으면 즉시 로딩, 변경 시 자동 최신화
    fetch('dictionary/entries.json').then(r=>r.json()).then(d=>{
      DATA=(Array.isArray(d)?d:[]).sort((a,b)=>(a.term||'').localeCompare(b.term||'','ko'));
      $('count').textContent=DATA.length.toLocaleString();
      buildCats(); buildIndex(); render();
      // ?q= 또는 #term 진입
      const sp=new URLSearchParams(location.search); const q=sp.get('q')||decodeURIComponent((location.hash||'').replace('#',''));
      if(q){ $('q').value=q; render(); }
    }).catch(()=>{ $('results').innerHTML='<p class="text-center text-neutral-900/40 py-10">사전을 불러오지 못했어요.</p>'; });

    function buildCats(){
      const present=new Set(DATA.map(e=>e.category).filter(Boolean));
      $('cats').innerHTML=CATS.filter(c=>c==='전체'||present.has(c)).map(c=>
        `<button onclick="setCat('${c}')" data-cat="${c}" class="cat-btn text-xs font-semibold px-3.5 py-1.5 rounded-full border transition ${c===CAT?'bg-gold text-white border-ink':'bg-white text-neutral-900/60 border-ink/15 hover:border-ink/30'}">${c}</button>`
      ).join('');
    }
    function buildIndex(){
      const present=new Set(DATA.map(e=>initialOf(e.term)).filter(Boolean));
      $('index').innerHTML='<button onclick="setInitial(\'\')" class="idx px-2 py-1 rounded font-semibold '+(INITIAL===''?'text-gold':'text-neutral-900/45 hover:text-neutral-900')+'">전체</button>'+
        IDX.filter(i=>present.has(i)).map(i=>`<button onclick="setInitial('${i}')" class="idx px-2 py-1 rounded ${INITIAL===i?'text-gold font-bold':'text-neutral-900/45 hover:text-neutral-900'}">${i}</button>`).join('');
    }
    function setCat(c){ CAT=c; FAQ_TOPIC=''; INITIAL=''; buildCats(); buildIndex(); render(); }
    function setInitial(i){ INITIAL=i; $('q').value=''; buildIndex(); render(); }
    function searchTerm(t){ $('q').value=t; INITIAL=''; CAT='전체'; buildCats(); buildIndex(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

    function hl(text, q){ if(!q) return esc(text); const safe=esc(text); try{ const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return safe.replace(re,'<mark>$1</mark>'); }catch(e){ return safe; } }

    function render(){
      const q=($('q').value||'').trim().toLowerCase();
      const idxEl=$('index');
      // ===== FAQ 주제별 모드(검색어 없을 때) =====
      if(CAT==='자주 묻는 질문' && !q){
        if(idxEl) idxEl.style.display='none';
        if(!FAQ_TOPIC){ renderFaqTopics(); return; }
        const tl=DATA.filter(e=>e.category==='자주 묻는 질문' && (e.faqTopic||'기타')===FAQ_TOPIC);
        $('count').textContent=tl.length.toLocaleString(); $('empty').classList.add('hidden');
        const tm=FAQ_TOPICS.find(x=>x.n===FAQ_TOPIC)||{ic:''};
        const head=`<button onclick="setFaqTopic('')" class="inline-flex items-center gap-1 text-sm font-semibold text-gold mb-3 hover:underline">← 주제 전체 보기</button>
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2">${tm.ic} ${esc(FAQ_TOPIC)} <span class="text-sm font-semibold text-neutral-900/40">${tl.length}</span></h2>`;
        $('results').innerHTML=head+tl.map(e=>card(e,'')).join('');
        return;
      }
      if(idxEl) idxEl.style.display='';
      let list=DATA.filter(e=>{
        if(CAT!=='전체' && e.category!==CAT) return false;
        if(INITIAL && initialOf(e.term)!==INITIAL) return false;
        if(q){ const deepTxt=(e.deep||[]).map(s=>(s.h||'')+' '+(s.p||'')).join(' '); const hay=((e.term||'')+' '+(e.en||'')+' '+(e.original||'')+' '+(e.def||'')+' '+deepTxt+' '+((e.related||[]).join(' '))).toLowerCase(); if(!hay.includes(q)) return false; }
        return true;
      });
      // 검색어가 있으면 관련도순 정렬(정확 일치 표제어 → 시작 일치 → 포함 → 영어 → 본문만 매칭)
      if(q){
        const score=e=>{ const t=(e.term||'').toLowerCase(), en=(e.en||'').toLowerCase();
          if(t===q) return 0; if(t.indexOf(q)===0) return 1; if(t.indexOf(q)>=0) return 2;
          if(en===q) return 3; if(en.indexOf(q)>=0) return 4; return 5; };
        list.sort((a,b)=> score(a)-score(b) || (a.term||'').localeCompare(b.term||'','ko'));
      }
      $('count').textContent=list.length.toLocaleString();
      if(!list.length){ $('results').innerHTML=''; $('empty').classList.remove('hidden'); return; }
      $('empty').classList.add('hidden');
      // 필터(카테고리·초성·검색어)가 바뀌면 '더 보기' 개수 초기화
      const sig=CAT+'|'+INITIAL+'|'+q;
      if(sig!==LASTSIG){ BROWSE=24; LASTSIG=sig; }
      const cap = q ? 400 : (INITIAL ? 400 : BROWSE);
      const shown=list.slice(0,cap);
      let moreHtml='';
      if(list.length>cap){
        moreHtml = (!q && !INITIAL)
          ? `<div class="text-center py-6"><button onclick="showMore()" class="bg-gold/10 text-gold border border-gold/30 font-semibold text-sm px-8 py-3 rounded-full hover:bg-gold/20 transition">더 보기 <span class="text-neutral-900/40 font-normal ml-1">${cap.toLocaleString()} / ${list.length.toLocaleString()}</span></button><p class="text-neutral-900/35 text-xs mt-3">위 검색창이나 초성(ㄱㄴㄷ)으로 더 빠르게 찾을 수 있어요</p></div>`
          : `<p class="text-center text-neutral-900/40 text-sm py-4">검색어를 입력하면 더 정확히 찾을 수 있어요 (${list.length.toLocaleString()}개 중 ${cap}개 표시)</p>`;
      }
      $('results').innerHTML=shown.map(e=>card(e,q)).join('') + moreHtml;
    }

    function card(e,q){
      const scr=(e.scriptures||[]).map(s=>`<button type="button" class="scrchip inline-block bg-sand/70 hover:bg-gold/20 text-neutral-900/75 text-[11px] px-2 py-0.5 rounded mr-1 mb-1 transition" onclick="showScr(event,'${esc(s).replace(/'/g,"\\'")}')">${esc(s)} <span class="text-neutral-900/30"></span></button>`).join('');
      const rel=(e.related||[]).map(r=>`<button onclick="searchTerm('${esc(r).replace(/'/g,"\\'")}')" class="text-gold text-xs hover:underline mr-2">#${esc(r)}</button>`).join('');
      const isFaq=e.category==='자주 묻는 질문';
      // 상세 설명(deep): 다단락 펼침
      let deepHtml='';
      if(Array.isArray(e.deep)&&e.deep.length){
        const secs=e.deep.map(s=>{
          if(s.misc){ return `<div class="bg-[#fbf3e6] border-l-2 border-gold/60 rounded-r-lg px-3.5 py-2.5"><p class="text-[12.5px] font-bold text-gold mb-0.5">${esc(s.h||'흔한 오해')}</p><p class="text-[13.5px] text-neutral-900/80 leading-[1.9]">${esc(s.p||'')}</p></div>`; }
          return `<div>${s.h?`<h4 class="font-bold text-neutral-900 text-[14px] mb-1">${esc(s.h)}</h4>`:''}<p class="text-[13.5px] text-neutral-900/80 leading-[1.9]">${esc(s.p||'')}</p></div>`;
        }).join('');
        deepHtml=`<details class="mt-3 deep">
          <summary class="cursor-pointer select-none inline-flex items-center gap-1.5 text-[13px] font-bold text-gold bg-gold/[0.07] hover:bg-gold/[0.12] rounded-full px-3.5 py-1.5 transition">${isFaq?'자세한 답변 보기':'더 깊이 알아보기'}<span class="caret transition">▾</span></summary>
          <div class="mt-3 space-y-3 border-l-2 border-sand pl-4">${secs}</div>
        </details>`;
      }
      return `<article class="bg-white rounded-2xl border ${isFaq?'border-gold/25':'border-ink/8'} shadow-soft p-5">
        <div class="flex items-baseline flex-wrap gap-x-2.5 gap-y-1">
          ${isFaq?'<span class="text-gold font-bold text-lg shrink-0">Q.</span>':''}
          <h2 class="text-lg font-bold text-neutral-900 ${isFaq?'leading-snug':''}">${hl(e.term||'',q)}</h2>
          ${e.en&&!isFaq?`<span class="text-neutral-900/45 text-sm font-medium" style="font-family:Georgia,serif">${hl(e.en,q)}</span>`:''}
          ${e.category?`<span class="ml-auto text-[10px] font-bold text-gold bg-gold/10 px-2 py-0.5 rounded-full shrink-0">${esc(e.category)}</span>`:''}
        </div>
        ${e.original?`<p class="text-[12px] text-neutral-900/45 mt-1">원어 · ${esc(e.original)}</p>`:''}
        <p class="text-[14px] text-neutral-900/80 leading-[1.85] mt-2.5">${isFaq?'<b class="text-neutral-900">한마디로 — </b>':''}${hl(e.def||'',q)}</p>
        ${e.note?`<p class="text-[13px] text-neutral-900/60 leading-relaxed mt-2 bg-sand/50 border-l-2 border-gold/50 rounded-r-lg px-3 py-2">${hl(e.note,q)}</p>`:''}
        ${deepHtml}
        ${scr?`<div class="mt-3">${scr}</div>`:''}
        ${rel?`<div class="mt-2">${rel}</div>`:''}
      </article>`;
    }

    /* ===== 관련구절 말풍선: 클릭 시 본문(짧으면 전문, 길면 핵심요약) ===== */
    (function(){ var st=document.createElement('style'); st.textContent=
      '.scrchip{cursor:pointer;border:0}'
      +'#scrBubble{position:absolute;z-index:130;background:#fff;border:1px solid rgba(33,58,107,.12);border-radius:14px;box-shadow:0 14px 40px -10px rgba(21,32,58,.32);max-width:92vw}'
      +'#scrBubble .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;border-bottom:1px solid rgba(33,58,107,.07)}'
      +'#scrBubble .bh b{color:#00704a;font-size:12.5px}'
      +'#scrBubble .bh button{border:0;background:transparent;color:rgba(33,58,107,.4);cursor:pointer;font-size:13px}'
      +'#scrBubble .bbody{padding:11px 14px 13px;max-height:48vh;overflow:auto}'
      +'#scrBubble .bbody p{color:rgba(33,58,107,.88);line-height:1.78;font-size:13px;margin-bottom:5px}'
      +'#scrBubble .bbody p b{color:#00704a;font-weight:700;margin-right:3px;font-size:11px}'
      +'#scrBubble .bsum{color:#00704a !important;font-weight:700;font-size:12px;margin-bottom:3px}'
      +'#scrBubble .bmore{color:rgba(33,58,107,.45) !important;font-size:12px}'
      +'#scrBubble .blink{display:inline-block;margin-top:6px;color:#00704a;font-weight:600;font-size:12.5px;text-decoration:none}';
      document.head.appendChild(st);
    })();
    var BOOKS_KO={}, PASSAGE_SUMM={};
    var ABBR={'창':'Genesis','출':'Exodus','레':'Leviticus','민':'Numbers','신':'Deuteronomy','수':'Joshua','삿':'Judges','룻':'Ruth','삼상':'1Samuel','삼하':'2Samuel','왕상':'1Kings','왕하':'2Kings','대상':'1Chronicles','대하':'2Chronicles','스':'Ezra','느':'Nehemiah','에':'Esther','욥':'Job','시':'Psalms','잠':'Proverbs','전':'Ecclesiastes','아':'SongofSolomon','사':'Isaiah','렘':'Jeremiah','애':'Lamentations','겔':'Ezekiel','단':'Daniel','호':'Hosea','욜':'Joel','암':'Amos','옵':'Obadiah','욘':'Jonah','미':'Micah','나':'Nahum','합':'Habakkuk','습':'Zephaniah','학':'Haggai','슥':'Zechariah','말':'Malachi','마':'Matthew','막':'Mark','눅':'Luke','요':'John','행':'Acts','롬':'Romans','고전':'1Corinthians','고후':'2Corinthians','갈':'Galatians','엡':'Ephesians','빌':'Philippians','골':'Colossians','살전':'1Thessalonians','살후':'2Thessalonians','딤전':'1Timothy','딤후':'2Timothy','딛':'Titus','몬':'Philemon','히':'Hebrews','약':'James','벧전':'1Peter','벧후':'2Peter','요일':'1John','요이':'2John','요삼':'3John','유':'Jude','계':'Revelation'};
    fetch('bible/books.json').then(function(r){return r.json();}).then(function(bs){ bs.forEach(function(b){ BOOKS_KO[b.ko]=b.file; }); }).catch(function(){});
    fetch('dictionary/passage-summaries.json').then(function(r){return r.ok?r.json():{};}).then(function(j){ PASSAGE_SUMM=j||{}; }).catch(function(){});
    function bookFile(n){ return BOOKS_KO[n]||ABBR[n]||null; }
    function parseRef(s){ var m=String(s||'').trim().match(/^(.+?)\s*(\d+):(\d+)(?:[-~](\d+))?$/); if(!m) return null; var f=bookFile(m[1]); if(!f) return null; return { file:f, ch:+m[2], v1:+m[3], v2:m[4]?+m[4]:+m[3] }; }
    var chCache={};
    function getChapter(file,ch){ var k=file+'-'+ch; if(chCache[k]!==undefined) return Promise.resolve(chCache[k]); return fetch('bible/kr/'+k+'.json').then(function(r){ return r.ok?r.json():null; }).then(function(j){ chCache[k]=j; return j; }).catch(function(){ chCache[k]=null; return null; }); }
    function closeBubble(){ var b=document.getElementById('scrBubble'); if(b) b.remove(); }
    function showBubble(anchor, title, html){
      closeBubble();
      var b=document.createElement('div'); b.id='scrBubble';
      b.innerHTML='<div class="bh"><b>'+esc(title)+'</b><button type="button" onclick="closeBubble()">✕</button></div><div class="bbody">'+html+'</div>';
      document.body.appendChild(b);
      var bw=Math.min(340, window.innerWidth-24); b.style.width=bw+'px';
      var r=anchor.getBoundingClientRect();
      var left=r.left+window.scrollX+r.width/2-bw/2;
      left=Math.max(window.scrollX+12, Math.min(left, window.scrollX+window.innerWidth-bw-12));
      b.style.left=left+'px'; b.style.top=(r.bottom+window.scrollY+9)+'px';
    }
    function showScr(ev, ref){
      ev.stopPropagation();
      var anchor=ev.currentTarget; var p=parseRef(ref);
      if(!p){ showBubble(anchor, ref, '<p class="bmore">구절을 찾을 수 없어요.</p>'); return; }
      var link='bible.html?b='+p.file+'&c='+p.ch+'&v='+p.v1;
      var linkHtml='<a class="blink" href="'+link+'">본문에서 보기 →</a>';
      var isLong=(p.v2-p.v1+1)>3;
      var key=p.file+' '+p.ch+':'+p.v1+'-'+p.v2;
      showBubble(anchor, ref, '<p class="bmore">불러오는 중…</p>');
      if(isLong){
        var sm=PASSAGE_SUMM[key]||PASSAGE_SUMM[ref];
        if(sm){ showBubble(anchor, ref, '<p class="bsum">핵심 요약</p><p>'+esc(sm)+'</p>'+linkHtml); return; }
        getChapter(p.file,p.ch).then(function(ch){
          var h = (ch&&ch[p.v1-1]) ? ('<p>'+esc(ch[p.v1-1])+'</p><p class="bmore">… 외 '+(p.v2-p.v1)+'절</p>') : '<p class="bmore">이 본문은 곧 제공됩니다.</p>';
          showBubble(anchor, ref, h+linkHtml);
        });
        return;
      }
      getChapter(p.file,p.ch).then(function(ch){
        var h='';
        if(ch){ var lines=[]; for(var v=p.v1; v<=p.v2; v++){ if(ch[v-1]) lines.push('<p><b>'+v+'</b>'+esc(ch[v-1])+'</p>'); } h=lines.length?lines.join(''):'<p class="bmore">이 구절은 번역 준비 중입니다.</p>'; }
        else h='<p class="bmore">이 책은 곧 번역됩니다.</p>';
        showBubble(anchor, ref, h+linkHtml);
      });
    }
    document.addEventListener('click', function(e){ if(!e.target.closest('#scrBubble') && !e.target.closest('.scrchip')) closeBubble(); });
  </script>

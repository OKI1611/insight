<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <div id="siteHeader" data-active="preachers.html"></div>

  <main class="max-w-3xl mx-auto px-4 py-9">

    <!-- ===== 목록(목차) ===== -->
    <div id="listView">
      <div class="text-center mb-8">
        <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">GREAT PREACHERS · 위대한 설교자 시리즈</p>
        <h1 class="text-3xl md:text-4xl font-bold leading-tight">위대한 설교자 시리즈</h1>
        <p class="text-ink/60 text-base md:text-lg mt-4 max-w-2xl mx-auto leading-relaxed">
          시대를 깨운 위대한 설교자들의 명설교를 <b class="text-ink/80">칼럼식으로 요약</b>해 전합니다.
          한 편씩 읽으며 은혜를 나누고, <b class="text-gold">댓글</b>로 묵상을 함께 나눠 보세요.
        </p>
      </div>

      <div class="text-right mb-4">
        <button id="writeBtn" onclick="openEditor()" class="hidden bg-ink text-paper text-sm font-semibold px-4 py-2.5 rounded-full hover:bg-navy transition">✏️ 새 글 쓰기</button>
      </div>

      <div id="toc" class="space-y-7"><p class="text-ink/40 text-sm text-center py-12">불러오는 중…</p></div>
    </div>

    <!-- ===== 읽기 ===== -->
    <article id="readView" class="hidden">
      <button onclick="showList()" class="text-sm text-ink/50 hover:text-gold mb-6">← 목록으로</button>
      <div id="rHead"></div>
      <div id="rBody" class="article text-ink/85 text-[16px]"></div>
      <div id="rTakeaways"></div>

      <div id="rAdmin" class="hidden mt-8 pt-4 border-t border-ink/10 text-sm">
        <button onclick="deleteCurrent()" class="text-ink/40 hover:text-red-500">🗑 이 글 삭제</button>
      </div>

      <!-- 댓글 -->
      <section class="mt-12 pt-8 border-t border-ink/10">
        <h2 class="font-bold text-xl mb-1">💬 묵상 나눔 <span id="cCount" class="text-ink/40 text-base font-normal"></span></h2>
        <p class="text-ink/50 text-sm mb-5">이 설교를 읽고 받은 은혜와 적용을 자유롭게 나눠 주세요.</p>
        <div id="cForm" class="mb-6"></div>
        <div id="cList" class="space-y-4"><p class="text-ink/40 text-sm text-center py-6">댓글을 불러오는 중…</p></div>
      </section>
    </article>

    <!-- ===== 관리자 글쓰기 ===== -->
    <div id="editView" class="hidden">
      <button onclick="showList()" class="text-sm text-ink/50 hover:text-gold mb-6">← 취소</button>
      <h2 class="text-2xl font-bold mb-5">새 설교 글 쓰기</h2>
      <div class="space-y-3">
        <div class="grid sm:grid-cols-2 gap-3">
          <input id="fPreacher" placeholder="설교자 (예: 찰스 스펄전)" class="bg-white border border-ink/15 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold" />
          <input id="fPreacherEn" placeholder="설교자 영문 (예: Charles H. Spurgeon)" class="bg-white border border-ink/15 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold" />
        </div>
        <input id="fTitle" placeholder="제목" class="w-full bg-white border border-ink/15 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold" />
        <div class="grid sm:grid-cols-2 gap-3">
          <input id="fSermon" placeholder="원 설교 제목 (예: Songs in the Night)" class="bg-white border border-ink/15 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold" />
          <input id="fScripture" placeholder="본문 성구 (예: 욥기 35:10)" class="bg-white border border-ink/15 rounded-xl px-4 py-3 text-sm outline-none focus:border-gold" />
        </div>
        <div><div id="quillEditor"></div></div>
        <p id="fMsg" class="text-sm text-red-500"></p>
        <div class="flex gap-2">
          <button id="saveBtn" onclick="savePost()" class="bg-gold text-white font-bold px-6 py-3 rounded-full hover:opacity-90 transition">올리기</button>
          <button onclick="showList()" class="text-ink/50 px-4">취소</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const $ = id => document.getElementById(id);
    let isAdmin = false, SESSION = null, SEED = [], DBPOSTS = [], CURRENT = null, quill = null;

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function nl2(s){ return esc(s).replace(/\n/g,'<br>'); }
    // 허용 태그만 남기는 간단 새니타이즈
    function sanitize(html){
      const tpl = document.createElement('template'); tpl.innerHTML = html || '';
      const ok = {P:1,H1:1,H2:1,H3:1,STRONG:1,B:1,EM:1,I:1,U:1,BR:1,BLOCKQUOTE:1,UL:1,OL:1,LI:1,A:1};
      (function walk(node){
        [...node.childNodes].forEach(n=>{
          if(n.nodeType===1){
            if(!ok[n.tagName]){ const t=document.createTextNode(n.textContent); n.replaceWith(t); return; }
            [...n.attributes].forEach(a=>{ if(!(n.tagName==='A' && a.name==='href')) n.removeAttribute(a.name); });
            if(n.tagName==='A'){ n.setAttribute('target','_blank'); n.setAttribute('rel','noopener'); }
            walk(n);
          } else if(n.nodeType!==3){ n.remove(); }
        });
      })(tpl.content);
      return tpl.innerHTML;
    }
    function timeAgo(iso){ const d=(Date.now()-new Date(iso))/86400000; if(d<1)return '오늘'; if(d<7)return Math.floor(d)+'일 전'; return new Date(iso).toLocaleDateString('ko-KR'); }
    function myName(){ const u=SESSION&&SESSION.user; if(!u) return '회원'; return (u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name)) || (u.email?u.email.split('@')[0]:'회원'); }

    sb.auth.getSession().then(({data})=>{ setUser(data.session); init(); });
    sb.auth.onAuthStateChange((_e,s)=>{ setUser(s); if(CURRENT) renderCommentForm(); });
    function setUser(session){
      SESSION = session;
      isAdmin = !!(session && session.user && session.user.email === ADMIN_EMAIL);
      $('writeBtn').classList.toggle('hidden', !isAdmin);
    }

    async function init(){
      try{ SEED = (await (await fetch('content/preachers.json?t='+Date.now())).json()).posts || []; }catch(e){ SEED = []; }
      await loadDbPosts();
      renderTOC();
      const h = (location.hash||'').match(/^#post-(.+)$/);
      if(h) openByKey(decodeURIComponent(h[1]), true);
    }

    async function loadDbPosts(){
      try{
        const { data } = await sb.from('preacher_posts').select('*').order('created_at',{ascending:true});
        DBPOSTS = (data||[]).map(r=>({ key:'db-'+r.id, dbId:r.id, preacher:r.preacher||'BIBLY', preacher_en:r.preacher_en||'', title:r.title||'', sermon_title:r.sermon_title||'', scripture:r.scripture||'', html:r.body_html||'', takeaways:[], seed:false }));
      }catch(e){ DBPOSTS = []; }
    }

    function allPosts(){
      const seed = SEED.map(p=>({ key:p.id, preacher:p.preacher, preacher_en:p.preacher_en, title:p.title, sermon_title:p.sermon_title, scripture:p.scripture, html:p.summary_html, takeaways:p.takeaways||[], seed:true, order:p.order||0 }));
      return seed.concat(DBPOSTS);
    }

    function renderTOC(){
      const posts = allPosts();
      // 설교자별 그룹 (등장 순서 유지)
      const groups = []; const idx = {};
      posts.forEach(p=>{ const k=p.preacher||'기타'; if(idx[k]==null){ idx[k]=groups.length; groups.push({name:k, en:p.preacher_en, items:[]}); } groups[idx[k]].items.push(p); });
      groups.forEach(g=> g.items.sort((a,b)=>(a.order||0)-(b.order||0)));
      $('toc').innerHTML = groups.map(g=>`
        <div>
          <div class="flex items-baseline gap-2 mb-3">
            <h2 class="font-bold text-xl">${esc(g.name)}</h2>
            ${g.en?`<span class="text-ink/40 text-sm">${esc(g.en)}</span>`:''}
            <span class="text-ink/35 text-xs ml-auto">${g.items.length}편</span>
          </div>
          <div class="bg-white rounded-2xl border border-ink/8 shadow-soft divide-y divide-ink/6 overflow-hidden">
            ${g.items.map((p,i)=>`
              <button onclick="openByKey('${esc(p.key)}')" class="w-full text-left px-5 py-4 hover:bg-ink/[0.025] transition flex items-center gap-4">
                <span class="shrink-0 w-8 h-8 rounded-full bg-gold/12 text-gold font-bold text-sm flex items-center justify-center">${String(i+1).padStart(2,'0')}</span>
                <span class="min-w-0 flex-1">
                  <span class="block font-semibold leading-snug">${esc(p.title)}</span>
                  <span class="block text-xs text-ink/45 mt-0.5">${esc(p.sermon_title||'')}${p.scripture?` · ${esc(p.scripture)}`:''}</span>
                </span>
                <svg class="w-4 h-4 text-ink/25 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
              </button>`).join('')}
          </div>
        </div>`).join('');
    }

    function openByKey(key, noScroll){
      const p = allPosts().find(x=>x.key===key); if(!p){ showList(); return; }
      CURRENT = p;
      history.replaceState(null,'','#post-'+encodeURIComponent(key));
      $('rHead').innerHTML = `
        <span class="inline-block bg-gold/12 text-gold text-xs font-bold px-3 py-1 rounded-full mb-3">${esc(p.preacher)}${p.preacher_en?` · ${esc(p.preacher_en)}`:''}</span>
        <h1 class="text-2xl md:text-[30px] font-bold leading-snug">${esc(p.title)}</h1>
        <p class="text-ink/50 text-sm mt-2.5 mb-6 pb-6 border-b border-ink/10">
          ${p.sermon_title?`📖 <b class="text-ink/70">${esc(p.sermon_title)}</b>`:''}${p.scripture?` · ${esc(p.scripture)}`:''}
        </p>`;
      $('rBody').innerHTML = sanitize(p.html||'');
      $('rTakeaways').innerHTML = (p.takeaways&&p.takeaways.length) ? `
        <div class="bg-gold/[0.07] border border-gold/25 rounded-2xl p-5 mt-8">
          <p class="font-bold text-gold mb-2.5">✦ 오늘의 적용</p>
          <ul class="space-y-1.5">${p.takeaways.map(t=>`<li class="flex gap-2 text-[15px] text-ink/75 leading-relaxed"><span class="text-gold shrink-0">✓</span><span>${esc(t)}</span></li>`).join('')}</ul>
        </div>` : '';
      $('rAdmin').classList.toggle('hidden', !(isAdmin && !p.seed));
      $('listView').classList.add('hidden'); $('editView').classList.add('hidden');
      $('readView').classList.remove('hidden');
      renderCommentForm(); loadComments(key);
      if(!noScroll) window.scrollTo({top:0,behavior:'smooth'});
    }

    function showList(){ $('readView').classList.add('hidden'); $('editView').classList.add('hidden'); $('listView').classList.remove('hidden'); history.replaceState(null,'',location.pathname); window.scrollTo({top:0,behavior:'smooth'}); }

    // ===== 댓글 =====
    function renderCommentForm(){
      if(SESSION && SESSION.user){
        $('cForm').innerHTML = `
          <div class="bg-white border border-ink/12 rounded-2xl p-4">
            <textarea id="cInput" rows="3" placeholder="은혜 나눔을 남겨 주세요…" class="w-full text-sm outline-none resize-none"></textarea>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-ink/8">
              <span class="text-xs text-ink/40">${esc(myName())}님으로 작성</span>
              <button onclick="addComment()" class="bg-ink text-paper text-sm font-semibold px-4 py-2 rounded-full hover:bg-navy transition">등록</button>
            </div>
          </div>`;
      } else {
        $('cForm').innerHTML = `<div class="bg-ink/[0.03] border border-ink/8 rounded-2xl p-5 text-center text-sm text-ink/55">댓글을 남기려면 <a href="index.html" class="text-gold font-semibold hover:underline">로그인</a> 해 주세요.</div>`;
      }
    }

    async function loadComments(key){
      const { data, error } = await sb.from('preacher_comments').select('*').eq('post_key', key).order('created_at',{ascending:true});
      if(error){ $('cList').innerHTML = `<p class="text-ink/40 text-sm text-center py-4">댓글을 불러오지 못했습니다. (관리자: db/preachers.sql 실행 필요)</p>`; $('cCount').textContent=''; return; }
      const list = data||[];
      $('cCount').textContent = list.length ? `${list.length}` : '';
      if(!list.length){ $('cList').innerHTML = '<p class="text-ink/35 text-sm text-center py-6">첫 번째 묵상 나눔을 남겨 보세요.</p>'; return; }
      const myId = SESSION&&SESSION.user&&SESSION.user.id;
      $('cList').innerHTML = list.map(c=>{
        const canDel = isAdmin || (myId && c.user_id===myId);
        return `<div class="bg-white border border-ink/8 rounded-2xl px-4 py-3.5">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="font-semibold text-sm">${esc(c.author_name||'회원')}</span>
            <span class="text-xs text-ink/35">${timeAgo(c.created_at)}</span>
            ${canDel?`<button onclick="delComment('${c.id}')" class="ml-auto text-xs text-ink/30 hover:text-red-500">삭제</button>`:''}
          </div>
          <p class="text-[15px] text-ink/80 leading-relaxed">${nl2(c.content)}</p>
        </div>`;
      }).join('');
    }

    async function addComment(){
      if(!(SESSION&&SESSION.user)) return;
      const el = $('cInput'); const content = (el.value||'').trim();
      if(!content){ el.focus(); return; }
      const { error } = await sb.from('preacher_comments').insert({ post_key: CURRENT.key, user_id: SESSION.user.id, author_name: myName(), content });
      if(error){ alert('등록 오류: ' + error.message); return; }
      el.value=''; loadComments(CURRENT.key);
    }
    async function delComment(id){
      if(!confirm('이 댓글을 삭제할까요?')) return;
      const { error } = await sb.from('preacher_comments').delete().eq('id', id);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      loadComments(CURRENT.key);
    }

    // ===== 관리자 글쓰기 =====
    function openEditor(){
      $('listView').classList.add('hidden'); $('readView').classList.add('hidden');
      $('editView').classList.remove('hidden');
      if(!quill){ quill = new Quill('#quillEditor', { theme:'snow', modules:{ toolbar:[['bold','italic'],[{header:3}],['blockquote'],[{list:'ordered'},{list:'bullet'}],['link'],['clean']] } }); }
      window.scrollTo({top:0,behavior:'smooth'});
    }
    async function savePost(){
      if(!isAdmin) return;
      const preacher=$('fPreacher').value.trim(), title=$('fTitle').value.trim();
      const body = quill && quill.getText().trim() ? sanitize(quill.root.innerHTML) : '';
      const msg=$('fMsg'); const btn=$('saveBtn');
      if(!preacher||!title||!body){ msg.textContent='설교자·제목·본문을 모두 입력하세요.'; return; }
      btn.disabled=true; btn.textContent='올리는 중…'; msg.textContent='';
      const { error } = await sb.from('preacher_posts').insert({
        preacher, preacher_en:$('fPreacherEn').value.trim()||null, title,
        sermon_title:$('fSermon').value.trim()||null, scripture:$('fScripture').value.trim()||null, body_html:body
      });
      btn.disabled=false; btn.textContent='올리기';
      if(error){ msg.textContent='오류: '+error.message; return; }
      ['fPreacher','fPreacherEn','fTitle','fSermon','fScripture'].forEach(id=>$(id).value=''); quill.setText('');
      await loadDbPosts(); renderTOC(); showList();
    }
    async function deleteCurrent(){
      if(!CURRENT || CURRENT.seed || !isAdmin) return;
      if(!confirm('이 글을 삭제할까요? (댓글도 함께 사라집니다)')) return;
      const { error } = await sb.from('preacher_posts').delete().eq('id', CURRENT.dbId);
      if(error){ alert('삭제 오류: '+error.message); return; }
      await loadDbPosts(); renderTOC(); showList();
    }
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="/share.js"></script>
  <script src="auth-header.js"></script>
</body>

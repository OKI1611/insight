name: Update YouTube stats

# 유튜브 채널 실적(구독자·누적 조회수·영상 수)을 매일 자동으로 가져와
# content/site.json 을 갱신·커밋한다. 커밋되면 Cloudflare 가 자동 배포 → 사이트 수치 갱신.
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 (KST) 자동 실행
  workflow_dispatch: {}     # 필요하면 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch & update YouTube stats
        run: python tools/update_yt_stats.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain content/site.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/site.json
            git commit -m "chore: 유튜브 채널 실적 자동 갱신 [skip ci]"
            git push
            echo "stats updated & pushed"
          else
            echo "no change in stats"
          fi

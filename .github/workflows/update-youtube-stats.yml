name: Update YouTube stats

# 유튜브 채널 실적(구독자·누적 조회수·영상 수)을 매일 자동으로 가져와
# content/site.json 을 갱신·커밋한다. 커밋되면 Cloudflare 가 자동 배포 → 사이트 수치 갱신.
on:
  schedule:
    - cron: '0 21,3,9,15 * * *'   # 6시간마다 (KST 06·12·18·24시) — 구독자 반영 체감 속도 개선(2026-10-19)
  workflow_dispatch: {}     # 필요하면 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Fetch & update YouTube stats
        run: python tools/update_yt_stats.py
      - name: Commit if changed
        run: |
          # index.html 도 함께 — 스크립트가 첫 화면 폴백 숫자(data-stat)를 같이 고친다.
          # (site.json 만 add 하면 index.html 수정분이 버려져 첫 화면에 옛 숫자가 남는다)
          if [ -n "$(git status --porcelain content/site.json index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/site.json index.html
            # ⚠️ 커밋 메시지에 [skip ci] 를 넣지 말 것 —
            # Cloudflare 가 배포까지 건너뛰어 GitHub 파일만 바뀌고 사이트 수치는 옛것으로 남는다.
            git commit -m "chore: 유튜브 채널 실적 자동 갱신"
            # 다른 자동 작업과 동시에 올리면 거부되므로 최신본을 받아 최대 3번 다시 시도
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --quiet origin main && git push; then ok=1; break; fi
              echo "push 재시도 $i"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "push 3번 모두 실패"; exit 1; }
            echo "stats updated & pushed"
          else
            echo "no change in stats"
          fi

name: Update hall of fame

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 명예의 전당 집계
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          WINDOW_DAYS: '90'
          TOP_N: '10'
          SCAN_VIDEOS: '200'
          MIN_DAYS: '3'
          MIN_LIKES: '3'
          MIN_LIKE_RATIO: '0.2'
        run: node tools/build_hall_of_fame.mjs

      - name: 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain content/hall-of-fame.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/hall-of-fame.json
            git commit -m "chore: 명예의 전당 자동 갱신"
            # 다른 자동 작업과 동시에 올리면 거부되므로 최신본을 받아 최대 3번 다시 시도
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --quiet origin main && git push; then ok=1; break; fi
              echo "push 재시도 $i"; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "push 3번 모두 실패"; exit 1; }
            echo "순위 갱신됨"
          else
            echo "순위 변동 없음"
          fi

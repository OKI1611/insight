name: Update hall of fame

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 명예의 전당 집계
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          WINDOW_DAYS: '90'
          TOP_N: '10'
          SCAN_VIDEOS: '200'
          MIN_DAYS: '3'
          MIN_LIKES: '3'
          MIN_LIKE_RATIO: '0.2'
        run: node tools/build_hall_of_fame.mjs

      - name: 변경분 커밋
        run: |
          if [ -n "$(git status --porcelain content/hall-of-fame.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/hall-of-fame.json
            git commit -m "chore: 명예의 전당 자동 갱신"
            git push
            echo "순위 갱신됨"
          else
            echo "순위 변동 없음"
          fi

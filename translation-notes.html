  <script>
  (function(){
    var DATA=null, CAT='all';
    // 관리자 편집분(Supabase) — 같은 id는 덮어쓰기, 새 id는 추가, hidden은 숨김
    var SB_URL='https://bmxkndkwefdgsomlznoo.supabase.co';
    var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJteGtuZGt3ZWZkZ3NvbWx6bm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzAwODIsImV4cCI6MjA5NjE0NjA4Mn0.l1yHhMVYwMqYSL8ub9PtrJPOl7CYr7yqstG2AER1EaU';
    var ADMIN_EMAIL='josephoh1611@gmail.com', IS_ADMIN=false, RAW=null, OVER=[];
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function qs(k){ return new URLSearchParams(location.search).get(k); }
    // 로그인 세션 읽기(admin.html과 동일 방식)
    function session(){
      try{
        var raw=localStorage.getItem('bibly-admin-auth');
        if(raw){ var v=JSON.parse(raw); if(v&&v.user&&!(v.expires_at&&v.expires_at*1000<Date.now())) return v; }
        for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!/auth-token/.test(k)) continue;
          var o=JSON.parse(localStorage.getItem(k)); var s=(o&&o.user)?o:(o&&o.currentSession)?o.currentSession:null;
          if(s&&s.user&&!(s.expires_at&&s.expires_at*1000<Date.now())) return s; }
      }catch(e){} return null;
    }
    function token(){ var s=session(); return (s&&s.access_token)||SB_ANON; }
    // 본문 마크업 ↔ 블록 변환
    function toText(body){
      return (body||[]).map(function(b){
        if(b.h) return '## '+b.h;
        if(b.v) return '> '+b.v;
        return String(b.p||'').replace(/<b>/g,'**').replace(/<\/b>/g,'**');
      }).join('\n\n');
    }
    function toBlocks(txt){
      var out=[];
      String(txt||'').split(/\n\s*\n/).forEach(function(chunk){
        var t=chunk.trim(); if(!t) return;
        if(t.indexOf('## ')===0) out.push({h:t.slice(3).trim()});
        else if(t.charAt(0)==='>') out.push({v:t.split('\n').map(function(l){return l.replace(/^>\s?/,'');}).join(' ').trim()});
        else {
          var p=t.replace(/\n/g,' ').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});
          var bold=false; p=p.replace(/\*\*/g,function(){ bold=!bold; return bold?'<b>':'</b>'; });
          if(bold) p+='</b>';
          out.push({p:p});
        }
      });
      return out;
    }
    function fetchOverrides(){
      return fetch(SB_URL+'/rest/v1/translation_notes?select=*&order=sort.asc',{
        headers:{apikey:SB_ANON, Authorization:'Bearer '+SB_ANON}
      }).then(function(r){ return r.ok? r.json():[]; }).catch(function(){ return []; });
    }
    function mergeNotes(base, rows){
      var map={}; (rows||[]).forEach(function(r){ map[r.id]=r; });
      var seen={}, out=[];
      (base.notes||[]).forEach(function(n,i){
        seen[n.id]=1;
        var ov=map[n.id];
        if(ov){ if(!ov.hidden) out.push({note:ov, sort:(ov.sort!==100000? ov.sort:(i+1)*10)}); }
        else out.push({note:n, sort:(i+1)*10});
      });
      (rows||[]).forEach(function(r){ if(!seen[r.id] && !r.hidden) out.push({note:r, sort:r.sort||100000}); });
      out.sort(function(a,b){ return a.sort-b.sort; });
      base.notes=out.map(function(x){ return x.note; });
      return base;
    }

    function renderChips(){
      var base=[['all','전체']].concat(Object.entries(DATA.cats));
      document.getElementById('chips').innerHTML = base.map(function(c){
        return '<button class="chip'+(CAT===c[0]?' on':'')+'" data-c="'+c[0]+'">'+esc(c[1])+'</button>';
      }).join('');
      document.querySelectorAll('#chips .chip').forEach(function(b){
        b.onclick=function(){ CAT=b.dataset.c; renderChips(); renderCards(); };
      });
    }
    // 본문 블록에서 검색용 평문 추출
    function plain(n){
      return [n.title, n.verse, n.summary, (n.tags||[]).join(' '),
        (n.body||[]).map(function(b){ return String(b.h||b.v||b.p||''); }).join(' ')]
        .join(' ').replace(/<[^>]+>/g,'').toLowerCase();
    }
    function hi(s, q){
      s=esc(s); if(!q) return s;
      try{ return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark class="bg-gold/25 rounded px-0.5">$1</mark>'); }
      catch(e){ return s; }
    }
    function renderCards(){
      var q=(document.getElementById('q').value||'').trim().toLowerCase();
      document.getElementById('qClear').classList.toggle('hidden', !q);
      var byCat=DATA.notes.filter(function(n){ return CAT==='all'||n.cat===CAT; });
      var list=q? byCat.filter(function(n){ return plain(n).indexOf(q)>=0; }) : byCat;
      // 번호는 전체 목록 기준 고정(검색해도 원래 번호 유지)
      var numOf={}; DATA.notes.forEach(function(n,i){ numOf[n.id]=i+1; });
      var cnt=document.getElementById('countTxt');
      cnt.innerHTML = q
        ? '<b class="text-gold">'+list.length+'</b>편 검색됨 <span class="text-neutral-900/35">· 전체 '+DATA.notes.length+'편</span>'
        : '모두 <b class="text-gold">'+DATA.notes.length+'</b>편'+(CAT!=='all'? ' <span class="text-neutral-900/35">· 이 분류 '+list.length+'편</span>':'');
      document.getElementById('cards').innerHTML = list.map(function(n){
        return '<a class="noteCard relative" href="translation-notes.html?id='+encodeURIComponent(n.id)+'">'
          + '<div class="flex items-center gap-2 mb-1.5">'
          + '<span class="shrink-0 w-6 h-6 rounded-full bg-ink/5 text-neutral-900/50 text-[11px] font-bold grid place-items-center">'+numOf[n.id]+'</span>'
          + '<span class="tag">'+esc(DATA.cats[n.cat]||n.cat)+'</span>'
          + '<span class="text-[11px] text-neutral-900/45 font-serifkr">'+hi(n.verse,q)+'</span>'
          + (IS_ADMIN? '<span class="ml-auto text-[11px] font-bold text-gold border border-gold/40 rounded-md px-2 py-0.5 hover:bg-gold hover:text-white" data-edit="'+esc(n.id)+'">편집</span>':'')
          + '</div>'
          + '<div class="font-bold text-[15.5px] leading-snug">'+hi(n.title,q)+'</div>'
          + '<p class="text-[13px] text-neutral-900/60 leading-relaxed mt-1.5">'+hi(n.summary,q)+'</p>'
          + '</a>';
      }).join('') || '<p class="text-sm text-neutral-900/50">'+(q? '검색 결과가 없습니다. 다른 낱말로 찾아보세요.':'글이 없습니다.')+'</p>';
      if(IS_ADMIN){
        document.querySelectorAll('#cards [data-edit]').forEach(function(b){
          b.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); openEditor(b.getAttribute('data-edit')); };
        });
      }
    }
    function renderNote(n, idx){
      document.title = n.title + ' — 성경 번역 이야기 · BIBLY 바이블 인사이트';
      document.getElementById('nCat').textContent = DATA.cats[n.cat]||n.cat;
      document.getElementById('nTitle').textContent = n.title;
      document.getElementById('nVerse').textContent = n.verse;
      document.getElementById('nTags').innerHTML = (n.tags||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
      document.getElementById('nBody').innerHTML = (n.body||[]).map(function(b){
        if(b.h) return '<h2>'+esc(b.h)+'</h2>';
        if(b.v) return '<div class="verse">'+esc(b.v)+'</div>';
        return '<p>'+String(b.p||'')+'</p>';  // 자체 집필 콘텐츠 — <b> 강조 허용
      }).join('');
      var prev=DATA.notes[idx-1], next=DATA.notes[idx+1];
      if(prev){ var a=document.getElementById('prevLink'); a.href='translation-notes.html?id='+encodeURIComponent(prev.id); a.querySelector('span').textContent=prev.title; a.classList.remove('hidden'); }
      if(next){ var a2=document.getElementById('nextLink'); a2.href='translation-notes.html?id='+encodeURIComponent(next.id); a2.querySelector('span').textContent=next.title; a2.classList.remove('hidden'); }
    }

    // ===== 관리자 편집기 =====
    var CUR=null;
    function el(i){ return document.getElementById(i); }
    function openEditor(id){
      var n = id? DATA.notes.filter(function(x){return x.id===id;})[0] : null;
      var isNew=!n;
      var isOverride = !!OVER.filter(function(r){return r.id===id;})[0];
      CUR={ id:id||'', isNew:isNew };
      el('edTitle').textContent = isNew? '새 글 쓰기' : '글 편집';
      el('edId').value = n? n.id : '';
      el('edId').readOnly = !isNew;
      el('edCat').value = n? (n.cat||'verse') : 'verse';
      el('edT').value = n? n.title : '';
      el('edV').value = n? (n.verse||'') : '';
      el('edTag').value = n? (n.tags||[]).join(', ') : '';
      el('edS').value = n? (n.summary||'') : '';
      el('edB').value = n? toText(n.body) : '';
      el('edMsg').textContent='';
      el('edHide').classList.toggle('hidden', isNew);
      el('edRevert').classList.toggle('hidden', !isOverride);
      el('edModal').classList.remove('hidden');
    }
    function closeEditor(){ el('edModal').classList.add('hidden'); CUR=null; }
    function upsert(row){
      return fetch(SB_URL+'/rest/v1/translation_notes?on_conflict=id',{
        method:'POST',
        headers:{apikey:SB_ANON, Authorization:'Bearer '+token(), 'Content-Type':'application/json',
          Prefer:'resolution=merge-duplicates,return=representation'},
        body:JSON.stringify([row])
      }).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); return r.json(); });
    }
    function reloadAll(){
      return fetchOverrides().then(function(rows){
        OVER=rows; DATA=mergeNotes(JSON.parse(JSON.stringify(RAW)), rows);
        renderChips(); renderCards();
      });
    }
    function saveNote(){
      var m=el('edMsg'); m.style.color='#6b7280'; m.textContent='저장 중…';
      var id=(el('edId').value||'').trim().toLowerCase().replace(/[^a-z0-9\-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
      if(!id){ m.style.color='#dc2626'; m.textContent='글 주소(영문)를 입력해 주세요.'; return; }
      if(!el('edT').value.trim()){ m.style.color='#dc2626'; m.textContent='제목을 입력해 주세요.'; return; }
      var body=toBlocks(el('edB').value);
      if(!body.length){ m.style.color='#dc2626'; m.textContent='본문을 입력해 주세요.'; return; }
      var idx=DATA.notes.map(function(n){return n.id;}).indexOf(id);
      var sort = idx>=0? (idx+1)*10 : (DATA.notes.length+1)*10;
      upsert({ id:id, cat:el('edCat').value, title:el('edT').value.trim(), verse:el('edV').value.trim(),
        tags:el('edTag').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
        summary:el('edS').value.trim(), body:body, hidden:false, sort:sort, updated_at:new Date().toISOString() })
      .then(function(){ m.style.color='#059669'; m.textContent='저장되었습니다.';
        return reloadAll().then(function(){ setTimeout(closeEditor,700); }); })
      .catch(function(e){ m.style.color='#dc2626'; m.textContent='저장 실패: '+String(e.message||e).slice(0,110); });
    }
    function hideNote(){
      if(!CUR||!CUR.id) return;
      if(!confirm('이 글을 사이트에서 숨길까요? (나중에 다시 보이게 할 수 있습니다)')) return;
      var n=DATA.notes.filter(function(x){return x.id===CUR.id;})[0]||{};
      var idx=DATA.notes.map(function(x){return x.id;}).indexOf(CUR.id);
      upsert({ id:CUR.id, cat:n.cat||'verse', title:n.title||'', verse:n.verse||'', tags:n.tags||[],
        summary:n.summary||'', body:n.body||[], hidden:true, sort:(idx+1)*10, updated_at:new Date().toISOString() })
      .then(function(){ return reloadAll(); }).then(closeEditor)
      .catch(function(e){ alert('실패: '+String(e.message||e).slice(0,110)); });
    }
    function revertNote(){
      if(!CUR||!CUR.id) return;
      if(!confirm('수정한 내용을 취소하고 원본 글로 되돌릴까요?')) return;
      fetch(SB_URL+'/rest/v1/translation_notes?id=eq.'+encodeURIComponent(CUR.id),{
        method:'DELETE', headers:{apikey:SB_ANON, Authorization:'Bearer '+token()}
      }).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return reloadAll(); })
      .then(closeEditor).catch(function(e){ alert('실패: '+String(e.message||e).slice(0,110)); });
    }

    Promise.all([
      fetch('content/translation-notes.json').then(function(r){ return r.json(); }),
      fetchOverrides()
    ]).then(function(res){
      RAW=JSON.parse(JSON.stringify(res[0])); OVER=res[1];
      var s=session(); IS_ADMIN = !!(s && s.user && s.user.email===ADMIN_EMAIL);
      var d=mergeNotes(res[0], res[1]);
      DATA=d;
      var id=qs('id');
      var idx=id? d.notes.findIndex(function(n){ return n.id===id; }) : -1;
      if(idx>=0){
        document.getElementById('noteView').classList.remove('hidden');
        renderNote(d.notes[idx], idx);
      } else {
        document.getElementById('introTxt').textContent=d.intro||'';
        document.getElementById('listView').classList.remove('hidden');
        if(IS_ADMIN) el('adminBar').classList.remove('hidden');
        renderChips(); renderCards();
        // 검색
        var qi=el('q'), t=null;
        qi.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(renderCards, 120); });
        el('qClear').onclick=function(){ qi.value=''; qi.focus(); renderCards(); };
        // 편집기 버튼
        el('btnNew').onclick=function(){ openEditor(null); };
        el('edClose').onclick=closeEditor;
        el('edSave').onclick=saveNote;
        el('edHide').onclick=hideNote;
        el('edRevert').onclick=revertNote;
        el('edModal').addEventListener('click', function(ev){ if(ev.target===el('edModal')) closeEditor(); });
      }
    }).catch(function(e){
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('cards').innerHTML='<p class="text-sm text-neutral-900/50">목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';
    });
  })();
  </script>
</body>
</html>

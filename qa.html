    }}}

    h1,h2,.serif{font-family:'Pretendard',system-ui,sans-serif} mark{background:#fbeec2;color:inherit;border-radius:3px;padding:0 1px}

    details.deep[open] summary .caret{transform:rotate(180deg)}

<body class="font-sans bg-paper text-neutral-900 antialiased min-h-screen">

  <div id="siteHeader" data-active="qa.html"></div>

  <!-- 히어로 + 검색 -->
  <section class="bg-white border-b border-ink/8">
    <div class="max-w-3xl mx-auto px-5 py-11 md:py-14 text-center">
      <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-3">Bible Q&amp;A · 성경 궁금증</p>
      <h1 class="text-2xl md:text-[32px] font-bold leading-tight">성경 <span class="text-gold">Q&amp;A</span> · 말씀 궁금증 풀이</h1>
      <p class="text-neutral-900/60 text-sm md:text-[15px] mt-3 leading-relaxed max-w-xl mx-auto">신앙과 성경에 대한 궁금증, <b class="text-neutral-900">원어와 성경 본문</b>으로 정직하게 답합니다. 주제로도, 성경 책으로도 쉽게 찾아보세요.</p>
      <div class="relative mt-6 max-w-lg mx-auto">
        <input id="q" type="search" autocomplete="off" placeholder="궁금한 것을 검색하세요 (예: 구원의 확신, 십일조, 666…)" oninput="onSearch()" class="w-full border border-ink/15 rounded-full pl-12 pr-4 py-3.5 text-[15px] outline-none focus:border-gold shadow-soft bg-white" />
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-900/30"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg></span>
      </div>
      <div id="hotchips" class="flex flex-wrap justify-center gap-1.5 mt-3.5"></div>
    </div>
  </section>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <!-- 탐색 모드 탭 -->
    <div id="tabs" class="flex items-center justify-center gap-2 mb-5">
      <button id="tabTopic" onclick="setMode('topic')" class="tabbtn text-sm font-bold px-5 py-2 rounded-full border transition">주제로 찾기</button>
      <button id="tabBook" onclick="setMode('book')" class="tabbtn text-sm font-bold px-5 py-2 rounded-full border transition">성경 책으로 찾기</button>
    </div>

    <div id="results" class="space-y-3"></div>
    <div id="empty" class="hidden text-center text-neutral-900/45 py-16">
      <p class="font-semibold">찾으시는 질문이 아직 없어요.</p>
      <p class="text-sm mt-1">다른 검색어로 찾아보시거나, <a href="request.html" class="text-gold underline">궁금한 점을 남겨</a> 주세요. 답변이 계속 추가됩니다.</p>
    </div>

    <p class="text-[11px] text-neutral-900/35 text-center mt-10 leading-relaxed">
      ※ 모든 답변은 히브리어·헬라어 원어와 성경 본문을 직접 근거로 <b class="text-neutral-900/55">자체 집필</b>했습니다.
      특정 교파·번역본을 절대시하거나 다른 번역을 정죄하지 않으며, 성경이 말하는 바를 균형 있게 전합니다.
    </p>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    let FAQ=[], MODE='topic', SEL='', BOOKORDER=[];
    const TOPICS=['구원·믿음','하나님·예수·삼위일체','성경·창조','신앙생활','교회·예배·헌금','성령·은사','윤리·관계·문화','죽음·종말·천국'];
    const TOPIC_IC={'구원·믿음':'✝️','하나님·예수·삼위일체':'🕊️','성경·창조':'📖','신앙생활':'🙏','교회·예배·헌금':'⛪','성령·은사':'🔥','윤리·관계·문화':'🤝','죽음·종말·천국':'⏳'};
    const ABBR={'창':'창세기','출':'출애굽기','레':'레위기','민':'민수기','신':'신명기','수':'여호수아','삿':'사사기','룻':'룻기','삼상':'사무엘상','삼하':'사무엘하','왕상':'열왕기상','왕하':'열왕기하','대상':'역대상','대하':'역대하','스':'에스라','느':'느헤미야','에':'에스더','욥':'욥기','시':'시편','잠':'잠언','전':'전도서','아':'아가','사':'이사야','렘':'예레미야','애':'예레미야애가','겔':'에스겔','단':'다니엘','호':'호세아','욜':'요엘','암':'아모스','옵':'오바댜','욘':'요나','미':'미가','나':'나훔','합':'하박국','습':'스바냐','학':'학개','슥':'스가랴','말':'말라기','마':'마태복음','막':'마가복음','눅':'누가복음','요':'요한복음','행':'사도행전','롬':'로마서','고전':'고린도전서','고후':'고린도후서','갈':'갈라디아서','엡':'에베소서','빌':'빌립보서','골':'골로새서','살전':'데살로니가전서','살후':'데살로니가후서','딤전':'디모데전서','딤후':'디모데후서','딛':'디도서','몬':'빌레몬서','히':'히브리서','약':'야고보서','벧전':'베드로전서','벧후':'베드로후서','요일':'요한일서','요이':'요한이서','요삼':'요한삼서','유':'유다서','계':'요한계시록'};
    const HOT=['구원의 확신','거듭남','십일조','666 짐승의 표','방언','예정','자살','술 담배'];

    // 성구 문자열 → 한글 책 이름
    function bookOf(ref){ var m=String(ref||'').trim().match(/^([1-3]?[가-힣]+)/); if(!m) return null; return ABBR[m[1]]||null; }
    function booksOf(e){ var set={}; (e.scriptures||[]).forEach(function(s){ var b=bookOf(s); if(b) set[b]=1; }); return Object.keys(set); }

    // 초기 탭 스타일
    function paintTabs(){
      [['tabTopic','topic'],['tabBook','book']].forEach(function(p){
        var b=$(p[0]), on=MODE===p[1];
        b.className='tabbtn text-sm font-bold px-5 py-2 rounded-full border transition '+(on?'bg-gold text-white border-ink':'bg-white text-neutral-900/55 border-ink/15 hover:border-ink/30');
      });
    }
    function setMode(m){ MODE=m; SEL=''; $('q').value=''; paintTabs(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function pickTopic(t){ SEL=t; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function pickBook(b){ SEL=b; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function onSearch(){ render(); }
    function searchFor(t){ $('q').value=t; render(); window.scrollTo({top:0,behavior:'smooth'}); }

    $('results').innerHTML='<div class="text-center text-neutral-900/40 py-16"><p class="text-sm">질문을 불러오는 중…</p></div>';
    Promise.all([
      fetch('dictionary/entries.json').then(r=>r.json()).catch(()=>[]),
      fetch('bible/books.json').then(r=>r.ok?r.json():[]).catch(()=>[])
    ]).then(function(res){
      var d=res[0]||[], books=res[1]||[];
      BOOKORDER=books.map(function(b){return b.ko;}).filter(Boolean);
      books.forEach(function(b){ if(b.ko&&b.file) KO2FILE[b.ko]=b.file; });
      FAQ=(Array.isArray(d)?d:[]).filter(e=>e.category==='자주 묻는 질문');
      FAQ.forEach(function(e){ e._books=booksOf(e); });
      $('hotchips').innerHTML=HOT.map(h=>`<button onclick="searchFor('${h.replace(/'/g,"\\'")}')" class="text-[11.5px] bg-sand/70 hover:bg-gold/15 text-neutral-900/60 hover:text-gold px-2.5 py-1 rounded-full transition">${esc(h)}</button>`).join('');
      paintTabs();
      var sp=new URLSearchParams(location.search); var q=sp.get('q');
      if(q){ $('q').value=q; }
      render();
    }).catch(()=>{ $('results').innerHTML='<p class="text-center text-neutral-900/40 py-10">질문을 불러오지 못했어요.</p>'; });

    function hl(text,q){ if(!q) return esc(text); const safe=esc(text); try{ const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return safe.replace(re,'<mark>$1</mark>'); }catch(e){ return safe; } }

    function render(){
      var q=($('q').value||'').trim().toLowerCase();
      $('empty').classList.add('hidden');
      // 1) 검색 모드 — 모드/선택 무시하고 전체에서 찾기
      if(q){
        var list=FAQ.filter(function(e){
          var deepTxt=(e.deep||[]).map(s=>(s.h||'')+' '+(s.p||'')).join(' ');
          var hay=((e.term||'')+' '+(e.def||'')+' '+deepTxt+' '+((e.related||[]).join(' '))).toLowerCase();
          return hay.includes(q);
        });
        if(!list.length){ $('results').innerHTML=''; $('empty').classList.remove('hidden'); return; }
        $('results').innerHTML='<p class="text-sm text-neutral-900/55 mb-3"><b class="text-neutral-900">'+list.length+'개</b>의 질문을 찾았어요. <span class="text-neutral-900/40">제목을 누르면 답변이 펼쳐집니다.</span></p>'+qList(list.slice(0,200),q);
        return;
      }
      // 2) 주제 모드
      if(MODE==='topic'){
        if(!SEL){
          var counts={}; FAQ.forEach(e=>{ var t=e.faqTopic||'신앙생활'; counts[t]=(counts[t]||0)+1; });
          var cards=TOPICS.filter(t=>counts[t]).map(t=>
            `<button onclick="pickTopic('${t.replace(/'/g,"\\'")}')" class="group bg-white rounded-2xl border border-ink/8 shadow-soft p-5 text-left hover:-translate-y-0.5 hover:border-gold/40 hover:shadow-card transition">
              <span class="block w-7 h-[3px] bg-gold/55 rounded-full mb-3.5 group-hover:w-10 transition-all"></span>
              <p class="font-bold text-neutral-900 text-[15px] group-hover:text-gold transition leading-snug">${esc(t)}</p>
              <p class="text-xs text-neutral-900/45 mt-1.5">질문 <b class="text-neutral-900/70">${counts[t]}</b>개 <span class="text-gold/70">→</span></p></button>`).join('');
          $('results').innerHTML=`<p class="text-sm text-neutral-900/55 mb-4">궁금한 <b class="text-neutral-900">주제를 선택</b>하면 관련 질문을 모아서 볼 수 있어요.</p>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cards}</div>`;
          return;
        }
        var tl=FAQ.filter(e=>(e.faqTopic||'신앙생활')===SEL);
        $('results').innerHTML=backBar('주제 전체','pickTopic')+
          `<h2 class="text-xl font-bold mb-1.5 flex items-baseline gap-2"><span class="inline-block w-1 h-5 bg-gold rounded-full translate-y-0.5"></span>${esc(SEL)} <span class="text-sm font-semibold text-neutral-900/40">${tl.length}</span></h2>`+
          `<p class="text-xs text-neutral-900/45 mb-3 pl-3">궁금한 질문 제목을 누르면 답변이 펼쳐집니다.</p>`+
          qList(tl,'');
        return;
      }
      // 3) 성경 책 모드
      if(!SEL){
        var bc={}; FAQ.forEach(e=>{ (e._books||[]).forEach(b=>{ bc[b]=(bc[b]||0)+1; }); });
        var order=BOOKORDER.length?BOOKORDER:Object.keys(bc);
        var chips=order.map(function(b){
          var n=bc[b]||0, on=n>0;
          return `<button ${on?`onclick="pickBook('${b.replace(/'/g,"\\'")}')"`:'disabled'} class="text-left px-3 py-2 rounded-xl border text-[13px] transition ${on?'bg-white border-ink/10 hover:border-gold/50 hover:shadow-soft':'bg-ink/[0.02] border-ink/5 text-neutral-900/25 cursor-default'}">
            <span class="font-semibold ${on?'text-neutral-900':''}">${esc(b)}</span> ${on?`<span class="text-gold font-bold text-xs">${n}</span>`:'<span class="text-[10px]">–</span>'}</button>`;
        }).join('');
        var haveN=Object.keys(bc).length;
        $('results').innerHTML=`<p class="text-sm text-neutral-900/55 mb-3">성경 <b class="text-neutral-900">책을 선택</b>하면 그 책과 관련된 질문을 볼 수 있어요. <span class="text-neutral-900/40">(현재 ${haveN}권에 질문 연결 · 계속 추가)</span></p>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${chips}</div>`;
        return;
      }
      var bl=FAQ.filter(e=>(e._books||[]).indexOf(SEL)>=0);
      $('results').innerHTML=backBar('성경 책 전체','pickBook')+
        `<h2 class="text-xl font-bold mb-1.5 flex items-baseline gap-2"><span class="inline-block w-1 h-5 bg-gold rounded-full translate-y-0.5"></span>${esc(SEL)} <span class="text-sm font-semibold text-neutral-900/40">${bl.length}</span></h2>`+
        (bl.length?`<p class="text-xs text-neutral-900/45 mb-3 pl-3">질문 제목을 누르면 답변이 펼쳐집니다.</p>`+qList(bl,''):'<p class="text-neutral-900/45 py-8 text-center text-sm">이 책과 연결된 질문은 곧 추가됩니다.</p>');
    }
    function backBar(label,fn){ return `<button onclick="${fn}('')" class="inline-flex items-center gap-1 text-sm font-semibold text-gold mb-3 hover:underline">← ${label} 보기</button>`; }

    // 게시판형 목록 행(닫히면 번호+제목만, 클릭하면 답변 펼침)
    function qRow(e,q,num){
      var ans=(e.def||'').replace(/^\s*한마디로\s*[—-]\s*/,'');
      var deepInner='';
      if(Array.isArray(e.deep)&&e.deep.length){
        deepInner='<div class="mt-3.5 space-y-3.5 border-l-2 border-sand pl-4">'+e.deep.map(function(s){
          if(s.h==='흔한 오해'||s.misc){ return `<div class="bg-[#faf5ec] border-l-2 border-gold/50 rounded-r-lg px-3.5 py-2.5"><p class="text-[12.5px] font-bold text-gold mb-0.5">${esc(s.h||'흔한 오해')}</p><p class="text-[13.5px] text-neutral-900/80">${esc(s.p||'')}</p></div>`; }
          return `<div>${s.h?`<h4 class="font-bold text-neutral-900 text-[14px] mb-1">${esc(s.h)}</h4>`:''}<p class="text-[13.5px] text-neutral-900/80">${esc(s.p||'')}</p></div>`;
        }).join('')+'</div>';
      }
      var scr=(e.scriptures||[]).map(s=>`<button type="button" class="scrchip inline-block bg-sand/70 hover:bg-gold/15 text-neutral-900/70 text-[11px] px-2 py-0.5 rounded mr-1 mb-1 transition" onclick="showScr(event,'${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('');
      var rel=(e.related||[]).map(r=>`<button onclick="searchFor('${esc(r).replace(/'/g,"\\'")}')" class="text-gold/90 text-xs hover:underline mr-2.5">${esc(r)}</button>`).join('');
      var bks=(e._books||[]).slice(0,3).map(b=>`<button onclick="setMode('book');pickBook('${b.replace(/'/g,"\\'")}')" class="text-neutral-900/40 hover:text-gold">${esc(b)}</button>`).join('<span class="text-neutral-900/20 mx-1">·</span>');
      return `<details class="qrow">
        <summary class="cursor-pointer select-none flex items-center gap-3 py-3.5 hover:bg-sand/20 rounded-lg px-2 -mx-2 transition">
          <span class="qnum text-[13px] font-semibold text-neutral-900/35 shrink-0 w-7 text-right" style="font-variant-numeric:tabular-nums">${num||''}</span>
          <span class="qtitle flex-1 min-w-0 font-semibold text-[15px] text-neutral-900 leading-snug transition">${hl(e.term||'',q)}</span>
          <span class="qcaret text-neutral-900/25 shrink-0 text-xs transition">▼</span>
        </summary>
        <div class="qbody pl-10 pr-1 pb-5 pt-1">
          <p class="text-[14px] text-neutral-900/85 leading-[1.9]">${hl(ans,q)}</p>
          ${deepInner}
          ${scr?`<div class="mt-3.5">${scr}</div>`:''}
          <div class="flex items-center flex-wrap gap-x-1 gap-y-1 mt-2.5 text-xs">${rel}${bks?`<span class="ml-auto text-[10.5px] text-neutral-900/30">관련 본문 · ${bks}</span>`:''}</div>
        </div>
      </details>`;
    }
    function qList(arr,q){ return '<div class="bg-white rounded-2xl border border-ink/8 shadow-soft px-4 divide-y divide-ink/6">'+arr.map((e,i)=>qRow(e,q,i+1)).join('')+'</div>'; }

    function card(e,q){
      var scr=(e.scriptures||[]).map(s=>`<button type="button" class="scrchip inline-block bg-sand/70 hover:bg-gold/20 text-neutral-900/75 text-[11px] px-2 py-0.5 rounded mr-1 mb-1 transition" onclick="showScr(event,'${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('');
      var rel=(e.related||[]).map(r=>`<button onclick="searchFor('${esc(r).replace(/'/g,"\\'")}')" class="text-gold text-xs hover:underline mr-2">#${esc(r)}</button>`).join('');
      var deepHtml='';
      if(Array.isArray(e.deep)&&e.deep.length){
        var secs=e.deep.map(function(s){
          if(s.h==='흔한 오해'||s.misc){ return `<div class="bg-[#fbf3e6] border-l-2 border-gold/60 rounded-r-lg px-3.5 py-2.5"><p class="text-[12.5px] font-bold text-gold mb-0.5">${esc(s.h||'흔한 오해')}</p><p class="text-[13.5px] text-neutral-900/80 leading-[1.9]">${esc(s.p||'')}</p></div>`; }
          return `<div>${s.h?`<h4 class="font-bold text-neutral-900 text-[14px] mb-1">${esc(s.h)}</h4>`:''}<p class="text-[13.5px] text-neutral-900/80 leading-[1.9]">${esc(s.p||'')}</p></div>`;
        }).join('');
        deepHtml=`<details class="mt-3 deep">
          <summary class="cursor-pointer select-none inline-flex items-center gap-1.5 text-[13px] font-bold text-gold bg-gold/[0.07] hover:bg-gold/[0.12] rounded-full px-3.5 py-1.5 transition">자세한 답변 보기<span class="caret transition">▾</span></summary>
          <div class="mt-3 space-y-3 border-l-2 border-sand pl-4">${secs}</div></details>`;
      }
      var bks=(e._books||[]).slice(0,3).map(b=>`<button onclick="setMode('book');pickBook('${b.replace(/'/g,"\\'")}')" class="text-[10px] text-neutral-900/45 hover:text-gold">${esc(b)}</button>`).join('<span class="text-neutral-900/20 mx-1">·</span>');
      return `<article class="bg-white rounded-2xl border border-gold/25 shadow-soft p-5">
        <div class="flex items-baseline flex-wrap gap-x-2 gap-y-1">
          <span class="text-gold font-bold text-lg shrink-0">Q.</span>
          <h2 class="text-lg font-bold text-neutral-900 leading-snug">${hl(e.term||'',q)}</h2>
        </div>
        <p class="text-[14px] text-neutral-900/80 leading-[1.85] mt-2.5"><b class="text-neutral-900">한마디로 — </b>${hl(e.def||'',q)}</p>
        ${deepHtml}
        ${scr?`<div class="mt-3">${scr}</div>`:''}
        <div class="flex items-center flex-wrap gap-x-2 gap-y-1 mt-2">${rel}${bks?`<span class="ml-auto text-[10px] text-neutral-900/35">📖 ${bks}</span>`:''}</div>
      </article>`;
    }

    /* ===== 관련 구절 말풍선 (dictionary.html과 동일 동작) ===== */
    (function(){ var st=document.createElement('style'); st.textContent=
      '.scrchip{cursor:pointer;border:0}'
      +'#scrBubble{position:absolute;z-index:130;background:#fff;border:1px solid rgba(33,58,107,.12);border-radius:14px;box-shadow:0 14px 40px -10px rgba(21,32,58,.32);max-width:92vw}'
      +'#scrBubble .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;border-bottom:1px solid rgba(33,58,107,.07)}'
      +'#scrBubble .bh b{color:#00704a;font-size:12.5px}'
      +'#scrBubble .bh button{border:0;background:transparent;color:rgba(33,58,107,.4);cursor:pointer;font-size:13px}'

      document.head.appendChild(st);
    })();
    var ABBR_F={'창':'Genesis','출':'Exodus','레':'Leviticus','민':'Numbers','신':'Deuteronomy','수':'Joshua','삿':'Judges','룻':'Ruth','삼상':'1Samuel','삼하':'2Samuel','왕상':'1Kings','왕하':'2Kings','대상':'1Chronicles','대하':'2Chronicles','스':'Ezra','느':'Nehemiah','에':'Esther','욥':'Job','시':'Psalms','잠':'Proverbs','전':'Ecclesiastes','아':'SongofSolomon','사':'Isaiah','렘':'Jeremiah','애':'Lamentations','겔':'Ezekiel','단':'Daniel','호':'Hosea','욜':'Joel','암':'Amos','옵':'Obadiah','욘':'Jonah','미':'Micah','나':'Nahum','합':'Habakkuk','습':'Zephaniah','학':'Haggai','슥':'Zechariah','말':'Malachi','마':'Matthew','막':'Mark','눅':'Luke','요':'John','행':'Acts','롬':'Romans','고전':'1Corinthians','고후':'2Corinthians','갈':'Galatians','엡':'Ephesians','빌':'Philippians','골':'Colossians','살전':'1Thessalonians','살후':'2Thessalonians','딤전':'1Timothy','딤후':'2Timothy','딛':'Titus','몬':'Philemon','히':'Hebrews','약':'James','벧전':'1Peter','벧후':'2Peter','요일':'1John','요이':'2John','요삼':'3John','유':'Jude','계':'Revelation'};
    var chCache={}, KO2FILE={};
    function parseRef(s){ var m=String(s||'').trim().match(/^(.+?)\s*(\d+):(\d+)(?:[-~](\d+))?$/); if(!m) return null; var nm=m[1].trim(); var f=ABBR_F[nm]||KO2FILE[nm]; if(!f) return null; return {file:f,ch:+m[2],v1:+m[3],v2:m[4]?+m[4]:+m[3]}; }
    function getChapter(file,ch){ var k=file+'-'+ch; if(chCache[k]!==undefined) return Promise.resolve(chCache[k]); return fetch('bible/kr/'+k+'.json').then(r=>r.ok?r.json():null).then(j=>{chCache[k]=j;return j;}).catch(()=>{chCache[k]=null;return null;}); }
    function closeBubble(){ var b=$('scrBubble'); if(b) b.remove(); }
    function showBubble(anchor,title,html){ closeBubble(); var b=document.createElement('div'); b.id='scrBubble'; b.innerHTML='<div class="bh"><b>'+esc(title)+'</b><button type="button" onclick="closeBubble()">✕</button></div><div class="bbody">'+html+'</div>'; document.body.appendChild(b); var bw=Math.min(340,window.innerWidth-24); b.style.width=bw+'px'; var r=anchor.getBoundingClientRect(); var left=r.left+window.scrollX+r.width/2-bw/2; left=Math.max(window.scrollX+12,Math.min(left,window.scrollX+window.innerWidth-bw-12)); b.style.left=left+'px'; b.style.top=(r.bottom+window.scrollY+9)+'px';
      var bh=b.offsetHeight; if(r.bottom+bh+16>window.innerHeight && r.top-bh-9>0){ b.style.top=(r.top+window.scrollY-bh-9)+'px'; } }
    function showScr(ev,ref){ ev.stopPropagation(); var anchor=ev.currentTarget; var p=parseRef(ref); if(!p){ showBubble(anchor,ref,'<p>구절을 찾을 수 없어요.</p>'); return; } var link='bible.html?b='+p.file+'&c='+p.ch+'&v='+p.v1; var linkHtml='<a class="blink" href="'+link+'">본문에서 보기 →</a>'; showBubble(anchor,ref,'<p>불러오는 중…</p>'); getChapter(p.file,p.ch).then(function(ch){ var h=''; if(ch){ var lines=[]; for(var v=p.v1; v<=p.v2 && v<=p.v1+3; v++){ if(ch[v-1]) lines.push('<p><b>'+v+'</b>'+esc(ch[v-1])+'</p>'); } h=lines.length?lines.join(''):'<p>이 구절은 번역 준비 중입니다.</p>'; if(p.v2>p.v1+3) h+='<p style="color:rgba(33,58,107,.45)">…</p>'; } else h='<p>이 책은 곧 제공됩니다.</p>'; showBubble(anchor,ref,h+linkHtml); }); }
    document.addEventListener('click', function(e){ if(!e.target.closest('#scrBubble') && !e.target.closest('.scrchip')) closeBubble(); });
    window.setMode=setMode; window.pickTopic=pickTopic; window.pickBook=pickBook; window.onSearch=onSearch; window.searchFor=searchFor; window.showScr=showScr; window.closeBubble=closeBubble;
  </script>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>결제 실패 — 바이블 인사이트</title>
  <script src="https://cdn.tailwindcss.com?v=3"></script>
  <script>tailwind.config={theme:{extend:{colors:{gold:'#00704a',ink:'#213a6b',paper:'#ffffff'}}}}</script>
  <link rel="icon" href="/images/favicon-32.png?v=7" />
</head>
<body class="bg-paper text-neutral-900 antialiased min-h-screen flex items-center justify-center px-5">
  <div class="w-full max-w-md text-center">
    <div class="w-16 h-16 mx-auto rounded-full bg-rose-500/12 flex items-center justify-center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <h1 class="text-2xl font-bold mt-5">결제가 취소되었어요</h1>
    <p id="msg" class="text-neutral-900/60 text-sm mt-2 leading-relaxed">결제가 완료되지 않았습니다. 다시 시도해 주세요.</p>
    <p class="text-neutral-900/45 text-xs mt-3">카드는 승인되지 않았으니 요금이 청구되지 않습니다.</p>
    <div class="flex gap-2 mt-6">
      <a href="/booklet.html" class="flex-1 bg-ink text-white font-bold py-3.5 rounded-xl hover:opacity-90 transition">스토어로 돌아가기</a>
      <a href="/store-help.html" class="px-5 py-3.5 rounded-xl border border-neutral-300 font-semibold text-sm hover:bg-neutral-50 transition">고객센터</a>
    </div>
    <a href="/index.html" class="inline-block mt-4 text-neutral-900/40 text-sm hover:text-gold">홈으로</a>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const code = qs.get('code'), message = qs.get('message');
    if(message){ document.getElementById('msg').textContent = decodeURIComponent(message); }
  </script>
</body>
</html>

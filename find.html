<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="/content-loader.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나에게 맞는 강의 찾기 — BIBLY 바이블 인사이트</title>
  <meta name="description" content="6가지 질문에 답하면 신앙 배경·관심·목표를 분석해, 당신에게 최적화된 코스와 학습 순서를 추천해 드립니다. BIBLY 바이블 인사이트 수강 진단." />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#15203a" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#15203a', navy:'#1b2a4a', gold:'#b8923f', sand:'#efe7d6', paper:'#fcfaf6' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'], display:['"Noto Serif KR"','Pretendard','serif'] },
      boxShadow: { card:'0 14px 40px -18px rgba(21,32,58,.22)', soft:'0 2px 10px -4px rgba(21,32,58,.10)' }
    }}}
  </script>
  <style>h1,h2{font-family:'Noto Serif KR',Pretendard,serif}
    .opt.sel{border-color:#b8923f;background:#faf6ea;color:#15203a;font-weight:600}
  </style>
</head>
<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <header class="sticky top-0 z-40 bg-paper/90 backdrop-blur border-b border-ink/8">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-2 shrink-0"><span class="w-8 h-8 rounded-lg bg-ink flex items-center justify-center shrink-0"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#b8923f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.6C10.4 5.5 8.4 5 6 5C4.7 5 3.7 5.15 3 5.35V18.2C3.7 18 4.7 17.85 6 17.85C8.4 17.85 10.4 18.35 12 19.5"/><path d="M12 6.6C13.6 5.5 15.6 5 18 5C19.3 5 20.3 5.15 21 5.35V18.2C20.3 18 19.3 17.85 18 17.85C15.6 17.85 13.6 18.35 12 19.5"/><path d="M12 6.6V19.5"/></svg></span><span class="leading-none"><span class="block font-extrabold text-[15px] tracking-tight">BIBLY<span class="text-gold">.</span></span><span class="block text-[9px] text-ink/45 tracking-wide mt-0.5">말씀으로 시대를 읽다</span></span></a>
      <nav id="navmenu" class="flex items-center gap-4 sm:gap-5 text-sm text-ink/70 overflow-x-auto whitespace-nowrap pl-1"></nav>
      <div class="ml-auto flex items-center gap-3 shrink-0"><span id="authArea" class="flex items-center gap-2"></span><a href="index.html" class="text-sm text-ink/45 hover:text-gold">홈</a></div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <div id="introHead" class="text-center mb-7">
      <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">COURSE FINDER · 수강 진단</p>
      <h1 class="text-2xl md:text-3xl font-bold">나에게 맞는 강의 찾기</h1>
      <p class="text-ink/55 text-sm mt-3">6가지 질문에 답하면, 신앙 배경·관심·목표를 분석해 <b class="text-ink">당신에게 최적화된 코스와 학습 순서</b>를 추천해 드려요.</p>
    </div>

    <!-- 진행 막대 -->
    <div id="progressWrap" class="mb-5">
      <div class="flex items-center justify-between text-xs text-ink/50 mb-1.5">
        <span id="stepLabel">질문 1 / 6</span>
        <span id="stepPct">17%</span>
      </div>
      <div class="h-2 rounded-full bg-ink/8 overflow-hidden"><div id="progressBar" class="h-full bg-gold rounded-full transition-all" style="width:17%"></div></div>
    </div>

    <!-- 진단 (스텝) -->
    <div id="step" class="min-h-[260px]"></div>
    <div id="stepNav" class="mt-6 flex items-center justify-between gap-3">
      <button id="prevBtn" onclick="prevStep()" class="px-5 py-3 rounded-full border border-ink/15 text-ink/60 font-semibold text-sm hover:bg-ink/5 transition disabled:opacity-0">← 이전</button>
      <button id="nextBtn" onclick="nextStep()" disabled class="flex-1 max-w-[280px] ml-auto bg-ink text-paper font-semibold px-8 py-3.5 rounded-full hover:bg-navy transition shadow-card disabled:opacity-40 disabled:cursor-not-allowed">다음 →</button>
    </div>

    <!-- 결과 -->
    <div id="result" class="hidden"></div>
  </main>

  <script>
    // 7개 분야(그룹) — course.json의 group 값과 정확히 일치해야 함
    const GROUPS = {
      basic:     { name:'신앙의 기초',     emoji:'📘', tag:'입문',     why:'신앙을 처음 시작했거나 기초를 다지고 싶은 분께. 예수님·구원·교회 등 기독교의 핵심부터 차근차근.' },
      bible:     { name:'성경으로 더 깊이', emoji:'📖', tag:'기초~중급', why:'성경 각 권과 핵심 주제(로마서·레위기·기도·성령)를 스스로 깊이 읽고 싶은 분께.' },
      worldview: { name:'세계관과 분별',   emoji:'🧭', tag:'중급',     why:'세상을 성경의 눈으로 읽고, 이단·사이비·교리를 흔들림 없이 분별하고 싶은 분께.' },
      endtime:   { name:'종말과 예언',     emoji:'🔮', tag:'중급~심화', why:'천년왕국·요한계시록·종말 예언의 큰 그림을 음모론 없이 잡고 싶은 분께. 채널의 대표 시리즈.' },
      people:    { name:'인물에게 배우다', emoji:'👤', tag:'전체',     why:'사도 바울과 스펄전·로이드존스 등 위대한 신앙 인물의 삶에서 도전을 받고 싶은 분께.' },
      life:      { name:'삶으로 살아내기', emoji:'🌱', tag:'전체',     why:'관계·회복·동기부여·문화 등 믿음을 일상으로 살아내는 지혜가 필요한 분께.' },
    };
    // 학습 순서(기초→심화). '그 외' 분야는 추천에서 제외
    const GORDER = ['basic','bible','worldview','endtime','people','life'];
    const LEVELS_LABEL = ['입문','초급','중급','심화'];
    // multi: 복수 선택 허용 질문 / lv: Q1 응답별 추천 단계
    const QUESTIONS = [
      { q:'신앙·성경 공부, 지금 어느 단계이신가요?', sub:'배경에 맞춰 시작 단계를 조정해 드려요.', opts:[
        { t:'이제 막 시작했어요 — 신앙 입문', s:{basic:3}, lv:0 },
        { t:'교회는 다니지만 기초가 약해요', s:{basic:2, bible:1}, lv:1 },
        { t:'기본은 알고, 더 깊이 가고 싶어요', s:{bible:1, worldview:1, endtime:1}, lv:2 },
        { t:'오래 신앙생활했고 심화를 원해요', s:{endtime:2, worldview:1, bible:1}, lv:3 },
      ]},
      { q:'어떤 분야에 마음이 끌리세요?', sub:'여러 개 골라도 좋아요 (복수 선택).', multi:true, opts:[
        { t:'📘 기독교 기초·신앙 입문', s:{basic:3} },
        { t:'📖 성경 각 권·주제 깊이 공부', s:{bible:3} },
        { t:'🧭 세계관·교리·이단 분별', s:{worldview:3} },
        { t:'🔮 종말·천년왕국·예언', s:{endtime:3} },
        { t:'👤 신앙 인물·위대한 설교자', s:{people:3} },
        { t:'🌱 관계·동기부여·삶의 적용', s:{life:3} },
      ]},
      { q:'가장 먼저 풀고 싶은 질문은 무엇인가요?', sub:'끌리는 질문 하나만 골라주세요.', opts:[
        { t:'예수님은 누구시고, 구원이란 무엇인가', s:{basic:3} },
        { t:'성경을 어떻게 읽고 통독할까', s:{bible:3} },
        { t:'종말·계시록·천년왕국의 큰 그림', s:{endtime:3} },
        { t:'이단·세상 풍조를 어떻게 분별할까', s:{worldview:3} },
        { t:'관계·상처·삶의 문제에 답을 찾고 싶다', s:{life:3} },
      ]},
      { q:'지금 가장 절실한 마음은 무엇인가요?', sub:'동기에 맞는 출발점을 찾아드려요.', opts:[
        { t:'신앙의 기본기를 제대로 세우고 싶다', s:{basic:2} },
        { t:'종말이 불안하고 분별이 필요하다', s:{endtime:2, worldview:1} },
        { t:'성경을 스스로 읽는 힘을 기르고 싶다', s:{bible:2} },
        { t:'지치고 힘든 마음에 회복이 필요하다', s:{life:2} },
        { t:'깊은 교리·신학으로 더 들어가고 싶다', s:{worldview:2, bible:1} },
      ]},
      { q:'성경 본문에 얼마나 익숙하신가요?', sub:'본문 친숙도에 맞춰 추천해요.', opts:[
        { t:'성경 구조가 아직 낯설어요', s:{basic:2, bible:1} },
        { t:'신약 위주로 압니다', s:{bible:1, people:1, endtime:1} },
        { t:'구약·신약을 두루 읽었어요', s:{bible:1, endtime:1, worldview:1} },
        { t:'원어·신학 개념도 어느 정도 압니다', s:{worldview:2, endtime:1} },
      ]},
      { q:'한 번에 공부하기 좋은 시간은?', sub:'호흡에 맞춰 분량을 잡아드려요.', opts:[
        { t:'짧게 핵심만 (10~20분)', s:{basic:1, life:1} },
        { t:'보통 (20~40분)', s:{bible:1, worldview:1} },
        { t:'길어도 깊이 있게 (40분 이상)', s:{endtime:1, people:1} },
      ]},
      { q:'이 공부로 가장 이루고 싶은 목표는?', sub:'목표에 맞는 분야를 매칭해요.', opts:[
        { t:'신앙의 기초를 든든히 세우기', s:{basic:2} },
        { t:'스스로 분별하는 힘 기르기', s:{worldview:1, endtime:1} },
        { t:'성경을 깊이 있게 통독·연구', s:{bible:2} },
        { t:'삶의 변화와 마음의 회복', s:{life:2} },
        { t:'가족·다음 세대 신앙 교육', s:{basic:1, worldview:1, bible:1} },
      ]},
    ];

    const answers = QUESTIONS.map(Q => Q.multi ? [] : -1);
    let stepIdx = 0, COURSE = null;
    const N = QUESTIONS.length;

    function answered(qi){ const Q = QUESTIONS[qi]; return Q.multi ? answers[qi].length > 0 : answers[qi] >= 0; }
    function renderStep(){
      const qi = stepIdx, Q = QUESTIONS[qi];
      document.getElementById('stepLabel').textContent = `질문 ${qi+1} / ${N}`;
      const pct = Math.round((qi) / N * 100) + Math.round(1/N*100*(answered(qi)?1:0));
      const shown = Math.round((qi + (answered(qi)?1:0)) / N * 100);
      document.getElementById('stepPct').textContent = shown + '%';
      document.getElementById('progressBar').style.width = shown + '%';
      document.getElementById('step').innerHTML = `
        <div class="bg-white rounded-2xl border border-ink/8 shadow-soft p-5 md:p-6">
          <p class="font-bold text-lg leading-snug"><span class="text-gold">Q${qi+1}.</span> ${Q.q}</p>
          ${ Q.sub ? `<p class="text-ink/50 text-sm mt-1.5">${Q.sub}</p>` : '' }
          <div class="grid gap-2.5 mt-4">
            ${Q.opts.map((o, oi) => {
              const sel = Q.multi ? answers[qi].includes(oi) : answers[qi] === oi;
              return `<button class="opt text-left border border-ink/15 rounded-xl px-4 py-3 text-sm hover:border-gold transition flex items-center gap-3 ${sel?'sel':''}" onclick="choose(${qi},${oi})">
                <span class="shrink-0 w-5 h-5 rounded-${Q.multi?'md':'full'} border-2 ${sel?'border-gold bg-gold':'border-ink/25'} flex items-center justify-center text-white text-xs">${sel ? '✓' : ''}</span>
                <span class="flex-1">${o.t}</span></button>`;
            }).join('')}
          </div>
        </div>`;
      document.getElementById('prevBtn').disabled = qi === 0;
      const nb = document.getElementById('nextBtn');
      nb.disabled = !answered(qi);
      nb.textContent = (qi === N-1) ? '결과 보기 →' : '다음 →';
    }
    function choose(qi, oi){
      const Q = QUESTIONS[qi];
      if(Q.multi){
        const arr = answers[qi]; const i = arr.indexOf(oi);
        if(i >= 0) arr.splice(i,1); else arr.push(oi);
        renderStep();   // 멀티는 머무르며 토글
      } else {
        answers[qi] = oi; renderStep();
        // 단일 선택은 잠깐 보여주고 자동 진행
        setTimeout(() => { if(stepIdx === qi && answers[qi] === oi) nextStep(); }, 260);
      }
    }
    function prevStep(){ if(stepIdx > 0){ stepIdx--; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); } }
    function nextStep(){
      if(!answered(stepIdx)) return;
      if(stepIdx < N-1){ stepIdx++; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
      else showResult();
    }

    async function showResult(){
      const score = {}; GORDER.forEach(k => score[k] = 0);
      answers.forEach((ans, qi) => {
        const Q = QUESTIONS[qi];
        const picks = Q.multi ? ans : [ans];
        picks.forEach(oi => { const s = Q.opts[oi] && Q.opts[oi].s; if(s) for(const k in s) if(k in score) score[k] += s[k]; });
      });
      // 동점 시 기초→심화(GORDER) 우선
      const ranked = GORDER.slice().sort((a, b) => (score[b] - score[a]) || (GORDER.indexOf(a) - GORDER.indexOf(b)));
      let top3 = ranked.filter(k => score[k] > 0).slice(0, 3);
      if(!top3.length) top3 = ['basic'];
      const maxScore = score[ranked[0]] || 1;
      // 학습 순서: 추천 분야를 기초→심화로 정렬
      const path = top3.slice().sort((a, b) => GORDER.indexOf(a) - GORDER.indexOf(b));

      if(!COURSE){ try { COURSE = await (await fetch('content/course.json?t=' + Date.now())).json(); } catch(e){ COURSE = { levels: [] }; } }
      const levels = COURSE.levels || [];
      let acc = 0; const startOf = {};
      levels.forEach(lv => { startOf[lv.name] = acc; acc += (lv.lessons || []).length; });
      const fit = k => Math.max(40, Math.round(score[k] / maxScore * 100));
      // 분야(그룹)에 속한 트랙들 — course.json 순서(기초 트랙 먼저)
      const tracksOf = k => levels.filter(lv => lv.group === GROUPS[k].name);
      const entryOf  = k => tracksOf(k)[0] || null;
      const cntOf    = k => tracksOf(k).reduce((s, lv) => s + (lv.lessons || []).length, 0);

      const levelLabel = LEVELS_LABEL[answers[0]] || '입문';
      const pace = answers[5];                        // Q6: 0 짧게 / 1 보통 / 2 길어도
      const perWeek = pace === 0 ? 4 : pace === 2 ? 2 : 3;
      // 시작 플랜 분량 = 각 분야의 첫(기초) 트랙
      const planLessons = path.reduce((s, k) => { const e = entryOf(k); return s + (e ? (e.lessons || []).length : 0); }, 0);
      const weeks = Math.max(1, Math.ceil(planLessons / perWeek));

      function planStep(key, n, isFirst){
        const g = GROUPS[key], tracks = tracksOf(key), entry = entryOf(key);
        const start = (entry && entry.name in startOf) ? startOf[entry.name] : 0;
        const eCnt = entry ? (entry.lessons || []).length : 0;
        const more = Math.max(0, tracks.length - 1), totalCnt = cntOf(key);
        const first = entry && entry.lessons && entry.lessons[0] ? entry.lessons[0].title : '';
        return `<div class="bg-white rounded-2xl border ${ isFirst ? 'border-2 border-gold' : 'border-ink/8' } shadow-soft p-5">
          <div class="flex items-start gap-4">
            <div class="shrink-0 w-10 h-10 rounded-full ${ isFirst ? 'bg-gold text-white' : 'bg-gold/15 text-gold' } font-bold flex items-center justify-center">${n}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <p class="font-bold text-[17px]">${g.emoji} ${g.name}</p>
                <span class="text-[11px] bg-ink/8 text-ink/60 px-2 py-0.5 rounded-full font-semibold">${g.tag}</span>
                ${ isFirst ? '<span class="text-[11px] bg-gold text-white px-2 py-0.5 rounded-full font-bold">여기서 시작</span>' : '' }
                <span class="text-xs text-ink/40">적합도 ${fit(key)}%</span>
              </div>
              <p class="text-sm text-ink/60 mt-1.5 leading-relaxed">${g.why}</p>
              <div class="mt-3 bg-paper/70 border border-ink/8 rounded-xl px-3.5 py-2.5">
                <p class="text-xs text-gold font-bold mb-0.5">먼저 들을 코스</p>
                <p class="text-sm font-semibold">${entry ? entry.name : ''} <span class="text-ink/40 font-normal">· ${eCnt}강</span></p>
                ${ first ? `<p class="text-xs text-ink/45 mt-0.5 truncate">첫 강의: ${first}</p>` : '' }
              </div>
              <p class="text-xs text-ink/45 mt-2">이 분야 총 ${tracks.length}개 트랙 · ${totalCnt}강${ more ? ` (코스 ${more}개 더 있어요)` : '' }</p>
              <a href="watch.html?l=${start}" class="inline-block mt-2.5 text-sm font-semibold text-gold hover:underline">이 코스부터 보기 →</a>
            </div>
          </div>
        </div>`;
      }
      function secCard(key){
        const g = GROUPS[key], entry = entryOf(key);
        const start = (entry && entry.name in startOf) ? startOf[entry.name] : 0;
        return `<a href="watch.html?l=${start}" class="block bg-white rounded-2xl border border-ink/8 shadow-soft p-4 hover:shadow-card transition">
          <div class="flex items-center justify-between"><p class="font-bold text-sm">${g.emoji} ${g.name}</p><span class="text-xs text-gold font-semibold shrink-0">적합도 ${fit(key)}%</span></div>
          <p class="text-sm text-ink/55 mt-1.5 leading-relaxed">${g.why}</p>
        </a>`;
      }

      document.getElementById('introHead').classList.add('hidden');
      document.getElementById('progressWrap').classList.add('hidden');
      document.getElementById('step').classList.add('hidden');
      document.getElementById('stepNav').classList.add('hidden');
      const res = document.getElementById('result');
      res.classList.remove('hidden');
      const extras = ranked.filter(k => !path.includes(k) && score[k] > 0).slice(0, 2);
      const firstG = GROUPS[path[0]], firstEntry = entryOf(path[0]);
      const firstStart = (firstEntry && firstEntry.name in startOf) ? startOf[firstEntry.name] : 0;
      res.innerHTML = `
        <div class="text-center mb-6">
          <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">YOUR LEARNING PLAN · 맞춤 학습 플랜</p>
          <h1 class="text-2xl font-bold">당신을 위한 학습 플랜이 완성됐어요</h1>
          <p class="text-ink/55 text-sm mt-2">답변을 분석해, <b class="text-ink">${levelLabel}</b> 단계에 맞는 분야와 순서로 설계했어요.</p>
        </div>
        <div class="bg-ink text-paper rounded-2xl p-5 mb-6 grid grid-cols-3 divide-x divide-white/10 text-center">
          <div class="px-2"><p class="text-xs text-paper/50">추천 시작 단계</p><p class="font-bold mt-1">${levelLabel}</p></div>
          <div class="px-2"><p class="text-xs text-paper/50">시작 분량</p><p class="font-bold mt-1">총 ${planLessons}강</p></div>
          <div class="px-2"><p class="text-xs text-paper/50">예상 기간</p><p class="font-bold mt-1">약 ${weeks}주</p></div>
        </div>
        <div class="bg-gold/10 border border-gold/30 rounded-xl p-4 mb-7 text-center text-sm text-ink/75">
          🎯 <b class="text-ink">${firstG.emoji} ${firstG.name}</b> 분야의 「${firstEntry ? firstEntry.name : ''}」부터 시작하는 걸 추천해요.
        </div>
        <p class="font-bold mb-3 flex items-center gap-2">🗺️ 단계별 학습 플랜 <span class="text-ink/40 text-xs font-normal">기초 → 심화</span></p>
        <div class="space-y-3">${ path.map((k, i) => planStep(k, i+1, i===0)).join('') }</div>
        <div class="mt-4 bg-paper border border-gold/30 rounded-xl p-4 text-center text-sm text-ink/70">💡 추천 페이스: <b class="text-ink">주 ${perWeek}강</b> 기준 약 <b class="text-ink">${weeks}주</b>면 시작 코스를 완주해요. 무리하지 말고 꾸준히!</div>
        <a href="watch.html?l=${firstStart}" class="block text-center bg-ink text-paper font-semibold px-8 py-4 rounded-full hover:bg-navy transition shadow-card mt-6">▶ 「${firstEntry ? firstEntry.name : ''}」부터 시작하기</a>
        ${ extras.length ? `<div class="mt-9"><p class="font-bold mb-3">📚 관심 있다면 이 분야도</p><div class="grid gap-3">${extras.map(secCard).join('')}</div></div>` : '' }
        <div class="flex flex-col sm:flex-row gap-3 justify-center mt-9">
          <button onclick="resetQuiz()" class="px-6 py-3 rounded-full border border-ink/15 text-ink/60 font-semibold text-sm hover:bg-ink/5 transition">↺ 다시 진단하기</button>
          <a href="curriculum.html" class="px-6 py-3 rounded-full border border-ink/15 text-ink/60 font-semibold text-sm hover:bg-ink/5 transition text-center">전체 커리큘럼 보기</a>
        </div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function resetQuiz(){
      for(let i=0;i<QUESTIONS.length;i++) answers[i] = QUESTIONS[i].multi ? [] : -1;
      stepIdx = 0;
      document.getElementById('result').classList.add('hidden');
      document.getElementById('introHead').classList.remove('hidden');
      document.getElementById('progressWrap').classList.remove('hidden');
      document.getElementById('step').classList.remove('hidden');
      document.getElementById('stepNav').classList.remove('hidden');
      renderStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    renderStep();
  </script>

  <script>
    fetch('content/site.json?t=' + Date.now()).then(r => r.json()).then(s => {
      const nav = document.getElementById('navmenu'); if(!nav || !s.menu) return;
      const cur = (location.pathname.split('/').pop() || 'index.html');
      nav.innerHTML = s.menu.map(m => {
        const hash = m.href.startsWith('#');
        const href = hash ? ('index.html' + m.href) : m.href;
        const active = !hash && (href.split('?')[0] === cur);
        return '<a href="' + href + '" class="' + (active ? 'text-gold font-semibold' : 'hover:text-gold') + '">' + m.label + '</a>';
      }).join('');
    }).catch(() => {});
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="auth-header.js"></script>
</body>
</html>

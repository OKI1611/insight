  <script>
  /* =========================================================================
     성경 해석 능력 진단 — 6개 역량 측정 + 심리검사형 리포트
     ========================================================================= */
  const $ = id => document.getElementById(id);
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 6개 역량 축
  const DIMS = [
    { k:'knowledge',     ko:'성경 지식', en:'Bible Knowledge' },
    { k:'comprehension', ko:'본문 이해', en:'Comprehension' },
    { k:'interpretation',ko:'해석 능력', en:'Interpretation' },
    { k:'discernment',   ko:'교리 분별', en:'Discernment' },
    { k:'application',   ko:'삶의 적용', en:'Application' },
    { k:'selfstudy',     ko:'자립 학습', en:'Self-study' },
  ];
  // 강의 분야(course.json group과 일치)
  const GROUPS = {
    basic:     { name:'신앙의 기초',     tag:'입문',     why:'예수님·구원·교회 등 기독교의 핵심부터 차근차근 다지는 분야.' },
    bible:     { name:'성경으로 더 깊이', tag:'기초~중급', why:'성경 각 권과 핵심 주제(로마서·레위기·기도)를 스스로 깊이 읽는 분야.' },
    worldview: { name:'세계관과 분별',   tag:'중급',     why:'세상을 성경의 눈으로 읽고 이단·교리를 흔들림 없이 분별하는 분야.' },
    endtime:   { name:'종말과 예언',     tag:'중급~심화', why:'천년왕국·요한계시록·종말 예언의 큰 그림을 잡는 대표 시리즈.' },
    people:    { name:'인물에게 배우다', tag:'전체',     why:'사도 바울과 위대한 신앙 인물의 삶에서 도전을 받는 분야.' },
    life:      { name:'삶으로 살아내기', tag:'전체',     why:'관계·회복·동기부여 등 믿음을 일상으로 살아내는 분야.' },
  };
  const GORDER = ['basic','bible','worldview','endtime','people','life'];

  // ---------- PART A : 자기보고 6문항 ----------
  const PART_A = [
    { q:'신앙생활은 얼마나 되셨나요?', sub:'배경을 이해하기 위한 질문이에요.', opts:[
      { t:'이제 막 시작했어요 (1년 미만)', d:{years:0} },
      { t:'1~5년 정도 됐어요', d:{years:1} },
      { t:'5~15년 됐어요', d:{years:2} },
      { t:'15년 이상 됐어요', d:{years:3} },
    ]},
    { q:'요즘 성경을 스스로 얼마나 읽으시나요?', sub:'자립 학습 습관을 봅니다.', opts:[
      { t:'거의 못 읽어요', d:{ss:0} },
      { t:'예배·모임 때 주로 봐요', d:{ss:1} },
      { t:'주 몇 차례 스스로 읽어요', d:{ss:2} },
      { t:'매일, 계획을 세워 규칙적으로 읽어요', d:{ss:3} },
    ]},
    { q:'신앙 훈련·교육 경험이 있으신가요?', sub:'배운 기초를 반영해요.', opts:[
      { t:'특별한 교육은 받지 못했어요', d:{train:0} },
      { t:'새가족·기초 교육 정도 받았어요', d:{train:1} },
      { t:'제자훈련·성경공부반을 수료했어요', d:{train:2} },
      { t:'신학교육을 받았거나 가르치는 위치예요', d:{train:3} },
    ]},
    { q:'가장 마음이 끌리는 분야는? ', sub:'여러 개 골라도 좋아요 (복수 선택).', multi:true, opts:[
      { t:'기독교 기초·신앙 입문', d:{group:'basic'} },
      { t:'성경 각 권·통독', d:{group:'bible'} },
      { t:'세계관·교리·이단 분별', d:{group:'worldview'} },
      { t:'종말·천년왕국·예언', d:{group:'endtime'} },
      { t:'신앙 인물·위대한 설교자', d:{group:'people'} },
      { t:'관계·회복·삶의 적용', d:{group:'life'} },
    ]},
    { q:'이 공부로 가장 이루고 싶은 것은?', sub:'목표에 학습을 맞춰 드려요.', opts:[
      { t:'신앙의 기초를 든든히 세우기', d:{goal:'basic'} },
      { t:'성경을 스스로 읽고 해석하는 힘', d:{goal:'bible'} },
      { t:'이단·세상 풍조를 분별하는 힘', d:{goal:'worldview'} },
      { t:'삶의 변화와 마음의 회복', d:{goal:'life'} },
      { t:'배워서 남을 가르치고 이끌기', d:{goal:'lead'} },
    ]},
    { q:'한 번에 공부하기 좋은 시간은?', sub:'호흡에 맞춰 분량을 잡아드려요.', opts:[
      { t:'짧게 핵심만 (10~20분)', d:{pace:0} },
      { t:'보통 (20~40분)', d:{pace:1} },
      { t:'길어도 깊이 있게 (40분 이상)', d:{pace:2} },
    ]},
  ];

  // ---------- PART B : 실제 채점 24문항 (dim별 6문항, 5지선다·고난도) ----------
  // a = 정답 인덱스, dim = 측정 역량, ex = 해설
  const PART_B = [
    // ===== 성경 지식 (6) — 정경 구조·역사 =====
    { dim:'knowledge', q:'다음 중 ‘모세오경(율법서)’에 속하지 않는 책은?', c:['출애굽기','레위기','여호수아','민수기','신명기'], a:2,
      ex:'모세오경은 창세기·출애굽기·레위기·민수기·신명기입니다. 여호수아는 그 다음 역사서예요.' },
    { dim:'knowledge', q:'바울의 ‘옥중서신’으로 분류되지 않는 것은?', c:['에베소서','빌립보서','골로새서','데살로니가전서','빌레몬서'], a:3,
      ex:'옥중서신은 에베소·빌립보·골로새·빌레몬서 넷입니다. 데살로니가전서는 옥중서신이 아닙니다.' },
    { dim:'knowledge', q:'다음 중 구약의 ‘시가서(지혜서)’가 아닌 것은?', c:['욥기','시편','잠언','전도서','이사야'], a:4,
      ex:'시가서는 욥기·시편·잠언·전도서·아가입니다. 이사야는 대선지서(예언서)예요.' },
    { dim:'knowledge', q:'‘공관복음(共觀福音)’에 해당하는 세 권은?', c:['마태·마가·누가','마태·마가·요한','마가·누가·요한','마태·누가·요한','네 복음서 전부'], a:0,
      ex:'마태·마가·누가는 내용·구조가 비슷해 공관복음이라 부릅니다. 요한복음은 관점이 뚜렷이 다릅니다.' },
    { dim:'knowledge', q:'다음 인물을 활동 시대가 이른 순서대로 바르게 나열한 것은?', c:['아브라함 → 모세 → 다윗 → 바울','모세 → 아브라함 → 다윗 → 바울','아브라함 → 다윗 → 모세 → 바울','다윗 → 아브라함 → 모세 → 바울','모세 → 아브라함 → 바울 → 다윗'], a:0,
      ex:'족장 아브라함 → 출애굽의 모세 → 왕정의 다윗 → 신약의 바울 순입니다.' },
    { dim:'knowledge', q:'다음 중 예수님의 ‘열두 제자’에 포함되지 않는 인물은?', c:['베드로','안드레','마태','바울','요한'], a:3,
      ex:'바울(사울)은 부활·승천 이후 부르심을 받은 사도로, 지상 사역의 열두 제자에는 들지 않습니다.' },
    // ===== 본문 이해 (6) — 본문을 정확히 읽는가 =====
    { dim:'comprehension', q:'“오직 성령의 열매는…”(갈 5:22-23)에 열매로 ‘나열되지 않은’ 것은?', c:['오래 참음','자비','충성','절제','지혜'], a:4,
      ex:'성령의 아홉 열매는 사랑·희락·화평·오래참음·자비·양선·충성·온유·절제입니다. ‘지혜’는 이 목록에 없습니다.' },
    { dim:'comprehension', q:'“너희가 거듭난 것은 썩지 아니할 씨로 된 것이니…”(벧전 1:23). 본문이 말하는 ‘썩지 아니할 씨’는?', c:['살아 있고 항상 있는 하나님의 말씀','세례의 물','사람의 선한 결심','육신의 혈통','교회의 전통'], a:0,
      ex:'바로 그 절이 “하나님의 말씀으로 되었느니라”고 밝힙니다. 씨는 곧 하나님의 말씀입니다.' },
    { dim:'comprehension', q:'“물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라”(요 3:5). 니고데모에게 하신 이 말씀의 핵심은?', c:['율법을 온전히 지켜야 한다','물세례만 받으면 충분하다','거듭남(중생) 없이는 하나님 나라에 들어갈 수 없다','방언의 은사를 받아야 한다','어머니 태로 다시 들어가야 한다'], a:2,
      ex:'예수님은 육의 출생이 아니라 성령으로 인한 거듭남(중생)의 필요성을 말씀하십니다.' },
    { dim:'comprehension', q:'“너희는 택하신 족속이요 왕 같은 제사장들이요…”(벧전 2:9)에서 ‘왕 같은 제사장’이 가리키는 대상은?', c:['구약의 레위 지파','모든 신자(성도)','교회의 목사만','이스라엘의 왕들','천사들'], a:1,
      ex:'신약의 만인제사장 진리로, 그리스도를 믿는 모든 성도를 가리킵니다.' },
    { dim:'comprehension', q:'“내가 그리스도와 함께 십자가에 못 박혔나니…”(갈 2:20). 바울이 말하려는 바는?', c:['옛 자아는 죽고 이제 그리스도께서 내 삶을 다스리신다','바울이 실제로 십자가에서 죽었다','이제 아무 일도 하지 않아도 된다','다시 율법 아래로 돌아간다','그리스도께서 떠나셨다'], a:0,
      ex:'옛 사람은 그리스도와 함께 죽고, 이제 내 안에 그리스도께서 사시는 새 생명을 말합니다.' },
    { dim:'comprehension', q:'“행함이 없는 믿음은 그 자체가 죽은 것이라”(약 2:17)가 뜻하는 바는?', c:['믿음은 필요 없다','행함으로 구원을 얻는다','믿음과 행함은 아무 상관이 없다','참된 믿음은 반드시 행함(열매)으로 나타난다','행함이 믿음보다 앞선다'], a:3,
      ex:'야고보는 믿음을 부정하지 않고, 살아 있는 참믿음은 열매로 증명된다고 말합니다.' },
    // ===== 해석 능력 (6) — 문맥·장르 =====

      ex:'성경은 하나님의 감동으로 된 완전한 계시로, 신앙과 삶의 최종 권위입니다(딤후 3:16).' },

      ex:'‘오직 은혜·오직 믿음’은 정통 복음의 핵심입니다. 나머지 넷은 이단의 전형적 특징이에요.' },

  const QUESTIONS = PART_A.map(q=>Object.assign({part:'A'},q))
    .concat(PART_B.map(q=>Object.assign({part:'B'},q)));
  const N = QUESTIONS.length;                 // 18
  const answers = QUESTIONS.map(q => q.multi ? [] : -1);
  let stepIdx = 0, COURSE = null, LAST_REPORT = null;

  function answered(i){ const Q=QUESTIONS[i]; return Q.multi ? answers[i].length>0 : answers[i]>=0; }

  function renderStep(){
    const i = stepIdx, Q = QUESTIONS[i];
    const doneCount = answers.filter((a,qi)=>answered(qi)).length;
    const pct = Math.round(doneCount / N * 100);
    $('stepLabel').textContent = `질문 ${i+1} / ${N}`;
    $('stepPct').textContent = pct + '%';
    $('progressBar').style.width = pct + '%';
    $('partLabel').textContent = Q.part==='A' ? 'PART 1 · 나의 배경과 습관' : 'PART 2 · 성경 문해력 실제 측정';

    const choices = Q.part==='A' ? Q.opts : Q.c.map((t,idx)=>({t}));
    const isMulti = !!Q.multi;
    const qhead = Q.part==='A'
      ? `<span class="text-gold">Q${i+1}.</span> ${esc(Q.q)}`
      : `<span class="text-gold">Q${i+1}.</span> ${esc(Q.q)}`;
    const badge = Q.part==='B'
      ? `<span class="text-[10.5px] font-bold text-gold bg-gold/10 border border-gold/25 px-2 py-0.5 rounded-full">채점 문항 · ${DIMS.find(d=>d.k===Q.dim).ko}</span>` : '';

    $('step').innerHTML = `
      <div class="bg-white rounded-2xl border border-ink/8 shadow-soft p-5 md:p-6">
        <div class="flex items-start gap-2 justify-between">
          <p class="font-bold text-lg leading-snug flex-1">${qhead}</p>
          ${badge}
        </div>
        ${ Q.sub ? `<p class="text-neutral-900/50 text-sm mt-1.5">${esc(Q.sub)}</p>` : '' }
        <div class="grid gap-2.5 mt-4">
          ${choices.map((o,oi)=>{
            const sel = isMulti ? answers[i].includes(oi) : answers[i]===oi;
            return `<button class="opt text-left border border-ink/15 rounded-xl px-4 py-3 text-sm hover:border-gold transition flex items-center gap-3 ${sel?'sel':''}" onclick="choose(${i},${oi})">
              <span class="shrink-0 w-5 h-5 rounded-${isMulti?'md':'full'} border-2 ${sel?'border-gold bg-gold':'border-ink/25'} flex items-center justify-center text-white text-xs">${sel?'✓':''}</span>
              <span class="flex-1">${esc(o.t)}</span></button>`;
          }).join('')}
        </div>
      </div>`;
    $('prevBtn').disabled = i===0;
    const nb = $('nextBtn'); nb.disabled = !answered(i);
    nb.textContent = (i===N-1) ? '결과 리포트 보기 →' : '다음 →';
  }
  function choose(i, oi){
    const Q = QUESTIONS[i];
    if(Q.multi){ const arr=answers[i], j=arr.indexOf(oi); if(j>=0) arr.splice(j,1); else arr.push(oi); renderStep(); }
    else { answers[i]=oi; renderStep(); setTimeout(()=>{ if(stepIdx===i && answers[i]===oi) nextStep(); }, 240); }
  }
  function prevStep(){ if(stepIdx>0){ stepIdx--; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); } }
  function nextStep(){ if(!answered(stepIdx)) return; if(stepIdx<N-1){ stepIdx++; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); }

  /* ---------------- 채점 ---------------- */
  function aVal(qi, key){ const o=PART_A[qi].opts[answers[qi]]; return o && o.d && (key in o.d) ? o.d[key] : null; }
  function computeScores(){
    // Part A 값
    const years = aVal(0,'years') ?? 0;
    const ss    = aVal(1,'ss') ?? 0;
    const train = aVal(2,'train') ?? 0;
    const interests = (answers[3]||[]).map(oi=>PART_A[3].opts[oi].d.group);
    const goal  = aVal(4,'goal') || 'bible';
    const pace  = aVal(5,'pace') ?? 1;
    // Part B 채점 (dim별 정답 수)
    const correctByDim = { knowledge:0, comprehension:0, interpretation:0, discernment:0 };
    const review = [];
    PART_B.forEach((Q,idx)=>{
      const gi = PART_A.length + idx;         // 전체 answers 인덱스
      const picked = answers[gi];
      const ok = picked === Q.a;
      if(ok) correctByDim[Q.dim]++;
      review.push({ dim:Q.dim, q:Q.q, picked, correct:Q.a, ok, choices:Q.c, ex:Q.ex });
    });
    const qScore = (c,tot) => Math.round(8 + (c/tot)*90);   // 6문항: 0→8 … 3→53 … 6→98
    const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
    const knowledge     = clamp(qScore(correctByDim.knowledge,6) + train*2, 8, 100);
    const comprehension = qScore(correctByDim.comprehension,6);
    const interpretation= qScore(correctByDim.interpretation,6);
    const discernment   = clamp(qScore(correctByDim.discernment,6) + train*2, 8, 100);
    const selfstudy     = clamp([34,54,74,90][ss] + (years>=2?4:0) + (train>=2?4:0), 20, 97);
    const goalBonus     = goal==='life'?18 : goal==='lead'?12 : 6;
    const application   = clamp(comprehension*0.4 + interpretation*0.25 + selfstudy*0.12 + goalBonus, 25, 96);
    const dims = { knowledge, comprehension, interpretation, discernment, application, selfstudy };
    const W = { knowledge:.15, comprehension:.2, interpretation:.24, discernment:.16, application:.12, selfstudy:.13 };
    let overall = 0; for(const k in W) overall += dims[k]*W[k]; overall = Math.round(overall);
    const topPct = Math.max(3, Math.round((100-overall)*0.82));
    return { dims, overall, topPct, correctByDim, review, years, ss, train, interests, goal, pace };
  }
  // 등급(급수 + 4단계)
  function bandOf(overall){
    const B = [
      { min:88, stage:'심화', rank:'1급 Laureate', blurb:'예언·종말의 큰 그림까지 꿰는 최고 단계에 도전할 역량입니다.' },
      { min:74, stage:'심화', rank:'2급 Master',    blurb:'세계관과 분별로 시대의 거짓을 가려내는 심화 단계가 적합합니다.' },
      { min:60, stage:'중급', rank:'3급 Expert',    blurb:'본문을 깊이 강해하고 핵심 교리로 골격을 세울 단계입니다.' },
      { min:44, stage:'초급', rank:'4급 Professional', blurb:'성경을 스스로 읽고 삶에 적용하며 실력을 키울 단계입니다.' },
      { min:0,  stage:'입문', rank:'5급 Associate', blurb:'복음·구원의 핵심부터 기초를 든든히 세울 단계입니다.' },
    ];
    return B.find(b => overall >= b.min);
  }
  // 유형
  function typeOf(s){
    const d = s.dims;
    if(s.years===0 && s.overall < 46) return { name:'첫걸음 새신자', en:'The First Steps', desc:'이제 막 믿음의 길에 들어선 당신 — 기초를 차근차근 세우면 성경이 활짝 열립니다.' };
    if(d.interpretation>=70 && d.discernment>=67) return { name:'분별하는 탐구자', en:'The Discerning Student', desc:'문맥을 읽고 참·거짓을 가려내는 힘이 뛰어납니다. 더 깊은 강해와 교리로 나아갈 때예요.' };
    if(d.knowledge>=67 && d.comprehension>=70 && d.interpretation<70) return { name:'성실한 통독자', en:'The Diligent Reader', desc:'꾸준히 읽어 지식과 이해가 탄탄합니다. 이제 스스로 해석하는 심화 기어를 올릴 단계예요.' };
    if(d.application>=72 && d.selfstudy>=60) return { name:'삶으로 사는 실천가', en:'The Faithful Doer', desc:'말씀을 삶으로 옮기는 힘이 강합니다. 해석의 깊이를 더하면 열매가 더 풍성해집니다.' };
    if(d.selfstudy<48) return { name:'열망하는 구도자', en:'The Eager Seeker', desc:'배우고자 하는 마음이 큽니다. 규칙적으로 스스로 읽는 루틴부터 세우면 빠르게 성장합니다.' };
    if(Object.values(d).every(v=>v>=72)) return { name:'말씀의 파수꾼', en:'The Watchman', desc:'모든 역량이 고르게 높습니다. 시대를 분별해 다른 이들을 깨우고 인도할 단계예요.' };
    return { name:'자라나는 학습자', en:'The Growing Learner', desc:'기초 위에 해석·분별의 근육을 붙여 갈 때입니다. 단계별 학습이 큰 도움이 됩니다.' };
  }

  function levelTag(v){ return v>=72 ? ['강점','#e2f3ea','#177a4a'] : v>=52 ? ['양호','#f3ead4','#8a6d2f'] : v>=38 ? ['보완','#fbeadd','#b9560f'] : ['성장','#fde7e7','#c0392b']; }

  /* ---------------- 리포트 ---------------- */
  async function showResult(){
    const s = computeScores();

        <div class="flex gap-2 mt-3">

  function drawViz(dims, overall){

    const labels=DIMS.map(d=>d.ko), vals=DIMS.map(d=>dims[d.k]);
    const cx=150,cy=125,R=86;
    const pt=(i,r)=>{ const a=(-90+60*i)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
    const svg=$('radar'); if(!svg) return; let out='';
    [0.25,0.5,0.75,1].forEach(f=>{ out+='<polygon points="'+labels.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="#e7e9ee" stroke-width="1"/>'; });
    labels.forEach((_,i)=>{ const e=pt(i,R); out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#e7e9ee" stroke-width="1"/>'; });
    out+='<polygon points="'+vals.map((v,i)=>pt(i,R*v/100).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="rgba(184,146,63,.2)" stroke="#b8923f" stroke-width="2"/>';
    vals.forEach((v,i)=>{ const p=pt(i,R*v/100); out+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#b8923f"/>'; });
    labels.forEach((l,i)=>{ const p=pt(i,R+22), anc=Math.abs(p[0]-cx)<8?'middle':(p[0]<cx?'end':'start'); out+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" font-size="11" font-weight="700" fill="#4b5563" text-anchor="'+anc+'">'+l+'</text>'; });
    svg.innerHTML=out;
  }

  /* ---------------- PDF 다운로드 ---------------- */
  async function downloadPDF(btn){
    const el = document.getElementById('reportCapture');
    if(!el){ return; }
    if(!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)){
      alert('PDF 모듈을 아직 불러오는 중이에요. 잠시 후 다시 눌러 주세요.'); return;
    }
    const old = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'PDF 만드는 중…'; }
    // 캡처 동안 해설 아코디언을 모두 펼침
    const dets = [...el.querySelectorAll('details')]; const wasOpen = dets.map(d=>d.open); dets.forEach(d=>d.open=true);
    // 기기 폭과 무관하게 일관된 A4 출력을 위해 캡처 동안 고정 폭 적용(모바일 잘림 방지)
    const prevW = el.style.width, prevMax = el.style.maxWidth;
    el.style.width = '640px'; el.style.maxWidth = '640px';
    try{
      const canvas = await html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, width:640, windowWidth:680 });
      const img = canvas.toDataURL('image/jpeg', 0.92);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','mm','a4');
      const pw = 210, ph = 297, m = 8;
      const iw = pw - m*2, ih = canvas.height * iw / canvas.width;
      let heightLeft = ih, position = m;
      pdf.addImage(img, 'JPEG', m, position, iw, ih);
      heightLeft -= (ph - m*2);
      while(heightLeft > 0){
        pdf.addPage();
        position = m - (ih - heightLeft);
        pdf.addImage(img, 'JPEG', m, position, iw, ih);
        heightLeft -= (ph - m*2);
      }
      pdf.save('성경문해력_리포트_' + (LAST_REPORT ? LAST_REPORT.date : '') + '.pdf');
    }catch(e){
      alert('PDF 저장에 문제가 있었어요. 브라우저 인쇄(Ctrl+P) → “PDF로 저장”을 이용해 주세요.');
    }
    el.style.width = prevW; el.style.maxWidth = prevMax;
    dets.forEach((d,i)=>d.open = wasOpen[i]);
    if(btn){ btn.disabled = false; btn.textContent = old; }
  }

    let r=null; try{ r=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
    if(!r) return;
    // 저장본은 요약 카드로 간단 표시 후 재진단 유도
    $('introHead').classList.add('hidden'); $('progressWrap').classList.add('hidden');
    $('step').classList.add('hidden'); $('stepNav').classList.add('hidden'); $('resumeBanner').classList.add('hidden');
    const res=$('result'); res.classList.remove('hidden');
    res.innerHTML=`<div class="text-center mb-5"><p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">SAVED REPORT · 지난 진단</p><h1 class="serif text-2xl font-bold">지난 성경 문해력 리포트</h1><p class="text-neutral-900/45 text-xs mt-2">진단일 ${r.date}</p></div>
      <div class="bg-white border border-ink/8 rounded-2xl shadow-soft p-6 mb-4 flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-5">
        <div style="position:relative;width:120px;height:120px;flex:none"><svg viewBox="0 0 126 126" width="120" height="120"><circle cx="63" cy="63" r="50" fill="none" stroke="#eef0f4" stroke-width="12"/><circle id="gauge" cx="63" cy="63" r="50" fill="none" stroke="#b8923f" stroke-width="12" stroke-linecap="round" transform="rotate(-90 63 63)" stroke-dasharray="314.2" stroke-dashoffset="314.2"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:30px;font-weight:800;color:#213a6b">${r.overall}</div><div class="text-neutral-900/40" style="font-size:11px">/ 100</div></div></div>
        <div style="flex:1;min-width:200px"><div class="serif text-lg font-bold">${r.stage} 수준 · ${r.rank}</div><div class="text-gold text-sm font-bold mt-1">${r.type}</div><div class="text-neutral-900/50 text-xs mt-1">상위 약 ${r.topPct}%</div></div>
      </div>
      <div class="grid gap-2.5 mb-5" id="savedBars"></div>
      <div class="flex flex-col sm:flex-row gap-3 justify-center"><button onclick="resetQuiz()" class="bg-gold text-white px-6 py-3 rounded-full font-semibold text-sm hover:opacity-90 transition">↻ 새로 진단하기</button><a href="academy.html" class="px-6 py-3 rounded-full border border-ink/15 text-neutral-900/60 font-semibold text-sm hover:bg-ink/5 transition text-center">인증 급수 과정 보기</a></div>`;
    const bars=$('savedBars'); if(bars&&r.dims){ bars.innerHTML=DIMS.map(d=>{ const v=r.dims[d.k]||0; return `<div><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12.5px;font-weight:700">${d.ko}</span><span style="font-size:12px;font-weight:800;color:#213a6b">${v}</span></div><div class="bar-tr"><div class="bar-fl" style="width:${v}%"></div></div></div>`; }).join(''); }
    drawGauge(r.overall); window.scrollTo({top:0,behavior:'smooth'});
  }
  function drawGauge(overall){ const g=$('gauge'); if(g){ const C=2*Math.PI*50; g.setAttribute('stroke-dashoffset',(C*(1-overall/100)).toFixed(1)); } }

  function resetQuiz(){
    for(let i=0;i<N;i++) answers[i]=QUESTIONS[i].multi?[]:-1;
    stepIdx=0;
    $('result').classList.add('hidden'); $('result').innerHTML='';
    $('introHead').classList.remove('hidden'); $('progressWrap').classList.remove('hidden');
    $('step').classList.remove('hidden'); $('stepNav').classList.remove('hidden');
    renderStep(); window.scrollTo({top:0,behavior:'smooth'});
  }

  showResumeBanner();
  renderStep();
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="auth-header.js?v=20260619c"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나에게 맞는 강의 찾기 — 오광일의 인사이트 브리핑</title>
  <meta name="description" content="3가지만 답하면, 지금 당신에게 가장 잘 맞는 강의를 찾아드립니다. 무엇부터 들을지 막막한 분을 위한 강의 추천 진단." />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#15203a" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#15203a', navy:'#1b2a4a', gold:'#b8923f', sand:'#efe7d6', paper:'#fcfaf6' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'], display:['"Noto Serif KR"','Pretendard','serif'] },
      boxShadow: { card:'0 14px 40px -18px rgba(21,32,58,.22)', soft:'0 2px 10px -4px rgba(21,32,58,.10)' }
    }}}
  </script>
  <style>h1,h2{font-family:'Noto Serif KR',Pretendard,serif}
    .opt.sel{border-color:#b8923f;background:#faf6ea;color:#15203a;font-weight:600}
  </style>
</head>
<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <header class="sticky top-0 z-40 bg-paper/90 backdrop-blur border-b border-ink/8">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="font-bold text-[15px] shrink-0">오광일의 <span class="text-gold">인사이트 브리핑</span></a>
      <nav id="navmenu" class="flex items-center gap-4 sm:gap-5 text-sm text-ink/70 overflow-x-auto whitespace-nowrap pl-1"></nav>
      <a href="index.html" class="ml-auto text-sm text-ink/45 hover:text-gold shrink-0">홈</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <div class="text-center mb-9">
      <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">FIND YOUR CLASS</p>
      <h1 class="text-2xl md:text-3xl font-bold">나에게 맞는 강의 찾기</h1>
      <p class="text-ink/55 text-sm mt-3">무엇부터 들을지 막막하신가요? <b class="text-ink">4가지만 답하면</b> 지금 당신에게 꼭 맞는 강의를 찾아드려요.</p>
    </div>

    <!-- 진단 -->
    <div id="quiz" class="space-y-6"></div>
    <div id="quizFoot" class="mt-8 text-center">
      <button id="resultBtn" onclick="showResult()" disabled
        class="bg-ink text-paper font-semibold px-8 py-4 rounded-full hover:bg-navy transition shadow-card disabled:opacity-40 disabled:cursor-not-allowed">
        결과 보기 →
      </button>
      <p id="quizHint" class="text-ink/45 text-xs mt-3">모든 질문에 답하면 결과를 볼 수 있어요.</p>
    </div>

    <!-- 결과 -->
    <div id="result" class="hidden"></div>
  </main>

  <script>
    const TRACK = {
      millennium:'천년왕국 세미나', prophecy:'예언의 기초 · 구약과 다니엘',
      current:'종말과 국제정세 · 제3성전', essay:'신앙 에세이 · 분별',
      preacher:'위대한 설교자', paul:'사도바울 — 은혜와 근성의 사람',
      cult:'이단·사이비 분별', doctrine:'신학노트 · 핵심 교리'
    };
    const PRIORITY = ['millennium','prophecy','current','cult','doctrine','preacher','paul','essay'];
    const WHY = {
      millennium:'종말과 천년왕국의 큰 그림을 처음부터 순서대로 잡고 싶은 당신에게.',
      prophecy:'계시록의 열쇠가 되는 구약(스가랴·다니엘)부터 단단히 다지고 싶은 당신에게.',
      current:'이스라엘·중동·국제정세를 성경 예언의 눈으로 읽고 싶은 당신에게.',
      cult:'이단·사이비·음모론에 흔들리지 않는 분별력을 기르고 싶은 당신에게.',
      doctrine:'하나님·죄·구원 같은 신앙의 기초 교리를 단단히 세우고 싶은 당신에게.',
      preacher:'위대한 신앙 인물과 설교에서 깊은 도전을 받고 싶은 당신에게.',
      paul:'사도 바울의 삶과 사역에서 동역과 인내를 배우고 싶은 당신에게.',
      essay:'짧지만 깊은 신앙 에세이로 마음을 정돈하고 싶은 당신에게.'
    };
    const QUESTIONS = [
      { q:'성경 예언·종말 공부, 지금 어느 정도이신가요?', opts:[
        { t:'거의 처음이에요', s:{millennium:2, prophecy:1} },
        { t:'조금 들어봤어요', s:{millennium:1, current:1} },
        { t:'꽤 공부했어요', s:{current:2, doctrine:1, paul:1} },
      ]},
      { q:'가장 마음이 끌리는 주제는?', opts:[
        { t:'천년왕국·휴거·재림, 종말의 큰 그림', s:{millennium:3} },
        { t:'이스라엘·중동·국제정세 속 예언', s:{current:3} },
        { t:'스가랴·다니엘 같은 구약 예언의 기초', s:{prophecy:3} },
        { t:'이단·사이비에 흔들리지 않는 분별', s:{cult:3} },
        { t:'하나님·죄·구원, 신앙의 기초 교리', s:{doctrine:3} },
        { t:'위대한 신앙 인물과 설교', s:{preacher:3} },
        { t:'사도 바울의 삶과 사역', s:{paul:3} },
      ]},
      { q:'지금 가장 큰 고민은?', opts:[
        { t:'종말이 두렵고 혼란스러워요', s:{millennium:2} },
        { t:'음모론·이단 정보에 자꾸 흔들려요', s:{cult:2, current:1} },
        { t:'성경을 어떻게 읽을지 막막해요', s:{prophecy:2, doctrine:1} },
        { t:'신앙을 더 깊이 다지고 싶어요', s:{preacher:1, paul:1, doctrine:1} },
      ]},
      { q:'어떤 강의가 더 편하세요?', opts:[
        { t:'짧고 핵심만 (10~20분)', s:{cult:1, essay:1, doctrine:1} },
        { t:'길어도 깊이 있게 (30분 이상)', s:{millennium:1, current:1} },
      ]},
    ];
    const answers = new Array(QUESTIONS.length).fill(-1);
    let COURSE = null;

    function renderQuiz(){
      document.getElementById('quiz').innerHTML = QUESTIONS.map((Q, qi) => `
        <div class="bg-white rounded-2xl border border-ink/8 shadow-soft p-5">
          <p class="font-bold mb-3"><span class="text-gold">Q${qi+1}.</span> ${Q.q}</p>
          <div class="grid gap-2">
            ${Q.opts.map((o, oi) => `<button class="opt text-left border border-ink/15 rounded-xl px-4 py-3 text-sm hover:border-gold transition" data-q="${qi}" data-o="${oi}" onclick="pick(${qi},${oi})">${o.t}</button>`).join('')}
          </div>
        </div>`).join('');
    }
    function pick(qi, oi){
      answers[qi] = oi;
      document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b => b.classList.toggle('sel', +b.dataset.o === oi));
      const all = answers.every(a => a >= 0);
      document.getElementById('resultBtn').disabled = !all;
      if(all) document.getElementById('quizHint').textContent = '준비됐어요! 결과 보기를 눌러주세요.';
    }
    async function showResult(){
      if(!answers.every(a => a >= 0)) return;
      const score = {}; Object.keys(TRACK).forEach(k => score[k] = 0);
      answers.forEach((oi, qi) => { const s = QUESTIONS[qi].opts[oi].s; for(const k in s) score[k] += s[k]; });
      const ranked = PRIORITY.slice().sort((a, b) => score[b] - score[a]);
      const top = ranked[0], second = ranked[1];

      if(!COURSE){ try { COURSE = await (await fetch('content/course.json?t=' + Date.now())).json(); } catch(e){ COURSE = { levels: [] }; } }
      const levels = COURSE.levels || [];
      let acc = 0; const startOf = {};
      levels.forEach(lv => { startOf[lv.name] = acc; acc += (lv.lessons || []).length; });
      const lvlByName = n => levels.find(lv => lv.name === n) || null;

      function card(key, primary){
        const name = TRACK[key];
        const lv = lvlByName(name);
        const start = (name in startOf) ? startOf[name] : 0;
        const first = lv && lv.lessons && lv.lessons[0] ? lv.lessons[0].title : '';
        const cnt = lv && lv.lessons ? lv.lessons.length : 0;
        if(primary){
          return `<div class="bg-white rounded-3xl border-2 border-gold shadow-card p-7 text-center">
            <p class="text-gold text-xs font-bold tracking-[0.25em] mb-3">추천 강의</p>
            <h2 class="text-2xl font-bold mb-2">${name}</h2>
            <p class="text-ink/60 text-sm mb-4">${lv ? (lv.desc||'') : ''}</p>
            <p class="text-ink/75 text-[15px] leading-relaxed mb-5">${WHY[key]}</p>
            <div class="bg-paper rounded-xl border border-ink/8 p-4 mb-6 text-left">
              <p class="text-xs text-ink/45 mb-1">첫 강의</p>
              <p class="font-semibold text-sm">${first}</p>
              <p class="text-xs text-ink/45 mt-1">총 ${cnt}강 · 무료 공개</p>
            </div>
            <a href="watch.html?l=${start}" class="inline-block bg-ink text-paper font-semibold px-8 py-4 rounded-full hover:bg-navy transition shadow-card">▶ 이 강의로 시작하기</a>
          </div>`;
        }
        return `<a href="watch.html?l=${start}" class="block bg-white rounded-2xl border border-ink/8 shadow-soft p-5 hover:shadow-card transition">
          <p class="text-xs text-gold font-bold mb-1">함께 추천</p>
          <p class="font-bold">${name}</p>
          <p class="text-sm text-ink/55 mt-1">${WHY[key]}</p>
        </a>`;
      }

      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('quizFoot').classList.add('hidden');
      const res = document.getElementById('result');
      res.classList.remove('hidden');
      res.innerHTML = `
        <div class="text-center mb-6">
          <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">YOUR RESULT</p>
          <h1 class="text-2xl font-bold">당신에게 맞는 강의를 찾았어요!</h1>
        </div>
        ${card(top, true)}
        <div class="mt-5">${card(second, false)}</div>
        <div class="text-center mt-8">
          <button onclick="resetQuiz()" class="text-sm text-ink/55 hover:text-gold underline">다시 진단하기</button>
        </div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function resetQuiz(){
      for(let i=0;i<answers.length;i++) answers[i] = -1;
      document.getElementById('result').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('quizFoot').classList.remove('hidden');
      document.getElementById('resultBtn').disabled = true;
      document.getElementById('quizHint').textContent = '모든 질문에 답하면 결과를 볼 수 있어요.';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    renderQuiz();
  </script>

  <script>
    fetch('content/site.json?t=' + Date.now()).then(r => r.json()).then(s => {
      const nav = document.getElementById('navmenu'); if(!nav || !s.menu) return;
      const cur = (location.pathname.split('/').pop() || 'index.html');
      nav.innerHTML = s.menu.map(m => {
        const hash = m.href.startsWith('#');
        const href = hash ? ('index.html' + m.href) : m.href;
        const active = !hash && (href.split('?')[0] === cur);
        return '<a href="' + href + '" class="' + (active ? 'text-gold font-semibold' : 'hover:text-gold') + '">' + m.label + '</a>';
      }).join('');
    }).catch(() => {});
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>
</html>

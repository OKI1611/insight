  <style>
    html{scroll-behavior:auto}
    .rp{display:none;max-width:46rem;margin:0 auto;padding:0 1.25rem 4rem;color:#1f2937;overflow-wrap:break-word}
    .rp[data-l="ko"]{word-break:keep-all}
    .rp[data-l="ja"],.rp[data-l="zh"]{word-break:normal;line-break:strict}
    html:not([data-ui]) .rp[data-l="ko"]{display:block}
    {{SHOW}}
    .rp .hero{padding:3rem 0 1.6rem;border-bottom:1px solid #213a6b14;margin-bottom:1.6rem}
    .rp .kicker{color:#00704a;font-size:.78rem;font-weight:800;letter-spacing:.18em;margin:0 0 .7rem}
    .rp h1{font-size:2rem;font-weight:800;line-height:1.25;color:#182c54;margin:0}
    .rp h1 small{display:block;font-size:1.08rem;font-weight:600;color:#4b5563;margin-top:.55rem}
    .rp .lead{margin:1.2rem 0 0;font-size:1.04rem;line-height:1.85;color:#374151}
    .rp .upd{margin:.9rem 0 0;font-size:.82rem;color:#6b7280}
    .rp .toc{background:#eaf0f8;border-radius:1rem;padding:1.1rem 1.25rem;margin:0 0 2rem}
    .rp .toc p{font-size:.8rem;font-weight:800;color:#00704a;letter-spacing:.08em;margin:0 0 .4rem}
    .rp .toc a{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:48px;padding:.55rem .2rem;font-size:1rem;font-weight:600;color:#1f2937;border-bottom:1px dashed #213a6b1c;text-decoration:none}
    .rp .toc a:last-child{border-bottom:0}
    .rp .toc a:hover{color:#00704a}
    .rp .toc a em{flex:none;font-style:normal;font-size:.8rem;font-weight:800;color:#00704a;background:#fff;border-radius:999px;padding:.25rem .7rem}
    /* 한 장씩 보기: 처음엔 소개+차례만, 장을 누르면 그 장만(스크립트가 html.rp-paged 를 붙일 때만 — 스크립트가 없으면 전체가 다 보인다) */
    html.rp-paged .rp .sec{display:none}
    html.rp-paged .rp .sec.on{display:block}
    html.rp-paged .rp.reading .hero,html.rp-paged .rp.reading .toc,html.rp-paged .rp.reading .see{display:none}
    .rp .back{display:none}
    html.rp-paged .rp .back{display:inline-flex;align-items:center;min-height:44px;margin-top:1.4rem;font-size:.9rem;font-weight:800;color:#00704a;text-decoration:none}
    html.rp-paged .rp .sec > h2{margin-top:.6rem;padding-top:0;border-top:0}
    .rp .secnav{display:none}
    html.rp-paged .rp .secnav{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:2.4rem 0 1rem}
    .rp .secnav a{display:block;min-height:64px;padding:.8rem 1rem;border:1px solid #213a6b22;border-radius:.9rem;background:#fff;color:#182c54;font-weight:700;font-size:.92rem;line-height:1.45;text-decoration:none}
    .rp .secnav a small{display:block;font-size:.75rem;font-weight:800;color:#00704a;margin-bottom:.2rem}
    .rp .secnav .nx{text-align:right;grid-column:2}
    .rp .secnav a:hover{border-color:#00704a}
    .rp section{scroll-margin-top:96px}
    .rp h2{font-size:1.4rem;font-weight:800;color:#182c54;margin:2.8rem 0 1rem;padding-top:1.4rem;border-top:2px solid #00704a22}
    .rp h3{font-size:1.12rem;font-weight:800;color:#00704a;margin:2rem 0 .7rem}
    .rp p{font-size:1.04rem;line-height:1.9;margin:0 0 1rem}
    .rp b{color:#111827}
    .rp .vs{margin:1rem 0 1.2rem;padding:1rem 1.15rem;background:#f7faf8;border-left:4px solid #00704a;border-radius:0 .75rem .75rem 0}
    .rp .vs p{font-family:'Noto Serif KR',Georgia,serif;font-size:1.02rem;line-height:1.9;margin:0;color:#111827}
    .rp .vs[lang="ja"] p,.rp .vs[lang="zh-Hant"] p{font-family:inherit}
    .rp .vs .vn{color:#00704a;font-weight:700;font-size:.7em;margin:0 .15em 0 .3em}
    .rp .vs cite{display:block;margin-top:.5rem;font-style:normal;font-size:.85rem;font-weight:700;color:#00704a}
    .rp .callout{background:#fff8e6;border:1px solid #f0d58a;border-radius:.8rem;padding:1rem 1.1rem;font-size:1rem;line-height:1.85;margin:1rem 0 1.3rem}
    .rp .tw{overflow-x:auto;margin:1rem 0 1.4rem;border:1px solid #213a6b1f;border-radius:.8rem}
    .rp table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:30rem}
    .rp th{background:#182c54;color:#fff;text-align:left;padding:.65rem .8rem;font-weight:700}
    .rp td{padding:.65rem .8rem;border-top:1px solid #213a6b14;vertical-align:top;line-height:1.65}
    .rp td:first-child{font-weight:700;color:#182c54}
    .rp .bl{margin:.6rem 0 1.2rem;padding-left:1.2rem;list-style:disc}
    .rp .bl li{font-size:1.02rem;line-height:1.85;margin:0 0 .55rem}
    .rp .qa .bl li{font-size:1rem}
    /* 휴대폰: 표를 한 줄씩 카드로 바꿔 가로 스크롤 없이 읽게 한다(칸 이름은 data-h) */
    @media(max-width:640px){
      .rp .tw{border:0;overflow:visible}
      .rp table{min-width:0}
      .rp thead{display:none}
      .rp table,.rp tbody,.rp tr,.rp td{display:block;width:100%}
      .rp tr{border:1px solid #213a6b1f;border-radius:.8rem;margin:0 0 .7rem;padding:.35rem .2rem;background:#fff}
      .rp td{border-top:0;padding:.35rem .8rem}
      .rp td[data-h]:not([data-h=""])::before{content:attr(data-h);display:block;font-size:.78rem;font-weight:800;color:#00704a;margin-bottom:.1rem}
      .rp td:first-child{font-size:1.02rem}
    }
    .rp .qa{border:1px solid #213a6b1a;border-radius:1rem;padding:0 1.2rem;margin:0 0 .8rem;background:#fff;box-shadow:0 2px 10px -6px rgba(21,32,58,.15)}
    .rp .qa .q{font-weight:800;color:#182c54;font-size:1.04rem;line-height:1.6;display:flex;gap:.6rem;align-items:flex-start;padding:1rem 0;min-height:48px;cursor:pointer;list-style:none}
    .rp .qa .q::-webkit-details-marker{display:none}
    .rp .qa .q b{flex:1;color:inherit}
    .rp .qa .q i{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:#eaf0f8;margin-top:.05rem;position:relative}
    .rp .qa .q i::before{content:'';position:absolute;left:50%;top:45%;width:.45rem;height:.45rem;border-right:2px solid #182c54;border-bottom:2px solid #182c54;transform:translate(-50%,-50%) rotate(45deg)}
    .rp .qa[open] .q i::before{top:58%;transform:translate(-50%,-50%) rotate(-135deg)}
    .rp .qa .a{padding:0 0 .6rem;border-top:1px dashed #213a6b1c}
    .rp .qa .q span{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:#00704a;color:#fff;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:.05rem}
    .rp sup.fr a{color:#00704a;font-weight:800;font-size:.78em;padding:0 .1em;text-decoration:none}
    .rp .notes ol{padding-left:1.3rem;margin:0}
    .rp .notes li{font-size:.95rem;line-height:1.8;margin:0 0 .7rem;color:#374151;scroll-margin-top:96px}
    .rp .notes li:target{background:#fff8e6;border-radius:.4rem}
    .rp .notes .bk{color:#00704a;text-decoration:none;font-weight:700}
    .rp .refs h4{font-size:.92rem;font-weight:800;color:#182c54;margin:1.2rem 0 .4rem}
    .rp .refs ul{margin:0;padding-left:1.1rem}
    .rp .refs li{font-size:.92rem;line-height:1.7;color:#374151;margin:0 0 .35rem;word-break:normal;overflow-wrap:anywhere}
    .rp .see{margin-top:2.6rem;padding:1.2rem 1.25rem;border-radius:1rem;background:#182c54}
    .rp .see p{color:#9fd8bd;font-size:.8rem;font-weight:800;letter-spacing:.08em;margin:0 0 .5rem}
    .rp .see a{display:block;color:#fff;font-weight:700;padding:.55rem 0;min-height:44px;border-bottom:1px solid #ffffff1f}
    .rp .see a:last-child{border-bottom:0}
    @media(max-width:640px){.rp h1{font-size:1.6rem}.rp h2{font-size:1.25rem}.rp p{font-size:1rem}}
  </style>
</head>
<body class="font-sans bg-paper text-neutral-900 antialiased min-h-screen">

  <div id="siteHeader" data-active="rapture.html"></div>
{{ARTICLES}}
  <script>
  // 선택한 언어의 원고가 아직 없으면 한국어를 보여 준다
  (function(){ try{
    var u = document.documentElement.getAttribute('data-ui');
    if(u && !document.querySelector('.rp[data-l="' + u + '"]')) document.documentElement.setAttribute('data-ui','ko');
  }catch(e){} })();
  // 한 장씩 보기 — 주소의 #(장·각주 위치)를 보고 그 장만 보여 준다. 뒤로 가기·공유 링크·각주 이동이 모두 # 로 움직인다.
  (function(){
    var root = document.documentElement; root.classList.add('rp-paged');
    function art(){ return document.querySelector('.rp[data-l="' + (root.getAttribute('data-ui') || 'ko') + '"]') || document.querySelector('.rp[data-l="ko"]'); }
    function go(top){ try{ window.scrollTo({ top: Math.max(0, top), behavior: 'instant' }); }catch(e){ window.scrollTo(0, Math.max(0, top)); } }
    function show(){
      var a = art(); if(!a) return;
      var id = decodeURIComponent((location.hash || '').slice(1));
      var t = id ? document.getElementById(id) : null;
      if(t && !a.contains(t)){                         // 언어를 바꿨으면 같은 장의 그 언어 위치로
        var m = id.match(/^[a-z]{2}-(.+)$/); t = m ? document.getElementById(a.getAttribute('data-l') + '-' + m[1]) : null;
      }
      var sec = t ? t.closest('.sec') : null;
      a.classList.toggle('reading', !!sec);
      a.querySelectorAll('.sec').forEach(function(s){ s.classList.toggle('on', s === sec); });
      if(!sec){ go(t && t.id.slice(-4) === '-toc' ? a.querySelector('.toc').getBoundingClientRect().top + window.scrollY - 90 : 0); return; }
      for(var d = t.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) d.open = true;
      if(t === sec) go(a.getBoundingClientRect().top + window.scrollY - 70);
      else { t.scrollIntoView({ block: 'center' }); }
    }
    window.addEventListener('hashchange', show);
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  })();
  </script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://biblynote.com/level" />

  <meta property="og:description" content="10문항으로 확인하고 맞춤 학습 로드맵을 받아보세요." />
  <meta property="og:image" content="https://biblynote.com/images/og-cover.png?v=8" />

  <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BIBLY" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#213a6b', navy:'#182c54', gold:'#00704a', sand:'#eaf0f8', paper:'#ffffff' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'] },
      boxShadow: { soft:'0 2px 10px -4px rgba(21,32,58,.10)', card:'0 18px 50px -20px rgba(21,32,58,.28)' }
    }}}
  </script>
  <style>
    .glow{background:radial-gradient(60% 60% at 50% 0%,rgba(0,112,74,.16),transparent 70%)}
    .optBtn{min-height:48px}
    .optBtn.sel{border-color:#00704a;background:rgba(0,112,74,.08);font-weight:700}
  </style>
  <script src="/i18n.js?v=20261127f"></script>
</head>
<body class="font-sans bg-paper text-neutral-900 antialiased">

  <header class="border-b border-ink/8">
    <div class="max-w-5xl mx-auto px-5 h-14 flex items-center justify-center">
      <a href="index.html" class="inline-flex items-center gap-2">
        <img src="/images/logo-heritage-wide.png?v=3" alt="바이블 인사이트" class="h-8 w-auto" />
        <span class="font-bold text-[17px] tracking-tight">바이블 인사이트<span class="text-gold">.</span></span>
      </a>
    </div>
  </header>

  <!-- 진단 -->
  <section id="quizView" class="relative overflow-hidden">
    <div class="absolute inset-0 glow"></div>
    <div class="relative max-w-xl mx-auto px-5 pt-10 pb-14">
      <div class="text-center">
        <p class="inline-flex items-center gap-2 bg-gold/15 text-gold text-xs font-bold px-3 py-1.5 rounded-full tracking-wide">무료 진단 · 10문항 · 약 3분</p>
        <h1 class="mt-4 text-[26px] md:text-[36px] font-black leading-[1.18] tracking-tight">내 성경 이해,<br/><span class="text-gold">지금 몇 급일까요?</span></h1>
        <p class="mt-3 text-neutral-900/60 text-[14px]">가입 없이 바로 가능합니다. 점수에 맞는 시작 급수를 추천해 드려요.</p>
      </div>
      <div class="mt-4 h-2 rounded-full bg-ink/10 overflow-hidden"><div id="qBar" class="h-full bg-gold rounded-full transition-all" style="width:0%"></div></div>
      <div id="qWrap" class="mt-6"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="resultView" style="display:none" class="max-w-xl mx-auto px-5 pt-10 pb-16"></section>

  <footer class="py-10 text-center border-t border-ink/8">
    <p class="text-neutral-900/45 text-xs">© BIBLY 바이블 인사이트 · 말씀으로 시대를 읽다</p>
  </footer>

  <script>
    // ===== 진단 10문항 — 기초(구원·성경)부터 예언(계시록·천년왕국)까지 한 계단씩 =====
    var QS = [
      { q:'성경이 말하는 구원의 근거는 무엇일까요?', o:['선한 행실을 충분히 쌓는 것','은혜로, 믿음으로 받는 하나님의 선물','교회 예식에 빠짐없이 참여하는 것','착한 마음을 유지하는 것'], a:1, ref:'엡 2:8-9' },
      { q:'성경 66권의 구성으로 맞는 것은?', o:['구약 27권 · 신약 39권','구약 39권 · 신약 27권','구약 46권 · 신약 20권','구약 33권 · 신약 33권'], a:1, ref:'' },
      { q:'예수님의 부활이 우리에게 중요한 가장 큰 이유는?', o:['위대한 스승의 감동적인 결말이라서','우리 부활의 첫 열매, 곧 보증이 되시기 때문','교회 절기의 기원이 되었기 때문','제자들의 용기를 설명해 주기 때문'], a:1, ref:'고전 15:20' },
      { q:'구원받은 사람이 죄를 지으면 어떻게 될까요?', o:['구원이 취소된다','자녀로서 아버지의 징계를 받으며, 자백하면 교제가 회복된다','다시 세례를 받아야 한다','아무 일도 일어나지 않는다'], a:1, ref:'요일 1:9, 히 12:6' },
      { q:'삼위일체를 가장 바르게 설명한 것은?', o:['한 하나님이 세 가지 모습으로 번갈아 나타나신다','세 하나님이 한 팀을 이루신다','한 하나님이 성부·성자·성령 세 위격으로 계신다','예수님은 하나님보다 낮은 신적 존재다'], a:2, ref:'' },
      { q:'이단을 분별하는 가장 확실한 기준은?', o:['교세가 작고 모임이 폐쇄적인가','헌금을 강조하는가','성경 외에 교주나 추가 계시를 같은 권위로 두는가','예배 형식이 낯선가'], a:2, ref:'갈 1:8' },
      { q:'다니엘 2장의 큰 신상 환상이 보여주는 것은?', o:['바벨론 왕의 개인적인 악몽','이방 제국들의 흥망 순서와 마지막에 임할 하나님 나라','성전 건축의 설계도','교회 시대의 일곱 단계'], a:1, ref:'단 2장' },
      { q:'데살로니가전서 4장이 말하는 주님 강림 때의 순서는?', o:['산 자가 먼저 올라가고 죽은 자는 남는다','그리스도 안에서 죽은 자들이 먼저 일어나고, 살아남은 자들이 함께 끌어올려진다','모든 사람이 동시에 심판대 앞에 선다','죽은 자들은 영원히 잠든 상태로 있는다'], a:1, ref:'살전 4:16-17' },
      { q:'요한계시록 1장 19절이 알려주는 계시록 전체의 구조는?', o:['과거·현재·미래 — 본 것, 지금 있는 일, 장차 될 일','일곱 교회에게 보낸 일곱 통의 편지 모음','바벨론 멸망의 반복 서술','순서 없는 상징들의 모음'], a:0, ref:'계 1:19' },
      { q:'요한계시록 20장의 "천 년"을 가장 자연스럽게 읽으면?', o:['교회 시대를 가리키는 비유적 숫자','그리스도께서 땅에서 다스리시는 실제 기간','신자의 마음속 평안을 뜻하는 표현','이미 지나간 역사의 한 시대'], a:1, ref:'계 20:4-6' }
    ];
    // 점수 → 추천 급수(프로그램의 rank 문자열과 일치해야 academy 자동선택이 된다)
    function recommend(score){
      if(score <= 3) return '5급';
      if(score <= 5) return '4급';
      if(score <= 7) return '3급';
      if(score <= 9) return '2급';
      return '1급';
    }

    var answers = new Array(QS.length).fill(-1);
    var wrap = document.getElementById('qWrap'), bar = document.getElementById('qBar');
    function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function render(){
      wrap.innerHTML = QS.map(function(x, qi){
        return '<div class="bg-white border border-ink/8 rounded-2xl shadow-soft p-5 mb-3.5">'
          + '<p class="font-bold text-[15px] leading-snug"><span class="text-gold">Q' + (qi+1) + '.</span> ' + esc(x.q) + '</p>'
          + '<div class="mt-3 grid gap-2">' + x.o.map(function(opt, oi){
              return '<button type="button" data-q="' + qi + '" data-o="' + oi + '" class="optBtn text-left border border-ink/12 rounded-xl px-4 py-3 text-[13.5px] leading-snug hover:border-gold/60 transition' + (answers[qi]===oi?' sel':'') + '">' + esc(opt) + '</button>';
            }).join('') + '</div></div>';
      }).join('')
      + '<button id="qSubmit" class="w-full min-h-[54px] bg-gold text-white font-bold text-[16px] rounded-2xl hover:opacity-90 transition shadow-card disabled:opacity-40" disabled>결과 보기</button>'
      + '<p class="text-center text-[12px] text-neutral-900/40 mt-2">모든 문항에 답하면 버튼이 열립니다</p>';
      wrap.querySelectorAll('.optBtn').forEach(function(b){
        b.addEventListener('click', function(){
          var qi = +b.dataset.q;
          answers[qi] = +b.dataset.o;
          wrap.querySelectorAll('.optBtn[data-q="' + qi + '"]').forEach(function(x){ x.classList.toggle('sel', +x.dataset.o === answers[qi]); });
          var done = answers.filter(function(a){ return a >= 0; }).length;
          bar.style.width = (done / QS.length * 100) + '%';
          var btn = document.getElementById('qSubmit');
          if(done === QS.length){ btn.disabled = false; btn.scrollIntoView({ behavior:'smooth', block:'center' }); }
        });
      });
      wrap.addEventListener('click', function(e){ if(e.target && e.target.id === 'qSubmit' && !e.target.disabled) showResult(); });
    }
    render();

    // ===== 결과 — program.json 에서 추천 급수 카드 + 기수 D-day =====
    function cohortState(prog){
      var c = prog && prog.cohort; if(!c || !c.deadline) return null;
      var end = new Date(c.deadline + 'T23:59:59+09:00');
      if(isNaN(end)) return null;
      var ms = end - new Date();
      return { name:c.name||'', startNote:c.startNote||'', over: ms < 0, daysLeft: Math.max(0, Math.floor(ms/86400000)) };
    }
    var won = function(v){ return Number(v).toLocaleString() + '원'; };
    async function showResult(){
      var score = answers.reduce(function(s, a, i){ return s + (a === QS[i].a ? 1 : 0); }, 0);
      var rank = recommend(score);
      var prog = null;
      try{ prog = await fetch('content/program.json?t=' + Date.now()).then(function(r){ return r.json(); }); }catch(e){}
      var rk = prog && (prog.ranks||[]).find(function(r){ return r.rank === rank; });
      var st = prog && cohortState(prog);
      var early = rk && rk.earlybird && st && !st.over;
      var levelTxt = { '5급':'기초를 단단히 다질 때입니다', '4급':'기본기가 있습니다 — 흐름을 꿰어 보세요', '3급':'탄탄합니다 — 본문 강해로 깊이를 더할 때입니다', '2급':'상당한 수준입니다 — 분별력을 벼릴 단계입니다', '1급':'뛰어납니다 — 예언의 큰 그림을 완성할 단계입니다' }[rank];
      var applyVal = rk ? (rk.name + ' (' + rk.rank + ')') : '';
      var html =
        '<div class="text-center">'
        + '<p class="inline-flex items-center gap-2 bg-gold/15 text-gold text-xs font-bold px-3 py-1.5 rounded-full">진단 결과</p>'
        + '<p class="mt-5 text-neutral-900/55 text-sm">10문항 중</p>'
        + '<p class="text-[56px] font-black leading-none text-gold mt-1">' + score + '<span class="text-[22px] text-neutral-900/40 font-bold">/10</span></p>'
        + '<h2 class="text-xl md:text-2xl font-bold mt-4">' + esc(levelTxt) + '</h2>'
        + '</div>'
        + (rk ?
          '<div class="mt-7 bg-white border-2 rounded-3xl shadow-card p-6 text-center" style="border-color:' + (rk.color||'#00704a') + '">'
          + '<p class="text-[12px] font-bold tracking-[0.18em] text-neutral-900/45">추천 시작 과정</p>'
          + '<h3 class="text-2xl font-black mt-1.5" style="color:' + (rk.color==='#c7b07a'?'#9a7a34':(rk.color||'#00704a')) + '">' + esc(rk.rank) + ' ' + esc(rk.name) + '</h3>'
          + '<p class="text-neutral-900/60 text-[13.5px] mt-2 leading-relaxed">' + esc(rk.tagline||'') + '</p>'
          + '<p class="mt-4 font-black text-xl">' + (early ? '<span class="line-through text-neutral-900/35 text-[15px] mr-1.5">' + won(rk.price) + '</span><span class="text-gold">' + won(rk.earlybird) + '</span>' : won(rk.price)) + '</p>'
          + (st && !st.over ? '<p class="text-[12.5px] text-neutral-900/55 mt-1.5"><b class="text-gold">' + esc(st.name) + ' 모집 중</b> · 마감까지 <b>D-' + st.daysLeft + '</b>' + (st.startNote ? ' · ' + esc(st.startNote) : '') + '</p>' : '')
          + '<a href="academy.html?apply=' + encodeURIComponent(applyVal) + '&src=level" class="mt-5 inline-flex w-full items-center justify-center min-h-[52px] bg-gold text-white font-bold text-[15px] rounded-2xl hover:opacity-90 transition">' + esc(rk.rank) + ' 과정 자세히 보기 →</a>'
          + '<a href="curriculum.html" class="mt-2 inline-flex w-full items-center justify-center min-h-[48px] border border-ink/15 text-neutral-900/75 font-bold text-[14px] rounded-2xl hover:bg-ink/5 transition">먼저 무료 강의로 시작하기</a>'
          + '<p class="text-[11.5px] text-neutral-900/40 mt-2.5">모든 강의 시청은 무료 · 인증과정은 5일 무료체험 가능</p>'
          + '</div>' : '')
        + (score >= 8 ?
          '<div class="mt-5 bg-ink text-white rounded-3xl p-6 text-center">'
          + '<p class="text-[12px] font-bold tracking-[0.18em] text-white/50">이미 가르칠 준비가 되셨다면</p>'
          + '<h3 class="text-lg font-bold mt-2 leading-snug">수료를 넘어, 가르치는 사람으로</h3>'
          + '<p class="text-white/65 text-[13px] mt-2 leading-relaxed">' + score + '점이면 배우는 단계를 넘어 <b class="text-white">인도하는 단계</b>를 준비하실 수 있습니다. 대표강사가 직접 동행하는 소수 정원 심화 과정을 15분 상담으로 안내드립니다.</p>'
          + '<a href="consult.html?src=level" class="mt-4 inline-flex w-full items-center justify-center min-h-[50px] bg-white text-ink font-bold text-[14.5px] rounded-2xl hover:opacity-90 transition">심화 과정 진단 상담 신청 →</a>'
          + '</div>' : '')
        + '<div class="mt-6 bg-sand/60 border border-ink/8 rounded-2xl p-5">'
        + '<p class="font-bold text-[13.5px]">풀이 참고 구절</p>'
        + '<p class="text-[12.5px] text-neutral-900/60 mt-1.5 leading-relaxed">' + QS.map(function(x,i){ return x.ref ? ('Q' + (i+1) + ' ' + x.ref) : ''; }).filter(Boolean).join(' · ') + '</p>'
        + '</div>';
      document.getElementById('quizView').style.display = 'none';
      var rv = document.getElementById('resultView');
      rv.innerHTML = html; rv.style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
  <script src="auth-header.js?v=20261021a"></script>
</body>
</html>

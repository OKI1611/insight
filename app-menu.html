  <style>
    /* ── 앱 세부 메뉴 공용 화면(저자의 책·공지·이벤트·질문과 답·교재·급수 과정·후원·성경사전) ──
       웹 페이지를 옮긴 것이 아니라 앱 전용 목록/상세 구조. 글자 16px, 누르는 요소 48px 이상, 가로 스크롤 없음. */
    *{box-sizing:border-box}
    body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111827;background:#fff}
    main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
    .hidden{display:none !important}
    .sec-h{font-size:17px;font-weight:800;margin:14px 0 10px;letter-spacing:-.01em}
    .sub{font-size:14px;color:#4b5563;line-height:1.6}
    .press{transition:transform .12s}.press:active{transform:scale(.98)}
    .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pill{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 10px;background:#eef2f8;color:#1f3a68}
    .pill.g{background:#e9f4ef;color:#0b7d53}
    .btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:12px;font-weight:800;font-size:15.5px;text-decoration:none;border:1px solid #dfe4ec;background:#fff;color:#111827;padding:0 14px;width:100%}
    .btn.pri{background:#1f3a68;border-color:#1f3a68;color:#fff}
    .btn.grn{background:#0b7d53;border-color:#0b7d53;color:#fff}
    .btn + .btn{margin-top:8px}
    .btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btns2 .btn{margin:0}
    /* 검색창 */
    .sbox{display:flex;align-items:center;gap:8px;height:50px;border:1.5px solid #dfe4ec;border-radius:14px;padding:0 12px 0 14px;background:#fff;margin:4px 0 12px}
    .sbox input{flex:1;min-width:0;border:0;outline:0;font-size:16px;font-family:inherit;background:none;color:#111827}
    .sbox button{height:42px;padding:0 14px;border:0;border-radius:10px;background:#1f3a68;color:#fff;font-weight:800;font-size:14px}
    /* 목록 행 */
    .list{background:#fff;border:1px solid #dfe4ec;border-radius:16px;overflow:hidden}
    .row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;border:0;border-top:1px solid #eef1f5;background:#fff;text-align:left;color:#111827;text-decoration:none;font-family:inherit}
    .row:first-child{border-top:0}
    .row:active{background:#f3f5f8}
    .row .t{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.4}
    .row .m{font-size:12.5px;color:#4b5563;font-weight:600;flex:none}
    .row .chev{width:18px;height:18px;flex:none;color:#9aa3b5}
    .row .num{flex:none;width:26px;font-size:13px;font-weight:800;color:#6b7280}
    /* 책 격자 */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
    .bk{border:0;background:none;padding:0;text-align:left;font-family:inherit;color:inherit}
    .grid2 .bk{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0}
    .bk .bt{min-height:calc(14.5px*1.35*2)} .bk .bs{min-height:calc(12.5px*1.4*2)}
    .bk img{width:100%;aspect-ratio:3/4.3;object-fit:cover;border-radius:10px;box-shadow:0 10px 24px -14px rgba(21,32,58,.5);background:#eef1f6}
    .bk .bt{font-size:14.5px;font-weight:800;line-height:1.35;margin-top:8px}
    .bk .bs{font-size:12.5px;color:#4b5563;margin-top:3px;line-height:1.4}
    /* 카드 */
    .card{background:#fff;border:1px solid #dfe4ec;border-radius:16px;padding:14px 16px}
    .card + .card{margin-top:10px}
    .card .ct{font-size:16px;font-weight:800;line-height:1.35}
    .card .cs{font-size:13.5px;color:#4b5563;margin-top:4px;line-height:1.5}
    .card .cp{font-size:17px;font-weight:900;color:#1f3a68;margin-top:8px}
    .card .cp s{font-size:13px;color:#9aa3b5;font-weight:600;margin-left:6px}
    .kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #eef1f5;font-size:15px}
    .kv:first-of-type{border-top:0}
    .kv b{font-weight:800}
    .kv .cp2{flex:none;height:42px;padding:0 12px;border-radius:10px;border:1px solid #dfe4ec;background:#fff;font-weight:800;font-size:13px;color:#1f3a68}
    /* 후원 화면 */
    .sp-hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px 20px;color:#fff;background:linear-gradient(135deg,#e11d48 0%,#be123c 55%,#881337 100%);box-shadow:0 18px 34px -20px rgba(136,19,55,.7)}
    .sp-hero:after{content:'';position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 70%)}
    .sp-hero .hi{width:46px;height:46px;border-radius:50%;background:#fff;color:#e11d48;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
    .sp-hero .ey{font-size:12.5px;font-weight:800;letter-spacing:.12em;opacity:.85;margin-top:14px}
    .sp-hero h2{font-size:21px;line-height:1.35;font-weight:900;letter-spacing:-.02em;margin:6px 0 0}
    .sp-hero p{font-size:14px;line-height:1.6;opacity:.92;margin:8px 0 0}
    .sp-lbl{font-size:13px;font-weight:800;color:#6b7280;letter-spacing:.04em;margin:20px 2px 8px}
    .sp-way{display:flex;align-items:center;gap:12px;min-height:66px;padding:12px 14px;border:1px solid #e5e8ef;border-radius:16px;background:#fff;text-decoration:none;color:#111827}
    .sp-way + .sp-way{margin-top:10px}
    .sp-way:active{transform:scale(.985);background:#f8fafc}
    .sp-way .ic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
    .sp-way .tx{flex:1;min-width:0}
    .sp-way .t{font-size:15.5px;font-weight:800;line-height:1.3}
    .sp-way .d{font-size:12.5px;color:#6b7280;margin-top:2px;line-height:1.4}
    .sp-way .go{flex:none;width:18px;height:18px;color:#9aa3b5}
    .sp-acct{border:1px solid #e5e8ef;border-radius:16px;padding:14px 14px 12px;background:#fff;margin-top:10px}
    .sp-acct .row1{display:flex;align-items:center;gap:12px}
    .sp-acct .num{font-size:17px;font-weight:900;letter-spacing:.02em;color:#1f3a68;margin-top:10px;word-break:break-all}
    .sp-acct .own{font-size:13px;color:#6b7280;margin-top:2px}
    .sp-acct .cpy{margin-top:12px;width:100%;height:46px;border-radius:12px;border:0;background:#1f3a68;color:#fff;font-weight:800;font-size:14.5px;font-family:inherit}
    .sp-note{margin-top:18px;padding:14px;border-radius:14px;background:#f6f7fa;font-size:13.5px;color:#4b5563;line-height:1.65}
    .sp-note b{color:#111827}
    /* 상세 시트 */
    #sheet{position:fixed;inset:0;z-index:88;display:none}
    #sheet.open{display:block}
    #sheet .bg{position:absolute;inset:0;background:rgba(11,21,48,.5)}
    #sheet .box{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:640px;bottom:0;background:#fff;border-radius:22px 22px 0 0;max-height:88dvh;overflow:auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px))}
    #sheet .grab{width:40px;height:4px;border-radius:2px;background:#dfe3ea;margin:0 auto 12px}
    #sheet .close{position:sticky;top:0;float:right;width:40px;height:40px;border-radius:999px;border:1px solid #dfe4ec;background:#fff;font-size:18px;line-height:1}
    .dt-h{font-size:19px;font-weight:900;line-height:1.3;letter-spacing:-.01em;margin:4px 0 4px}
    .dt-s{font-size:14px;color:#4b5563}
    .dt-p{font-size:15.5px;line-height:1.75;margin:10px 0 0;white-space:pre-line}
    .dt-q{margin:12px 0;padding:12px 14px;border-left:4px solid #0b7d53;background:#e9f4ef;border-radius:0 12px 12px 0;font-size:15px;line-height:1.65}
    .dt-lbl{font-size:12.5px;font-weight:800;color:#6b7280;margin:16px 0 6px;letter-spacing:.04em}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chips span,.chips a{font-size:13px;font-weight:700;background:#f3f5f8;border-radius:999px;padding:6px 11px;color:#1f3a68;text-decoration:none}
    .empty{text-align:center;color:#6b7280;font-size:14.5px;padding:28px 0}
    .skel{height:16px;border-radius:8px;background:linear-gradient(90deg,#eef1f6 25%,#f6f8fb 37%,#eef1f6 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;margin:10px 0}
    @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
    details.qa{background:#fff;border:1px solid #dfe4ec;border-radius:14px;padding:0 14px;margin-bottom:8px}
    details.qa summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:14px 0;font-size:15.5px;font-weight:800;line-height:1.45}
    details.qa summary::-webkit-details-marker{display:none}
    details.qa summary .q{flex:none;color:#0b7d53}
    details.qa .a{font-size:15px;line-height:1.75;padding:0 0 14px;color:#111827;border-top:1px dashed #e5e9f0;padding-top:12px}
    details.qa .a h4{font-size:14.5px;margin:12px 0 4px;color:#1f3a68}
    /* 질문과 답 — 댓글 */
    .qc{margin-top:24px;padding-top:16px;border-top:1px solid #e5e9f0}
    .qc-h{font-size:15.5px;font-weight:800;color:#1f3a68;margin:0 0 10px}
    .qc-i{display:flex;gap:10px;align-items:flex-start;background:#f3f5f8;border-radius:14px;padding:12px 13px;margin-bottom:8px}
    .qc-i.adm{background:#e9f4ef;border:1px solid #cfe5da}
    .qc-av{flex:none;width:32px;height:32px;border-radius:999px;background:#dfe5ef;color:#1f3a68;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center}
    .qc-i.adm .qc-av{background:#0b7d53;color:#fff}
    .qc-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 3px;font-size:13.5px}
    .qc-t{font-size:11.5px;font-weight:800;color:#fff;background:#0b7d53;border-radius:5px;padding:1px 6px}
    .qc-d{font-size:12.5px;color:#6b7280}
    .qc-x{margin-left:auto;border:0;background:none;color:#9aa3b5;font-size:13px;min-height:32px;padding:0 4px}
    .qc-c{font-size:15px;line-height:1.7;margin:0;color:#1f2937;word-break:break-word}
    .qc textarea{width:100%;margin-top:6px;border:1.5px solid #dfe3ea;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.6;outline:none;resize:vertical;font-family:inherit}
    .qc textarea:focus{border-color:#0b7d53}
    .qc-login{background:#f3f5f8;border-radius:14px;padding:14px;text-align:center}
    .qc-login p{margin:0 0 10px;font-size:14.5px;color:#374151}
    /* 질문과 답 — 글 단독 화면 본문 */
    .qbody{font-size:16px;line-height:1.85;color:#1f2937}
    .qbody .qh{font-size:16.5px;font-weight:800;color:#1f3a68;margin:20px 0 6px}
    .qbody .qp{margin:0 0 12px}
    .qhtml p{margin:0 0 .9em}.qhtml h1,.qhtml h2,.qhtml h3,.qhtml h4{font-weight:800;color:#111827;line-height:1.5;margin:1.3em 0 .5em}
    .qhtml h1{font-size:19px}.qhtml h2{font-size:18px}.qhtml h3{font-size:17px}.qhtml h4{font-size:16px}
    .qhtml ul,.qhtml ol{margin:0 0 .9em;padding-left:1.3em}.qhtml li{margin-bottom:.3em}
    .qhtml blockquote{border-left:4px solid #0b7d53;background:#e9f4ef;border-radius:0 12px 12px 0;padding:12px 14px;margin:1em 0}
    .qhtml img{max-width:100%;height:auto;border-radius:10px}.qhtml a{color:#0b7d53;text-decoration:underline}
    .qhtml a.colFile{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #dfe4ec;border-radius:12px;background:#f7f9fc;text-decoration:none;color:#111827;margin:1em 0;min-height:48px}
    .qhtml a.colFile .cfIcon{flex:none;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:#1f3a68}
    .qhtml a.colFile .cfBody{min-width:0;flex:1}.qhtml a.colFile .cfName{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .qhtml a.colFile .cfMeta{display:block;font-size:12.5px;color:#6b7280}.qhtml a.colFile .cfGo{flex:none;font-size:13px;font-weight:800;color:#0b7d53}
  </style>

</head>
<body>
  <main id="main"><div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></main>

  <div id="sheet" aria-hidden="true"><div class="bg" onclick="closeSheet()"></div><div class="box"><div class="grab"></div><button type="button" class="close" onclick="closeSheet()" aria-label="닫기">✕</button><div id="sheetBody"></div></div></div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const won = n => (Number(n)||0).toLocaleString('ko-KR') + '원';
    const fdate = s => { try{ const d = new Date(s); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }catch(e){ return ''; } };
    const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
    const sp = new URLSearchParams(location.search);
    const P = sp.get('p') || 'books';
    const TITLES = { books:'저자의 책', notices:'공지사항', events:'이벤트', qna:'질문과 답', store:'교재 스토어', academy:'급수 과정', support:'후원하기', dictionary:'성경사전', board:'수강생 질문방', search:'검색', themes:'주제별 성경', english:'바이블 잉글리시', notes:'번역 이야기', resources:'자료실' };
    function setTitle(t){ document.title = t + ' — 바이블 인사이트'; if(window.__setAppTitle) window.__setAppTitle(t); else window.__appTitle = t; }
    setTitle(TITLES[P] || '바이블 인사이트');
    function openSheet(html){ $('sheetBody').innerHTML = html; $('sheet').classList.add('open'); $('sheet').querySelector('.box').scrollTop = 0; }
    function closeSheet(){ $('sheet').classList.remove('open'); }
    const rest = (q) => fetch(SUPABASE_URL + '/rest/v1/' + q, { headers:{ apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } }).then(r => r.ok ? r.json() : []);
    const nl2br = s => esc(s).replace(/\n/g, '<br/>');

    const VIEWS = {
      // ── 저자의 책: 표지 격자 → 상세 시트(한 줄 소개·정가·구매 버튼) ──
      async books(){
        const d = await fetch('/content/app-books.json?t=' + Date.now()).then(r=>r.json());
        const books = d.books || [];
        $('main').innerHTML = `<p class="sub" style="margin:4px 0 12px">표지를 누르면 소개와 구매처가 열립니다.</p><div class="grid2">` + books.map((b,i) => `
          <button type="button" class="bk press" onclick="showBook(${i})"><img src="/${esc(b.cover)}" alt=""/><p class="bt clamp2">${esc(b.title)}</p><p class="bs clamp2">${esc(b.sub)}</p></button>`).join('') + `</div>`;
        window.showBook = (i) => {
          const b = books[i]; const st = b.stores || {};
          const btn = (s, cls) => `<a class="btn ${cls}" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`;
          openSheet(`
            <div style="display:flex;gap:14px;align-items:flex-start"><img src="/${esc(b.cover)}" alt="" style="width:92px;border-radius:8px;box-shadow:0 10px 24px -14px rgba(21,32,58,.5)"/>
              <div style="min-width:0;flex:1">${b.badge ? `<span class="pill g">${esc(b.badge)}</span>` : ''}<p class="dt-h">${esc(b.title)}</p><p class="dt-s">${esc(b.sub)}</p>${b.meta && b.meta['정가'] ? `<p class="dt-s" style="margin-top:6px;font-weight:800;color:#1f3a68">${esc(b.meta['정가'])}</p>` : ''}</div></div>
            ${b.quote ? `<div class="dt-q">${esc(b.quote)}</div>` : ''}
            ${(st.paper||[]).length ? `<p class="dt-lbl">📘 종이책 구매</p><div class="btns2">${st.paper.map((s,k) => btn(s, k===0?'pri':'')).join('')}</div>` : ''}
            ${(st.ebook||[]).length ? `<p class="dt-lbl">📱 전자책 구매</p><div class="btns2">${st.ebook.map(s => btn(s,'')).join('')}</div>` : ''}
            ${!(st.paper||[]).length && !(st.ebook||[]).length ? `<p class="sub" style="margin-top:14px">판매처 준비 중입니다.</p>` : ''}
            <a class="btn" style="margin-top:14px" href="/books#${esc(b.id)}">자세한 소개 보기</a>`);
        };
        const want = sp.get('id'); if(want){ const i = books.findIndex(b => b.id === want); if(i >= 0) setTimeout(() => showBook(i), 200); }
      },
      // ── 공지·이벤트: 목록 → 눌러서 본문 ──
      async notices(){ return listNotices('notice'); },
      async events(){ return listNotices('event'); },
      // ── 질문과 답: 검색 + 목록 → 누르면 그 글만 단독 화면(웹 qna.html 과 같은 방식) ──
      async qna(){
        const [base, adm] = await Promise.all([
          fetch('/content/qna.json?t=' + Date.now()).then(r=>r.json()).catch(()=>[]),
          rest('site_content?select=data&key=eq.qna_posts').catch(()=>[])
        ]);
        const B = Array.isArray(base) ? base : (base.items || []);
        const A = (adm && adm[0] && Array.isArray(adm[0].data)) ? adm[0].data : [];
        const aid = {}; A.forEach(x => aid[x.id] = 1);
        const items = A.concat(B.filter(x => !aid[x.id]));   // 관리자 화면에서 쓴 글도 함께(웹과 같은 합치기)
        const roomOf = it => it.room === 'gen' ? 'gen' : 'rev';
        const ROOMN = { rev:'요한계시록', gen:'신앙·성경' };
        let room = sp.get('room') || '', curQ = '', openId = null, listY = 0, pushed = false;
        const plain = h => { const d = document.createElement('div'); d.innerHTML = String(h||''); return (d.textContent||'').replace(/\s+/g,' ').trim(); };
        const clean = (html) => {
          const d = document.createElement('div'); d.innerHTML = html || '';

        const data = await rest('resources?select=*&order=created_at.desc&limit=200');
        const urlName = u => { try{ return decodeURIComponent(String(u||'').split('?')[0].split('/').pop()||''); }catch(e){ return ''; } };
        const files = r => { let a = r && r.files; if(typeof a === 'string'){ try{ a = JSON.parse(a); }catch(e){ a = null; } } if(Array.isArray(a) && a.length) return a.filter(f => f && f.url).map(f => ({ url:f.url, name:f.name || urlName(f.url) || '첨부파일' })); if(r && r.file_url) return [{ url:r.file_url, name:urlName(r.file_url) || '첨부파일' }]; return []; };
        const dl = (u,n) => !/\/storage\/v1\/object\/public\//.test(u||'') ? u : u + (u.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(n||'');
        if(!data || !data.length){ $('main').innerHTML = '<p class="empty">아직 올라온 자료가 없습니다.</p>'; return; }
        $('main').innerHTML = `<p class="sub" style="margin:4px 0 12px">제목을 누르면 내용이 열리고, 받기 버튼을 누르면 휴대폰에 저장됩니다.</p><div class="list">` + data.map((r,i) => { const fl = files(r); return `<button type="button" class="row press" data-i="${i}"><span class="t">${r.category ? `<span style="font-size:11.5px;color:#b08b2e;font-weight:800">${esc(r.category)}</span><br/>` : ''}${esc(r.title||'')}<br/><span style="font-size:12.5px;color:#4b5563;font-weight:600">${fdate(r.created_at)}${fl.length ? ' · 📎 첨부 ' + fl.length : ''}</span></span>${CHEV}</button>`; }).join('') + `</div>`;
        $('main').querySelectorAll('button.row').forEach(b => b.addEventListener('click', () => { const r = data[+b.dataset.i]; const fl = files(r);
          openSheet(`${r.category ? `<span class="pill g">${esc(r.category)}</span>` : ''}<p class="dt-h">${esc(r.title||'')}</p><p class="dt-s">${fdate(r.created_at)}</p>`
            + (r.description ? `<div class="dt-p" style="margin-top:10px">${safeHtml(r.description)}</div>` : '')
            + (fl.length ? `<p class="dt-lbl">📎 첨부파일 — 누르면 저장됩니다</p>` + fl.map(f => `<a class="btn pri" style="margin-top:8px" href="${esc(dl(f.url,f.name))}" target="_blank" rel="noopener">${esc(f.name)} 받기</a>`).join('') : '')
            + ((r.link||'').trim() ? `<a class="btn" style="margin-top:10px" href="${esc(r.link.trim())}" target="_blank" rel="noopener">관련 링크 열기</a>` : '')); }));
        const want = sp.get('id'); if(want){ const i = data.findIndex(r => String(r.id) === want); if(i >= 0) setTimeout(() => $('main').querySelector(`button.row[data-i="${i}"]`).click(), 200); }
      },
      // ── 번역 이야기: 글 목록 → 본문 (메뉴에서는 빠졌지만 딥링크용으로 유지) ──
      async notes(){
        const d = await fetch('/content/translation-notes.json?t=' + Date.now()).then(r=>r.json()); const N = d.notes || []; const cats = d.cats || {};
        const catName = (c) => (cats && (cats[c] || (Array.isArray(cats) ? (cats.find(x => x.id === c)||{}).name : ''))) || '';
        $('main').innerHTML = `<p class="sub" style="margin:4px 0 12px">${esc((d.intro && (d.intro.summary || d.intro.text)) || '킹제임스 성경 정본역을 옮기며 고민한 번역 이야기입니다.')}</p><div class="list">` + N.map((n,i) => `<button type="button" class="row press" data-i="${i}"><span class="num">${i+1}</span><span class="t">${esc(n.title)}<br/><span class="clamp2" style="font-size:12.5px;color:#4b5563;font-weight:600">${esc(n.verse||'')}</span></span>${CHEV}</button>`).join('') + `</div>`;
        $('main').querySelectorAll('button.row').forEach(b => b.addEventListener('click', () => { const n = N[+b.dataset.i];
          openSheet(`${n.cat ? `<span class="pill">${esc(catName(n.cat) || n.cat)}</span>` : ''}<p class="dt-h">${esc(n.title)}</p><p class="dt-s">${esc(n.verse||'')}</p>${n.summary ? `<div class="dt-q">${esc(n.summary)}</div>` : ''}` + (n.body||[]).map(bl => bl.h ? `<p class="dt-lbl" style="font-size:15px;color:#1f3a68">${esc(bl.h)}</p>` : bl.v ? `<div class="dt-q" style="font-size:14.5px">${safeHtml(bl.v)}</div>` : bl.p ? `<p class="dt-p" style="margin-top:6px">${safeHtml(bl.p)}</p>` : '').join('')); }));
        const want = sp.get('id'); if(want){ const i = N.findIndex(n => n.id === want); if(i >= 0) setTimeout(() => $('main').querySelector(`button.row[data-i="${i}"]`).click(), 200); }
      }
    });
    async function listNotices(kind){
      const data = await rest(`notices?select=id,title,body,created_at,pinned&kind=eq.${kind}&order=pinned.desc,created_at.desc&limit=50`);
      $('main').innerHTML = (data && data.length) ? `<div class="list">` + data.map((n,i) => `<button type="button" class="row press" data-i="${i}">${n.pinned ? '<span class="pill g" style="flex:none">고정</span>' : ''}<span class="t">${esc(n.title)}<br/><span style="font-size:12.5px;color:#4b5563;font-weight:600">${fdate(n.created_at)}</span></span>${CHEV}</button>`).join('') + `</div>` : `<p class="empty">${kind === 'event' ? '진행 중인 이벤트가 없습니다.' : '등록된 공지가 없습니다.'}</p>`;
      $('main').querySelectorAll('button.row').forEach(b => b.addEventListener('click', () => { const n = data[+b.dataset.i]; openSheet(`<p class="dt-s">${fdate(n.created_at)}</p><p class="dt-h">${esc(n.title)}</p><p class="dt-p">${nl2br(n.body||'')}</p>`); }));
    }
    (async () => {
      try{ await (VIEWS[P] || VIEWS.books)(); }
      catch(e){ $('main').innerHTML = '<p class="empty">내용을 불러오지 못했어요. 네트워크를 확인한 뒤 다시 열어 주세요.</p>'; }
    })();
  </script>
  <script src="/auth-header.js?v=20261021a"></script>
  <script src="/app-shell.js?v=20261126f"></script>

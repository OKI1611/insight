<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="/content-loader.js?v=20260703f"></script>
  <script src="/site-header.js?v=20260729a"></script>
  <script src="/section-sidenav.js?v=14"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이단 분별 기준 — BIBLY 바이블 인사이트</title>
  <meta name="description" content="특정 단체를 지목하지 않고, 성경과 정통 신앙에 비추어 이단·사이비를 분별하는 기준을 영역별로 정리한 신앙 교육 자료입니다." />
  <link rel="canonical" href="https://biblynote.com/heresy" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BIBLY 바이블 인사이트" />
  <meta property="og:title" content="이단 분별 기준 — 이렇게 분별합니다" />
  <meta property="og:description" content="성경과 정통 신앙에 비추어 이단의 표지를 가려내는 분별 기준." />
  <meta property="og:url" content="https://biblynote.com/heresy" />
  <meta property="og:image" content="https://biblynote.com/images/og-cover.png?v=6" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#213a6b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=6" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#213a6b', navy:'#182c54', gold:'#00704a', sand:'#eaf0f8', paper:'#ffffff' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'], display:['Pretendard','system-ui','sans-serif'] },
      boxShadow: { soft:'0 2px 10px -4px rgba(21,32,58,.10)', card:'0 14px 40px -18px rgba(21,32,58,.22)' }
    }}}
  </script>
  <style>
    h1,h2,.serif{font-family:'Pretendard',system-ui,sans-serif}
    .tabbtn[aria-selected="true"]{ background:#213a6b; color:#fff; border-color:#213a6b; }
    mark{ background:#00704a22; color:inherit; border-radius:2px; padding:0 1px; }
    .card{ transition:transform .15s ease, box-shadow .15s ease; }
    .card:hover{ transform:translateY(-2px); }
  </style>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"홈","item":"https://biblynote.com/"},{"@type":"ListItem","position":2,"name":"위대한 믿음","item":"https://biblynote.com/preachers"},{"@type":"ListItem","position":3,"name":"이단 분별 기준","item":"https://biblynote.com/heresy"}]}
  </script>
</head>
<body class="font-sans bg-paper text-neutral-900 antialiased min-h-screen">

  <div id="siteHeader" data-active="heresy.html"></div>

  <main class="max-w-4xl mx-auto px-4 py-9">
    <!-- 헤더 -->
    <div class="text-center mb-6">
      <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">DISCERNMENT · 성도의 분별</p>
      <h1 class="text-3xl md:text-4xl font-bold leading-tight">이단, 이렇게 분별합니다</h1>
      <p id="intro" class="text-neutral-900/55 mt-3 text-sm md:text-[15px] leading-relaxed max-w-2xl mx-auto"></p>
    </div>

    <!-- 안내 배너 -->
    <div class="max-w-2xl mx-auto mb-6 text-[12.5px] leading-relaxed text-neutral-600 bg-sand/70 border border-ink/10 rounded-xl px-4 py-3 flex gap-2.5">
      <span class="text-gold shrink-0 font-bold">✓</span>
      <span id="noticeText"></span>
    </div>

    <!-- 신학적 토대 -->
    <div class="max-w-2xl mx-auto mb-8 rounded-xl border border-ink/10 bg-ink/[0.03] px-5 py-4">
      <p class="text-[11px] font-bold tracking-[0.2em] text-ink mb-1.5">분별의 기준 · 정통 보수신학</p>
      <p id="foundation" class="text-[12.5px] leading-relaxed text-neutral-600"></p>
    </div>

    <!-- 검색 + 영역 필터 -->
    <div class="sticky top-0 z-10 bg-paper/95 backdrop-blur -mx-4 px-4 py-3 border-b border-ink/8 mb-6">
      <div class="max-w-3xl mx-auto">
        <div class="relative">
          <svg class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          <input id="q" type="search" inputmode="search" placeholder="분별 기준 검색 (예: 삼위일체, 시한부, 헌금)"
            class="w-full pl-11 pr-4 py-3 rounded-xl border border-ink/15 focus:border-gold outline-none text-[15px] bg-white" />
        </div>
        <div class="flex items-center gap-1.5 mt-3 overflow-x-auto pb-0.5" id="cats" role="tablist" aria-label="영역"></div>
      </div>
    </div>

    <!-- 기준 목록 -->
    <div id="list" class="max-w-3xl mx-auto grid gap-3.5"></div>
    <p id="count" class="max-w-3xl mx-auto text-center text-xs text-neutral-400 mt-6"></p>

    <!-- 교리 사례 심층 -->
    <div id="caseSection" class="max-w-3xl mx-auto mt-14">
      <div class="text-center mb-6">
        <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">CASE STUDY · 교리 사례</p>
        <h2 class="text-2xl md:text-3xl font-bold leading-tight">왜 이단으로 분별되는가</h2>
        <p class="text-neutral-500 text-sm mt-2 max-w-xl mx-auto leading-relaxed">특정 교리를 성경 이상으로 절대화하고 ‘이렇게 하지 않으면 문제’라 가르친 대표 사례를, 정통 보수신학과 성경 근거로 살펴봅니다.</p>
      </div>
      <div id="cases" class="grid gap-4"></div>
    </div>

    <!-- 하단 안내 -->
    <div id="disc" class="max-w-3xl mx-auto mt-8 text-[12px] leading-relaxed text-neutral-500 bg-neutral-50 border border-ink/8 rounded-xl p-4"></div>
  </main>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function hl(s){ if(!Q) return esc(s); const i=s.toLowerCase().indexOf(Q.toLowerCase()); if(i<0) return esc(s);
      return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+Q.length))+'</mark>'+esc(s.slice(i+Q.length)); }

    let DB=null, CAT='all', Q='';
    const catLabel = id => id==='all' ? '전체' : ((DB.categories.find(c=>c.id===id)||{}).label||id);

    function matches(x){
      if(CAT!=='all' && x.cat!==CAT) return false;
      if(!Q) return true;
      const s=(x.title+' '+x.sign+' '+x.orthodox+' '+(x.scriptures||[]).join(' ')+' '+catLabel(x.cat)).toLowerCase();
      return s.includes(Q.toLowerCase());
    }

    function card(x, n){
      const scr = (x.scriptures||[]).map(s=>`<span class="inline-block text-[11px] text-ink/80 bg-sand border border-ink/10 rounded px-1.5 py-0.5">${esc(s)}</span>`).join(' ');
      return `<div class="card bg-white border border-ink/10 rounded-2xl p-5 md:p-6 shadow-soft">
        <div class="flex items-center gap-2 mb-2">
          <span class="inline-block text-[11px] font-bold text-gold bg-gold/10 border border-gold/20 rounded-full px-2 py-0.5">${esc(catLabel(x.cat))}</span>
          <span class="text-[11px] text-neutral-400 font-semibold">분별 기준 ${n}</span>
        </div>
        <h3 class="font-bold text-[17px] md:text-[18px] leading-snug flex gap-2">
          <span class="text-rose-400 shrink-0">⚑</span><span>${hl(x.title)}</span>
        </h3>
        <p class="text-[14px] text-neutral-700 leading-relaxed mt-2">${hl(x.sign)}</p>
        <div class="mt-3 bg-gold/5 border-l-3 border-gold/50 rounded-r-lg px-3.5 py-2.5" style="border-left-width:3px">
          <p class="text-[11px] font-bold text-gold tracking-wide mb-1">정통 신앙은</p>
          <p class="text-[13.5px] text-neutral-700 leading-relaxed">${hl(x.orthodox)}</p>
        </div>
        ${scr?`<div class="mt-3 flex items-center gap-1.5 flex-wrap"><span class="text-[11px] text-neutral-400 font-semibold mr-0.5">성경 근거</span>${scr}</div>`:''}
      </div>`;
    }

    function caseMatches(x){
      if(CAT!=='all' && x.cat!==CAT) return false;
      if(!Q) return true;
      const s=(x.teaching+' '+x.claim+' '+x.why+' '+x.orthodox+' '+(x.related||'')+' '+(x.scriptures||[]).join(' ')).toLowerCase();
      return s.includes(Q.toLowerCase());
    }
    function caseCard(x){
      const scr=(x.scriptures||[]).map(s=>`<span class="inline-block text-[11px] text-ink/80 bg-sand border border-ink/10 rounded px-1.5 py-0.5">${esc(s)}</span>`).join(' ');
      return `<div class="card bg-white border border-ink/10 rounded-2xl p-5 md:p-6 shadow-soft">
        <div class="flex items-center gap-2 flex-wrap mb-2">
          <span class="inline-block text-[11px] font-bold text-gold bg-gold/10 border border-gold/20 rounded-full px-2 py-0.5">${esc(catLabel(x.cat))}</span>
          ${x.ruling?`<span class="inline-block text-[11px] text-rose-600 bg-rose-50 border border-rose-200 rounded-full px-2 py-0.5">${esc(x.ruling)}</span>`:''}
        </div>
        <h3 class="font-bold text-[18px] leading-snug">${hl(x.teaching)}</h3>
        ${x.related?`<p class="text-[12px] text-neutral-400 mt-1">관련 계열 · ${esc(x.related)}</p>`:''}
        <p class="text-[13.5px] text-neutral-700 leading-relaxed mt-2.5"><b class="text-ink">이렇게 주장합니다 · </b>${hl(x.claim)}</p>
        <div class="mt-3 rounded-r-lg px-3.5 py-2.5 bg-rose-50/50" style="border-left:3px solid #f4a8a0">
          <p class="text-[11px] font-bold text-rose-500 mb-1">왜 이단으로 분별되는가</p>
          <p class="text-[13.5px] text-neutral-700 leading-relaxed">${hl(x.why)}</p>
        </div>
        <div class="mt-2.5 rounded-r-lg px-3.5 py-2.5 bg-gold/5" style="border-left:3px solid #00704a80">
          <p class="text-[11px] font-bold text-gold mb-1">정통 신앙은</p>
          <p class="text-[13px] text-neutral-700 leading-relaxed">${hl(x.orthodox)}</p>
        </div>
        ${scr?`<div class="mt-3 flex items-center gap-1.5 flex-wrap"><span class="text-[11px] text-neutral-400 font-semibold mr-0.5">성경 근거</span>${scr}</div>`:''}
      </div>`;
    }
    function render(){
      if(!DB) return;
      const items = DB.criteria.filter(matches);
      document.getElementById('list').innerHTML = items.length ? items.map((x,i)=>card(x,i+1)).join('') : `<p class="text-center text-neutral-400 py-10 text-sm">해당하는 분별 기준이 없습니다.</p>`;
      document.getElementById('count').textContent = `${DB.updated||''}년 기준 · 분별 기준 ${items.length}/${DB.criteria.length}`;
      const cs = (DB.cases||[]).filter(caseMatches);
      const cel = document.getElementById('cases'); const sec = document.getElementById('caseSection');
      if(cel) cel.innerHTML = cs.length ? cs.map(caseCard).join('') : `<p class="text-center text-neutral-400 py-8 text-sm">해당하는 교리 사례가 없습니다.</p>`;
      if(sec) sec.style.display = (DB.cases&&DB.cases.length) ? '' : 'none';
    }

    function buildCats(){
      const cats = [{id:'all',label:'전체'}].concat(DB.categories);
      document.getElementById('cats').innerHTML = cats.map(c=>
        `<button class="tabbtn shrink-0 text-[13px] font-semibold px-3.5 py-1.5 rounded-full border border-ink/15 text-neutral-700" role="tab" aria-selected="${c.id==='all'}" data-cat="${c.id}">${esc(c.label)}</button>`
      ).join('');
      document.querySelectorAll('#cats .tabbtn').forEach(b=> b.addEventListener('click',()=>{
        CAT=b.dataset.cat;
        document.querySelectorAll('#cats .tabbtn').forEach(t=>t.setAttribute('aria-selected', t===b?'true':'false'));
        render();
      }));
    }

    document.getElementById('q').addEventListener('input', e=>{ Q=e.target.value.trim(); render(); });

    fetch('content/heresy.json').then(r=>r.json()).then(d=>{
      DB=d;
      document.getElementById('intro').textContent = d.intro||'';
      const fo=document.getElementById('foundation'); if(fo) fo.textContent = d.foundation||'';
      const nt=document.getElementById('noticeText'); if(nt) nt.textContent = d.notice||'';
      document.getElementById('disc').innerHTML = `<b class="text-neutral-600">이용 안내 ·</b> 이 자료는 특정 개인·단체를 지목하지 않고, 성경과 정통 신앙에 비추어 이단의 표지를 정리한 신앙 교육 자료입니다. 분별의 목적은 정죄가 아니라 진리 안에서 성도를 지키기 위함입니다. 문의·의견 ${esc(d.correctionEmail||'')}`;
      buildCats();
      render();
    }).catch(()=>{ document.getElementById('list').innerHTML='<p class="text-center text-neutral-400 py-16 text-sm">자료를 불러오지 못했습니다.</p>'; });
  </script>
</body>
</html>

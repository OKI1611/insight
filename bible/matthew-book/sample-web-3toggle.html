<title>마태복음 KJV 영한대역 샘플 (1–2장)</title>
<style>
*{box-sizing:border-box}
:root{
  --paper:#f2efe6; --page:#fbf9f3; --ink:#22304c; --en:#59606f; --accent:#9a7b22;
  --accent2:#c9b06a; --rubric:#8c3a2c; --rule:#e7e1d2; --label:#a89e84; --chip:#efe9da; --chipbd:#e2d9c2;
  --shadow:0 1px 2px rgba(40,32,10,.05),0 12px 34px rgba(40,32,10,.09);
  --fs:1.155rem;
  --ko:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --enf:Georgia,"Times New Roman","Nanum Myeongjo",serif;
  --ui:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101219; --page:#181b24; --ink:#e9e5d7; --en:#a6adbc; --accent:#cba650;
  --accent2:#8a7534; --rubric:#cf7358; --rule:#2a2e3a; --label:#8b8674;
  --chip:#23262f; --chipbd:#343845; --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.4);
}}
:root[data-theme="light"]{
  --paper:#f2efe6;--page:#fbf9f3;--ink:#22304c;--en:#59606f;--accent:#9a7b22;--accent2:#c9b06a;
  --rubric:#8c3a2c;--rule:#e7e1d2;--label:#a89e84;--chip:#efe9da;--chipbd:#e2d9c2;
  --shadow:0 1px 2px rgba(40,32,10,.05),0 12px 34px rgba(40,32,10,.09);
}
:root[data-theme="dark"]{
  --paper:#101219;--page:#181b24;--ink:#e9e5d7;--en:#a6adbc;--accent:#cba650;--accent2:#8a7534;
  --rubric:#cf7358;--rule:#2a2e3a;--label:#8b8674;--chip:#23262f;--chipbd:#343845;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.4);
}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ko);
  -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 96px}

/* toolbar */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  padding:11px 20px;margin:0 -20px 0;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(9px);border-bottom:1px solid var(--rule);font-family:var(--ui)}
.bar .grp{display:flex;gap:4px;align-items:center}
.bar .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--label);margin-right:4px}
.bar button{font-family:var(--ui);font-size:12.5px;color:var(--en);background:transparent;
  border:1px solid var(--chipbd);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.18s}
.bar button:hover{border-color:var(--accent)}
.bar button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .sp{flex:1}

/* book */
.book{background:var(--page);margin-top:26px;border:1px solid var(--rule);border-radius:3px;
  box-shadow:var(--shadow);padding:56px clamp(22px,6vw,72px) 72px}
.masthead{text-align:center;padding-bottom:26px;margin-bottom:8px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--ui);font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
.booktitle{font-family:var(--ko);font-weight:700;font-size:clamp(2.5rem,7vw,3.6rem);margin:.28em 0 .1em;
  letter-spacing:.06em;text-wrap:balance}
.booten{font-family:var(--enf);font-style:italic;font-size:clamp(.85rem,2.4vw,1.02rem);
  letter-spacing:.12em;color:var(--en)}
.blurb{font-family:var(--ui);font-size:12.5px;color:var(--label);margin-top:16px;letter-spacing:.02em}

/* chapter opener */
.chap{text-align:center;margin:52px 0 30px;display:flex;align-items:center;justify-content:center;gap:20px}
.chap::before,.chap::after{content:"";height:1px;width:min(74px,16vw);background:linear-gradient(90deg,transparent,var(--accent2))}
.chap::after{background:linear-gradient(90deg,var(--accent2),transparent)}
.chap .num{font-family:var(--enf);font-size:2.5rem;font-weight:700;color:var(--accent);line-height:1}
.chap .ko{font-family:var(--ui);font-size:12px;letter-spacing:.3em;color:var(--label);text-transform:uppercase}
.chap .cwrap{display:flex;flex-direction:column;gap:5px;align-items:center}

/* verse */
.v{position:relative;padding-left:2.5rem;margin:0 0 1.15rem}
.vn{position:absolute;left:0;top:.2em;font-family:var(--enf);font-size:.82rem;font-weight:700;
  color:var(--accent);font-variant-numeric:tabular-nums;min-width:2rem}
.vko{font-family:var(--ko);font-size:var(--fs);line-height:1.92;color:var(--ink);letter-spacing:.01em}
.ven{font-family:var(--enf);font-size:calc(var(--fs)*.86);line-height:1.62;color:var(--en);margin-top:.28em}

/* apparatus */
.app{margin:.55rem 0 .2rem;display:none;flex-direction:column;gap:.5rem;
  border-left:2px solid var(--accent2);padding:.5rem 0 .5rem .95rem}
.level-full .app:has(.note),.level-full .app:has(.lex),
.level-note .app:has(.note),.level-note .app:has(.voc){display:flex}
.note,.lex{display:none}
.level-full .note,.level-note .note{display:block}
.level-full .lex.voc,.level-note .lex.voc{display:flex;flex-wrap:wrap}
.level-full .lex.gra{display:block}
.note{font-family:var(--ko);font-size:.9rem;line-height:1.72;color:var(--en)}
.note .tag,.lex .tag{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);margin-right:.5em;vertical-align:.08em}
.lex{font-family:var(--ui);font-size:.8rem;line-height:1.55;color:var(--en);gap:5px 7px;align-items:baseline}
.chip{background:var(--chip);border:1px solid var(--chipbd);border-radius:5px;padding:2.5px 8px;white-space:nowrap}
.chip i{font-family:var(--enf);font-style:italic;color:var(--ink);font-weight:600}
.chip em{font-style:normal;color:var(--label);font-size:.86em;margin:0 3px}
.gra{margin-top:.3rem}
.gra .row{margin-top:.2rem}
.gra b{font-family:var(--enf);color:var(--ink);font-weight:700}

/* parallel mode */
.mode-parallel .book{max-width:none}
.mode-parallel .v{padding-left:0;display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr);
  column-gap:2.2rem;row-gap:.15rem;align-items:start}
.mode-parallel .vn{position:static;grid-column:1;grid-row:1;text-align:right;padding-top:.28em}
.mode-parallel .vko{grid-column:2}
.mode-parallel .ven{grid-column:3;margin-top:0;padding-top:.02em}
.mode-parallel .app{grid-column:1/-1;margin-left:0}
@media(max-width:680px){
  .mode-parallel .v{grid-template-columns:1.6rem 1fr;}
  .mode-parallel .ven{grid-column:2}
}
.wrap.mode-parallel{max-width:1120px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap mode-stack level-full" id="wrap">
  <div class="bar">
    <div class="grp"><span class="lab">판형</span>
      <button id="m-stack" aria-pressed="true" onclick="setMode('stack')">상하 대역</button>
      <button id="m-par" aria-pressed="false" onclick="setMode('parallel')">좌우 2단</button>
    </div>
    <div class="grp"><span class="lab">부속</span>
      <button id="lv-full" aria-pressed="true" onclick="setLevel('full')">풀 스터디</button>
      <button id="lv-note" aria-pressed="false" onclick="setLevel('note')">주해 중심</button>
      <button id="lv-plain" aria-pressed="false" onclick="setLevel('plain')">대역 위주</button>
    </div>
    <div class="sp"></div>
    <div class="grp"><span class="lab">크기</span>
      <button onclick="fs(-1)">A-</button><button onclick="fs(1)">A+</button>
    </div>
  </div>

  <div class="book" id="book">
    <div class="masthead">
      <div class="eyebrow">정본역 킹제임스 성경 · 영한대역 스터디 바이블</div>
      <h1 class="booktitle">마태복음</h1>
      <div class="booten">The Gospel According to St. Matthew</div>
      <div class="blurb">흠정역(KJV) 본문 · 새로운 우리말 번역 · 절별 주해와 원어 어휘 · KJV 어법 풀이</div>
    </div>
    <div id="text"></div>
  </div>
</div>

<script>
const DATA = [{"ch": 1, "verses": [{"n": 1, "en": "The book of the generation of Jesus Christ, the son of David, the son of Abraham.", "ko": "다윗의 자손이요 아브라함의 자손인 예수 그리스도의 계보라.", "note": "그리스어 '비블로스 게네세오스'(biblos geneseos, βίβλος γενέσεως)는 '계보의 책·기원의 기록'을 뜻하며, 창세기 5:1의 히브리어 '톨레도트'(계보의 기록) 어법을 그대로 잇는 표제다. 마태는 예수를 다윗과 아브라함의 언약적 후손으로 제시하여, 왕권(다윗)과 만민을 향한 복의 약속(아브라함)이 그분 안에서 성취됨을 선포한다. '아들'을 다윗-아브라함 순으로 거꾸로 부른 것은 왕 되심을 앞세워 강조한 것이다.", "voc": [["book", "n.", "책, 기록"], ["generation", "n.", "계보, 혈통"], ["Abraham", "", "아브라함"], ["David", "", "다윗"]], "idi": [["the book of the generation", "계보의 기록 (현대: the record of the genealogy)"]], "gra": []}, {"n": 2, "en": "Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas and his brethren;", "ko": "아브라함이 이삭을 낳고, 이삭이 야곱을 낳고, 야곱이 유다와 그 형제들을 낳으니라.", "note": "그리스어 '에겐네센'(egennesen, ἐγέννησεν, 동사 gennao의 부정과거)은 '낳다·아버지가 되다'라는 뜻이며, KJV는 이를 고어 'begat'으로 옮겼다(현대영어 'was the father of'). 마태는 약속의 씨가 아브라함-이삭-야곱으로 이어지며, 특히 유다에게서 왕의 규가 나오리라 한 창세기 49:10의 예언 위에 그리스도의 계보를 세운다. '형제들'을 함께 언급함은 열두 지파, 곧 언약 백성 전체를 염두에 둔 것이다.", "voc": [["begat", "v.", "낳았다"], ["Isaac", "", "이삭"], ["Jacob", "", "야곱"], ["brethren", "n.", "형제들 (brother의 고어 복수)"]], "idi": [["A begat B", "A가 B를 낳다 (현대: A was the father of B)"]], "gra": [["begat", "beget의 고어 과거형. 현대영어로는 'fathered/was the father of'"], ["brethren", "brother의 고어 복수형 — 혈연 또는 언약 공동체를 가리킴"]]}, {"n": 3, "en": "And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;", "ko": "유다가 다말에게서 베레스와 세라를 낳고, 베레스가 헤스론을 낳고, 헤스론이 람을 낳으니라.", "note": "여기 처음으로 여인 '다말'(Thamar)이 족보에 등장한다. 다말은 이방 며느리였고 그 출생 사연에는 부끄러움이 얽혀 있으나(창 38장), 마태는 이를 감추지 않고 기록한다. 전치사 'of'는 '~에게서 난'을 뜻하며, 이 계보에 오른 네 여인은 하나님의 은혜가 죄인과 이방인까지 품는 구속사임을 미리 보여 준다.", "voc": [["Phares", "", "베레스"], ["Zara", "", "세라"], ["Thamar", "", "다말"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["of Thamar", "of=출처의 전치사 '다말에게서 (난)'"]]}, {"n": 4, "en": "And Aram begat Aminadab; and Aminadab begat Naasson; and Naasson begat Salmon;", "ko": "람이 아미나답을 낳고, 아미나답이 나손을 낳고, 나손이 살몬을 낳으니라.", "note": "이 세대는 애굽 종살이와 광야 시대를 관통한다. 나손(Naasson)은 출애굽 때 유다 지파의 지도자였으니(민 1:7), 하나님의 언약은 종살이의 어둠 속에서도 끊이지 않고 이어졌다. 반복되는 'begat'은 단조로워 보이나, 세대마다 하나님이 약속을 지켜 오셨다는 신실하심의 증거다.", "voc": [["Aram", "", "람"], ["Aminadab", "", "아미나답"], ["Naasson", "", "나손"], ["Salmon", "", "살몬"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 세대의 이어짐을 규칙적으로 나타냄"]]}, {"n": 5, "en": "And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;", "ko": "살몬이 라합에게서 보아스를 낳고, 보아스가 룻에게서 오벳을 낳고, 오벳이 이새를 낳으니라.", "note": "두 이방 여인이 나란히 등장한다. 라합(Rachab)은 여리고의 기생이었고, 룻(Ruth)은 모압 여인이었으나, 믿음으로 언약 백성에 접붙임을 받아 메시아의 조상이 되었다(수 2장, 룻기). 마태는 이로써 복음이 혈통이나 출신이 아니라 하나님의 은혜와 믿음으로 임함을 예고한다. 이새(Jesse)는 다윗의 아버지로, 왕가로 나아가는 길목이다.", "voc": [["Booz", "", "보아스"], ["Rachab", "", "라합"], ["Obed", "", "오벳"], ["Ruth", "", "룻"]], "idi": [], "gra": [["of Rachab / of Ruth", "of=출처의 전치사 '~에게서 (난)'"]]}, {"n": 6, "en": "And Jesse begat David the king; and David the king begat Solomon of her that had been the wife of Urias;", "ko": "이새가 다윗 왕을 낳으니라. 다윗은 우리야의 아내였던 여인에게서 솔로몬을 낳고,", "note": "이 계보에서 유일하게 '왕'(the king)이라는 칭호가 붙는 이는 다윗이다. 마태는 예수께서 다윗 왕조의 정통 후계자이심을 강조한다. 밧세바를 이름 대신 '우리야의 아내였던 여인'이라 부른 것은 다윗의 큰 죄(삼하 11장)를 은근히 상기시키면서도, 그 죄악의 자리에서도 하나님의 언약이 은혜로 이어졌음을 드러낸다. 'her that had been'은 관계절이 이끄는 고어 어법이다.", "voc": [["king", "n.", "왕"], ["Solomon", "", "솔로몬"], ["Urias", "", "우리야"], ["wife", "n.", "아내"]], "idi": [], "gra": [["her that had been the wife of Urias", "her that=she who; had been=과거완료 '~였던 여인에게서'"]]}, {"n": 7, "en": "And Solomon begat Roboam; and Roboam begat Abia; and Abia begat Asa;", "ko": "솔로몬이 르호보암을 낳고, 르호보암이 아비야를 낳고, 아비야가 아사를 낳으니라.", "note": "이제 계보는 유다 왕들의 계열로 접어든다. 르호보암(Roboam) 때에 나라가 남북으로 갈라졌으나(왕상 12장), 다윗 언약을 따라 왕권은 유다에 남았다. 아사(Asa)는 우상을 없애고 여호와를 찾은 개혁의 왕이었으니, 신실한 왕과 부패한 왕이 뒤섞인 이 계열 자체가 하나님의 오래 참으심을 증언한다.", "voc": [["Roboam", "", "르호보암"], ["Abia", "", "아비야"], ["Asa", "", "아사"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 현대영어 'was the father of'"]]}, {"n": 8, "en": "And Asa begat Josaphat; and Josaphat begat Joram; and Joram begat Ozias;", "ko": "아사가 여호사밧을 낳고, 여호사밧이 요람을 낳고, 요람이 웃시야를 낳으니라.", "note": "여호사밧(Josaphat)은 백성에게 율법을 가르친 경건한 왕이었다(대하 17장). 마태는 요람과 웃시야(아사랴) 사이의 아하시야·요아스·아마샤 세 악한 왕을 생략하는데, 이는 열네 대씩 세 묶음(17절)이라는 상징적 구조를 위한 것이지 오류가 아니다. 유대 족보에서 '낳다'는 직계뿐 아니라 후손을 포괄할 수 있었다.", "voc": [["Josaphat", "", "여호사밧"], ["Joram", "", "요람"], ["Ozias", "", "웃시야"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "여기서 '낳다'는 직계 후손을 넘어 계열의 이어짐을 뜻할 수 있음(세 왕 생략)"]]}, {"n": 9, "en": "And Ozias begat Joatham; and Joatham begat Achaz; and Achaz begat Ezekias;", "ko": "웃시야가 요담을 낳고, 요담이 아하스를 낳고, 아하스가 히스기야를 낳으니라.", "note": "믿음의 왕과 배교의 왕이 한 계보 안에 나란히 선다. 아하스(Achaz)는 우상을 섬긴 악한 왕이었으나, 그 아들 히스기야(Ezekias)는 성전을 정결케 하고 여호와를 신뢰한 개혁의 왕이었다(왕하 18장). 경건이 혈통으로 유전되지 않음을 보여 주니, 각 세대는 스스로 하나님 앞에 서야 한다.", "voc": [["Joatham", "", "요담"], ["Achaz", "", "아하스"], ["Ezekias", "", "히스기야"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 세대의 이어짐"]]}, {"n": 10, "en": "And Ezekias begat Manasses; and Manasses begat Amon; and Amon begat Josias;", "ko": "히스기야가 므낫세를 낳고, 므낫세가 아몬을 낳고, 아몬이 요시야를 낳으니라.", "note": "므낫세(Manasses)는 가장 악한 왕 중 하나였으나 말년에 회개하였고(대하 33장), 요시야(Josias)는 율법책을 발견하고 대대적 개혁을 이룬 마지막 경건한 왕이었다. 그러나 그 뒤로 유다는 급속히 무너져 포로로 향한다. 이 계보는 인간 왕조의 한계와, 오직 그리스도만이 영원한 왕이 되심을 예비한다.", "voc": [["Manasses", "", "므낫세"], ["Amon", "", "아몬"], ["Josias", "", "요시야"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 현대영어 'was the father of'"]]}, {"n": 11, "en": "And Josias begat Jechonias and his brethren, about the time they were carried away to Babylon:", "ko": "바벨론으로 끌려갈 무렵에 요시야가 여고냐와 그 형제들을 낳으니라.", "note": "그리스어 '메토이케시아'(metoikesia, μετοικεσία)는 '거주지를 옮김·강제 이주'로 바벨론 포로기를 가리킨다. 여고냐(Jechonias)는 예레미야 22:30에서 '기록에서 자식이 없는 자'로 저주받은 왕이니, 인간적으로 보면 다윗 왕조의 소망이 끊긴 지점이다. 그러나 하나님은 이 막다른 길에서도 언약을 이어 가시니, 왕조의 회복은 사람의 힘이 아니라 하나님의 신실하심에 달렸다.", "voc": [["Jechonias", "", "여고냐"], ["brethren", "n.", "형제들 (brother의 고어 복수)"], ["carry away", "v.", "끌고 가다"], ["Babylon", "", "바벨론"]], "idi": [["carried away to Babylon", "바벨론으로 (포로로) 끌려가다"]], "gra": [["they were carried away", "수동태(be carried away) '끌려가다' — 강제로 데려가짐"]]}, {"n": 12, "en": "And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;", "ko": "바벨론으로 옮겨진 후에 여고냐가 스알디엘을 낳고, 스알디엘이 스룹바벨을 낳으니라.", "note": "포로의 어둠 속에서도 다윗의 씨는 끊이지 않았다. 스룹바벨(Zorobabel)은 포로 귀환 후 성전을 재건한 유다 총독으로(스 3장), 하나님이 다윗 언약을 회복하고 계심을 보여 주는 이정표다. '옮겨진 후에'라는 표현은 심판 뒤에도 이어지는 은혜, 곧 절망의 자리에서 다시 시작하시는 하나님을 증언한다.", "voc": [["Salathiel", "", "스알디엘"], ["Zorobabel", "", "스룹바벨"], ["brought", "v.", "옮겨진 (bring의 과거분사)"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["after they were brought", "were brought=수동태 '옮겨진 후에'"]]}, {"n": 13, "en": "And Zorobabel begat Abiud; and Abiud begat Eliakim; and Eliakim begat Azor;", "ko": "스룹바벨이 아비훗을 낳고, 아비훗이 엘리아김을 낳고, 엘리아김이 아소르를 낳으니라.", "note": "포로 귀환 이후의 이 이름들은 구약 다른 곳에 거의 나타나지 않는 무명의 세대다. 성경의 역사가 침묵하는 동안에도 하나님은 조용히 약속의 씨를 보존하고 계셨다. 사람의 기록에 남지 않은 이름들조차 하나님의 구속 계획 안에서 제자리를 지키니, 이는 무명한 신자의 삶에도 뜻이 있음을 일깨운다.", "voc": [["Abiud", "", "아비훗"], ["Eliakim", "", "엘리아김"], ["Azor", "", "아소르"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 현대영어 'was the father of'"]]}, {"n": 14, "en": "And Azor begat Sadoc; and Sadoc begat Achim; and Achim begat Eliud;", "ko": "아소르가 사독을 낳고, 사독이 아킴을 낳고, 아킴이 엘리웃을 낳으니라.", "note": "구약과 신약 사이 약 400년의 '침묵기'를 잇는 세대다. 선지자의 음성이 멈춘 그 긴 세월에도 다윗의 혈통은 끊이지 않고 흘러 왔다. 하나님의 침묵이 곧 부재는 아니니, 약속은 눈에 보이지 않는 곳에서 때를 향해 무르익고 있었다.", "voc": [["Sadoc", "", "사독"], ["Achim", "", "아킴"], ["Eliud", "", "엘리웃"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 세대의 이어짐"]]}, {"n": 15, "en": "And Eliud begat Eleazar; and Eleazar begat Matthan; and Matthan begat Jacob;", "ko": "엘리웃이 엘르아살을 낳고, 엘르아살이 맛단을 낳고, 맛단이 야곱을 낳으니라.", "note": "긴 계보가 마침내 요셉의 아버지 야곱에게 이른다. 아브라함의 아들 이삭에서 시작된 족보가 또 한 명의 '야곱'에서 절정을 향하니, 하나님이 처음 약속하신 그 언약이 온전히 이루어질 순간이 임박했음을 알린다. 무명의 세대를 지나온 계보가 이제 성육신의 문턱에 선다.", "voc": [["Eleazar", "", "엘르아살"], ["Matthan", "", "맛단"], ["Jacob", "", "야곱"], ["begat", "v.", "낳았다"]], "idi": [], "gra": [["begat", "beget의 고어 과거형 — 현대영어 'was the father of'"]]}, {"n": 16, "en": "And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.", "ko": "야곱이 마리아의 남편 요셉을 낳으니, 그 마리아에게서 그리스도라 하는 예수께서 나시니라.", "note": "여기서 계보의 어법이 결정적으로 바뀐다. 앞에서는 모두 'A가 B를 낳았다'였으나, 요셉은 예수를 '낳은' 자가 아니라 '마리아의 남편'으로만 소개된다. 그리스어 원문의 '나시니라'(egennethe, 수동태)는 예수께서 남자의 씨가 아니라 성령으로 나셨음을 문법으로 못 박는다. '그리스도'(Christos)는 히브리어 '메시아'(기름부음 받은 자)의 번역이다.", "voc": [["Joseph", "", "요셉"], ["husband", "n.", "남편"], ["Mary", "", "마리아"], ["Christ", "", "그리스도 (기름부음 받은 자)"]], "idi": [], "gra": [["of whom was born Jesus", "was born=수동태(egennethe) '나시니라' — 요셉을 통해 '낳은' 것이 아님을 표시"], ["who is called Christ", "who=관계대명사; is called=수동태 '그리스도라 불리는'"]]}, {"n": 17, "en": "So all the generations from Abraham to David are fourteen generations; and from David until the carrying away into Babylon are fourteen generations; and from the carrying away into Babylon unto Christ are fourteen generations.", "ko": "그러므로 모든 세대가, 아브라함부터 다윗까지 열네 대요, 다윗부터 바벨론으로 옮겨질 때까지 열네 대요, 바벨론으로 옮겨진 때부터 그리스도까지 열네 대니라.", "note": "마태는 계보를 열넷씩 세 묶음으로 정돈한다. 히브리어에서 '다윗'(דוד)의 글자 값을 더하면 14가 되므로(달레트4+바브6+달레트4), 이 구조 자체가 '예수는 다윗의 아들, 곧 약속된 왕'임을 수의 상징으로 외친다. 아브라함(약속)-다윗(왕권)-포로(심판)-그리스도(성취)의 네 마디로 구속사 전체를 한눈에 압축한 것이다.", "voc": [["generation", "n.", "세대, 대"], ["fourteen", "num.", "열넷"], ["carrying away", "n.", "끌려감, 이주"], ["Babylon", "", "바벨론"]], "idi": [["the carrying away into Babylon", "바벨론으로의 (포로) 이주"]], "gra": [["from ... unto ...", "from A unto B='A부터 B까지' — 기간의 시작과 끝"]]}, {"n": 18, "en": "Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost.", "ko": "예수 그리스도의 나심은 이러하니라. 그 어머니 마리아가 요셉과 정혼하고 동거하기 전에, 성령으로 잉태된 것이 나타났더라.", "note": "고어 'on this wise'에서 'wise'는 '현명한'이 아니라 옛 명사 '방식·방도'(way, manner)로, 전체는 'in this way(이러하니라)'를 뜻한다. 유대의 정혼(므네스튜오)은 법적으로 혼인에 준하는 구속력을 지녀 파혼하려면 이혼 증서가 필요했다. 마태는 '성령으로'(of the Holy Ghost) 잉태되었음을 명시하여, 예수의 나심이 인간의 통상적 출생과 다른 초자연적 잉태, 곧 동정녀 탄생임을 밝힌다.", "voc": [["birth", "n.", "나심, 출생"], ["espouse", "v.", "약혼하다, 정혼하다"], ["with child", "", "아이를 밴, 임신한"], ["Holy Ghost", "", "성령"]], "idi": [["on this wise", "이런 식으로, 이러하니라 (현대: in this way)"], ["with child", "아이를 밴, 임신한 (현대: pregnant)"]], "gra": [["on this wise", "wise=옛 명사 '방식(way·manner)'. 현대영어 'in this way'와 동일"], ["was espoused", "수동태 '정혼한 상태가 되다'"]]}, {"n": 19, "en": "Then Joseph her husband, being a just man, and not willing to make her a publick example, was minded to put her away privily.", "ko": "그 남편 요셉은 의로운 사람이라, 그녀를 드러내어 욕되게 하려 하지 아니하고 가만히 파혼하고자 하였더라.", "note": "그리스어 '디카이오스'(dikaios, δίκαιος)는 '의로운·공정한'을 뜻하며, 율법을 신실히 지키면서도 마리아를 부끄럽게 하지 않으려 한 요셉의 성품을 요약한다. 'put away'는 파혼(이혼)을, 'privily'는 'privately(은밀히)'의 고어다. 간음 혐의를 공개하면 마리아는 율법에 따라 돌에 맞을 수도 있었기에, 요셉이 조용히 파혼하려 한 것은 그의 의로움과 긍휼이 함께 어우러진 모습이다.", "voc": [["just", "adj.", "의로운, 공정한"], ["publick", "adj.", "공개적인 (public의 고어 철자)"], ["privily", "adv.", "은밀히 (privately의 고어)"], ["put away", "v.", "내보내다, 파혼하다"]], "idi": [["make her a publick example", "그녀를 공개적으로 본보기(망신) 삼다 (현대: make an example of her)"], ["put her away privily", "가만히 내보내다, 조용히 파혼하다 (현대: divorce her quietly)"]], "gra": [["publick", "public의 고어 철자 — 어미에 -k를 붙인 옛 표기"], ["was minded", "고어 표현 '마음먹었다·작정하였다'(현대: intended)"]]}, {"n": 20, "en": "But while he thought on these things, behold, the angel of the LORD appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost.", "ko": "그가 이 일을 곰곰이 생각할 때에, 보라, 주의 천사가 꿈에 그에게 나타나 이르되 \"다윗의 자손 요셉아, 네 아내 마리아 데려오기를 두려워하지 말라. 그녀에게 잉태된 이는 성령으로 된 것이라.", "note": "천사가 요셉을 '다윗의 자손'이라 부름은, 그를 통해 예수께서 다윗 왕조의 법적 상속권을 잇게 됨을 확증한다. 고어 부정 명령형 'fear not'은 성경에서 하나님의 사자가 사람을 안심시킬 때 반복되는 위로의 정형구다. 'thou/thee/thy'는 각각 '너[주격]/너를[목적격]/너의'를 뜻하는 2인칭 고어이며, 천사는 마리아의 잉태가 죄가 아니라 성령의 역사임을 분명히 밝혀 요셉의 의심을 거둔다.", "voc": [["angel", "n.", "천사, 사자"], ["dream", "n.", "꿈"], ["fear", "v.", "두려워하다"], ["conceive", "v.", "잉태하다"]], "idi": [["fear not", "두려워 말라 (현대: do not fear)"], ["take unto thee", "네게로 맞아들이다, 데려오다"]], "gra": [["thou son of David", "thou=너[주격]; 2인칭 단수 고어"], ["take unto thee ... thy wife", "thee=너를[목적격], thy=너의; fear not+to부정사='~하기를 두려워 말라'"]]}, {"n": 21, "en": "And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.", "ko": "그녀가 아들을 낳으리니, 너는 그 이름을 예수라 하라. 이는 그가 자기 백성을 그들의 죄에서 구원하실 것임이라.\"", "note": "'예수'(예수스, Iesous)는 히브리어 '예호슈아'(여호와는 구원이시다)에서 왔으니, 이름 자체가 그분의 사명을 담는다. 결정적으로 '자기 백성을 그들의 죄에서 구원하시리라' 하니, 당시 유대인이 기대한 정치적·군사적 해방이 아니라 죄로부터의 구원이 메시아의 본질적 사역임을 선언한다. 'shall'은 단순 미래를 넘어 하나님의 확정된 뜻과 명령을 나타내는 강한 고어 조동사다.", "voc": [["bring forth", "v.", "낳다, 산출하다"], ["Jesus", "", "예수 (여호와는 구원이시다)"], ["save", "v.", "구원하다"], ["sin", "n.", "죄"]], "idi": [["bring forth a son", "아들을 낳다"]], "gra": [["thou shalt call", "thou=너[주격], shalt=2인칭 shall '너는 ~하라'(명령적 미래)"], ["he shall save", "shall=하나님의 확정된 뜻을 나타내는 강한 미래 '반드시 구원하시리라'"]]}, {"n": 22, "en": "Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,", "ko": "이 모든 일이 된 것은, 주께서 선지자를 통하여 하신 말씀을 이루려 하심이니, 이르시기를", "note": "마태복음의 특징인 '성취 정형구'가 처음 나온다. 마태는 예수의 생애 곳곳을 구약 예언의 성취로 제시하여, 그분이 오랜 세월 예고된 바로 그 메시아이심을 유대인 독자에게 증언한다. 'that it might be fulfilled'는 목적을 나타내는 고어 어법으로 '이루어지도록 하려 함'을 뜻하며, 이 모든 일의 배후에 예언을 반드시 성취하시는 하나님의 주권이 있음을 드러낸다.", "voc": [["fulfil", "v.", "이루다, 성취하다"], ["spoken", "v.", "말해진 (speak의 과거분사)"], ["prophet", "n.", "선지자"], ["Lord", "n.", "주(主)"]], "idi": [], "gra": [["that it might be fulfilled", "that+might=목적 '이루어지도록'; be fulfilled=수동태"], ["which was spoken of the Lord", "which=관계대명사; of the Lord='주에 의하여'(행위자 of)"]]}, {"n": 23, "en": "Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.", "ko": "\"보라, 처녀가 잉태하여 아들을 낳을 것이요, 그 이름을 임마누엘이라 하리라\" 하셨으니, 이를 번역하면 '하나님이 우리와 함께 계시다' 함이라.", "note": "이사야 7:14의 인용이다. 히브리어 '알마'(젊은 여인)를 칠십인역이 '파르테노스'(처녀)로 옮겼고, 마태는 이를 동정녀 탄생의 예언으로 받는다. '임마누엘'(히브리어 임마누엘=하나님이 우리와 함께)은 예수께서 하나님이 친히 인간과 함께 거하시는 성육신의 성취임을 선언한다. 마태복음은 이 '임마누엘'로 시작해 '내가 너희와 항상 함께 있으리라'(28:20)로 끝맺는 수미상관을 이룬다.", "voc": [["virgin", "n.", "처녀, 동정녀"], ["Emmanuel", "", "임마누엘 (하나님이 우리와 함께)"], ["interpret", "v.", "번역하다, 해석하다"], ["with child", "", "아이를 밴, 임신한"]], "idi": [["which being interpreted is", "번역(해석)하면 ~이다"], ["God with us", "하나님이 우리와 함께 (임마누엘의 뜻)"]], "gra": [["a virgin shall be with child", "shall=예언적 미래 '반드시 ~하리라'"], ["which being interpreted", "분사구문(수동) '해석되면' — 현대영어 'which, when interpreted, is'"]]}, {"n": 24, "en": "Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:", "ko": "요셉이 잠에서 깨어 일어나 주의 천사가 분부한 대로 행하여 그 아내를 데려왔으나,", "note": "요셉은 즉각 순종한다. 꿈에서 깨자마자 천사가 '분부한 대로'(as ... had bidden) 행하여 마리아를 아내로 맞아들이니, 이는 하나님의 말씀 앞에 자기 명예와 계획을 내려놓은 믿음의 순종이다. 'bidden'은 'bid(명하다)'의 고어 과거분사이며, 요셉의 조용한 순종은 온 구속사가 한 사람의 믿음의 결단을 통해 진행되게 하신 하나님의 섭리를 보여 준다.", "voc": [["raise", "v.", "일으키다, 깨우다"], ["bidden", "v.", "명한, 분부한 (bid의 과거분사)"], ["angel", "n.", "천사"], ["wife", "n.", "아내"]], "idi": [["take unto him his wife", "그 아내를 (자기에게로) 데려오다, 맞아들이다"]], "gra": [["being raised from sleep", "분사구문(수동) '잠에서 깨워져·깨어'"], ["as the angel ... had bidden him", "had bidden=과거완료 '분부하였던 대로'; bidden=bid의 고어 과거분사"]]}, {"n": 25, "en": "And knew her not till she had brought forth her firstborn son: and he called his name JESUS.", "ko": "그녀가 맏아들을 낳기까지 그녀를 가까이하지 아니하였더니, 요셉이 그 이름을 예수라 하니라.", "note": "성경에서 동사 'know'(그리스어 기노스코, ginosko)는 부부의 잠자리를 가리키는 완곡어법으로, 'knew her not'은 마리아가 아들을 낳기까지 요셉이 동침하지 않았음을 뜻한다. 이는 예수의 잉태가 전적으로 성령의 역사였음을 다시금 확증하여 동정녀 탄생 교리를 뒷받침한다. 요셉이 천사의 명대로 그 이름을 '예수'라 부름으로써, 이 장은 순종으로 마무리되고 왕의 나심을 향한 다음 장의 서막이 열린다.", "voc": [["know", "v.", "알다 (여기선 동침하다)"], ["firstborn", "n.", "맏아들, 첫아들"], ["till", "conj.", "~하기까지"], ["Jesus", "", "예수(여호와는 구원이시다)"]], "idi": [["knew her not", "그녀를 가까이하지(동침하지) 아니하였다"]], "gra": [["knew her not", "고어 부정 어순(동사+목적어+not). 'know'는 부부관계의 완곡어법"], ["till she had brought forth", "had brought=과거완료 '낳기까지'"]]}]}, {"ch": 2, "verses": [{"n": 1, "en": "Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem,", "ko": "예수께서 헤롯 왕 때에 유대 베들레헴에서 나시니, 보라, 동방에서 박사들이 예루살렘에 이르러", "note": "마태는 예수의 탄생을 '헤롯 왕 때'라는 실제 역사에 못 박아 복음이 신화가 아닌 사실임을 밝힌다. '보라(behold)'는 그리스어 '이두'(idou, ἰδού)로 독자의 시선을 붙드는 서술 표지이며, 뒤이어 이방인 박사들이 등장한다. 그리스어 '마고이'(magoi, μάγοι)는 페르시아·바벨론의 별을 연구하던 학자 계층으로, 이방인이 유대인의 왕을 찾아옴은 구원이 온 열방에 미침을 예표한다.", "voc": [["born", "v.", "태어난 (bear의 과거분사)"], ["wise men", "", "박사들, 현자들"], ["east", "n.", "동방"], ["Bethlehem", "", "베들레헴"]], "idi": [["in the days of", "~의 때에, ~의 시대에"]], "gra": [["behold", "보라 — 주의를 끄는 고어 감탄사(그리스어 idou)"]]}, {"n": 2, "en": "Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him.", "ko": "이르되 \"유대인의 왕으로 나신 이가 어디 계시나이까? 우리가 동방에서 그분의 별을 보고 그분께 경배하러 왔나이다\" 하더라.", "note": "박사들이 찾은 이는 '유대인의 왕으로 나신 이', 곧 왕으로 옹립된 자가 아니라 태어날 때부터 왕이신 메시아다. '그분께 경배하러(to worship him)'의 그리스어 '프로스퀴네오'(proskyneo, προσκυνέω)는 무릎 꿇고 엎드려 절함을 뜻하여 신적 경배를 가리킨다. 이방인이 그리스도의 신성을 먼저 알아본 장면이다.", "voc": [["King", "n.", "왕"], ["Jews", "n.", "유대인"], ["star", "n.", "별"], ["worship", "v.", "경배하다"]], "idi": [["are come to", "~하러 왔다 (완료의 옛 표현: have come)"]], "gra": [["he that is born King", "he that=관계대명사 '~한 그 사람'(현대: the one who is born)"]]}, {"n": 3, "en": "When Herod the king had heard these things, he was troubled, and all Jerusalem with him.", "ko": "헤롯 왕이 이 말을 듣고 마음이 어지러워졌으며, 온 예루살렘이 그와 함께 그러하였더라.", "note": "'be troubled'는 '동요하다·근심하다'라는 숙어이며, 그리스어 '에타라크테'(etarachthe, tarasso의 수동)는 물이 뒤흔들리듯 마음이 소용돌이치는 상태를 가리킨다. 헤롯은 자기 왕위를 위협받아 불안에 빠졌고, 온 예루살렘도 그 폭정을 알기에 함께 요동했다. 참 왕의 오심 앞에서 세상 권력이 떠는 모습을 대조적으로 보여 준다.", "voc": [["trouble", "v.", "어지럽히다, 근심하게 하다"], ["Herod", "", "헤롯(왕)"], ["Jerusalem", "", "예루살렘"], ["hear", "v.", "듣다"]], "idi": [["be troubled", "동요하다, 근심하다"]], "gra": [["was troubled", "수동태 '마음이 어지러워지다'"]]}, {"n": 4, "en": "And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born.", "ko": "그가 백성의 모든 대제사장과 서기관을 한곳에 불러 모으고, 그리스도가 어디서 태어나야 하는지를 그들에게 물으니,", "note": "고어에서 'demand of'는 '~에게 묻다·따져 묻다'라는 뜻으로, 현대영어의 'demand(강력히 요구하다)'와 달리 여기서는 '묻다(inquire)'에 가깝다. 헤롯은 대제사장과 서기관들을 모아 그리스도(메시아)가 어디서 나실지를 캐물었다. 그리스어 '크리스토스'(Christos, Χριστός)는 히브리어 '메시아(기름 부음 받은 자)'의 번역이다.", "voc": [["gather", "v.", "모으다"], ["chief priest", "", "대제사장"], ["scribe", "n.", "서기관"], ["Christ", "n.", "그리스도, 메시아"]], "idi": [["demand of (someone)", "~에게 묻다, 따져 묻다 (고어)"]], "gra": [["demanded of them", "고어 demand of='~에게 묻다'. 현대 demand(강력히 요구하다)와 다름"]]}, {"n": 5, "en": "And they said unto him, In Bethlehem of Judaea: for thus it is written by the prophet,", "ko": "그들이 그에게 이르되 \"유대 베들레헴이니, 선지자로 말미암아 이렇게 기록되었나이다,", "note": "대제사장과 서기관들은 메시아의 출생지를 미가서 5장 2절에서 정확히 알았으나, 정작 그분을 찾아 경배하지는 않았다. '기록되었나이다(it is written)'는 성경의 확정된 권위를 선언하는 정형구다. 지식과 순종은 별개임을, 진리를 알면서도 나아가지 않는 종교 지도자들이 보여 준다.", "voc": [["Bethlehem", "", "베들레헴"], ["Judaea", "", "유대"], ["prophet", "n.", "선지자"], ["write", "v.", "기록하다"]], "idi": [["it is written", "기록되었다 — 성경 인용 정형구"]], "gra": [["thus it is written by the prophet", "by=행위자 표시(현대: by the prophet); it is written=수동"]]}, {"n": 6, "en": "And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel.", "ko": "'또 유다 땅 베들레헴아, 너는 유다의 통치자들 가운데 결코 가장 작지 아니하니, 이는 내 백성 이스라엘을 다스릴 한 다스리는 이가 네게서 나올 것임이라' 하였나이다\" 하더라.", "note": "미가서 5장 2절의 인용으로, '결코 가장 작지 아니하니(art not the least)'는 작은 고을 베들레헴이 메시아를 배출함으로 가장 큰 영예를 얻음을 뜻한다. 'thou/thee'는 베들레헴을 인격처럼 부르는 2인칭 고어(thou=주격 '너', thee=목적격)이며, '다스리는 이(Governor)'는 목자처럼 이스라엘을 치실 그리스도를 가리킨다.", "voc": [["least", "adj.", "가장 작은"], ["prince", "n.", "통치자, 방백"], ["Governor", "n.", "다스리는 이, 통치자"], ["rule", "v.", "다스리다"]], "idi": [["out of thee shall come", "네게서 나오리라 (예언 정형구)"]], "gra": [["thou ... art not the least", "thou=너(주격); art=are의 2인칭 고어; thee=너(목적격)"]]}, {"n": 7, "en": "Then Herod, when he had privily called the wise men, enquired of them diligently what time the star appeared.", "ko": "이에 헤롯이 박사들을 가만히 불러, 그 별이 나타난 때를 그들에게 자세히 캐어물은 후,", "note": "'privily'는 '은밀히'라는 고어 부사이고, 'enquire ... diligently'는 '자세히 캐묻다'이다. 그리스어 '에크리보사'(ekribosa, akriboo)는 정밀하게 알아냄을 뜻한다. 헤롯이 별이 나타난 정확한 시점을 은밀히 캐낸 것은 뒤이어 두 살 이하 사내아이를 학살하려는 흉계의 준비였다(16절).", "voc": [["privily", "adv.", "은밀히, 가만히 (고어)"], ["enquire", "v.", "캐묻다, 알아보다 (=inquire)"], ["diligently", "adv.", "부지런히, 자세히"], ["appear", "v.", "나타나다"]], "idi": [], "gra": [["what time the star appeared", "what time=when '언제 ~했는지'(고어 의문 부사구)"]]}, {"n": 8, "en": "And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found him, bring me word again, that I may come and worship him also.", "ko": "그들을 베들레헴으로 보내며 이르되 \"가서 그 어린아이를 부지런히 찾아보고, 찾거든 내게 다시 알려, 나도 가서 그분께 경배하게 하라\" 하더라.", "note": "'bring me word again'은 '내게 소식을 회신하라'라는 고어 숙어로, 'again'은 '다시'보다 '도로·회신하여'의 뜻이다. 'ye'는 '너희'를 뜻하는 2인칭 복수 주격 고어다. 헤롯은 자기도 경배하러 가겠다며 거짓 구실을 댔으나, 실은 아기를 죽이려는 흉계였다.", "voc": [["search", "v.", "찾다, 수색하다"], ["young child", "", "어린아이"], ["word", "n.", "소식, 전갈"], ["worship", "v.", "경배하다"]], "idi": [["bring (me) word again", "내게 다시 알려 다오 (소식을 회신하다)"]], "gra": [["when ye have found him", "ye=너희(2인칭 복수 주격 고어); have found=현재완료"]]}, {"n": 9, "en": "When they had heard the king, they departed; and, lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was.", "ko": "그들이 왕의 말을 듣고 떠나가니, 보라, 동방에서 보았던 그 별이 그들을 앞서 가다가, 어린아이가 있는 곳 위에 이르러 멈추어 서니라.", "note": "'lo'는 '보라!'라는 고어 감탄사로 그리스어 '이두'(idou)를 옮긴 것이며, 'which'는 사물을 가리키는 관계대명사('그들이 보았던 그 별')이다. 박사들이 좇던 별이 다시 나타나 아기 있는 곳 위에 멈춘 것은 하나님의 기적적 인도를 강조한다. 별의 초자연적 멈춤은 이것이 단순한 천문 현상이 아님을 보여 준다.", "voc": [["depart", "v.", "떠나다"], ["star", "n.", "별"], ["stand over", "", "~위에 멈추어 서다"], ["young child", "", "어린아이"]], "idi": [["lo", "보라! — 주의를 끄는 고어 감탄사"], ["go before", "앞서 가다, 인도하다"]], "gra": [["the star, which they saw", "which=사물을 가리키는 관계대명사 '그들이 본 그 별'"]]}, {"n": 10, "en": "When they saw the star, they rejoiced with exceeding great joy.", "ko": "그들이 그 별을 보고 심히 크게 기뻐하고 또 기뻐하니라.", "note": "'rejoiced with exceeding great joy'는 '심히 크고 큰 기쁨으로 기뻐하다'로, 그리스어 '에카레산 카란 메갈렌 스포드라'(echaresan charan megalen sphodra)는 동족목적어와 강조어를 겹쳐 기쁨의 극치를 표현한다. 'exceeding'은 '심히·극도로'라는 고어 부사다. 오랜 여정 끝에 별이 다시 나타나자 박사들의 기쁨이 절정에 이른다.", "voc": [["rejoice", "v.", "기뻐하다"], ["exceeding", "adv.", "심히, 극도로 (고어)"], ["great", "adj.", "큰"], ["joy", "n.", "기쁨"]], "idi": [["with exceeding great joy", "심히 크게 기뻐하며"]], "gra": [["exceeding great joy", "exceeding=부사 '심히'(현대 -ly 없는 옛 부사)"]]}, {"n": 11, "en": "And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh.", "ko": "그 집에 들어가 어린아이가 그 어머니 마리아와 함께 있음을 보고, 엎드려 그분께 경배하며, 그들의 보배 상자를 열어 황금과 유향과 몰약을 예물로 드리니라.", "note": "그리스어 '프로스퀴네오'(proskyneo)로 '엎드려 경배하니라(fell down, and worshipped)'는 아기 예수를 하나님으로 예배했음을 분명히 한다. 세 예물은 각기 상징으로 이해되어 왔으니 황금은 왕권, 유향은 신성(제사), 몰약은 장사(고난과 죽음)를 가리킨다. 이방인이 그리스도의 왕·제사장·구속자 되심을 예물로 고백한 장면이다.", "voc": [["fall down", "v.", "엎드리다"], ["treasure", "n.", "보배, 보물상자"], ["frankincense", "n.", "유향"], ["myrrh", "n.", "몰약"]], "idi": [["fall down and worship", "엎드려 경배하다"]], "gra": [["they presented unto him gifts", "unto=to의 고어 '~에게'; presented=드렸다"]]}, {"n": 12, "en": "And being warned of God in a dream that they should not return to Herod, they departed into their own country another way.", "ko": "그들이 꿈에 헤롯에게로 돌아가지 말라는 하나님의 지시를 받고, 다른 길로 자기들의 나라로 떠나가니라.", "note": "'being warned of God'에서 'of'는 행위자를 나타내는 고어 전치사로 '하나님에 의해'(현대영어 by God)를 뜻하고, 분사구문 'being warned'는 '경고를 받았으므로'라는 이유를 담는다. 그리스어 '크레마티스텐테스'(chrematisthentes)는 하나님이 주시는 신적 지시·계시를 받음을 가리킨다. 하나님은 박사들을 꿈으로 인도하여 헤롯의 손에서 아기를 지키신다.", "voc": [["warn", "v.", "경고하다, 지시하다"], ["dream", "n.", "꿈"], ["depart", "v.", "떠나다"], ["country", "n.", "나라, 고향"]], "idi": [["being warned of God", "하나님의 지시(경고)를 받고"]], "gra": [["warned of God", "of=행위자 표시 고어 전치사 '하나님에 의해'(현대: by God); being warned=분사구문"]]}, {"n": 13, "en": "And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him.", "ko": "그들이 떠난 후에, 보라, 주의 천사가 꿈에 요셉에게 나타나 이르되 \"일어나 어린아이와 그 어머니를 데리고 이집트로 피하여, 내가 네게 알릴 때까지 거기 머물라. 이는 헤롯이 그 어린아이를 찾아 죽이려 함이라\" 하니,", "note": "'appeareth'는 3인칭 단수 현재의 고어 어미(-eth)로 '나타나다(appears)'이며, 마태는 생생함을 위해 현재형을 쓴다. 'be thou there'의 thou는 2인칭 주격 고어다. 주의 천사가 요셉을 꿈으로 인도하여 애굽으로 피신케 하니, 하나님이 친히 그리스도를 보호하심을 보여 준다. 이는 애굽으로 내려간 옛 이스라엘의 역사를 반향한다.", "voc": [["angel", "n.", "천사"], ["arise", "v.", "일어나다"], ["flee", "v.", "피하다, 도망하다"], ["destroy", "v.", "멸하다, 죽이다"]], "idi": [["seek to destroy", "죽이려 하다, 없애려 하다"]], "gra": [["appeareth", "-eth=3인칭 단수 현재 고어 어미(현대: appears)"], ["be thou there", "thou=너(2인칭 주격 고어); 명령문 '거기 머물라'"]]}, {"n": 14, "en": "When he arose, he took the young child and his mother by night, and departed into Egypt:", "ko": "그가 일어나, 밤에 어린아이와 그 어머니를 데리고 이집트로 떠나가", "note": "요셉은 즉시 순종하여 '밤에(by night)' 어린아이와 그 어머니를 데리고 애굽으로 떠났다. 밤중의 급한 피신은 헤롯의 위협이 임박했음과 요셉의 지체 없는 믿음을 함께 드러낸다. 신적 명령에 대한 즉각적 순종은 마태복음이 요셉을 의로운 사람으로 그리는 방식이다.", "voc": [["arise", "v.", "일어나다"], ["take", "v.", "데리다, 취하다"], ["by night", "", "밤에"], ["depart", "v.", "떠나다"]], "idi": [["by night", "밤에, 밤중에"]], "gra": []}, {"n": 15, "en": "And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son.", "ko": "헤롯이 죽기까지 거기 있었으니, 이는 주께서 선지자로 말미암아 \"내가 내 아들을 이집트에서 불러내었노라\" 하신 말씀을 이루려 하심이라.", "note": "호세아 11장 1절('내가 애굽에서 내 아들을 spoken", "that which=~하신 바 그것(현대: what was spoken)"]]}, {"n": 18, "en": "In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not.", "ko": "\"라마에서 한 소리가 들렸으니, 통곡과 애곡과 큰 슬픔이라. 라헬이 그 자식들을 위하여 울며 위로받기를 거절하였으니, 이는 그들이 없어졌음이라\" 함이니라.", "note": "예레미야 31장 15절의 인용으로, 라헬(베들레헴 부근 라마에 장사됨)이 자식을 잃고 통곡하는 모습으로 유아 학살의 슬픔을 그린다. '위로받기를 거절하였다(would not be comforted)'는 그 슬픔의 깊이를 나타낸다. 그러나 예레미야 31장의 문맥은 곧 회복과 새 언약의 소망으로 이어지니, 이 애곡 뒤에 구원이 있다.", "voc": [["lamentation", "n.", "통곡, 애통"], ["weeping", "n.", "울음"], ["mourning", "n.", "슬픔, 애도"], ["comfort", "v.", "위로하다"]], "idi": [["would not be comforted", "위로받기를 거절하다"]], "gra": [["because they are not", "are not=존재하지 않다, 없어지다(고어: '그들이 없음이라')"]]}, {"n": 19, "en": "But when Herod was dead, behold, an angel of the Lord appeareth in a dream to Joseph in Egypt,", "ko": "그러나 헤롯이 죽은 후에, 보라, 주의 천사가 이집트에서 꿈에 요셉에게 나타나", "note": "'appeareth'는 3인칭 단수 현재 고어 어미(-eth)로 '나타나다'이며, 마태는 다시 현재형으로 장면을 생생히 그린다. 헤롯이 죽자 주의 천사가 애굽에 있는 요셉에게 다시 꿈으로 나타난다. 위협이 사라지자 하나님이 때를 따라 귀환을 인도하시니, 그분의 보호는 위기의 시작부터 끝까지 이어진다.", "voc": [["dead", "adj.", "죽은"], ["behold", "", "보라 (감탄사)"], ["angel", "n.", "천사"], ["dream", "n.", "꿈"]], "idi": [], "gra": [["appeareth", "-eth=3인칭 단수 현재 고어 어미(현대: appears)"]]}, {"n": 20, "en": "Saying, Arise, and take the young child and his mother, and go into the land of Israel: for they are dead which sought the young child’s life.", "ko": "이르되 \"일어나 어린아이와 그 어머니를 데리고 이스라엘 땅으로 가라. 이는 어린아이의 목숨을 노리던 자들이 죽었음이라\" 하니,", "note": "'seek one's life'는 '~의 목숨을 노리다'라는 성경적 숙어이고, 'which'는 사람을 가리키는 고어 관계대명사(현대: who)다. 그리스어 '제툰테스 텐 프쉬켄'(zetountes ten psychen, 목숨을 찾는 자들)은 출애굽기 4장 19절에서 모세의 목숨을 노리던 자들을 가리킨 표현을 그대로 반향한다. 마태는 이로써 예수를 새 모세, 곧 참 구원자로 예표한다.", "voc": [["arise", "v.", "일어나다"], ["seek", "v.", "찾다, 노리다"], ["life", "n.", "목숨"], ["dead", "adj.", "죽은"]], "idi": [["seek one's life", "~의 목숨을 노리다, 죽이려 하다"]], "gra": [["they are dead which sought", "which=사람을 가리키는 고어 관계대명사(현대: who)"]]}, {"n": 21, "en": "And he arose, and took the young child and his mother, and came into the land of Israel.", "ko": "그가 일어나, 어린아이와 그 어머니를 데리고 이스라엘 땅으로 들어오니라.", "note": "요셉은 다시금 지체 없이 순종하여 어린아이와 그 어머니를 데리고 이스라엘 땅으로 돌아온다. 14절의 애굽행과 짝을 이루는 이 귀환은 하나님의 인도가 완성되어 감을 보여 준다. 마태는 요셉의 반복되는 즉각 순종을 통해 하나님의 뜻에 자신을 온전히 내어 맡긴 믿음을 그린다.", "voc": [["arise", "v.", "일어나다"], ["take", "v.", "데리다"], ["come into", "", "~로 들어오다"], ["land", "n.", "땅, 지방"]], "idi": [], "gra": []}, {"n": 22, "en": "But when he heard that Archelaus did reign in Judaea in the room of his father Herod, he was afraid to go thither: notwithstanding, being warned of God in a dream, he turned aside into the parts of Galilee:", "ko": "그러나 아켈라오가 그 아버지 헤롯을 이어 유대를 다스린다 함을 듣고 거기로 가기를 두려워하더니, 꿈에 하나님의 지시를 받고 갈릴리 지방으로 비켜 가", "note": "'in the room of'는 '~의 자리에·~를 대신하여'라는 고어 숙어로 현대영어 'in place of'에 해당한다(room=옛 명사 '자리'). 'thither'는 '그리로'라는 고어 부사다. 폭군의 아들 아켈라오를 두려워한 요셉이 다시 꿈의 지시로 갈릴리로 물러가니, 하나님은 위험을 피할 길까지 세밀히 인도하신다.", "voc": [["reign", "v.", "통치하다, 다스리다"], ["afraid", "adj.", "두려워하는"], ["thither", "adv.", "그리로 (고어)"], ["turn aside", "", "비켜 가다, 물러가다"]], "idi": [["in the room of", "~의 자리에, ~를 대신하여 (현대: in place of)"]], "gra": [["was afraid to go thither", "thither=그리로(고어 방향 부사, 현대: there)"], ["being warned of God", "of=행위자 표시 '하나님에 의해'; being warned=분사구문"]]}, {"n": 23, "en": "And he came and dwelt in a city called Nazareth: that it might be fulfilled which was spoken by the prophets, He shall be called a Nazarene.", "ko": "나사렛이라 하는 동네에 이르러 사니, 이는 선지자들로 말미암아 \"그가 나사렛 사람이라 일컬어지리라\" 하신 말씀을 이루려 하심이라.", "note": "'that it might be fulfilled'는 마태복음의 성취 정형구다. '나사렛 사람(Nazarene)'이라는 예언은 특정 구절이 아니라 여러 선지자('선지자들')의 증언을 아우르니, 멸시받던 고을 나사렛 출신이라는 사실이 곧 '멸시받는 종'으로 오실 메시아(사 53장)를 가리킨다. 예수는 낮고 천한 자리에서 자라 겸비한 구원자가 되신다.", "voc": [["dwell", "v.", "거하다, 살다"], ["city", "n.", "동네, 성읍"], ["Nazareth", "", "나사렛"], ["Nazarene", "n.", "나사렛 사람"]], "idi": [["that it might be fulfilled", "이루어지게 하려 하심이라 — 마태복음 성취 정형구"]], "gra": [["He shall be called a Nazarene", "shall be called=수동 미래 '~라 일컬어지리라'"]]}]}];
function chipVoc(voc){
  if(!voc||!voc.length) return '';
  const c = voc.map(w=>`<span class="chip"><i>${esc(w[0])}</i>${w[1]?`<em>${esc(w[1])}</em>`:' '}${esc(w[2]||'')}</span>`).join('');
  return `<div class="lex voc"><span class="tag">어휘</span>${c}</div>`;
}

  (gra||[]).forEach(x=>rows.push(`<div class="row"><b>${esc(x[0])}</b> — ${esc(x[1])}</div>`));
  if(!rows.length) return '';
  return `<div class="lex gra"><span class="tag">KJV 어법</span>${rows.join('')}</div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function render(){
  let h='';
  for(const c of DATA){
    h+=`<div class="chap"><div class="cwrap"><span class="num">${c.ch}</span><span class="ko">제 ${c.ch} 장</span></div></div>`;
    for(const v of c.verses){
      const lex = chipVoc(v.voc)+graBlock(v.idi,v.gra);
      const note = v.note?`<div class="note"><span class="tag">주해</span>${esc(v.note)}</div>`:'';
      const app = (note||lex)?`<div class="app">${note}${lex}</div>`:'';
      h+=`<div class="v"><span class="vn">${v.ch||''}${v.n}</span>`+
         `<div class="vko">${esc(v.ko)}</div><div class="ven">${esc(v.en)}</div>${app}</div>`;
    }
  }
  document.getElementById('text').innerHTML=h;
}
const wrap=document.getElementById('wrap');
function setMode(m){
  wrap.classList.toggle('mode-parallel',m==='parallel');
  wrap.classList.toggle('mode-stack',m==='stack');
  document.getElementById('m-stack').setAttribute('aria-pressed',m==='stack');
  document.getElementById('m-par').setAttribute('aria-pressed',m==='parallel');
}
function setLevel(lv){
  ['full','note','plain'].forEach(x=>{
    wrap.classList.toggle('level-'+x, x===lv);
    document.getElementById('lv-'+x).setAttribute('aria-pressed', x===lv);
  });
}
let curfs=1.155;
function fs(d){curfs=Math.max(.95,Math.min(1.5,curfs+d*.06));document.getElementById('book').style.setProperty('--fs',curfs+'rem');}
render();
</script>

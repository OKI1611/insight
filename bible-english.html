<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script src="/content-loader.js?v=20260703f"></script>
  <script src="/site-header.js?v=20260906b"></script>
  <script src="/section-sidenav.js?v=20260815a"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이블 잉글리시 · 성경으로 배우는 영어 — BIBLY 바이블 인사이트</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BIBLY" />
  <meta name="description" content="성경으로 영어를 배우는 바이블 잉글리시. 성경책·장을 골라 유닛별로 듣기·단어·어법·암송·연습 단계 학습. 발음(IPA)·쉬운 영어·토익/수능 어법까지." />
  <link rel="canonical" href="https://biblynote.com/bible-english" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BIBLY 바이블 인사이트" />
  <meta property="og:title" content="바이블 잉글리시 · 성경으로 배우는 영어" />
  <meta property="og:image" content="https://biblynote.com/images/og-cover.png?v=7" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#213a6b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#213a6b', navy:'#182c54', gold:'#00704a', sand:'#eaf0f8', paper:'#ffffff' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'] },
      boxShadow: { soft:'0 2px 10px -4px rgba(21,32,58,.10)', card:'0 14px 40px -18px rgba(21,32,58,.22)' }
    }}}
  </script>
  <style>
    h1,h2,h3{font-family:'Pretendard',system-ui,sans-serif}
    .en{font-family:Georgia,'Times New Roman',serif}
    .eyebrow{letter-spacing:.28em;text-transform:uppercase}
    .ucard{opacity:0;transform:translateY(8px);animation:rise .38s ease forwards}
    @keyframes rise{to{opacity:1;transform:none}}
  </style>
</head>
<body class="font-sans bg-paper text-neutral-900 antialiased">

  <div id="siteHeader" data-active="bible-english.html"></div>

  <!-- Hero -->
  <section class="bg-gradient-to-b from-sand/60 to-paper border-b border-ink/8">
    <div class="max-w-3xl mx-auto px-5 py-8 md:py-11 text-center">
      <p class="eyebrow text-gold text-[11px] font-bold mb-3">Bible English · 바이블 잉글리시</p>
      <h1 class="text-2xl md:text-[30px] font-bold leading-tight">성경으로 <span class="text-gold">배우는 영어</span></h1>
      <p class="text-neutral-900/60 text-sm mt-2.5 leading-relaxed max-w-xl mx-auto">성경책과 장을 고르면, 한 유닛씩 <b class="text-neutral-900/75">듣고 · 익히고 · 외우고 · 말해</b> 보며 학습합니다.</p>
      <div class="inline-flex items-center gap-1.5 mt-5 text-[11.5px] font-semibold text-neutral-900/50 flex-wrap justify-center">
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">듣기</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">단어</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">어법</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">암송</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">연습</span>
      </div>
    </div>
  </section>

  <div class="max-w-3xl mx-auto px-4 md:px-5 py-6">
    <!-- 경로(브레드크럼) -->
    <nav id="crumb" class="flex items-center gap-1.5 text-[12.5px] font-semibold text-neutral-900/45 mb-4 flex-wrap"></nav>

    <!-- 헤더 라인 -->
    <div class="flex items-center gap-3 mb-4 flex-wrap">
      <div>
        <p id="viewTitle" class="text-[15px] font-bold text-ink">성경책 선택</p>
        <p id="viewSub" class="text-[11.5px] text-neutral-900/45">불러오는 중…</p>
      </div>
      <a id="resumeBtn" href="#" class="hidden ml-auto text-[13px] font-bold text-white bg-gold rounded-full px-4 py-2 hover:opacity-90 transition">▶ 이어서 학습</a>
    </div>

    <div id="view" class="grid gap-3 sm:grid-cols-2"></div>
    <div id="emptyMsg" class="hidden text-center text-neutral-500 py-12 text-sm">콘텐츠를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>
  </div>

  <footer class="bg-paper border-t border-neutral-200 py-12 mt-4">
    <div class="max-w-6xl mx-auto px-5 text-center text-sm">
    </div>
  </footer>

  <script>
    const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const $=id=>document.getElementById(id);
    const STEPN=['듣기','단어','어법','암송','연습'];
    function prog(){ try{ return JSON.parse(localStorage.getItem('be_prog')||'{}'); }catch(e){ return {}; } }
    var UNITS=[];

    function statusChip(st){
      if(st==='done') return '<span class="text-[10px] font-bold text-white bg-gold rounded-full px-2 py-0.5">완료</span>';
      if(typeof st==='number') return '<span class="text-[10px] font-bold text-[#b07d16] bg-[#fbf3dc] rounded-full px-2 py-0.5">이어서 · STEP '+(st+1)+'</span>';
      return '<span class="text-[10px] font-bold text-neutral-900/40 bg-ink/5 rounded-full px-2 py-0.5">시작 전</span>';
    }
    function bar(pct){ return '<div class="h-1 bg-ink/8 rounded-full overflow-hidden mt-2.5"><div class="h-full bg-gold transition-all" style="width:'+pct+'%"></div></div>'; }
    function card(href,inner,delay){ return '<a href="'+href+'" class="ucard group block bg-white border border-ink/10 rounded-2xl shadow-soft hover:shadow-card hover:border-gold/40 transition p-5" style="animation-delay:'+delay+'ms">'+inner+'</a>'; }

    function setResume(){
      var p=prog(), rid=null, done=0;
      UNITS.forEach(function(u){ if(p[u.id]==='done')done++; else if(rid===null && typeof p[u.id]==='number')rid=u.id; });
      if(rid===null){ var f=UNITS.find(function(u){return p[u.id]!=='done';}); if(f)rid=f.id; }
      var rb=$('resumeBtn');
      if(rid!==null){ rb.href='/bible-english-unit.html?u='+rid; rb.classList.remove('hidden'); rb.textContent=(done>0?'▶ 이어서 학습':'▶ 학습 시작'); }
      else rb.classList.add('hidden');
    }

    /* ---- 책 목록 ---- */
    function renderBooks(){
      $('crumb').innerHTML='<span class="text-ink">성경책</span>';
      $('viewTitle').textContent='성경책 선택';
      var p=prog();
      var order=[], map={};
      UNITS.forEach(function(u){ if(!map[u.bookEn]){ map[u.bookEn]={book:u.book,bookEn:u.bookEn,chs:{},units:0,done:0}; order.push(u.bookEn);} var m=map[u.bookEn]; m.chs[u.chapter]=1; m.units++; if(p[u.id]==='done')m.done++; });
      $('viewSub').textContent=order.length+'개 성경책 · 학습할 책을 고르세요';
      $('view').className='grid gap-3 sm:grid-cols-2';
      $('view').innerHTML=order.map(function(be,i){ var m=map[be]; var chN=Object.keys(m.chs).length; var pct=m.units?Math.round(m.done/m.units*100):0;
        return card('?book='+encodeURIComponent(be),
          '<div class="flex items-center gap-3"><div class="flex-1 min-w-0"><p class="font-bold text-[17px] text-ink group-hover:text-gold transition">'+esc(m.book)+' <span class="en text-neutral-900/40 text-[13px] font-semibold">'+esc(be)+'</span></p><p class="text-[12px] text-neutral-900/50 mt-0.5">'+chN+'개 장 · '+m.units+'개 유닛</p></div><div class="text-right shrink-0"><p class="text-[11px] text-neutral-900/45 mb-0.5">완료 '+m.done+'/'+m.units+'</p><span class="text-gold/50 group-hover:text-gold group-hover:translate-x-0.5 inline-block transition text-lg">→</span></div></div>'+bar(pct), i*60);
      }).join('');
    }

    /* ---- 장 목록 ---- */
    function renderChapters(be){
      var list=UNITS.filter(function(u){return u.bookEn===be;});
      if(!list.length){ renderBooks(); return; }
      var bookKo=list[0].book, p=prog();
      $('crumb').innerHTML='<a href="/bible-english.html" class="hover:text-gold">성경책</a><span class="text-neutral-900/25">›</span><span class="text-ink">'+esc(bookKo)+'</span>';
      $('viewTitle').textContent=bookKo+' — 장 선택';
      var chs=[], cmap={};
      list.forEach(function(u){ if(!cmap[u.chapter]){cmap[u.chapter]={ch:u.chapter,units:0,done:0}; chs.push(u.chapter);} var m=cmap[u.chapter]; m.units++; if(p[u.id]==='done')m.done++; });
      chs.sort(function(a,b){return a-b;});
      $('viewSub').textContent='몇 장을 학습할지 고르세요 · '+chs.length+'개 장';
      $('view').className='grid gap-3 sm:grid-cols-3';
      $('view').innerHTML=chs.map(function(ch,i){ var m=cmap[ch]; var pct=m.units?Math.round(m.done/m.units*100):0;
        return card('?book='+encodeURIComponent(be)+'&ch='+ch,
          '<div class="flex items-center gap-3"><div class="flex-1 min-w-0"><p class="font-bold text-[17px] text-ink group-hover:text-gold transition">'+ch+'장</p><p class="text-[12px] text-neutral-900/50 mt-0.5">'+m.units+'개 유닛 · 완료 '+m.done+'/'+m.units+'</p></div><span class="text-gold/50 group-hover:text-gold inline-block transition text-lg shrink-0">→</span></div>'+bar(pct), i*55);
      }).join('');
    }

    /* ---- 유닛 목록 ---- */
    function renderUnits(be,ch){
      var list=UNITS.filter(function(u){return u.bookEn===be && u.chapter===ch;}).sort(function(a,b){return a.unitNo-b.unitNo;});
      if(!list.length){ renderChapters(be); return; }
      var bookKo=list[0].book, p=prog();
      $('crumb').innerHTML='<a href="/bible-english.html" class="hover:text-gold">성경책</a><span class="text-neutral-900/25">›</span><a href="?book='+encodeURIComponent(be)+'" class="hover:text-gold">'+esc(bookKo)+'</a><span class="text-neutral-900/25">›</span><span class="text-ink">'+ch+'장</span>';
      $('viewTitle').textContent=bookKo+' '+ch+'장 — 유닛';
      $('viewSub').textContent=list.length+'개 유닛 · 순서대로 학습하세요';
      $('view').className='grid gap-3 sm:grid-cols-2';
      $('view').innerHTML=list.map(function(u,i){ var st=p[u.id];
        var pct= st==='done'?100 : (typeof st==='number'? Math.round((st+1)/STEPN.length*100) : 0);
        return card('/bible-english-unit.html?u='+u.id,
          '<div class="flex items-start gap-3"><div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-1"><span class="text-[11px] font-bold text-gold">UNIT '+u.unitNo+'</span>'+statusChip(st)+'</div>'
          +'<p class="en font-bold text-[16px] text-ink truncate group-hover:text-gold transition">'+esc(u.title)+'</p>'
          +'<p class="text-[13px] text-neutral-900/55 truncate">'+esc(u.titleKo)+' · '+esc(u.ref)+'</p></div>'
          +'<span class="shrink-0 text-gold/40 group-hover:text-gold group-hover:translate-x-0.5 transition text-lg mt-0.5">→</span></div>'          +bar(pct), i*60);
      }).join('');
    }

    function route(){
      var q=new URLSearchParams(location.search), be=q.get('book'), ch=q.get('ch');
      if(!be) renderBooks(); else if(!ch) renderChapters(be); else renderUnits(be, parseInt(ch,10));
      setResume();
    }
    fetch('/content/be-units.json?t='+Date.now()).then(function(r){return r.json();})
      .then(function(list){ if(!list||!list.length){ $('emptyMsg').classList.remove('hidden'); $('viewSub').textContent=''; return; } UNITS=list; route(); })
      .catch(function(){ $('emptyMsg').classList.remove('hidden'); $('viewSub').textContent=''; });
    window.addEventListener('popstate', route);
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="auth-header.js?v=20260906a"></script>
</body>
</html>

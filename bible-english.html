  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#213a6b', navy:'#182c54', gold:'#00704a', sand:'#eaf0f8', paper:'#ffffff' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'] },
      boxShadow: { soft:'0 2px 10px -4px rgba(21,32,58,.10)', card:'0 14px 40px -18px rgba(21,32,58,.22)' }
    }}}
  </script>
  <style>
    h1,h2,h3{font-family:'Pretendard',system-ui,sans-serif}
    .en{font-family:Georgia,'Times New Roman',serif}
    .eyebrow{letter-spacing:.28em;text-transform:uppercase}
    .ucard{opacity:0;transform:translateY(8px);animation:rise .4s ease forwards}
    @keyframes rise{to{opacity:1;transform:none}}
  </style>
</head>
<body class="font-sans bg-paper text-neutral-900 antialiased">

  <div id="siteHeader" data-active="bible-english.html"></div>

  <!-- Hero -->
  <section class="bg-gradient-to-b from-sand/60 to-paper border-b border-ink/8">
    <div class="max-w-3xl mx-auto px-5 py-9 md:py-12 text-center">
      <p class="eyebrow text-gold text-[11px] font-bold mb-3">Bible English · 바이블 잉글리시</p>
      <h1 class="text-2xl md:text-[30px] font-bold leading-tight">성경으로 <span class="text-gold">배우는 영어</span></h1>
      <p class="text-neutral-900/60 text-sm mt-2.5 leading-relaxed max-w-xl mx-auto">한 유닛씩 <b class="text-neutral-900/75">듣고 · 익히고 · 외우고 · 말해</b> 보며 영어도 배우고 말씀도 알아가는 학습 코너.</p>
      <!-- 학습 흐름 -->
      <div class="inline-flex items-center gap-1.5 mt-5 text-[11.5px] font-semibold text-neutral-900/50 flex-wrap justify-center">
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">🎧 듣기</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">🔤 단어</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">🧠 어법</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">💛 암송</span><span class="text-neutral-900/25">→</span>
        <span class="bg-white border border-ink/10 rounded-full px-2.5 py-1 shadow-soft">✅ 연습</span>
      </div>
    </div>
  </section>

  <div class="max-w-3xl mx-auto px-4 md:px-5 py-7">
    <!-- 진도 요약 + 이어 학습 -->
    <div id="summary" class="flex items-center gap-3 mb-4 flex-wrap">
      <div>
        <p class="text-[13px] font-bold text-ink">유닛 목록</p>
        <p id="progText" class="text-[11.5px] text-neutral-900/45">불러오는 중…</p>
      </div>
      <a id="resumeBtn" href="#" class="hidden ml-auto text-[13px] font-bold text-white bg-gold rounded-full px-4 py-2 hover:opacity-90 transition">▶ 이어서 학습하기</a>
    </div>

    <!-- 유닛 카드 리스트 -->
    <div id="unitList" class="grid gap-3 sm:grid-cols-2"></div>

    <div id="emptyMsg" class="hidden text-center text-neutral-500 py-12 text-sm">유닛을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>

    <p class="text-[11.5px] text-neutral-900/40 mt-6 text-center">새 유닛이 계속 추가됩니다 · KJV(공유저작물) + BIBLY 새 번역 · 음성은 브라우저 내장(무료)</p>
  </div>

  <footer class="bg-paper border-t border-neutral-200 py-12 mt-4">
    <div class="max-w-6xl mx-auto px-5 text-center text-sm">
      <p class="font-bold text-neutral-900 text-lg mb-2">BIBLY<span class="text-gold">.</span> 바이블 인사이트</p>
      <p class="text-xs text-neutral-500">성경·종말론 전문 온라인 아카데미 · 대표강사 오광일</p>
    </div>
  </footer>

  <script>
    const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    var STEPN=['듣기','단어','어법','암송','연습'];
    function prog(){ try{ return JSON.parse(localStorage.getItem('be_prog')||'{}'); }catch(e){ return {}; } }

    function statusChip(st){
      if(st==='done') return '<span class="ml-auto text-[10px] font-bold text-white bg-gold rounded-full px-2 py-0.5">✓ 완료</span>';
      if(typeof st==='number') return '<span class="ml-auto text-[10px] font-bold text-[#b07d16] bg-[#fbf3dc] rounded-full px-2 py-0.5">이어서 · STEP '+(st+1)+'</span>';
      return '<span class="ml-auto text-[10px] font-bold text-neutral-900/40 bg-ink/5 rounded-full px-2 py-0.5">시작 전</span>';
    }
    function render(units){
      var p=prog(), done=0, resumeId=null;
      var html=units.map(function(u,idx){
        var st=p[u.id]; if(st==='done')done++; else if(resumeId===null && (typeof st==='number'))resumeId=u.id;
        var barPct = st==='done'?100 : (typeof st==='number'? Math.round((st+1)/STEPN.length*100) : 0);
        return '<a href="/bible-english-unit.html?u='+u.id+'" class="ucard group block bg-white border border-ink/10 rounded-2xl shadow-soft hover:shadow-card hover:border-gold/40 transition p-4" style="animation-delay:'+(idx*60)+'ms">'
          +'<div class="flex items-center gap-3.5">'
            +'<div class="shrink-0 w-14 h-14 rounded-2xl bg-gold/10 grid place-items-center text-[26px]">'+esc(u.emoji||'📘')+'</div>'
            +'<div class="flex-1 min-w-0">'
              +'<div class="flex items-center gap-2 mb-0.5"><span class="text-[11px] font-bold text-gold">UNIT '+u.id+'</span>'
                +'<span class="text-[10px] font-semibold text-neutral-900/45 bg-ink/5 rounded-full px-2 py-0.5">'+esc(u.level||'')+'</span>'
                +statusChip(st)+'</div>'
              +'<p class="en font-bold text-[16px] text-ink truncate group-hover:text-gold transition">'+esc(u.title)+'</p>'
              +'<p class="text-[13px] text-neutral-900/55 truncate">'+esc(u.titleKo)+' · '+esc(u.ref)+'</p>'
            +'</div>'
            +'<span class="shrink-0 text-gold/40 group-hover:text-gold group-hover:translate-x-0.5 transition text-lg">→</span>'
          +'</div>'
          +'<div class="flex items-center gap-2 mt-2.5 text-[11px] text-neutral-900/40">'
            +'<span>📖 '+u.verses.length+'구절</span><span class="text-neutral-900/20">·</span><span>🔤 단어 '+u.words.length+'</span><span class="text-neutral-900/20">·</span><span>🎯 토익·수능 문제</span>'
          +'</div>'
          +'<div class="h-1 bg-ink/8 rounded-full overflow-hidden mt-2"><div class="h-full bg-gold transition-all" style="width:'+barPct+'%"></div></div>'
        +'</a>';
      }).join('');
      document.getElementById('unitList').innerHTML=html;
      document.getElementById('progText').textContent='전체 '+units.length+'개 유닛 · '+done+'개 완료';
      // 이어 학습 버튼: 진행중 우선, 없으면 첫 미완료
      if(resumeId===null){ var firstUndone=units.find(function(u){return p[u.id]!=='done';}); if(firstUndone && done>0) resumeId=firstUndone.id; }
      var rb=document.getElementById('resumeBtn');
      if(resumeId!==null){ rb.href='/bible-english-unit.html?u='+resumeId; rb.classList.remove('hidden'); rb.textContent=(done>0?'▶ 이어서 학습하기':'▶ 학습 시작하기'); }
    }
    fetch('/content/be-units.json?t='+Date.now()).then(function(r){return r.json();})
      .then(function(list){ if(!list||!list.length){ document.getElementById('emptyMsg').classList.remove('hidden'); document.getElementById('progText').textContent=''; return; } render(list); })
      .catch(function(){ document.getElementById('emptyMsg').classList.remove('hidden'); document.getElementById('progText').textContent=''; });
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="auth-header.js?v=20260619c"></script>
</body>
</html>

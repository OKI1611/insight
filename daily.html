<body class="font-sans bg-paper text-neutral-900 antialiased min-h-screen">

  <div id="siteHeader" data-active="daily.html"></div>

  <!-- 히어로 -->
  <section class="bg-gradient-to-b from-navy via-ink to-[#16284c] text-paper">
    <div class="max-w-3xl mx-auto px-5 py-10 md:py-12 text-center">
      <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-2">Daily Word · 맥체인 데일리 묵상</p>
      <h1 class="text-2xl md:text-[30px] font-bold leading-tight">매일 <span class="text-gold">말씀과 함께</span></h1>
      <p class="text-paper/70 text-sm mt-3 leading-relaxed max-w-xl mx-auto">맥체인 성경읽기표를 따라 매일 한 본문을 — <b class="text-paper">맥락·원어·시대배경·신학·삶의 적용</b>으로. 오늘도 말씀으로 살아갈 힘과 용기를 얻으세요.</p>
    </div>
  </section>

  <main class="max-w-3xl mx-auto px-4 py-7">
    <!-- 날짜 네비 -->
    <div class="flex items-center justify-between gap-2 mb-5">
      <button onclick="step(-1)" id="prevBtn" class="text-sm border border-ink/15 rounded-full px-4 py-2 hover:bg-ink/5 transition">← 어제</button>
      <div class="text-center">
        <p id="dDate" class="font-bold text-neutral-900">—</p>
        <button onclick="openArchive()" class="text-[12px] text-gold hover:underline mt-0.5">지난 묵상 보기</button>
      </div>
      <button onclick="step(1)" id="nextBtn" class="text-sm border border-ink/15 rounded-full px-4 py-2 hover:bg-ink/5 transition">내일 →</button>
    </div>

    <article id="dev" class="bg-white rounded-2xl border border-ink/8 shadow-card p-6 md:p-8">
      <p class="text-neutral-900/40 text-center py-12">불러오는 중…</p>
    </article>

    <!-- 묵상 완료 / 공유 -->
    <div id="actions" class="hidden mt-5 flex flex-col sm:flex-row items-center justify-center gap-3">
      <button onclick="markDone()" id="doneBtn" class="bg-gold text-white font-bold px-6 py-3 rounded-full hover:opacity-90 transition shadow-soft">오늘 묵상 완료</button>
      <button onclick="share()" class="border border-ink/15 text-neutral-900/70 font-semibold px-5 py-3 rounded-full hover:bg-ink/5 transition">공유하기</button>
      <button onclick="openDevEditor()" id="devEditBtn" class="hidden border border-gold/50 text-gold font-semibold px-5 py-3 rounded-full hover:bg-gold/10 transition">이 묵상 편집</button>
      <a id="readFullLink" href="bible.html" onclick="return __readFull(event)" class="text-sm text-gold hover:underline">본문 전체 읽기 →</a>
    </div>
    <p id="streak" class="text-center text-[12.5px] text-neutral-900/55 mt-3"></p>

    <!-- ===== 오늘의 묵상 나눔 (블로그식) ===== -->
    <section id="shareSection" class="mt-9">
      <div class="flex items-center justify-between gap-2 mb-2">
        <h3 class="font-bold text-neutral-900 flex items-center gap-1.5">오늘의 묵상 나눔 <span id="postCount" class="text-xs font-semibold text-gold bg-gold/10 px-2 py-0.5 rounded-full">0</span></h3>
        <button onclick="toggleComposer()" id="writeBtn" class="text-sm font-semibold bg-gold text-white px-4 py-2 rounded-full hover:opacity-90 transition shadow-soft">내 묵상 쓰기</button>
      </div>
      <p class="text-[12px] text-neutral-900/50 mb-3">오늘 본문(<span id="shareRef" class="text-neutral-900/70 font-medium">—</span>)을 묵상하며 받은 은혜를 자유롭게 나눠보세요. 누구나 쓸 수 있어요.</p>
      <div id="composer" class="hidden bg-white rounded-2xl border border-gold/30 shadow-soft p-4 mb-4">
        <input id="pTitle" type="text" maxlength="60" placeholder="제목 (선택)" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm mb-2 outline-none focus:border-gold" />
        <textarea id="pContent" rows="5" maxlength="2000" placeholder="오늘 말씀에서 받은 은혜·깨달음·삶의 적용을 나눠주세요…" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-[14px] outline-none focus:border-gold leading-relaxed"></textarea>
        <div class="flex items-center justify-end gap-2 mt-2">
          <span id="pMsg" class="text-xs text-red-500 mr-auto"></span>
          <button onclick="toggleComposer()" class="text-sm text-neutral-900/50 px-3 py-2">취소</button>
          <button onclick="submitPost()" id="pSubmit" class="text-sm font-bold bg-ink text-paper px-5 py-2 rounded-full hover:bg-navy transition">나눔 올리기</button>
        </div>
      </div>
      <div id="postList" class="space-y-3"></div>
    </section>

    <!-- 보관함 -->
    <div id="archive" class="hidden mt-7 bg-white rounded-2xl border border-ink/8 shadow-soft p-5">
      <div class="flex items-center justify-between mb-3"><p class="font-bold text-sm">지난 묵상</p><button onclick="closeArchive()" class="text-xs text-neutral-900/40 hover:text-neutral-900">✕ 닫기</button></div>
      <div id="archiveList" class="grid sm:grid-cols-2 gap-2"></div>
    </div>

    <p class="text-[11px] text-neutral-900/40 text-center mt-8 leading-relaxed">매일 새 묵상이 맥체인 읽기표에 따라 자동으로 발행됩니다. 본문은 KJV 새번역·원어 대조를 따릅니다.</p>
  </main>

  <script src="auth-header.js?v=20260619c"></script>
  <script>
  const SUPABASE_URL='https://bmxkndkwefdgsomlznoo.supabase.co';
  const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJteGtuZGt3ZWZkZ3NvbWx6bm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzAwODIsImV4cCI6MjA5NjE0NjA4Mn0.l1yHhMVYwMqYSL8ub9PtrJPOl7CYr7yqstG2AER1EaU';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ flowType:'implicit', lock: async(_n,_t,fn)=>await fn() } });
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const ADMIN_EMAIL='josephoh1611@gmail.com';
  let INDEX=[], CUR=null, USER=null, REF='', IS_ADMIN=false, EDITING=null, POSTS=[], CUR_DOC=null;

  // '본문 전체 읽기' → 오늘 본문(d.ref)의 해당 성경·장으로 연결
  let BOOKMAP=[];
  fetch('bible/books.json').then(r=>r.json()).then(d=>{ BOOKMAP=d||[]; updateReadLink(); }).catch(()=>{});
  function readUrl(ref){
    if(!ref || !BOOKMAP.length) return 'bible.html';
    ref=String(ref).trim();
    let bk=BOOKMAP.filter(b=>ref.indexOf(b.ko)===0).sort((a,b)=>b.ko.length-a.ko.length)[0]
        || BOOKMAP.filter(b=>ref.indexOf(b.ko)>=0).sort((a,b)=>b.ko.length-a.ko.length)[0];
    const m=ref.match(/(\d+)/); const ch=m?m[1]:'';
    return bk ? ('bible.html?b='+bk.file+(ch?('&c='+ch):'')) : 'bible.html';
  }
  function updateReadLink(){ const a=$('readFullLink'); if(a) a.href=readUrl(REF); }
  // 클릭 시점에 현재 본문 기준으로 이동(타이밍 무관 보장)
  window.__readFull=function(e){ if(e&&e.preventDefault) e.preventDefault(); location.href=readUrl(REF); return false; };

  // 한국시간(KST=UTC+9) 기준 — 발행/오늘 판단을 방문자 시간대와 무관하게 통일
  function kstDate(){ return new Date(Date.now() + 9*3600000); }   // UTC부재 메서드(getUTC*)로 읽으면 KST 벽시계
  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ const k=kstDate(); return k.getUTCFullYear()+'-'+pad2(k.getUTCMonth()+1)+'-'+pad2(k.getUTCDate()); }
  // 발행 기준일: 매일 오전 6시(KST)에 그날 묵상이 공개된다. 6시 이전이면 전날까지만 공개.
  function publishCutoff(){ const k=kstDate(); if(k.getUTCHours()<6){ k.setUTCDate(k.getUTCDate()-1); } return k.getUTCFullYear()+'-'+pad2(k.getUTCMonth()+1)+'-'+pad2(k.getUTCDate()); }
  function fmtK(s){ const [y,m,d]=s.split('-'); const wd=['일','월','화','수','목','금','토'][new Date(s+'T00:00:00').getDay()]; return `${y}년 ${+m}월 ${+d}일 (${wd})`; }

  (async()=>{
    try{ const { data:{ session } } = await sb.auth.getSession(); USER=session?session.user:null; }catch(e){}
    IS_ADMIN = !!(USER && USER.email===ADMIN_EMAIL);
    try{ INDEX=await (await fetch('content/daily/index.json?t='+Date.now())).json(); }catch(e){ INDEX=[]; }
    INDEX=(INDEX.dates||INDEX||[]).filter(Boolean).sort();
    // 발행 게이트: 일반 방문자는 오전 6시(KST) 지난 날짜까지만. 관리자는 미리보기·편집 위해 전체 노출.
    const cut=publishCutoff();
    if(!IS_ADMIN) INDEX=INDEX.filter(d=>d<=cut);
    const t=todayStr();
    // 공개된 것 중 오늘 것이 있으면 오늘, 없으면 가장 최근(=발행 기준일)
    let pick = INDEX.includes(t) ? t : INDEX.filter(d=>d<=t).pop() || INDEX[INDEX.length-1];
    if(!pick){ $('dev').innerHTML='<p class="text-center text-neutral-900/50 py-12">곧 첫 묵상이 발행됩니다. 잠시만 기다려 주세요 </p>'; $('dDate').textContent=fmtK(t); return; }
    load(pick);
  })();

  async function load(date){
    CUR=date; $('dDate').textContent=fmtK(date);
    $('dev').innerHTML='<p class="text-neutral-900/40 text-center py-12">불러오는 중…</p>';
    $('actions').classList.add('hidden'); $('streak').textContent='';
    let d;
    try{ d=await (await fetch('content/daily/'+date+'.json?t='+Date.now())).json(); }catch(e){ $('dev').innerHTML='<p class="text-center text-neutral-900/50 py-12">이 날의 묵상을 불러오지 못했어요.</p>'; return; }
    // 관리자 수정본(오버라이드)이 있으면 그것을 우선 노출
    try{ const { data:ov } = await sb.from('daily_overrides').select('data').eq('devo_date',date).maybeSingle(); if(ov&&ov.data) d=ov.data; }catch(e){}
    CUR_DOC=d;
    render(d);
    if($('devEditBtn')) $('devEditBtn').classList.toggle('hidden', !IS_ADMIN);
    REF=d.ref||''; loadPosts(date);
    const i=INDEX.indexOf(date);
    $('prevBtn').disabled=(i<=0); $('prevBtn').classList.toggle('opacity-30',i<=0);
    $('nextBtn').disabled=(i>=INDEX.length-1); $('nextBtn').classList.toggle('opacity-30',i>=INDEX.length-1);
    $('actions').classList.remove('hidden');
    history.replaceState(null,'','?d='+date);
    refreshDone(date);
  }
  function render(d){
    const secs=(d.sections||[]).map(s=>`<div class="mb-4"><h3 class="font-bold text-neutral-900 text-[15px] mb-1.5 flex items-center gap-1.5">${esc(s.icon||'•')} ${esc(s.h)}</h3><p class="text-[14.5px] text-neutral-900/80">${esc(s.p)}</p></div>`).join('');
    $('dev').innerHTML=`
      <div class="text-center border-b border-ink/8 pb-5 mb-5">
        <span class="inline-block text-[11px] font-bold text-gold bg-gold/10 px-3 py-1 rounded-full mb-2">${esc(d.ref||'')}</span>
        <h2 class="font-sans text-xl md:text-2xl font-bold leading-snug">${esc(d.title||'')}</h2>
        ${d.verse_kr?`<p class="font-sans text-[16px] text-neutral-900 mt-3 leading-relaxed">"${esc(d.verse_kr)}"</p>`:''}
        ${d.verse_en?`<p class="verse-en text-[13px] text-neutral-900/45 mt-1.5 leading-relaxed">${esc(d.verse_en)}</p>`:''}
        ${d.focus?`<p class="text-[12px] text-neutral-900/40 mt-1.5">— ${esc(d.focus)}</p>`:''}
      </div>
      <div class="dev-body">${secs}</div>
      ${d.prayer?`<div class="mt-5 bg-sand/40 border-l-2 border-gold/50 rounded-r-xl px-4 py-3"><p class="text-[12px] font-bold text-gold mb-1">오늘의 기도</p><p class="text-[14px] text-neutral-900/80 leading-relaxed">${esc(d.prayer)}</p></div>`:''}
      ${d.question?`<div class="mt-3 bg-ink/[0.03] rounded-xl px-4 py-3"><p class="text-[12px] font-bold text-neutral-900/50 mb-1">묵상 질문</p><p class="text-[14px] text-neutral-900/80 leading-relaxed">${esc(d.question)}</p></div>`:''}
      ${d.encouragement?`<p class="text-center text-[15px] font-bold text-neutral-900 mt-6 serif">${esc(d.encouragement)}</p>`:''}`;
    updateReadLink();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function step(n){ const i=INDEX.indexOf(CUR); const j=i+n; if(j>=0&&j<INDEX.length) load(INDEX[j]); }

  function openArchive(){
    const box=$('archiveList');
    box.innerHTML=INDEX.slice().reverse().map(d=>`<button onclick="load('${d}');closeArchive()" class="text-left text-[13px] px-3 py-2 rounded-lg border border-ink/8 hover:border-gold/40 hover:bg-gold/5 transition ${d===CUR?'border-gold/50 bg-gold/5':''}">${fmtK(d)}</button>`).join('') || '<p class="text-xs text-neutral-900/40">아직 보관된 묵상이 없어요.</p>';
    $('archive').classList.remove('hidden'); $('archive').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function closeArchive(){ $('archive').classList.add('hidden'); }

  // ---- 묵상 완료(스트릭) ----
  const LS='bibly_devotion';
  function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } }
  async function refreshDone(date){
    let done=false, dates=[];
    if(USER){ try{ const { data } = await sb.from('devotion_log').select('devo_date').eq('user_id',USER.id); dates=(data||[]).map(r=>r.devo_date); }catch(e){} }
    else { dates=Object.keys(lsGet()); }
    done=dates.includes(date);
    paintDone(done); $('streak').textContent = dates.length ? `지금까지 ${dates.length}일 묵상했어요${streakOf(dates)}` : '';
  }
  function streakOf(dates){ const set=new Set(dates); let s=0; let d=new Date(); for(;;){ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set.has(k)){ s++; d.setDate(d.getDate()-1); } else break; } return s>1?` · 연속 ${s}일째 `:''; }
  function paintDone(done){ const b=$('doneBtn'); if(!b) return; if(done){ b.textContent='오늘 묵상 완료됨'; b.classList.add('opacity-70'); } else { b.textContent='오늘 묵상 완료'; b.classList.remove('opacity-70'); } }
  async function markDone(){
    if(!CUR) return;
    if(USER){ try{ await sb.from('devotion_log').upsert({ user_id:USER.id, devo_date:CUR, created_at:new Date().toISOString() },{onConflict:'user_id,devo_date'}); }catch(e){} }
    else { const o=lsGet(); o[CUR]=1; localStorage.setItem(LS, JSON.stringify(o)); }
    refreshDone(CUR);
  }
  function share(){
    const url='https://biblynote.com/daily?d='+CUR;
    if(navigator.share){ navigator.share({title:'매일 말씀과 함께', text:'오늘의 묵상', url}); }
    else { navigator.clipboard.writeText(url).then(()=>alert('링크를 복사했어요!\n'+url),()=>prompt('링크',url)); }
  }

  // ===== 수강생 묵상 나눔(블로그식) =====
  function fdt(s){ if(!s) return ''; const d=new Date(s), now=new Date(); const m=(now-d)/60000; if(m<1)return'방금'; if(m<60)return Math.floor(m)+'분 전'; if(m<1440)return Math.floor(m/60)+'시간 전'; return (d.getMonth()+1)+'.'+d.getDate(); }
  function toggleComposer(){
    if(!USER){ if(confirm('로그인하면 묵상을 나눌 수 있어요. 로그인하시겠어요?')) location.href='index.html'; return; }
    const c=$('composer'); c.classList.toggle('hidden'); if(!c.classList.contains('hidden')) $('pContent').focus();
  }
  async function loadPosts(date){
    $('shareRef').textContent = REF || '';
    const list=$('postList'); list.innerHTML='<p class="text-neutral-900/35 text-sm py-3 text-center">불러오는 중…</p>';
    let posts=[];
    try{ const { data } = await sb.from('daily_posts').select('id,author_id,author_name,title,content,created_at').eq('devo_date',date).order('created_at',{ascending:false}); posts=data||[]; }catch(e){ posts=[]; }
    $('postCount').textContent=posts.length;
    if(!posts.length){ list.innerHTML='<p class="text-neutral-900/40 text-sm py-6 text-center bg-white rounded-2xl border border-ink/8">아직 이 날의 수강생 묵상이 없어요.<br/>첫 나눔을 남겨보세요 </p>'; return; }
    const ids=posts.map(p=>p.id); let likeRows=[];
    try{ const { data } = await sb.from('daily_post_likes').select('post_id,user_id').in('post_id',ids); likeRows=data||[]; }catch(e){}
    const lc={}, mine={}; likeRows.forEach(r=>{ lc[r.post_id]=(lc[r.post_id]||0)+1; if(USER&&r.user_id===USER.id) mine[r.post_id]=true; });
    POSTS=posts;
    list.innerHTML=posts.map(p=>postCard(p,lc[p.id]||0,!!mine[p.id])).join('');
  }
  function postCard(p,likes,liked){
    const own = USER && p.author_id===USER.id;
    const canEdit = own || IS_ADMIN;            // 본인 글 또는 관리자
    const nm = esc(p.author_name||'익명'); const init = nm.slice(0,2);
    // 편집 모드: 제목·내용을 직접 고칠 수 있는 폼
    if(EDITING===p.id){
      return `<article class="bg-white rounded-2xl border border-gold/40 shadow-soft p-4">
        <p class="text-[12px] font-bold text-gold mb-2">글 수정 ${IS_ADMIN&&!own?'<span class="text-neutral-900/40 font-normal">(관리자)</span>':''}</p>
        <input id="et_${p.id}" type="text" maxlength="60" value="${esc(p.title||'')}" placeholder="제목 (선택)" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm mb-2 outline-none focus:border-gold" />
        <textarea id="ec_${p.id}" rows="5" maxlength="2000" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-[14px] outline-none focus:border-gold leading-relaxed" style="white-space:pre-wrap">${esc(p.content)}</textarea>
        <div class="flex items-center justify-end gap-2 mt-2">
          <span id="em_${p.id}" class="text-xs text-red-500 mr-auto"></span>
          <button onclick="cancelEdit()" class="text-sm text-neutral-900/50 px-3 py-2">취소</button>
          <button onclick="saveEdit('${p.id}')" class="text-sm font-bold bg-ink text-paper px-5 py-2 rounded-full hover:bg-navy transition">저장</button>
        </div>
      </article>`;
    }
    return `<article class="bg-white rounded-2xl border border-ink/8 shadow-soft p-4">
      <div class="flex items-center gap-2.5 mb-2">
        <div class="w-9 h-9 rounded-full bg-gold/15 text-gold flex items-center justify-center font-bold text-xs shrink-0">${init}</div>
        <div class="flex-1 min-w-0"><p class="font-bold text-sm text-neutral-900 truncate">${nm}${IS_ADMIN&&!own?' <span class="text-[10px] text-neutral-900/35 font-normal">· 다른 회원</span>':''}</p><p class="text-[11px] text-neutral-900/40">${fdt(p.created_at)}</p></div>
        ${canEdit?`<button onclick="startEdit('${p.id}')" class="text-[11px] text-neutral-900/40 hover:text-gold">수정</button>
        <button onclick="deletePost('${p.id}')" class="text-[11px] text-neutral-900/35 hover:text-red-500">삭제</button>`:''}
      </div>
      ${p.title?`<p class="font-bold text-neutral-900 text-[15px] mb-1">${esc(p.title)}</p>`:''}
      <p class="text-[14px] text-neutral-900/80 leading-relaxed" style="white-space:pre-wrap">${esc(p.content)}</p>
      <div class="flex items-center gap-4 mt-3 pt-2.5 border-t border-ink/5">
        <button onclick="toggleLike('${p.id}')" class="flex items-center gap-1.5 text-[13px] ${liked?'text-gold font-bold':'text-neutral-900/55'} hover:text-gold transition"><span>${likes}</span></button>
      </div>
    </article>`;
  }
  function startEdit(id){ EDITING=id; const p=POSTS.find(x=>x.id===id); if(!p) return;
    // 화면만 편집 폼으로 교체(좋아요 수 재조회 없이 빠르게)
    const list=$('postList'); const arts=list.querySelectorAll('article');
    const idx=POSTS.findIndex(x=>x.id===id); if(arts[idx]) arts[idx].outerHTML=postCard(p,0,false);
    const ta=$('ec_'+id); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
  }
  function cancelEdit(){ EDITING=null; loadPosts(CUR); }
  async function saveEdit(id){
    const title=($('et_'+id)?$('et_'+id).value.trim():''), content=($('ec_'+id)?$('ec_'+id).value.trim():'');
    if(content.length<5){ if($('em_'+id))$('em_'+id).textContent='조금 더 적어주세요 (5자 이상).'; return; }
    try{ const { error }=await sb.from('daily_posts').update({ title:title||null, content }).eq('id',id);
      if(error){ if($('em_'+id))$('em_'+id).textContent='수정 권한이 없거나 저장에 실패했어요.'; return; }
    }catch(e){ if($('em_'+id))$('em_'+id).textContent='저장 중 문제가 생겼어요.'; return; }
    EDITING=null; loadPosts(CUR);
  }
  async function submitPost(){
    if(!USER){ location.href='index.html'; return; }
    const content=$('pContent').value.trim(), title=$('pTitle').value.trim();
    if(content.length<5){ $('pMsg').textContent='조금 더 적어주세요 (5자 이상).'; return; }
    $('pSubmit').disabled=true;
    let nm='회원'; try{ const { data:prof }=await sb.from('profiles').select('full_name').eq('id',USER.id).maybeSingle(); nm=(prof&&prof.full_name)||(USER.email?USER.email.split('@')[0]:'회원'); }catch(e){ nm=USER.email?USER.email.split('@')[0]:'회원'; }
    try{ await sb.from('daily_posts').insert({ author_id:USER.id, author_name:nm, devo_date:CUR, title:title||null, content }); }
    catch(e){ $('pMsg').textContent='저장 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.'; $('pSubmit').disabled=false; return; }
    $('pTitle').value=''; $('pContent').value=''; $('pMsg').textContent=''; $('pSubmit').disabled=false;
    $('composer').classList.add('hidden'); loadPosts(CUR);
  }
  async function toggleLike(id){
    if(!USER){ if(confirm('로그인하면 공감할 수 있어요. 로그인하시겠어요?')) location.href='index.html'; return; }
    try{ const { data }=await sb.from('daily_post_likes').select('post_id').eq('post_id',id).eq('user_id',USER.id).maybeSingle();
      if(data){ await sb.from('daily_post_likes').delete().eq('post_id',id).eq('user_id',USER.id); }
      else { await sb.from('daily_post_likes').insert({ post_id:id, user_id:USER.id }); }
    }catch(e){}
    loadPosts(CUR);
  }
  async function deletePost(id){
    if(!confirm('이 글을 삭제할까요?')) return;
    try{ await sb.from('daily_posts').delete().eq('id',id); }catch(e){}
    loadPosts(CUR);
  }

  // ===== 묵상 본문 편집(관리자 전용) =====
  // content/daily/<날짜>.json 의 내용을 화면에서 직접 고쳐 Supabase(daily_overrides)에 저장.
  function secRow(s,i){ s=s||{icon:'•',h:'',p:''};
    return `<div class="de-sec border border-ink/10 rounded-xl p-3 mb-2" data-i="${i}">
      <div class="flex items-center gap-2 mb-1.5">
        <input class="de-icon w-12 border border-ink/15 rounded px-2 py-1 text-sm text-center" value="${esc(s.icon||'•')}" title="아이콘/이모지" />
        <input class="de-h flex-1 border border-ink/15 rounded px-2 py-1 text-sm font-semibold" value="${esc(s.h||'')}" placeholder="소제목 (예: 본문 풀이)" />
        <button type="button" onclick="this.closest('.de-sec').remove()" class="text-[11px] text-neutral-900/35 hover:text-red-500 px-1">삭제</button>
      </div>
      <textarea class="de-p w-full border border-ink/15 rounded px-2 py-1.5 text-[14px] leading-relaxed" rows="4" placeholder="단락 내용">${esc(s.p||'')}</textarea>
    </div>`;
  }
  function openDevEditor(){
    if(!IS_ADMIN){ alert('관리자만 편집할 수 있어요.'); return; }
    if(!CUR_DOC){ return; }
    const d=CUR_DOC;
    const fld=(label,id,val,ta)=> ta
      ? `<label class="block text-[12px] font-bold text-neutral-900/55 mt-3 mb-1">${label}</label><textarea id="${id}" rows="${ta}" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-[14px] leading-relaxed">${esc(val||'')}</textarea>`
      : `<label class="block text-[12px] font-bold text-neutral-900/55 mt-3 mb-1">${label}</label><input id="${id}" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm" value="${esc(val||'')}" />`;
    const ov=document.createElement('div');
    ov.id='devEditor';
    ov.style.cssText='position:fixed;inset:0;z-index:90;background:rgba(21,32,58,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px';
    ov.innerHTML=`<div class="bg-white rounded-2xl shadow-card w-full max-w-2xl my-2" style="max-width:42rem">
      <div class="flex items-center justify-between px-5 py-3 border-b border-ink/10 sticky top-0 bg-white rounded-t-2xl">
        <p class="font-bold text-neutral-900">묵상 편집 <span class="text-[12px] text-neutral-900/45 font-normal">· ${esc(fmtK(CUR))}</span></p>
        <button onclick="closeDevEditor()" class="text-neutral-900/40 hover:text-neutral-900 text-lg leading-none">✕</button>
      </div>
      <div class="px-5 py-4">
        ${fld('성경 본문 (예: 요한계시록 13장)','de_ref',d.ref)}
        ${fld('제목','de_title',d.title)}
        ${fld('핵심 말씀 — 한글','de_vkr',d.verse_kr,2)}
        ${fld('핵심 말씀 — 영문','de_ven',d.verse_en,2)}
        ${fld('출처 표기 (예: 요한계시록 13:8)','de_focus',d.focus)}
        <label class="block text-[12px] font-bold text-neutral-900/55 mt-4 mb-1">본문 단락</label>
        <div id="de_secs">${(d.sections||[]).map((s,i)=>secRow(s,i)).join('')}</div>
        <button type="button" onclick="document.getElementById('de_secs').insertAdjacentHTML('beforeend', secRow(null, Date.now()))" class="text-[12px] font-semibold text-gold border border-gold/40 rounded-full px-3 py-1.5 hover:bg-gold/10">＋ 단락 추가</button>
        ${fld('오늘의 기도','de_prayer',d.prayer,3)}
        ${fld('묵상 질문','de_question',d.question,2)}
        ${fld('격려 한마디','de_enc',d.encouragement)}
      </div>
      <div class="flex items-center gap-2 px-5 py-3 border-t border-ink/10 sticky bottom-0 bg-white rounded-b-2xl">
        <button onclick="revertDev()" class="text-[12px] text-neutral-900/45 hover:text-red-500 mr-auto">↺ 원본으로 되돌리기</button>
        <span id="de_msg" class="text-xs text-red-500"></span>
        <button onclick="closeDevEditor()" class="text-sm text-neutral-900/55 px-3 py-2">취소</button>
        <button onclick="saveDev()" id="de_save" class="text-sm font-bold bg-gold text-white px-5 py-2 rounded-full hover:opacity-90 transition shadow-soft">저장</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow='hidden';
  }
  function closeDevEditor(){ const ov=$('devEditor'); if(ov) ov.remove(); document.body.style.overflow=''; }
  function collectDev(){
    const g=id=>{ const e=$(id); return e?e.value.trim():''; };
    const secs=[...document.querySelectorAll('#de_secs .de-sec')].map(el=>({
      icon:(el.querySelector('.de-icon').value.trim()||'•'),
      h:el.querySelector('.de-h').value.trim(),
      p:el.querySelector('.de-p').value.trim()
    })).filter(s=>s.h||s.p);
    const o={ date:CUR, ref:g('de_ref'), title:g('de_title'), verse_kr:g('de_vkr'), verse_en:g('de_ven'),
      focus:g('de_focus'), sections:secs, prayer:g('de_prayer'), question:g('de_question'), encouragement:g('de_enc') };
    // 빈 값 제거(원본 스키마와 동일하게 깔끔히)
    Object.keys(o).forEach(k=>{ if(o[k]==='' || (Array.isArray(o[k])&&!o[k].length)) delete o[k]; });
    return o;
  }
  async function saveDev(){
    if(!IS_ADMIN) return;
    const msg=$('de_msg'); if(msg) msg.textContent='';
    const o=collectDev();
    if(!o.title){ if(msg) msg.textContent='제목은 비울 수 없어요.'; return; }
    $('de_save').disabled=true;
    try{ const { error }=await sb.from('daily_overrides').upsert({ devo_date:CUR, data:o, updated_at:new Date().toISOString() },{onConflict:'devo_date'});
      if(error){ if(msg) msg.textContent='저장 실패 — 권한(관리자 SQL) 또는 로그인을 확인해 주세요.'; $('de_save').disabled=false; return; }
    }catch(e){ if(msg) msg.textContent='저장 중 문제가 생겼어요.'; $('de_save').disabled=false; return; }
    CUR_DOC=o; render(o); closeDevEditor();
  }
  async function revertDev(){
    if(!IS_ADMIN) return;
    if(!confirm('이 날의 수정본을 지우고 원본(처음 발행된 묵상)으로 되돌릴까요?')) return;
    try{ await sb.from('daily_overrides').delete().eq('devo_date',CUR); }catch(e){}
    closeDevEditor(); load(CUR);
  }
  </script>
</body>
</html>

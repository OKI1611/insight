  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit', lock: async (_n, _t, fn) => await fn() } });
    let isAdmin = false, SESSION = null;
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function nl2(s){ return esc(s).replace(/\n/g,'<br>'); }
    function fmtDate(iso){ return new Date(iso).toLocaleDateString('ko-KR'); }
    function timeAgo(iso){ const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
      if(d<1) return '오늘'; if(d<7) return d+'일 전'; return new Date(iso).toLocaleDateString('ko-KR'); }
    function myName(){ const u=SESSION&&SESSION.user; if(!u) return '회원';
      return (u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||(u.email?u.email.split('@')[0]:'회원'); }
    // 확장자 → 카드 색상·라벨 분류
    function fileKind(ext){
      ext=(ext||'').toLowerCase();
      if(ext==='pdf') return 'pdf';
      if(['hwp','hwpx'].includes(ext)) return 'hwp';
      if(['doc','docx','rtf'].includes(ext)) return 'doc';
      if(['xls','xlsx','csv'].includes(ext)) return 'xls';
      if(['ppt','pptx'].includes(ext)) return 'ppt';
      if(['zip','7z','rar'].includes(ext)) return 'zip';
      if(['png','jpg','jpeg','gif','webp'].includes(ext)) return 'img';
      if(['mp3','m4a','wav'].includes(ext)) return 'mp3';
      return 'file';
    }
    function fileSize(b){ return b>=1048576 ? (b/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(b/1024))+'KB'; }
    function extOf(s){ const m=String(s||'').split('?')[0].match(/\.([A-Za-z0-9]{1,5})$/); return m?m[1].toLowerCase():''; }
    // 저장된 파일 이름이 없던 옛 자료는 주소 끝에서 이름을 만들어 준다
    function urlName(u){
      try{ const base=decodeURIComponent(String(u).split('?')[0].split('/').pop()||'');
        return base.replace(/^\d{10,}-/,'') || ''; }catch(e){ return ''; }
    }
    // 내려받을 때 보여 줄 이름 — 저장된 이름 > 주소 속 이름 > 자료 제목.확장자
    // (옛 자료는 주소가 '1788272661892.pdf' 라 이름이 없어 제목을 쓴다)
    function attachName(r){
      if(r.file_name) return r.file_name;
      const ext = extOf(r.file_url) || 'file';
      const raw = urlName(r.file_url);
      if(raw && !/^\d{10,}\.[A-Za-z0-9]{1,5}$/.test(raw)) return raw;
      const t = String(r.title||'첨부파일').replace(/[\\\/:*?"<>|]/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
      return (t || '첨부파일') + '.' + ext;
    }
    // Supabase 스토리지는 ?download=이름 을 붙이면 브라우저에서 바로 저장된다(원래 이름 유지)
    function dlUrl(u,name){
      if(!/\/storage\/v1\/object\/public\//.test(u||'')) return u;
      return u + (u.includes('?')?'&':'?') + 'download=' + encodeURIComponent(name||'');
    }
    function sanitize(html){ const d=document.createElement('div'); d.innerHTML=html||''; d.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,input,button,textarea,svg,math,frame,frameset,applet,noscript').forEach(n=>n.remove()); d.querySelectorAll('*').forEach(el=>{ [...el.attributes].forEach(a=>{ const name=a.name.toLowerCase(), val=a.value||''; if(/^on/i.test(name)){ el.removeAttribute(a.name); return; } if(/^(href|src|xlink:href|formaction|action|srcdoc|srcset|data|background|poster)$/.test(name)){ const v=val.replace(/\s+/g,'').toLowerCase(), okImg=(name==='src')&&/^data:image\//i.test(val.trim()); if(!okImg && /^(javascript:|data:|vbscript:)/.test(v)){ el.removeAttribute(a.name); return; } } if(name==='style' && /expression\(|javascript:|behavior:|@import|url\(/i.test(val)){ el.removeAttribute(a.name); } }); if(el.tagName==='A'){ el.setAttribute('rel','noopener noreferrer nofollow'); } }); return d.innerHTML; }
    function bodyHTML(b){ return /<[a-z][\s\S]*>/i.test(b||'') ? sanitize(b) : esc(b||'').replace(/\n/g,'<br>'); }
    // 글자 크기·폰트를 인라인 스타일로 등록 — 표시 페이지에서도 그대로 렌더(한 번만)
    function registerQuillStyles(){ if(window.__qReg || !window.Quill) return; window.__qReg = true;
      /* 글자 크기·폰트 whitelist와 픽커 라벨/미리보기는 editor-enhance.js가 공통 등록 */

      /* 첨부파일 카드를 Quill 이 정식 요소로 다루게 하는 커스텀 블롯.
         이렇게 해야 저장·재편집을 반복해도 카드가 무너지지 않고, 본문(description)에
         그대로 남아 별도 DB 칼럼 없이 동작한다. (칼럼 페이지와 같은 방식) */
      const BlockEmbed = Quill.import('blots/block/embed');
      class AttachBlot extends BlockEmbed {
        static create(v){
          const n = super.create();
          n.setAttribute('href', v.url);
          n.setAttribute('target', '_blank');
          n.setAttribute('rel', 'noopener noreferrer nofollow');
          n.setAttribute('data-kind', v.kind || 'file');
          n.setAttribute('data-name', v.name || '첨부파일');
          n.setAttribute('data-size', v.size || '');
          n.innerHTML =
            '<span class="cfIcon">' + esc((v.kind || 'file').toUpperCase()) + '</span>'
          + '<span class="cfBody"><span class="cfName">' + esc(v.name || '첨부파일') + '</span>'
          + '<span class="cfMeta">' + esc(v.size || '') + '</span></span>'
          + '<span class="cfGo">내려받기 ↓</span>';
          return n;
        }
        static value(n){
          return { url:n.getAttribute('href'), kind:n.getAttribute('data-kind'),
                   name:n.getAttribute('data-name'), size:n.getAttribute('data-size') };
        }
      }
      AttachBlot.blotName  = 'biblyAttach';
      AttachBlot.tagName   = 'a';
      AttachBlot.className = 'colFile';
      Quill.register(AttachBlot);
    }
    // 블로그식 리치 에디터 (Quill)
    let resQuill = null;
    function ensureResQuill(){
      if(resQuill) return resQuill;
      registerQuillStyles();
      resQuill = new Quill('#fEditor', {
        theme:'snow',
        placeholder:'자료 설명·본문을 자유롭게 작성하세요. 서식·사진·링크를 넣을 수 있어요.',
        modules:{ toolbar:[ [{ size: (window.BIBLY_EDITOR_SIZES || ['13px',false,'20px','24px']) },{ font: (window.BIBLY_EDITOR_FONTS || ['serif','monospace']) }], [{ header:[2,3,false] }], ['bold','italic','underline'], [{ color:[] },{ background:[] }], [{ list:'ordered' },{ list:'bullet' }], ['blockquote','link','image','biblyAttach'], ['clean'] ] }
      });
      // 첨부 버튼은 아이콘만으론 못 찾으므로 '파일 첨부' 글자를 넣는다
      const abtn = document.querySelector('#formView .ql-toolbar .ql-biblyAttach');
      if(abtn){
        abtn.innerHTML = '<span>📎</span><span>파일 첨부</span>';
        abtn.title = 'PDF·한글·워드 등 자료를 본문에 첨부합니다 (20MB 이하)';
      }
      // 본문 안 첨부 — 원본 파일 이름을 그대로 보여 주는 카드로 삽입
      resQuill.getModule('toolbar').addHandler('biblyAttach', () => {
        const input=document.createElement('input'); input.type='file';
        input.accept='.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.md,.zip,.mp3,.m4a';
        input.onchange=async()=>{
          const file=input.files[0]; if(!file) return;
          if(file.size>20*1024*1024){ alert('첨부파일은 20MB 이하만 가능해요.'); return; }
          const ext=extOf(file.name)||'bin';
          const safe=file.name.replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').slice(0,40) || 'file';
          const path=`resources/files/${Date.now()}-${safe}.${ext}`;
          const { error }=await sb.storage.from('community').upload(path,file);
          if(error){ alert('첨부 업로드 오류: '+error.message); return; }
          const url=sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          const range=resQuill.getSelection(true);
          resQuill.insertEmbed(range.index,'biblyAttach',
            { url: dlUrl(url,file.name), kind:fileKind(ext), name:file.name, size:fileSize(file.size) }, 'user');
          resQuill.setSelection(range.index+1);
        };
        input.click();
      });
      resQuill.getModule('toolbar').addHandler('image', () => {
        const input=document.createElement('input'); input.type='file'; input.accept='image/*';
        input.onchange=async()=>{
          const file=input.files[0]; if(!file) return;
          if(file.size>5*1024*1024){ alert('이미지는 5MB 이하만 가능해요.'); return; }
          const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
          const path=`resources/img/${Date.now()}.${ext}`;
          const { error }=await sb.storage.from('community').upload(path,file);
          if(error){ alert('이미지 업로드 오류: '+error.message); return; }
          const url=sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          const range=resQuill.getSelection(true);
          resQuill.insertEmbed(range.index,'image',url); resQuill.setSelection(range.index+1);
        };
        input.click();
      });
      return resQuill;
    }

    // 수정 화면에서 '지금 붙어 있는 파일'을 보여 주고 지울 수 있게 한다

    let RES = [], PAGE = 1;   // 자료 목록 페이지(10개씩)
    let CCOUNT = {};          // 자료별 댓글 수
    let COMMENTS_OK = true;   // 댓글 테이블이 아직 없으면 false

    // 댓글 수는 한 번에 모아서 센다(자료마다 따로 세면 목록이 느려진다)
    async function loadCommentCounts(){
      const { data, error } = await sb.from('resource_comments').select('resource_id');
      if(error){ COMMENTS_OK = false; CCOUNT = {}; return; }
      COMMENTS_OK = true; CCOUNT = {};
      (data||[]).forEach(x => { CCOUNT[x.resource_id] = (CCOUNT[x.resource_id]||0) + 1; });
    }

    let HASH_DONE = false;    // 공유 링크로 들어온 자료 펼치기는 첫 화면에서 한 번만

    async function loadList(){
      const wrap = document.getElementById('resList');
      const [{ data, error }] = await Promise.all([
        sb.from('resources').select('*').order('created_at',{ascending:false}),
        loadCommentCounts()
      ]);
      if(error){ wrap.innerHTML = `<p class="text-neutral-900/40 text-sm text-center py-8">불러오기 오류: ${esc(error.message)}</p>`; return; }
      if(!data.length){ wrap.innerHTML = '<p class="text-neutral-900/40 text-sm text-center py-10">아직 자료가 없습니다.'+(isAdmin?' 첫 자료를 올려보세요!':'')+'</p>'; document.getElementById('resPager').innerHTML=''; return; }

      if(!HASH_DONE && location.hash && location.hash.startsWith('#res-')){
        const idx = RES.findIndex(r => 'res-' + r.id === location.hash.slice(1));
        if(idx >= 0) PAGE = Math.floor(idx / BiblyPager.PER) + 1;

    // 목록 그리기 — 쪽 번호를 눌렀을 때는 다시 불러오지 않고 이것만 다시 그린다

              ${ r.category ? `<span class="text-[11px] text-gold font-bold tracking-wide">${esc(r.category)}</span>` : '' }
              <p class="font-semibold leading-snug">${esc(r.title||'')}</p>
              <p class="text-xs text-neutral-900/35 mt-0.5 flex items-center gap-1.5 flex-wrap">
                <span>${fmtDate(r.created_at)}</span>

            <!-- 버튼 묶음 — 좁은 화면에서는 제목 아래 줄로 내려간다(제목이 세로로 찌그러지지 않게) -->
            <div class="flex items-center gap-1.5 sm:gap-2 basis-full sm:basis-auto justify-end pl-[52px] sm:pl-0">

                    title="이 자료 공유하기" aria-label="이 자료 공유하기">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
              <span class="hidden sm:inline">공유</span>
            </button>
            <button onclick="event.stopPropagation();copyResLink(this)" data-id="${r.id}"
                    class="shrink-0 inline-flex items-center gap-1.5 text-xs font-semibold text-neutral-900/45 border border-ink/12 rounded-full px-2.5 sm:px-3 py-1.5 hover:text-gold hover:border-gold/50 transition"
                    title="이 자료 링크 복사" aria-label="이 자료 링크 복사">

          <div id="resbody-${r.id}" class="hidden mt-3 sm:pl-14 border-t border-ink/5 pt-3">
            ${ attachHTML(r) }
            ${ hasBody ? `<div class="resbody text-sm text-neutral-900/70 leading-relaxed">${bodyHTML(r.description)}</div>` : '' }
            <div class="mt-5 border-t border-ink/8 pt-3">
              <p class="text-sm font-bold mb-2">댓글 <span id="rccount-${r.id}" class="text-gold">${nc||''}</span></p>
              <div id="rclist-${r.id}" class="space-y-2"><p class="text-neutral-900/35 text-sm py-2">댓글을 불러오는 중…</p></div>
              <div id="rcform-${r.id}" class="mt-3"></div>
            </div>
          </div>
        </div>`;
      }).join('');
      if(!HASH_DONE){ HASH_DONE = true; openResFromHash(); }
    }

    // 첨부 자료 — 펼쳤을 때 가장 먼저 보이는 큰 카드
    function attachHTML(r){
      const cards = [];
      if(r.file_url){
        const name = attachName(r);
        const kind = fileKind(extOf(r.file_name || r.file_url));
        cards.push(`<a class="resFile" data-kind="${kind}" href="${esc(dlUrl(r.file_url,name))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            <span class="rfIcon">${esc(kind==='file'?'FILE':kind.toUpperCase())}</span>
            <span class="rfBody"><span class="rfName">${esc(name)}</span><span class="rfMeta">눌러서 내 기기에 저장하세요</span></span>
            <span class="rfGo">내려받기 ↓</span>
          </a>`);
      }
      if(r.link && String(r.link).trim()){
        cards.push(`<a class="resFile" data-kind="link" href="${esc(String(r.link).trim())}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
            <span class="rfIcon">🔗</span>
            <span class="rfBody"><span class="rfName">연결된 자료 열기</span><span class="rfMeta">${esc(String(r.link).trim().replace(/^https?:\/\//,'').slice(0,60))}</span></span>
            <span class="rfGo">열기 ↗</span>
          </a>`);
      }
      if(!cards.length) return '';
      return `<div class="mb-3">
          <p class="text-[11px] font-bold tracking-[0.15em] text-neutral-900/40 mb-1">첨부 자료</p>
          ${cards.join('')}
        </div>`;
    }

    // 자료 공유 — 해당 자료로 바로 연결되는 링크 생성
    function resLink(id){ return location.origin + location.pathname + '#res-' + id; }
    function shareRes(el){
      const url = resLink(el.dataset.id);
      const title = (el.dataset.t || '자료실') + ' — BIBLY 바이블 인사이트';
      if(window.biblyShare){ biblyShare(title, url); }
      else copyResLink(el);
    }
    // 링크만 바로 복사 — 카카오톡·카페처럼 붙여넣기로 퍼나를 때 가장 빠른 경로
    function copyResLink(el){
      const url = resLink(el.dataset.id);
      const done = () => resToast('링크가 복사됐어요');
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, fb); }
      else fb();
      function fb(){
        try{
          const ta = document.createElement('textarea');
          ta.value = url; ta.style.cssText = 'position:fixed;left:-9999px';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
        }catch(e){ prompt('아래 링크를 복사하세요', url); }
      }
    }
    function resToast(msg){
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#213a6b;color:#fff;padding:10px 18px;border-radius:9999px;font-size:14px;z-index:2147483647;box-shadow:0 8px 28px rgba(0,0,0,.3)';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1800);
    }
    // 공유 링크(#res-id)로 들어오면 해당 자료를 펼치고 그 위치로 이동
    function openResFromHash(){
      const m = (location.hash||'').match(/^#res-(.+)$/);
      if(!m) return;
      const card = document.getElementById('res-' + m[1]); if(!card) return;
      const body = document.getElementById('resbody-' + m[1]);
      if(body && body.classList.contains('hidden')) toggleRes(m[1]);
      card.scrollIntoView({ behavior:'smooth', block:'center' });
      card.classList.add('ring-2','ring-gold','rounded-xl');
      setTimeout(()=>card.classList.remove('ring-2','ring-gold','rounded-xl'), 2400);
    }

    async function saveResource(){
      const title = document.getElementById('fTitle').value.trim();
      const category = document.getElementById('fCategory').value.trim();
      ensureResQuill();
      // 본문에 첨부 카드만 있고 글자는 없을 수도 있으므로 HTML 로도 판단한다
      const rawHTML = resQuill.root.innerHTML;
      const hasContent = resQuill.getText().trim() || /colFile|<img/i.test(rawHTML);
      const description = hasContent ? sanitize(rawHTML) : '';
      let link = document.getElementById('fLink').value.trim();
      const file = document.getElementById('fFile').files[0];
      const msg = document.getElementById('fMsg'); const btn = document.getElementById('saveBtn');
      const editing = !!EDIT_ID;
      if(!title){ msg.textContent='제목을 입력하세요.'; return; }
      btn.disabled = true; const btnLabel = editing ? '수정 저장' : '올리기';
      btn.textContent = editing ? '저장 중…' : '올리는 중…'; msg.textContent = '';
      try {
        const row = { title, category: category||null, description: description||null, link: link||null };
        if(file){
          if(file.size > 20*1024*1024) throw new Error('파일은 20MB 이하만 가능해요.');
          const ext = extOf(file.name) || 'file';
          const safe = file.name.replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').slice(0,40) || 'file';
          const path = `resources/${Date.now()}-${safe}.${ext}`;
          const { error: upErr } = await sb.storage.from('community').upload(path, file);
          if(upErr) throw upErr;
          row.file_url  = sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          row.file_name = file.name;
        } else if(!editing){
          row.file_url = null; row.file_name = null;
        } else if(CLEAR_FILE){
          row.file_url = null; row.file_name = null;
        }
        // 새로 만든 file_name 칼럼이 아직 없는 DB 에서도 저장은 되게 한다
        const send = async payload => editing
          ? sb.from('resources').update(payload).eq('id', EDIT_ID)
          : sb.from('resources').insert(payload);
        let { error } = await send(row);
        let noteSQL = false;
        if(error && /file_name/.test(error.message||'')){
          const { file_name, ...noName } = row;
          ({ error } = await send(noName));
          noteSQL = !error;
        }
        if(error) throw error;
        closeForm(); loadList();
        if(noteSQL) alert('저장했습니다.\n첨부 파일 이름을 그대로 보여 주려면 Supabase SQL Editor 에서 db/resources_social.sql 을 한 번 실행하세요.');
      } catch(e){ msg.className = 'text-red-500 text-xs mt-2 text-right min-h-[14px]'; msg.textContent = '오류: ' + (e.message || e); }
      finally { btn.disabled = false; btn.textContent = btnLabel; }
    }

    function toggleRes(id){
      var b=document.getElementById('resbody-'+id), c=document.getElementById('rchev-'+id);
      if(!b) return; var closed=b.classList.toggle('hidden');
      if(c) c.style.transform = closed ? '' : 'rotate(180deg)';
      if(!closed && !b.dataset.loaded){ b.dataset.loaded='1'; loadComments(id); }
      if(!closed) renderCommentForm(id);
    }

    // ===== 댓글 =====
    function renderCommentForm(id){
      const f = document.getElementById('rcform-'+id); if(!f) return;
      if(!COMMENTS_OK){
        f.innerHTML = isAdmin
          ? `<p class="text-xs text-red-500">댓글 기능을 켜려면 Supabase SQL Editor 에서 <b>db/resources_social.sql</b> 을 한 번 실행하세요.</p>` : '';
        return;
      }
      if(SESSION && SESSION.user){
        f.innerHTML = `<div class="bg-white border border-ink/12 rounded-2xl p-3.5">
            <textarea id="rcin-${id}" rows="2" placeholder="자료를 보고 느낀 점·질문을 남겨 주세요…" class="w-full text-sm outline-none resize-none"></textarea>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-ink/8">
              <span class="text-xs text-neutral-900/40">${esc(myName())}님</span>
              <button onclick="addComment('${id}')" class="bg-gold text-white text-sm font-semibold px-4 py-2 rounded-full hover:opacity-90 transition">등록</button>
            </div></div>`;
      } else {
        f.innerHTML = `<div class="bg-ink/[0.03] border border-ink/8 rounded-2xl p-4 text-center text-sm text-neutral-900/55">댓글을 남기려면 <a href="index.html" class="text-gold font-semibold hover:underline">로그인</a> 해 주세요.</div>`;
      }
    }

    async function loadComments(id){
      const list = document.getElementById('rclist-'+id); if(!list) return;
      const { data, error } = await sb.from('resource_comments').select('*').eq('resource_id', id).order('created_at',{ascending:true});
      if(error){
        COMMENTS_OK = false;
        list.innerHTML = isAdmin
          ? `<p class="text-neutral-900/40 text-sm py-2">댓글을 불러오지 못했습니다. (관리자: db/resources_social.sql 실행 필요)</p>`
          : `<p class="text-neutral-900/35 text-sm py-2">댓글 기능을 준비 중입니다.</p>`;
        renderCommentForm(id); return;
      }
      const rows = data || [];
      CCOUNT[id] = rows.length;
      const cnt = document.getElementById('rccount-'+id); if(cnt) cnt.textContent = rows.length || '';
      if(!rows.length){ list.innerHTML = '<p class="text-neutral-900/35 text-sm py-2">첫 댓글을 남겨 보세요.</p>'; return; }
      const myId = SESSION && SESSION.user && SESSION.user.id;
      list.innerHTML = rows.map(c => {
        const canDel = isAdmin || (myId && c.user_id === myId);
        return `<div class="bg-white border border-ink/8 rounded-2xl px-4 py-3">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold text-sm">${esc(c.author_name||'회원')}</span>
              <span class="text-xs text-neutral-900/35">${timeAgo(c.created_at)}</span>
              ${canDel?`<button onclick="delComment('${c.id}','${id}')" class="ml-auto text-xs text-neutral-900/30 hover:text-red-500">삭제</button>`:''}
            </div>
            <p class="text-[15px] text-neutral-900/80 leading-relaxed">${nl2(c.content)}</p>
          </div>`;
      }).join('');
    }

    async function addComment(id){
      if(!(SESSION && SESSION.user)) return;
      const el = document.getElementById('rcin-'+id); if(!el) return;
      const content = (el.value||'').trim();
      if(!content){ el.focus(); return; }
      const { error } = await sb.from('resource_comments').insert({ resource_id: id, user_id: SESSION.user.id, author_name: myName(), content });
      if(error){ alert('등록 오류: ' + error.message); return; }
      el.value=''; loadComments(id);
    }

    async function delComment(cid, id){
      if(!confirm('이 댓글을 삭제할까요?')) return;
      const { error } = await sb.from('resource_comments').delete().eq('id', cid);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      loadComments(id);
    }

    async function delResource(id){
      if(!confirm('이 자료를 삭제할까요?')) return;
      const { error } = await sb.from('resources').delete().eq('id', id);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      loadList();
    }
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>

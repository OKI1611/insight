<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <div id="siteHeader" data-active="resources.html"></div>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <div class="flex items-end justify-between mb-8">
      <div>
        <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">LIBRARY</p>
        <h1 class="text-2xl md:text-3xl font-bold">자료실</h1>
        <p class="text-ink/55 text-sm mt-2">강의와 함께 보는 자료 — 암송노트·강의노트·도표를 받아보세요.</p>
      </div>
      <button id="writeBtn" onclick="openForm()" class="hidden bg-gold text-white text-sm font-semibold px-4 py-2.5 rounded-full hover:opacity-90 transition shrink-0">＋ 자료 올리기</button>
    </div>

    <!-- 작성 폼 (관리자) -->
    <div id="formView" class="hidden bg-white rounded-2xl border border-ink/10 shadow-soft p-5 mb-6">
      <h2 class="font-bold mb-4">자료 올리기</h2>
      <input id="fTitle" placeholder="자료 제목" class="w-full border border-ink/15 rounded-lg px-3 py-2.5 mb-2 outline-none focus:border-gold"/>
      <input id="fCategory" placeholder="분류 (예: 암송노트·강의노트·도표)" class="w-full border border-ink/15 rounded-lg px-3 py-2.5 mb-2 outline-none focus:border-gold"/>
      <label class="block text-xs font-semibold text-ink/50 mb-1">설명 · 본문 (블로그처럼 서식·사진 가능)</label>
      <div id="fEditor" class="mb-3"></div>
      <div class="grid sm:grid-cols-2 gap-3 mb-3">
        <label class="border border-dashed border-ink/20 rounded-lg px-3 py-2.5 text-sm text-ink/60 cursor-pointer hover:bg-ink/5 text-center">
          📎 파일 첨부 (PDF 등)
          <input id="fFile" type="file" class="hidden" onchange="document.getElementById('fFileName').textContent=this.files[0]?this.files[0].name:''"/>
          <span id="fFileName" class="block text-xs text-gold mt-1"></span>
        </label>
        <input id="fLink" placeholder="또는 링크 주소 (구글드라이브 등)" class="border border-ink/15 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-gold"/>
      </div>
      <div class="flex gap-2 justify-end">
        <button onclick="closeForm()" class="border border-ink/15 rounded-full px-5 py-2 text-sm hover:bg-ink/5">취소</button>
        <button id="saveBtn" onclick="saveResource()" class="bg-gold text-white font-semibold rounded-full px-6 py-2 text-sm hover:opacity-90">올리기</button>
      </div>
      <p id="fMsg" class="text-red-500 text-xs mt-2 text-right min-h-[14px]"></p>
    </div>

    <!-- 자료 리스트 -->
    <div id="resList" class="bg-white rounded-2xl border border-ink/8 shadow-soft divide-y divide-ink/5 overflow-hidden">
      <p class="text-ink/40 text-sm text-center py-10">자료를 불러오는 중…</p>
    </div>
  </main>

  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit', lock: async (_n, _t, fn) => await fn() } });
    let isAdmin = false;
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtDate(iso){ return new Date(iso).toLocaleDateString('ko-KR'); }
    function sanitize(html){ const d=document.createElement('div'); d.innerHTML=html||''; d.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,input,button,textarea,svg,math,frame,frameset,applet,noscript').forEach(n=>n.remove()); d.querySelectorAll('*').forEach(el=>{ [...el.attributes].forEach(a=>{ const name=a.name.toLowerCase(), val=a.value||''; if(/^on/i.test(name)){ el.removeAttribute(a.name); return; } if(/^(href|src|xlink:href|formaction|action|srcdoc|srcset|data|background|poster)$/.test(name)){ const v=val.replace(/\s+/g,'').toLowerCase(), okImg=(name==='src')&&/^data:image\//i.test(val.trim()); if(!okImg && /^(javascript:|data:|vbscript:)/.test(v)){ el.removeAttribute(a.name); return; } } if(name==='style' && /expression\(|javascript:|behavior:|@import|url\(/i.test(val)){ el.removeAttribute(a.name); } }); if(el.tagName==='A'){ el.setAttribute('rel','noopener noreferrer nofollow'); } }); return d.innerHTML; }
    function bodyHTML(b){ return /<[a-z][\s\S]*>/i.test(b||'') ? sanitize(b) : esc(b||'').replace(/\n/g,'<br>'); }
    // 글자 크기·폰트를 인라인 스타일로 등록 — 표시 페이지에서도 그대로 렌더(한 번만)
    function registerQuillStyles(){ if(window.__qReg || !window.Quill) return; window.__qReg = true;
      /* 글자 크기·폰트 whitelist와 픽커 라벨/미리보기는 editor-enhance.js가 공통 등록 */
    }
    // 블로그식 리치 에디터 (Quill)
    let resQuill = null;
    function ensureResQuill(){
      if(resQuill) return resQuill;
      registerQuillStyles();
      resQuill = new Quill('#fEditor', {
        theme:'snow',
        placeholder:'자료 설명·본문을 자유롭게 작성하세요. 서식·사진·링크를 넣을 수 있어요.',
        modules:{ toolbar:[ [{ size: (window.BIBLY_EDITOR_SIZES || ['13px',false,'20px','24px']) },{ font: (window.BIBLY_EDITOR_FONTS || ['serif','monospace']) }], [{ header:[2,3,false] }], ['bold','italic','underline'], [{ color:[] },{ background:[] }], [{ list:'ordered' },{ list:'bullet' }], ['blockquote','link','image'], ['clean'] ] }
      });
      resQuill.getModule('toolbar').addHandler('image', () => {
        const input=document.createElement('input'); input.type='file'; input.accept='image/*';
        input.onchange=async()=>{
          const file=input.files[0]; if(!file) return;
          if(file.size>5*1024*1024){ alert('이미지는 5MB 이하만 가능해요.'); return; }
          const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
          const path=`resources/img/${Date.now()}.${ext}`;
          const { error }=await sb.storage.from('community').upload(path,file);
          if(error){ alert('이미지 업로드 오류: '+error.message); return; }
          const url=sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          const range=resQuill.getSelection(true);
          resQuill.insertEmbed(range.index,'image',url); resQuill.setSelection(range.index+1);
        };
        input.click();
      });
      return resQuill;
    }

    sb.auth.getSession().then(({data:{session}})=>setUser(session));
    sb.auth.onAuthStateChange((_e,session)=>setUser(session));
    function setUser(session){
      isAdmin = !!(session && session.user && session.user.email === ADMIN_EMAIL);
      document.getElementById('writeBtn').classList.toggle('hidden', !isAdmin);
      { var _nu=document.getElementById('navUser'); if(_nu) _nu.innerHTML = isAdmin ? '<span class="text-gold font-semibold">관리자</span>' : ''; }
      loadList();
    }

    function openForm(){ document.getElementById('formView').classList.remove('hidden'); ensureResQuill(); }
    function closeForm(){
      document.getElementById('formView').classList.add('hidden');
      ['fTitle','fCategory','fLink'].forEach(id=>document.getElementById(id).value='');
      if(resQuill) resQuill.setText('');
      document.getElementById('fFile').value=''; document.getElementById('fFileName').textContent=''; document.getElementById('fMsg').textContent='';
    }

    async function loadList(){
      const wrap = document.getElementById('resList');
      const { data, error } = await sb.from('resources').select('*').order('created_at',{ascending:false});
      if(error){ wrap.innerHTML = `<p class="text-ink/40 text-sm text-center py-8">불러오기 오류: ${esc(error.message)}</p>`; return; }
      if(!data.length){ wrap.innerHTML = '<p class="text-ink/40 text-sm text-center py-10">아직 자료가 없습니다.'+(isAdmin?' 첫 자료를 올려보세요!':'')+'</p>'; return; }
      wrap.innerHTML = data.map(r => {
        const url = (r.file_url || r.link || '').trim();
        const hasBody = !!(r.description && r.description.trim());
        return `<div id="res-${r.id}" class="px-5 py-4 scroll-mt-24">
          <div class="flex items-center gap-4 ${hasBody?'cursor-pointer':''}" ${hasBody?`onclick="toggleRes('${r.id}')"`:''}>
            <div class="w-10 h-10 rounded-lg bg-gold/15 text-gold flex items-center justify-center shrink-0">📄</div>
            <div class="min-w-0 flex-1">
              ${ r.category ? `<span class="text-[11px] text-gold font-bold tracking-wide">${esc(r.category)}</span>` : '' }
              <p class="font-semibold leading-snug">${esc(r.title||'')}</p>
              <p class="text-xs text-ink/35 mt-0.5">${fmtDate(r.created_at)}${hasBody?' · 클릭하면 내용 보기':''}</p>
            </div>
            ${ hasBody ? `<svg id="rchev-${r.id}" class="w-5 h-5 text-ink/25 shrink-0 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>` : '' }
            ${ url ? `<a href="${encodeURI(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="shrink-0 bg-gold text-white text-sm font-semibold px-4 py-2 rounded-full hover:opacity-90">받기</a>`
                   : (hasBody ? '' : `<span class="shrink-0 text-ink/35 text-xs">준비 중</span>`) }
            <button onclick="event.stopPropagation();shareRes(this)" data-id="${r.id}" data-t="${esc(r.title||'').replace(/"/g,'&quot;')}" class="shrink-0 text-ink/35 hover:text-gold text-lg" title="공유하기">🔗</button>
            ${ isAdmin ? `<button onclick="event.stopPropagation();delResource('${r.id}')" class="shrink-0 text-ink/30 hover:text-red-500 text-sm">삭제</button>` : '' }
          </div>
          ${ hasBody ? `<div id="resbody-${r.id}" class="hidden resbody text-sm text-ink/70 mt-3 sm:pl-14 leading-relaxed border-t border-ink/5 pt-3">${bodyHTML(r.description)}</div>` : '' }
        </div>`;
      }).join('');
      openResFromHash();
    }

    // 🔗 자료 공유 — 해당 자료로 바로 연결되는 링크 생성
    function shareRes(el){
      const url = location.origin + location.pathname + '#res-' + el.dataset.id;
      const title = (el.dataset.t || '자료실') + ' — BIBLY 바이블 인사이트';
      if(window.biblyShare){ biblyShare(title, url); }
      else { try{ navigator.clipboard.writeText(url); alert('🔗 링크가 복사되었어요!'); }catch(e){ prompt('링크 복사', url); } }
    }
    // 공유 링크(#res-id)로 들어오면 해당 자료를 펼치고 그 위치로 이동
    function openResFromHash(){
      const m = (location.hash||'').match(/^#res-(.+)$/);
      if(!m) return;
      const card = document.getElementById('res-' + m[1]); if(!card) return;
      const body = document.getElementById('resbody-' + m[1]);
      if(body && body.classList.contains('hidden')) toggleRes(m[1]);
      card.scrollIntoView({ behavior:'smooth', block:'center' });
      card.classList.add('ring-2','ring-gold','rounded-xl');
      setTimeout(()=>card.classList.remove('ring-2','ring-gold','rounded-xl'), 2400);
    }

    async function saveResource(){
      const title = document.getElementById('fTitle').value.trim();
      const category = document.getElementById('fCategory').value.trim();
      ensureResQuill();
      const description = resQuill.getText().trim() ? sanitize(resQuill.root.innerHTML) : '';
      let link = document.getElementById('fLink').value.trim();
      const file = document.getElementById('fFile').files[0];
      const msg = document.getElementById('fMsg'); const btn = document.getElementById('saveBtn');
      if(!title){ msg.textContent='제목을 입력하세요.'; return; }
      btn.disabled = true; btn.textContent = '올리는 중…'; msg.textContent = '';
      let file_url = null;
      try {
        if(file){
          if(file.size > 20*1024*1024) throw new Error('파일은 20MB 이하만 가능해요.');
          const ext = (file.name.split('.').pop() || 'file');
          const path = `resources/${Date.now()}.${ext}`;
          const { error: upErr } = await sb.storage.from('community').upload(path, file);
          if(upErr) throw upErr;
          file_url = sb.storage.from('community').getPublicUrl(path).data.publicUrl;
        }
        const { error } = await sb.from('resources').insert({ title, category: category||null, description: description||null, file_url, link: link||null });
        if(error) throw error;
        closeForm(); loadList();
      } catch(e){ msg.textContent = '오류: ' + (e.message || e); }
      finally { btn.disabled = false; btn.textContent = '올리기'; }
    }

    function toggleRes(id){
      var b=document.getElementById('resbody-'+id), c=document.getElementById('rchev-'+id);
      if(!b) return; var closed=b.classList.toggle('hidden');
      if(c) c.style.transform = closed ? '' : 'rotate(180deg)';
    }

    async function delResource(id){
      if(!confirm('이 자료를 삭제할까요?')) return;
      const { error } = await sb.from('resources').delete().eq('id', id);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      loadList();
    }
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="/share.js"></script>
  <script src="auth-header.js?v=20260619c"></script>

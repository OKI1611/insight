    <!-- 비로그인 -->
    <div id="loginView" class="hidden">
      <div class="bg-white rounded-3xl border border-ink/8 shadow-card p-8 max-w-sm mx-auto text-center">
        <p class="text-3xl mb-3">🎓</p>
        <h2 class="text-lg font-bold mb-1">로그인하고 학습을 시작하세요</h2>
        <p class="text-sm text-ink/55 mb-6">수강신청과 학습 현황은 로그인 후 이용할 수 있어요.</p>
        <button onclick="googleLogin()" class="w-full flex items-center justify-center gap-3 border border-ink/15 bg-white rounded-xl py-3 font-medium hover:bg-ink/5 transition mb-3">
          <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C39.9 36.5 44 31 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>

        <button onclick="emailLogin()" class="w-full bg-ink text-paper font-semibold rounded-xl py-3 hover:bg-navy transition">이메일로 로그인</button>

    <!-- 로그인 -->

      <!-- 카테고리 개요 (진입 화면) -->

        <p class="text-xs font-bold text-ink/40 tracking-[0.2em] mb-3">과정 선택</p>

          <div id="catFree"></div>

      <!-- 자유 학습 상세 -->
      <div id="freeView" class="hidden">
        <button onclick="showCat('overview')" class="text-sm text-ink/50 hover:text-gold mb-3">← 과정 선택으로</button>
        <div class="flex items-center justify-between gap-2 mb-1">
          <div class="flex items-center gap-2">
            <span class="text-xl">📚</span><h2 class="font-bold text-lg">자유 학습 과정</h2>
            <span class="text-[11px] font-bold text-ink/45 bg-ink/[0.06] px-2 py-0.5 rounded-full">시험 없이 무료</span>

  <!-- 🎓 수료증 모달 -->
  <div id="certModal" style="display:none" class="fixed inset-0 z-[120] items-center justify-center bg-black/60 p-4" onclick="if(event.target===this)closeCert()">
    <div class="bg-paper rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden">
      <div id="certSheet"></div>
      <div id="certPrintActions" class="flex gap-2 p-4 bg-white border-t border-ink/8">
        <button onclick="printCert()" class="flex-1 bg-ink text-paper font-semibold py-2.5 rounded-xl hover:bg-navy transition">🖨 인쇄 · PDF 저장</button>
        <button onclick="closeCert()" class="px-5 bg-ink/5 hover:bg-ink/10 font-semibold py-2.5 rounded-xl transition">닫기</button>
      </div>
    </div>

  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit', lock: async (_n, _t, fn) => await fn() } });
    let user = null, uname = '회원', COURSE = null, PROGRAM = null;
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function ytId(u){ if(!u) return ''; const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (String(u).trim().length===11 ? String(u).trim() : ''); }

    // 저장된 세션을 직접 읽어 즉시 반영 (getSession()이 멈추는 환경 대비)
    function readStoredSession(){
      try {
        for(const k of Object.keys(localStorage)){
          if(!/auth-token/.test(k)) continue;
          const v = JSON.parse(localStorage.getItem(k));
          const s = (v && v.user) ? v : (v && v.currentSession) ? v.currentSession : null;
          if(s && s.user){ if(s.expires_at && s.expires_at * 1000 < Date.now()) return null; return s; }
        }
      } catch(e){}
      return null;
    }
    sb.auth.onAuthStateChange((_e, s) => onAuth(s));
    onAuth(readStoredSession());
    // 인증이 어떤 이유로도 안 잡히면 빈 화면 대신 로그인 화면 (폴백)
    setTimeout(() => {
      const lv = document.getElementById('loginView'), dv = document.getElementById('dashView');
      if(lv && dv && lv.classList.contains('hidden') && dv.classList.contains('hidden')) lv.classList.remove('hidden');
    }, 3000);

    function withTimeout(p, ms){ return Promise.race([ Promise.resolve(p), new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), ms)) ]); }
    function setNav(){ var n=document.getElementById('navUser'); if(n) n.innerHTML = `${esc(uname)}님 · <button onclick="logout()" class="hover:text-gold">로그아웃</button>`; }
    window.biblyHeaderLogin = function(){ var lv=document.getElementById('loginView'); if(lv){ lv.classList.remove('hidden'); lv.scrollIntoView({behavior:'smooth',block:'center'}); } };
    let authShown = false;
    async function onAuth(session){
      if(session && session.user){
        if(authShown && user && user.id === session.user.id) return; // 중복 호출 방지
        authShown = true;
        user = session.user;
        uname = user.email || '회원';
        // ① UI를 먼저 — 데이터 조회가 지연돼도 대시보드는 즉시 표시
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashView').classList.remove('hidden');
        setNav();
        loadDashboard();
        loadProgram();
        // ② 이름은 best-effort 업데이트
        try { const { data: prof } = await withTimeout(sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle(), 6000); if(prof && prof.full_name){ uname = prof.full_name; setNav(); } } catch(e){}
      } else {
        if(authShown) return; // 이미 로그인 상태면 무시(잘못된 null 이벤트 방지)
        user = null;
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('dashView').classList.add('hidden');
        { var _nu=document.getElementById('navUser'); if(_nu) _nu.innerHTML = ''; }
      }
    }
    async function googleLogin(){ await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href } }); }
    async function emailLogin(){
      const email = (document.getElementById('le').value||'').trim(), pw = document.getElementById('lp').value||'';
      const msg = document.getElementById('loginMsg');
      if(!email || !pw){ msg.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if(error) msg.textContent = error.message;
    }
    async function logout(){ await sb.auth.signOut(); }

    // 카테고리 개요 ↔ 상세 전환
    function showCat(w){
      ['catView','freeView','certView'].forEach(id => { var el = document.getElementById(id); if(el) el.classList.add('hidden'); });
      var target = w === 'free' ? 'freeView' : w === 'cert' ? 'certView' : 'catView';
      var el = document.getElementById(target); if(el) el.classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    async function loadDashboard(){
      const tracksEl = document.getElementById('tracks');
      const sumEl = document.getElementById('summary');
      tracksEl.innerHTML = '<p class="text-ink/40 text-sm text-center py-8">불러오는 중…</p>';
      if(!COURSE){ try { COURSE = await (await fetch('content/course.json?t=' + Date.now())).json(); } catch(e){ tracksEl.innerHTML = '<p class="text-red-500 text-sm text-center py-8">강의 정보를 불러오지 못했습니다.</p>'; return; } }
      const levels = COURSE.levels || [];
      let acc = 0; const starts = []; levels.forEach(lv => { starts.push(acc); acc += (lv.lessons||[]).length; });

      let enrolled = [], done = new Set(), loadErr = false, timedOut = false;
      try { const { data, error } = await withTimeout(sb.from('enrollments').select('track').eq('user_id', user.id), 9000); if(error) throw error; enrolled = (data||[]).map(e => e.track); }
      catch(e){ if(e.message === 'TIMEOUT') timedOut = true; else loadErr = true; }
      try { const { data } = await withTimeout(sb.from('lesson_progress').select('lesson_id').eq('user_id', user.id).eq('completed', true), 9000); (data||[]).forEach(p => done.add(p.lesson_id)); } catch(e){}

      const cfErr = (msg) => { const cf = document.getElementById('catFree'); if(cf) cf.innerHTML = `<div class="bg-white rounded-3xl border border-ink/8 shadow-soft p-6 text-sm text-ink/55">📚 ${msg}</div>`; };
      if(timedOut){
        tracksEl.innerHTML = '<div class="bg-white rounded-2xl border border-ink/8 p-6 text-center text-ink/60 text-sm">⏳ 학습 정보를 불러오지 못했어요. 이 사이트의 다른 탭을 모두 닫고 <button onclick="location.reload()" class="text-gold font-semibold underline">새로고침</button> 해주세요.</div>';
        sumEl.innerHTML = ''; cfErr('자유 학습 정보를 불러오지 못했어요. <button onclick="location.reload()" class="text-gold font-semibold underline">새로고침</button>'); return;
      }
      if(loadErr){
        tracksEl.innerHTML = '<div class="bg-white rounded-2xl border border-ink/8 p-6 text-center text-ink/55 text-sm">학습 기능을 준비 중입니다. (관리자: Supabase 테이블 생성 필요)</div>';
        sumEl.innerHTML = ''; cfErr('학습 기능을 준비 중입니다.'); return;
      }

      const welEl = document.getElementById('welcome');
      const mine = levels.map((lv, ti) => ({ lv, ti })).filter(x => enrolled.includes(x.lv.name));

      // ── 트랙별 통계 계산 ──
      const stats = mine.map(({ lv, ti }) => {
        const ls = lv.lessons || [];
        const doneCnt = ls.filter(l => done.has(ytId(l.youtube))).length;
        const pct = ls.length ? Math.round(doneCnt / ls.length * 100) : 0;
        const fi = ls.findIndex(l => !done.has(ytId(l.youtube)));
        return { lv, ti, ls, doneCnt, pct, finished: (pct === 100 && ls.length > 0),
                 nextIdx: starts[ti] + (fi < 0 ? 0 : fi), nextTitle: fi < 0 ? null : (ls[fi] && ls[fi].title) };
      });
      let totalLessons = 0, totalDone = 0, completedCnt = 0;
      stats.forEach(s => { totalLessons += s.ls.length; totalDone += s.doneCnt; if(s.finished) completedCnt++; });
      const overallPct = totalLessons ? Math.round(totalDone / totalLessons * 100) : 0;
      window.__certNames = stats.map(s => s.lv.name);

      // ── 환영 · 이어서 학습 히어로 ──
      const resume = stats.find(s => !s.finished && s.nextTitle);
      if(!mine.length){
        welEl.innerHTML = '';
      } else if(resume){
        welEl.innerHTML = `<div class="bg-ink text-paper rounded-3xl p-6 md:p-7">
          <p class="text-gold text-xs font-bold tracking-wide mb-3">${esc(uname)}님, 오늘도 환영합니다 👋</p>
          <p class="text-paper/50 text-xs mb-1">이어서 학습할 강의</p>
          <p class="font-bold text-lg leading-snug">${esc(resume.lv.name)}</p>
          <p class="text-paper/75 text-sm mt-1 mb-5 truncate">▸ ${esc(resume.nextTitle)}</p>
          <a href="watch.html?l=${resume.nextIdx}" class="inline-flex items-center gap-2 bg-gold text-white font-bold px-7 py-3 rounded-full hover:opacity-90 transition">▶ 이어서 학습하기</a>
        </div>`;
      } else {
        welEl.innerHTML = `<div class="bg-ink text-paper rounded-3xl p-7 text-center">
          <p class="text-4xl mb-2">🎉</p>
          <p class="font-bold text-lg">${esc(uname)}님, 수강 중인 모든 과정을 완주하셨어요!</p>
          <p class="text-paper/60 text-sm mt-1.5">각 과정의 <b class="text-gold">수료증</b>을 받아 학습을 기념해 보세요.</p>
        </div>`;
      }

      // ── 요약 카드 (3) ──
      const card = (val, label) => `<div class="bg-white rounded-2xl border border-ink/8 p-4 text-center"><p class="text-2xl font-bold text-gold">${val}</p><p class="text-xs text-ink/55 mt-1">${label}</p></div>`;
      sumEl.innerHTML =
        card(mine.length, '수강 과정') +
        card(`${totalDone}<span class="text-base text-ink/40">/${totalLessons}</span>`, '완료 강의') +
        card(`${overallPct}%`, '전체 진도율');

      // ── 개요: 자유 학습 카드 ──
      const catFree = document.getElementById('catFree');
      if(catFree){
        catFree.innerHTML = `<button onclick="showCat('free')" class="w-full h-full text-left bg-white rounded-3xl border border-ink/8 shadow-soft p-6 hover:shadow-card hover:border-gold/30 transition flex flex-col">
          <div class="flex items-center gap-2 mb-2"><span class="text-2xl">📚</span><h3 class="font-bold text-lg">자유 학습 과정</h3></div>
          <p class="text-sm text-ink/50 mb-4">시험 없이 자유롭게 듣는 무료 과정</p>
          ${ mine.length ? `<div class="flex items-end gap-5 mb-3">
              <div><p class="text-2xl font-bold text-gold leading-none">${overallPct}%</p><p class="text-[11px] text-ink/45 mt-1">전체 진도</p></div>
              <div><p class="text-2xl font-bold text-ink/80 leading-none">${mine.length}</p><p class="text-[11px] text-ink/45 mt-1">수강 과정</p></div>
              <div><p class="text-2xl font-bold text-ink/80 leading-none">${totalDone}<span class="text-sm text-ink/40">/${totalLessons}</span></p><p class="text-[11px] text-ink/45 mt-1">완료 강의</p></div>
            </div>
            <div class="h-1.5 rounded-full bg-ink/8 overflow-hidden mb-3"><div class="h-full bg-gold rounded-full" style="width:${overallPct}%"></div></div>`
          : `<p class="text-sm text-ink/55 mb-4 flex-1">아직 수강 중인 과정이 없어요.</p>` }
          <p class="text-sm font-semibold text-gold mt-auto">${ mine.length ? '상세 보기' : '강의 둘러보기' } →</p>
        </button>`;
      }

      if(!mine.length){
        tracksEl.innerHTML = `<div class="bg-white rounded-2xl border border-ink/8 p-8 text-center">
          <p class="text-3xl mb-3">📚</p>
          <p class="font-semibold mb-1">아직 수강신청한 강의가 없어요</p>
          <p class="text-sm text-ink/55 mb-5">강의실에서 마음에 드는 과정을 수강신청해 보세요.</p>
          <a href="index.html#catalog" class="inline-block bg-ink text-paper font-semibold px-6 py-3 rounded-full hover:bg-navy transition">강의 둘러보기 →</a>
        </div>`;
        return;
      }

      tracksEl.innerHTML = stats.map((s, idx) => {
        const { lv, ti, ls, doneCnt, pct } = s;
        const open = (idx === 0 && !s.finished);   // 첫 미완료 과정만 펼침
        const rows = ls.map((l, li) => {
          const gi = starts[ti] + li; const ok = done.has(ytId(l.youtube));
          return `<a href="watch.html?l=${gi}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-ink/[0.04] transition">
            <span class="shrink-0 text-lg">${ ok ? '✅' : '⬜' }</span>
            <span class="shrink-0 text-xs font-bold text-ink/30 w-6 text-center">${String(li+1).padStart(2,'0')}</span>
            <span class="flex-1 text-sm ${ ok ? 'text-ink/45 line-through' : 'text-ink/80' } truncate">${esc(l.title)}</span>
            <span class="shrink-0 text-xs text-ink/35">${ esc(l.duration||'') }</span>
          </a>`;
        }).join('');
        const badge = s.finished
          ? '<span class="shrink-0 bg-gold/15 text-gold text-[11px] font-bold px-2.5 py-1 rounded-full">🎓 수료</span>'
          : `<span class="text-sm font-semibold text-gold shrink-0">${pct}%</span>`;
        const bottom = s.finished
          ? `<div class="flex gap-2 mt-1.5 mb-1 mx-1">
               <button onclick="showCert(${idx})" class="flex-1 bg-gold text-white text-sm font-bold py-2.5 rounded-xl hover:opacity-90 transition">🎓 수료증 보기</button>
               <a href="watch.html?l=${starts[ti]}" class="px-4 flex items-center bg-ink text-paper text-sm font-semibold rounded-xl hover:bg-navy transition">다시보기</a>
             </div>`
          : `<a href="watch.html?l=${s.nextIdx}" class="block text-center mt-1.5 mb-1 mx-1 bg-ink text-paper text-sm font-semibold py-2.5 rounded-xl hover:bg-navy transition">${ doneCnt === 0 ? '▶ 학습 시작하기' : '▶ 이어보기' }</a>`;
        return `<div class="bg-white rounded-2xl border ${ s.finished ? 'border-gold/40' : 'border-ink/8' } shadow-soft overflow-hidden">
          <div onclick="toggleFolder(${ti})" class="px-5 pt-5 pb-4 cursor-pointer hover:bg-ink/[0.015] transition select-none">
            <div class="flex items-center gap-3 mb-3">
              <span id="ficon-${ti}" class="text-2xl shrink-0">${ s.finished ? '🎓' : (open ? '📂' : '📁') }</span>
              <div class="flex-1 min-w-0">
                <h3 class="font-bold leading-snug truncate">${esc(lv.name)}</h3>
                <p class="text-xs text-ink/45 mt-0.5">총 ${ls.length}강 · 클릭하면 강의 목록이 ${ open ? '닫혀요' : '열려요' }</p>
              </div>
              ${badge}
              <svg id="fchev-${ti}" class="w-5 h-5 text-ink/30 shrink-0 transition-transform" style="${ open ? 'transform:rotate(180deg)' : '' }" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <div class="h-2 rounded-full bg-ink/8 overflow-hidden"><div class="h-full bg-gold rounded-full" style="width:${pct}%"></div></div>
            <p class="text-xs text-ink/55 mt-2">${doneCnt}/${ls.length}강 완료</p>
          </div>
          <div id="folder-${ti}" class="${ open ? '' : 'hidden' } border-t border-ink/8 p-2">
            ${rows}
            ${bottom}
          </div>
        </div>`;
      }).join('');
    }
    // ── BIBLY 아카데미 인증 과정 · 학점 ──
    function won(n){ return '₩' + (Number(n)||0).toLocaleString(); }
    function packagesHTML(){
      const cards = (PROGRAM.ranks||[]).map(rk => {
        const main = rk.earlybird || rk.price || 0;
        const perks = (rk.perks||[]).map(p=>`<li class="flex gap-1.5"><span class="text-gold shrink-0">✓</span><span>${esc(p)}</span></li>`).join('');
        const rec = rk.tier === 1;
        return `<div class="bg-white rounded-2xl border ${rec?'border-gold/50 shadow-soft':'border-ink/10'} p-5 flex flex-col">
          <div class="flex items-center gap-2 mb-1">
            <span class="bg-ink text-paper text-xs font-bold px-2 py-0.5 rounded-full">${esc(rk.rank)}</span>
            <h4 class="font-bold text-lg">${esc(rk.name)}</h4>
            ${rec?'<span class="ml-auto text-[10px] font-bold text-gold bg-gold/12 px-2 py-0.5 rounded-full">입문 추천</span>':''}
          </div>
          <p class="text-xs text-ink/50 mb-3">${esc(rk.tagline||'')}</p>
          <p class="mb-3"><span class="text-2xl font-bold">${won(main)}</span>${rk.earlybird?` <span class="text-sm text-ink/40 line-through">${won(rk.price)}</span> <span class="text-[11px] font-bold text-rose-500">얼리버드</span>`:''}</p>
          <ul class="text-xs text-ink/65 space-y-1.5 mb-4 flex-1">${perks}</ul>
          <a href="academy.html" class="block text-center bg-ink text-paper text-sm font-semibold py-2.5 rounded-xl hover:bg-navy transition">등록 신청 →</a>
        </div>`;
      }).join('');
      return `<p class="text-sm text-ink/60 mb-4 leading-relaxed">아래 패키지를 등록하면 인증 과정이 열립니다. <b class="text-ink/80">계좌이체로 수강료를 입금</b>하시고 등록 신청하시면, 확인 후 수강권을 열어드려요.</p>
        <div class="grid sm:grid-cols-3 gap-3 mb-3">${cards}</div>
        <p class="text-xs text-ink/40">상위 등급은 하위 과정을 모두 포함합니다 · 결제·등록 문의는 ‘등록 신청’에서.</p>`;
    }
    async function loadProgram(){
      const host = document.getElementById('program');
      const catCert = document.getElementById('catCert');
      if(!host) return;
      try {
        if(!PROGRAM) PROGRAM = await (await fetch('content/program.json?t=' + Date.now())).json();
        if(!COURSE)  COURSE  = await (await fetch('content/course.json?t=' + Date.now())).json();
      } catch(e){ if(catCert) catCert.innerHTML = ''; host.innerHTML = ''; return; }

      let exById = {}, examReady = true, userTier = 0;
      try {
        const { data, error } = await withTimeout(sb.from('exam_results').select('lesson_id, final_score, passed').eq('user_id', user.id), 9000);
        if(error) throw error; (data||[]).forEach(r => { exById[r.lesson_id] = r; });
      } catch(e){ examReady = false; }
      try { const { data } = await withTimeout(sb.from('cert_access').select('tier').eq('user_id', user.id).maybeSingle(), 8000); if(data && data.tier) userTier = Number(data.tier)||0; } catch(e){}

      const brand = PROGRAM.brand || PROGRAM.title || '인증 과정';
      const levels = COURSE.levels || [];
      const byName = {}, startOf = {};
      let acc = 0; levels.forEach(lv => { byName[lv.name] = lv.lessons || []; startOf[lv.name] = acc; acc += (lv.lessons||[]).length; });
      const ex = PROGRAM.exam || {};
      const letterOf = (s) => { for(const g of (PROGRAM.gradeScale||[])) if(s >= g.min) return g.grade; return '미수료'; };

      // 접근 가능한 과목 기준 진행 요약
      let progPassed = 0, progTotal = 0, finishedCourses = 0;
      (PROGRAM.ranks||[]).forEach(rk => {
        if(userTier < (rk.tier||99)) return;
        (rk.tracks||[]).filter(t=>byName[t]).forEach(tname => {
          const ls = byName[tname]||[]; let p = 0;
          ls.forEach(l=>{ const r=exById[ytId(l.youtube)]; if(r&&r.passed) p++; });
          progPassed += p; progTotal += ls.length; if(p===ls.length && ls.length>0) finishedCourses++;
        });
      });
      const progPct = progTotal ? Math.round(progPassed/progTotal*100) : 0;

      // ── 개요 카드 (인증) ──
      if(catCert){
        if(userTier > 0){
          catCert.innerHTML = `<button onclick="showCat('cert')" class="w-full h-full text-left bg-ink text-paper rounded-3xl border border-gold/40 shadow-soft p-6 hover:shadow-card transition flex flex-col">
            <div class="flex items-center gap-2 mb-2"><span class="text-2xl">🎓</span><h3 class="font-bold text-lg">${esc(brand)}</h3><span class="ml-auto text-[10px] font-bold text-ink bg-gold px-2 py-0.5 rounded-full">인증</span></div>
            <p class="text-sm text-paper/60 mb-4">시험으로 검증하고 학점을 쌓는 과정</p>
            <div class="flex items-end gap-5 mb-3">
              <div><p class="text-2xl font-bold text-gold leading-none">${progPct}%</p><p class="text-[11px] text-paper/45 mt-1">시험 통과율</p></div>
              <div><p class="text-2xl font-bold leading-none">${finishedCourses}</p><p class="text-[11px] text-paper/45 mt-1">수료 과목</p></div>
            </div>
            <div class="h-1.5 rounded-full bg-white/15 overflow-hidden mb-3"><div class="h-full bg-gold rounded-full" style="width:${progPct}%"></div></div>
            <p class="text-sm font-semibold text-gold mt-auto">상세 보기 →</p>
          </button>`;
        } else {
          const fromP = (PROGRAM.ranks && PROGRAM.ranks[0] && (PROGRAM.ranks[0].earlybird||PROGRAM.ranks[0].price)) || 0;
          catCert.innerHTML = `<button onclick="showCat('cert')" class="w-full h-full text-left bg-ink text-paper rounded-3xl border border-gold/40 shadow-soft p-6 hover:shadow-card transition flex flex-col">
            <div class="flex items-center gap-2 mb-2"><span class="text-2xl">🎓</span><h3 class="font-bold text-lg">${esc(brand)}</h3><span class="ml-auto text-[10px] font-bold text-paper bg-white/15 px-2 py-0.5 rounded-full">🔒 유료</span></div>
            <p class="text-sm text-paper/60 mb-4 flex-1">시험·요약노트·수료증·학점으로 분별력을 공인받는 인증 과정이에요.</p>
            <p class="text-xs text-paper/50 mb-1">3급 입문 «여명»부터</p>
            <p class="mb-3"><span class="text-2xl font-bold text-gold">${won(fromP)}</span><span class="text-xs text-paper/45"> 부터</span></p>
            <p class="text-sm font-semibold text-gold mt-auto">패키지 보기 · 등록 →</p>
          </button>`;
        }
      }

      // ── 상세 (program) ──
      let inner;
      if(userTier > 0){
        const ranksHtml = (PROGRAM.ranks||[]).map(rk => {
          const unlocked = userTier >= (rk.tier||99);
          const header = `<div class="flex items-baseline gap-2 mb-2.5">
              <span class="bg-ink text-paper text-xs font-bold px-2.5 py-1 rounded-full">${esc(rk.rank)}</span>
              <span class="font-bold">${esc(rk.name)}</span>
              <span class="text-xs text-ink/45">${esc(rk.tagline||'')}</span>
              ${unlocked ? '' : '<span class="ml-auto text-[11px] font-bold text-ink/45 bg-ink/[0.06] px-2 py-0.5 rounded-full">🔒 상위 패키지</span>'}
            </div>`;
          if(!unlocked){
            return `<div class="mb-5">${header}<p class="text-xs text-ink/40 bg-white/60 rounded-xl border border-ink/8 px-4 py-3">«${esc(rk.name)}» 패키지를 등록하면 열려요. <a href="academy.html" class="text-gold font-semibold">패키지 보기 →</a></p></div>`;
          }
          const tracks = (rk.tracks||[]).filter(t => byName[t]);
          const trackCards = tracks.map(tname => {
            const ls = byName[tname] || [];
            let passed = 0, sum = 0;
            ls.forEach(l => { const r = exById[ytId(l.youtube)]; if(r && r.passed){ passed++; sum += Number(r.final_score)||0; } });
            const total = ls.length, pct = total ? Math.round(passed/total*100) : 0;
            const dn = (passed === total && total > 0), avg = passed ? Math.round(sum/passed) : 0;
            return `<div class="bg-white rounded-2xl border ${dn?'border-gold/45':'border-ink/8'} shadow-soft p-5">
              <div class="flex items-center gap-3 mb-2">
                <div class="flex-1 min-w-0"><h4 class="font-bold truncate">${esc(tname)}</h4>
                  <p class="text-xs text-ink/45 mt-0.5">시험 ${passed}/${total}강 통과</p></div>
                ${dn ? `<span class="shrink-0 bg-gold/15 text-gold text-sm font-bold px-3 py-1 rounded-full">학점 ${letterOf(avg)}</span>`
                     : `<span class="shrink-0 text-sm font-semibold text-gold">${pct}%</span>`}
              </div>
              <div class="h-2 rounded-full bg-ink/8 overflow-hidden"><div class="h-full bg-gold rounded-full" style="width:${pct}%"></div></div>
              ${dn ? `<p class="text-xs text-ink/60 mt-2.5">🎓 과목 수료 · 평균 ${avg}점 (학점 ${letterOf(avg)})</p>`
                   : `<a href="watch.html?l=${startOf[tname]||0}" class="inline-block text-xs text-gold font-semibold mt-2.5 hover:underline">시험 보러 가기 →</a>`}
            </div>`;
          }).join('');
          const body = tracks.length ? `<div class="space-y-3">${trackCards}</div>`
            : `<p class="text-xs text-ink/40 bg-white/60 rounded-xl border border-ink/8 px-4 py-3">과목 준비 중입니다.</p>`;
          return `<div class="mb-5">${header}${body}</div>`;
        }).join('');
        const examNote = examReady ? `<p class="text-xs text-ink/45 mt-1">통과 기준 ${ex.passScore||80}점 · 강의별 시험(${ex.perLesson||20}문제) 평균이 과목 학점이 됩니다.</p>`
          : `<p class="text-xs text-amber-600 mt-1">⚠️ 시험 기능을 준비 중입니다. (관리자: exam_results 테이블 생성 필요)</p>`;
        inner = `${ranksHtml}${examNote}`;
      } else {
        inner = packagesHTML();
      }

      host.innerHTML = `
        <div class="rounded-3xl border border-gold/35 bg-gold/[0.05] overflow-hidden shadow-soft">
          <div class="bg-ink text-paper px-5 md:px-6 py-4">
            <div class="flex items-center gap-2">
              <span class="text-xl">🎓</span>
              <h2 class="font-bold text-lg">${esc(brand)}</h2>
              <span class="ml-auto shrink-0 text-[11px] font-bold text-ink bg-gold px-2.5 py-1 rounded-full">인증 과정</span>
            </div>
            <p class="text-sm text-paper/70 mt-2 leading-relaxed">${esc(PROGRAM.intro||'')}</p>
          </div>
          <div class="p-4 md:p-6">${inner}</div>
        </div>`;
    }

    function toggleFolder(ti){
      const body = document.getElementById('folder-' + ti);
      const icon = document.getElementById('ficon-' + ti);
      const chev = document.getElementById('fchev-' + ti);
      if(!body) return;
      const closed = body.classList.toggle('hidden');
      if(icon) icon.textContent = closed ? '📁' : '📂';
      if(chev) chev.style.transform = closed ? '' : 'rotate(180deg)';
    }

    // ── 🎓 수료증 ──
    function showCert(idx){
      const name = (window.__certNames || [])[idx] || '';
      const t = new Date();
      const dateStr = `${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일`;
      const certNo = `BIBLY-${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}-${String(idx+1).padStart(2,'0')}`;
      document.getElementById('certSheet').innerHTML = `
        <div class="bg-ink text-paper px-7 py-8">
          <div class="border-2 border-gold/40 rounded-2xl px-6 py-9 text-center">
            <p class="text-gold tracking-[0.34em] text-[11px] font-bold mb-1">CERTIFICATE OF COMPLETION</p>
            <p class="text-paper/45 text-xs tracking-[0.3em] mb-7">수　료　증</p>
            <p class="text-paper/50 text-xs mb-1">학습자</p>
            <p class="text-2xl font-bold mb-6" style="font-family:'Noto Serif KR',serif">${esc(uname)}</p>
            <p class="text-paper/65 text-[13px] leading-relaxed mb-7">위 학습자는 BIBLY 바이블 인사이트의 아래 과정을<br/>성실히 이수하였기에 이 증서를 드립니다.</p>
            <p class="text-paper/45 text-xs mb-1">이수 과정</p>
            <p class="text-gold font-bold text-lg leading-snug mb-7 px-2">${esc(name)}</p>
            <p class="text-paper/45 text-xs">${dateStr}</p>
            <div class="mt-7 pt-5 border-t border-white/10">
              <p class="font-bold tracking-tight">BIBLY<span class="text-gold">.</span> 바이블 인사이트</p>
              <p class="text-paper/45 text-xs mt-0.5">대표강사　오광일</p>
              <p class="text-paper/25 text-[10px] mt-3">증서번호 ${certNo}</p>
            </div>
          </div>
        </div>`;
      const m = document.getElementById('certModal');
      m.style.display = 'flex';
    }
    function closeCert(){ document.getElementById('certModal').style.display = 'none'; }
    function printCert(){ window.print(); }
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
  <script src="auth-header.js"></script>
</body>
</html>

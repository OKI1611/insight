<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <main class="max-w-2xl mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">COMMUNITY</p>
      <h1 class="text-2xl font-bold">멤버 커뮤니티</h1>
      <p class="text-ink/55 text-sm mt-2">함께 공부하는 멤버들과 나누는 공간입니다.</p>
    </div>

    <!-- 로그인 안내 (비로그인 시) -->
    <div id="loginView" class="hidden">
      <div class="bg-white rounded-3xl border border-ink/8 shadow-card p-8 max-w-sm mx-auto text-center">
        <p class="text-3xl mb-3">🔒</p>
        <h2 class="text-lg font-bold mb-1">멤버 전용 공간이에요</h2>
        <p class="text-sm text-ink/55 mb-6">로그인하면 글과 사진을 나눌 수 있어요.</p>
        <button onclick="googleLogin()" class="w-full flex items-center justify-center gap-3 border border-ink/15 bg-white rounded-xl py-3 font-medium hover:bg-ink/5 transition mb-3">
          <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C39.9 36.5 44 31 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
          구글로 로그인
        </button>
        <input id="le" type="email" placeholder="이메일" class="w-full border border-ink/15 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-gold mb-2"/>
        <input id="lp" type="password" placeholder="비밀번호" class="w-full border border-ink/15 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-gold mb-2"/>
        <button onclick="emailLogin()" class="w-full bg-ink text-paper font-semibold rounded-xl py-3 hover:bg-navy transition">이메일로 로그인</button>
        <p id="loginMsg" class="text-red-500 text-xs mt-2 min-h-[16px]"></p>
        <p class="text-ink/45 text-xs mt-3">아직 회원이 아니신가요? <a href="index.html#pricing" class="text-gold underline">홈에서 가입</a></p>
      </div>
    </div>

    <!-- 게시판 (로그인 시) -->
    <div id="boardView" class="hidden">
      <!-- 탭: 자유 나눔 / Q&A 질문답변 -->
      <div class="flex gap-2 mb-5">
        <button id="tab-free" onclick="switchBoard('free')" class="flex-1 py-2.5 rounded-full text-sm font-semibold border transition">📷 자유 나눔</button>
        <button id="tab-qna" onclick="switchBoard('qna')" class="flex-1 py-2.5 rounded-full text-sm font-semibold border transition">🙋 질의응답</button>
        <button id="tab-prayer" onclick="switchBoard('prayer')" class="flex-1 py-2.5 rounded-full text-sm font-semibold border transition">🙏 기도 요청</button>
      </div>
      <!-- 글쓰기 (네이버 블로그식 에디터) -->
      <div class="bg-white rounded-2xl border border-ink/8 shadow-soft p-4 mb-6">
        <div id="postEditor"></div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-ink/8">
          <span class="text-xs text-ink/40">✍️ 글씨·색·사진·링크를 자유롭게 — 툴바를 활용하세요</span>
          <button id="postBtn" onclick="submitPost()" class="bg-gold text-white font-semibold text-sm px-5 py-2.5 rounded-full hover:opacity-90 transition shrink-0">글 올리기</button>
        </div>
        <p id="postMsg" class="text-red-500 text-xs mt-2 min-h-[14px]"></p>
      </div>

      <!-- 피드 -->
      <div id="feed" class="space-y-4"></div>
    </div>
  </main>

  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { lock: async (_n, _t, fn) => await fn() } });
    const ADMIN_EMAIL = 'josephoh1611@gmail.com';   // 관리자: 모든 글 삭제 가능
    let currentUser = null, currentName = '회원', isAdmin = false, currentBoard = 'free';

    // 강의실에서 '강사에게 질문하기'로 넘어온 경우: Q&A 탭 + 질문 프리필
    const _qp = new URLSearchParams(location.search);
    if(['qna','prayer','free'].includes(_qp.get('board'))) currentBoard = _qp.get('board');
    const ASK_REF = _qp.get('ask');
    let askApplied = false;

    // 네이버 블로그식 에디터 (Quill)
    let commQuill = null;
    function sanitize(html){
      const d = document.createElement('div'); d.innerHTML = html || '';
      d.querySelectorAll('script,style,iframe,object,embed').forEach(n => n.remove());
      d.querySelectorAll('*').forEach(el => { [...el.attributes].forEach(a => { if(/^on/i.test(a.name) || (a.name==='href' && /^javascript:/i.test(a.value))) el.removeAttribute(a.name); }); });
      return d.innerHTML;
    }
    function ensureCommQuill(){
      if(commQuill) return commQuill;
      commQuill = new Quill('#postEditor', {
        theme: 'snow',
        placeholder: '오늘의 나눔, 은혜, 사진을 자유롭게 나눠보세요…',
        modules: { toolbar: [
          [{ header:[1,2,3,false] }],
          ['bold','italic','underline','strike'],
          [{ color:[] }, { background:[] }],
          [{ list:'ordered' }, { list:'bullet' }],
          ['blockquote'],
          ['link','image'],
          ['clean']
        ] }
      });
      commQuill.getModule('toolbar').addHandler('image', () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = async () => {
          const file = input.files[0]; if(!file) return;
          if(!currentUser){ alert('로그인이 필요해요.'); return; }
          if(file.size > 5*1024*1024){ alert('이미지는 5MB 이하만 가능해요.'); return; }
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const path = `${currentUser.id}/${Date.now()}.${ext}`;
          const { error } = await sb.storage.from('community').upload(path, file);
          if(error){ alert('이미지 업로드 오류: ' + error.message); return; }
          const url = sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          const range = commQuill.getSelection(true);
          commQuill.insertEmbed(range.index, 'image', url);
          commQuill.setSelection(range.index + 1);
        };
        input.click();
      });
      return commQuill;
    }

    // 탭 전환 (자유 나눔 / Q&A 질문답변 / 기도 요청)
    function boardLabel(b){ return b === 'qna' ? '질문 올리기' : b === 'prayer' ? '기도 요청하기' : '글 올리기'; }
    function switchBoard(b){
      currentBoard = b;
      const on = 'bg-ink text-paper border-ink', off = 'bg-white text-ink/55 border-ink/15 hover:bg-ink/5';
      const base = 'flex-1 py-2.5 rounded-full text-sm font-semibold border transition ';
      ['free','qna','prayer'].forEach(x => { const el = document.getElementById('tab-' + x); if(el) el.className = base + (b === x ? on : off); });
      const ph = b === 'qna' ? '강의 내용이든 신앙 고민이든, 무엇이든 자유롭게 질문해 보세요. 강사와 멤버가 댓글로 답해드려요…'
               : b === 'prayer' ? '함께 기도할 제목을 나눠 주세요. 멤버들이 함께 기도하고, 댓글로 마음을 더해드려요…'
               : '오늘의 나눔, 은혜, 사진을 자유롭게 나눠보세요…';
      if(commQuill) commQuill.root.setAttribute('data-placeholder', ph);
      document.getElementById('postBtn').textContent = boardLabel(b);
      loadPosts();
    }

    sb.auth.onAuthStateChange((_e, session) => setAuthUI(session));
    sb.auth.getSession().then(({ data:{ session } }) => setAuthUI(session));

    async function setAuthUI(session){
      if (session && session.user){
        currentUser = session.user;
        const { data: prof } = await sb.from('profiles').select('full_name').eq('id', currentUser.id).maybeSingle();
        currentName = (prof && prof.full_name) || currentUser.email || '회원';
        isAdmin = (currentUser.email === ADMIN_EMAIL);
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('boardView').classList.remove('hidden');
        document.getElementById('navUser').innerHTML =
          `${esc(currentName)}님${isAdmin ? ' <span class="text-gold font-semibold">· 관리자</span>' : ''} · <button onclick="logout()" class="hover:text-gold">로그아웃</button>`;
        ensureCommQuill();
        switchBoard(currentBoard);
        // 강의실에서 넘어온 질문 프리필 (한 번만)
        if(ASK_REF && !askApplied){
          askApplied = true;
          commQuill.setText(`[강의 질문] ${decodeURIComponent(ASK_REF)}\n\n질문: `);
          setTimeout(() => { document.getElementById('postEditor').scrollIntoView({ behavior:'smooth', block:'center' }); commQuill.focus(); }, 350);
        }
      } else {
        currentUser = null; isAdmin = false;
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('boardView').classList.add('hidden');
        document.getElementById('navUser').innerHTML = '';
      }
    }

    async function googleLogin(){ await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href } }); }
    async function emailLogin(){
      const email = (document.getElementById('le').value||'').trim();
      const pw = document.getElementById('lp').value||'';
      const msg = document.getElementById('loginMsg');
      if(!email || !pw){ msg.textContent='이메일과 비밀번호를 입력하세요.'; return; }
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if(error) msg.textContent = error.message;
    }
    async function logout(){ await sb.auth.signOut(); }

    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function timeAgo(iso){
      const diff = Date.now() - new Date(iso).getTime();
      const m = Math.floor(diff/60000); if(m<1) return '방금'; if(m<60) return m+'분 전';
      const h = Math.floor(m/60); if(h<24) return h+'시간 전';
      const d = Math.floor(h/24); if(d<7) return d+'일 전';
      return new Date(iso).toLocaleDateString('ko-KR');
    }

    function renderPost(p){
      const mine = currentUser && p.author_id === currentUser.id;
      const canDel = mine || isAdmin;
      const delLabel = mine ? '삭제' : '🛡 관리자 삭제';
      return `<article id="post-${p.id}" class="bg-white rounded-2xl border border-ink/8 p-5 shadow-soft scroll-mt-20">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full bg-gold/20 text-gold flex items-center justify-center font-bold">${esc((p.author_name||'?').slice(0,1))}</div>
            <div><p class="font-semibold text-sm">${esc(p.author_name||'회원')}</p><p class="text-ink/40 text-xs">${timeAgo(p.created_at)}</p></div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button onclick="shareCommunityPost('${p.id}')" class="text-ink/40 hover:text-gold text-xs font-medium" title="이 글 공유하기">🔗 공유</button>
            ${canDel ? `<button onclick="del('${p.id}', ${mine ? 0 : 1})" class="text-ink/30 hover:text-red-500 text-xs">${delLabel}</button>` : ''}
          </div>
        </div>
        <div class="post-body text-ink/80 leading-relaxed text-[15px]">${ /<[a-z][\s\S]*>/i.test(p.content||'') ? sanitize(p.content) : esc(p.content).replace(/\n/g,'<br>') }</div>
        ${p.image_url ? `<img src="${p.image_url}" class="mt-3 rounded-xl max-h-96 w-auto border border-ink/5" loading="lazy">` : ''}
        <div class="mt-4 pt-4 border-t border-ink/5">
          <div id="comments-${p.id}" class="space-y-2.5 mb-3"></div>
          <div class="flex gap-2">
            <input id="ci-${p.id}" onkeydown="if(event.key==='Enter')addComment('${p.id}')" placeholder="댓글로 답변·토론하기…"
                   class="flex-1 border border-ink/12 rounded-full px-4 py-2 text-sm outline-none focus:border-gold"/>
            <button onclick="addComment('${p.id}')" class="bg-ink text-paper text-sm font-semibold px-4 py-2 rounded-full hover:bg-navy transition shrink-0">등록</button>
          </div>
        </div>
      </article>`;
    }

    function renderComments(postId, comments){
      const box = document.getElementById('comments-' + postId);
      if(!box) return;
      if(!comments.length){ box.innerHTML = '<p class="text-ink/35 text-xs">첫 댓글을 남겨보세요.</p>'; return; }
      box.innerHTML = comments.map(c => {
        const mine = currentUser && c.author_id === currentUser.id;
        const canDel = mine || isAdmin;
        const adminBadge = c.is_admin ? ' <span class="text-[10px] bg-gold/15 text-gold px-1.5 py-0.5 rounded align-middle">관리자</span>' : '';
        return `<div class="flex items-start gap-2 text-sm">
          <span class="font-semibold ${c.is_admin ? 'text-gold' : ''} shrink-0">${esc(c.author_name || '회원')}${adminBadge}</span>
          <span class="text-ink/75 flex-1 break-words">${esc(c.content)}</span>
          <span class="text-ink/30 text-xs shrink-0">${timeAgo(c.created_at)}</span>
          ${canDel ? `<button onclick="delComment('${c.id}')" class="text-ink/30 hover:text-red-500 text-xs shrink-0" title="삭제">×</button>` : ''}
        </div>`;
      }).join('');
    }

    async function addComment(postId){
      if(!currentUser){ alert('로그인이 필요해요.'); return; }
      const input = document.getElementById('ci-' + postId);
      const content = (input.value || '').trim();
      if(!content) return;
      input.disabled = true;
      const { error } = await sb.from('community_comments').insert({ post_id: postId, author_id: currentUser.id, author_name: currentName, content });
      input.disabled = false;
      if(error){ alert('댓글 오류: ' + error.message); return; }
      input.value = '';
      loadPosts();
    }

    async function delComment(id){
      if(!confirm('댓글을 삭제할까요?')) return;
      const { error } = await sb.from('community_comments').delete().eq('id', id);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      loadPosts();
    }

    async function loadPosts(){
      const feed = document.getElementById('feed');
      feed.innerHTML = '<p class="text-ink/40 text-sm text-center py-8">불러오는 중…</p>';
      const { data, error } = await sb.from('community_posts').select('*').eq('board', currentBoard).order('created_at', { ascending:false }).limit(100);
      if(error){ feed.innerHTML = `<p class="text-red-500 text-sm text-center py-8">불러오기 오류: ${esc(error.message)}</p>`; return; }
      if(!data.length){ feed.innerHTML = `<p class="text-ink/40 text-sm text-center py-10">${ currentBoard === 'qna' ? '첫 질문을 남겨보세요! 🙋' : currentBoard === 'prayer' ? '첫 기도 제목을 나눠보세요! 🙏' : '첫 글의 주인공이 되어보세요! ✍️' }</p>`; return; }
      POSTS_BY_ID = {}; data.forEach(p => { POSTS_BY_ID[p.id] = p; });
      feed.innerHTML = data.map(renderPost).join('');
      // 댓글 불러오기
      const ids = data.map(p => p.id);
      const { data: comments } = await sb.from('community_comments').select('*').in('post_id', ids).order('created_at', { ascending:true });
      const byPost = {};
      (comments || []).forEach(c => { (byPost[c.post_id] = byPost[c.post_id] || []).push(c); });
      data.forEach(p => renderComments(p.id, byPost[p.id] || []));
      // 공유 링크(#post-id)로 들어온 경우 해당 글로 스크롤·강조
      if(location.hash && location.hash.startsWith('#post-')){
        const el = document.getElementById(location.hash.slice(1));
        if(el){ el.scrollIntoView({ behavior:'smooth', block:'center' }); el.classList.add('ring-2','ring-gold'); setTimeout(() => el.classList.remove('ring-2','ring-gold'), 2600); }
      }
    }

    // ===== 게시글 SNS 공유 =====
    let POSTS_BY_ID = {}, SHARE_CTX = { url:'', text:'' };
    function postExcerpt(p){
      const d = document.createElement('div'); d.innerHTML = p.content || '';
      const t = (d.textContent || '').replace(/\s+/g, ' ').trim();
      return t.length > 80 ? t.slice(0, 80) + '…' : (t || '오광일의 인사이트 브리핑 커뮤니티 글');
    }
    function shareCommunityPost(postId){
      const p = POSTS_BY_ID[postId]; if(!p) return;
      const board = p.board || currentBoard;
      const url = location.origin + location.pathname + '?board=' + board + '#post-' + postId;
      const label = board === 'qna' ? '[질의응답]' : board === 'prayer' ? '[기도 요청]' : '[커뮤니티]';
      SHARE_CTX = { url, text: `${label} ${postExcerpt(p)}\n— 오광일의 인사이트 브리핑` };
      document.getElementById('shareSheet').classList.remove('hidden');
      document.getElementById('shareSheet').classList.add('flex');
    }
    function closeShareSheet(){ const s = document.getElementById('shareSheet'); s.classList.add('hidden'); s.classList.remove('flex'); }
    function copyCommLink(){
      const txt = SHARE_CTX.url;
      const done = () => alert('링크를 복사했어요! 원하는 곳(카카오톡·카페 등)에 붙여넣어 공유하세요.');
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(() => prompt('아래 링크를 복사하세요:', txt)); }
      else { prompt('아래 링크를 복사하세요:', txt); }
    }
    function shareCommExec(platform){
      const url = SHARE_CTX.url, text = SHARE_CTX.text;
      const eu = encodeURIComponent(url), et = encodeURIComponent(text), etxt = encodeURIComponent(text + ' ' + url);
      closeShareSheet();
      if(platform === 'copy' || platform === 'kakao' || platform === 'cafe'){ copyCommLink(); return; }
      if(platform === 'native'){
        if(navigator.share){ navigator.share({ text, url }).catch(() => {}); } else { copyCommLink(); }
        return;
      }
      let target = '';
      switch(platform){
        case 'blog':     target = `https://blog.naver.com/openapi/share?url=${eu}&title=${et}`; break;
        case 'band':     target = `https://www.band.us/plugin/share?body=${etxt}&route=${eu}`; break;
        case 'threads':  target = `https://www.threads.net/intent/post?text=${etxt}`; break;
        case 'x':        target = `https://twitter.com/intent/tweet?text=${et}&url=${eu}`; break;
        case 'facebook': target = `https://www.facebook.com/sharer/sharer.php?u=${eu}`; break;
      }
      if(target) window.open(target, '_blank', 'noopener,noreferrer,width=640,height=660');
    }

    async function submitPost(){
      if(!currentUser){ alert('로그인이 필요해요.'); return; }
      ensureCommQuill();
      const msg = document.getElementById('postMsg'); const btn = document.getElementById('postBtn');
      const text = commQuill.getText().trim();
      const html = sanitize(commQuill.root.innerHTML);
      const hasImage = /<img\s/i.test(html);
      if(!text && !hasImage){ msg.textContent = '내용을 입력하세요.'; return; }
      btn.disabled = true; btn.textContent = '올리는 중…'; msg.textContent = '';
      try{
        const { error } = await sb.from('community_posts').insert({ author_id: currentUser.id, author_name: currentName, content: html, board: currentBoard });
        if(error) throw error;
        commQuill.setText('');
        loadPosts();
      }catch(e){ msg.textContent = '오류: ' + (e.message || e); }
      finally{ btn.disabled = false; btn.textContent = boardLabel(currentBoard); }
    }

    async function del(id, asAdmin){
      if(!confirm(asAdmin ? '관리자 권한으로 이 글을 삭제할까요?' : '이 글을 삭제할까요?')) return;
      const { error } = await sb.from('community_posts').delete().eq('id', id);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      loadPosts();
    }
  </script>
  <script>
    fetch('content/site.json?t=' + Date.now()).then(r => r.json()).then(s => {
      const nav = document.getElementById('navmenu'); if(!nav || !s.menu) return;
      const cur = (location.pathname.split('/').pop() || 'index.html');
      nav.innerHTML = s.menu.map(m => {
        const hash = m.href.startsWith('#');
        const href = hash ? ('index.html' + m.href) : m.href;
        const active = !hash && (href.split('?')[0] === cur);
        return '<a href="' + href + '" class="' + (active ? 'text-gold font-semibold' : 'hover:text-gold') + '">' + m.label + '</a>';
      }).join('');
    }).catch(() => {});
  </script>
  <!-- 게시글 공유 시트 -->
  <div id="shareSheet" class="hidden fixed inset-0 z-[80] bg-ink/50 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target===this)closeShareSheet()">
    <div class="bg-white rounded-3xl shadow-card p-6 w-full max-w-xs">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-base">🔗 이 글 공유하기</h3>
        <button onclick="closeShareSheet()" class="text-ink/30 hover:text-ink text-2xl leading-none">×</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <button onclick="shareCommExec('kakao')" class="shareB">💬 카카오톡</button>
        <button onclick="shareCommExec('blog')" class="shareB">🟢 네이버 블로그</button>
        <button onclick="shareCommExec('band')" class="shareB">🔵 네이버 밴드</button>
        <button onclick="shareCommExec('cafe')" class="shareB">🍃 네이버 카페</button>
        <button onclick="shareCommExec('x')" class="shareB">𝕏 X(트위터)</button>
        <button onclick="shareCommExec('threads')" class="shareB">🧵 쓰레드</button>
        <button onclick="shareCommExec('facebook')" class="shareB">📘 페이스북</button>
        <button onclick="shareCommExec('native')" class="shareB">⋯ 기타(앱)</button>
      </div>
      <button onclick="shareCommExec('copy')" class="w-full mt-2 bg-ink text-paper font-semibold rounded-xl py-2.5 text-sm hover:bg-navy transition">🔗 링크 복사</button>
      <p class="text-ink/40 text-[11px] mt-3 leading-relaxed">※ 커뮤니티는 멤버 전용이라, 링크를 받은 분은 로그인 후 글을 볼 수 있어요.</p>
    </div>
  </div>
  <style>.shareB{display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid rgba(21,32,58,.12);border-radius:.75rem;padding:.6rem .4rem;font-weight:600;transition:.15s}.shareB:hover{background:rgba(184,146,63,.08);border-color:rgba(184,146,63,.4)}</style>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>

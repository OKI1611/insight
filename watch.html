  <script>
    let lessons = [], cur = 0, LESSON_TRACK = [];
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function ytId(u){
      if(!u) return '';
      const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
      return m ? m[1] : (String(u).trim().length === 11 ? String(u).trim() : '');
    }
    function parseT(t){ if(!t) return null; const p = String(t).trim().split(':').map(Number); if(!p.length || p.some(isNaN)) return null; return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : p[0]; }
    function seekTo(sec){
      const l = lessons[cur]; const id = ytId(l && l.youtube);
      if(!l || !l.free || !id) return;
      document.getElementById('player').innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}?rel=0&start=${sec}&autoplay=1" title="${esc(l.title)}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let LEVELS = [];
    fetch('content/course.json?t=' + Date.now())
      .then(r => r.json())
      .then(c => {
        // 단계(levels) 구조 우선, 없으면 기존 lessons 평면 구조 호환
        LEVELS = (c.levels && c.levels.length) ? c.levels.map(lv => ({ name: lv.name || '', desc: lv.desc || '', lessons: lv.lessons || [] }))
                                              : [{ name: '', desc: '', lessons: c.lessons || [] }];
        lessons = []; LESSON_TRACK = [];
        LEVELS.forEach(lv => lv.lessons.forEach(ls => { lessons.push(ls); LESSON_TRACK.push(lv.name || ''); }));
        document.getElementById('courseTitle').textContent = c.title || '강의';
        document.getElementById('courseSub').textContent = c.subtitle || '';
        const freeCnt = lessons.filter(l => l.free).length;
        document.getElementById('courseMeta').textContent = `${c.instructor || ''} · 총 ${lessons.length}강 · 무료 ${freeCnt}강 공개`;
        document.getElementById('listCount').textContent = `${lessons.length}강`;
        renderList();
        const firstFree = lessons.findIndex(l => l.free);
        const qp = parseInt(new URLSearchParams(location.search).get('l'), 10);
        const start = (!isNaN(qp) && qp >= 0 && qp < lessons.length) ? qp : (firstFree >= 0 ? firstFree : 0);
        loadLesson(start);
      })
      .catch(() => {
        document.getElementById('courseTitle').textContent = '강의를 불러오지 못했습니다.';
      });

    function lessonRow(l, i){
      const hasCh = l.chapters && l.chapters.length;
      const chHtml = hasCh ? `<ul id="ch-list-${i}" class="hidden bg-ink/[0.015] border-t border-ink/5">` +
        l.chapters.map(c => {
          const sec = parseT(c.t);
          if(sec != null && l.free){
            return `<li onclick="playChapter(${i}, ${sec})" class="flex items-start gap-2 pl-12 pr-4 py-2 cursor-pointer hover:bg-gold/[0.08] transition">
                <span class="text-[11px] font-semibold text-gold/80 shrink-0 w-9 pt-0.5">${esc(c.t)}</span>
                <span class="text-xs text-ink/70 flex-1 leading-snug">${esc(c.label)}</span>
              </li>`;
          }
          return `<li class="flex items-start gap-2 pl-12 pr-4 py-2"><span class="text-ink/30 shrink-0">▸</span><span class="text-xs text-ink/60 flex-1 leading-snug">${esc(c.label)}</span></li>`;
        }).join('') + `</ul>` : '';

      return `<li class="lessonItem">
          <div id="lesson-${i}" onclick="loadLesson(${i})"
              class="lesson flex items-center gap-3 px-4 py-3.5 cursor-pointer border-l-2 border-transparent hover:bg-ink/[0.03] transition">
            <span class="num text-sm text-ink/35 font-bold w-6 shrink-0">${String(i+1).padStart(2,'0')}</span>
            <div class="min-w-0 flex-1">
              <p class="title text-sm font-medium leading-snug">${esc(l.title || '')}</p>
              <p class="text-xs text-ink/45 mt-1">${ l.duration ? '⏱ ' + esc(l.duration) + ' · ' : '' }${ l.free ? '<span class="text-green-600 font-semibold">무료</span>' : '<span class="text-ink/40">🔒 오픈 예정</span>' }${ hasCh ? ` · <span class="text-ink/40">목차 ${l.chapters.length}</span>` : '' }</p>
            </div>
            ${ hasCh ? `<button onclick="toggleChapters(${i}, event)" class="chToggle shrink-0 w-7 h-7 flex items-center justify-center rounded-full hover:bg-ink/5 text-ink/40" aria-label="목차 펼치기">
                <svg class="chevC w-4 h-4 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
              </button>` : '' }
          </div>
          ${chHtml}
        </li>`;
    }
    function toggleChapters(i, ev){
      if(ev) ev.stopPropagation();
      const list = document.getElementById('ch-list-' + i);
      if(!list) return;
      const hidden = list.classList.toggle('hidden');
      const btn = document.querySelector('#lesson-' + i + ' .chevC');
      if(btn) btn.style.transform = hidden ? '' : 'rotate(180deg)';
    }
    function playChapter(i, sec){
      if(i !== cur) loadLesson(i);
      if(sec != null) seekTo(sec);
    }

    // ===== 요약 노트 / PDF / 공유 =====
    let NOTE_CACHE = {};
    function noteHeader(){
      return `<div style="border-bottom:2px solid #b8923f;padding-bottom:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span style="font-weight:700;color:#15203a;font-size:14px">오광일의 인사이트 브리핑 · 강의 노트</span>
        <span style="font-size:12px;color:#a7adba">바이블 인사이트 스쿨</span>
      </div>`;
    }
    function noteFooter(){
      return `<div style="border-top:1px solid #ececec;margin-top:22px;padding-top:10px;font-size:11px;color:#aab1bd">insight.josephoh1611.workers.dev · 오광일의 인사이트 브리핑 — 본 노트는 강의 학습용으로 무료 제공됩니다.</div>`;
    }
    function titleBlock(l){
      return `<h2 style="font-size:21px;font-weight:700;color:#15203a;margin:0 0 6px;line-height:1.35">${esc(l.title || '')}</h2>
        <p style="color:#6b7280;font-size:13px;margin:0 0 18px">강사 오광일${ l.duration ? ' · ' + esc(l.duration) : '' }</p>`;
    }
    // 기본(자동) 노트 — 풍성한 노트 파일이 없을 때 폴백
    function basicNoteHTML(l){
      const tags = (l.tags || []).map(t => `<span style="display:inline-block;background:#f4eedd;color:#8a6d2f;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;margin:3px 5px 3px 0">#${esc(t)}</span>`).join('');
      const chaps = (l.chapters || []).map(c => `<li style="margin:7px 0;color:#2b3550;line-height:1.5">${ c.t ? `<b style="color:#b8923f">${esc(c.t)}</b>&nbsp;&nbsp;` : '' }${esc(c.label)}</li>`).join('');
      return noteHeader() + titleBlock(l) +
        ( l.summary ? `<div style="margin-bottom:18px"><p style="font-weight:700;color:#15203a;margin:0 0 7px">📖 강의 소개</p><p style="color:#44506a;line-height:1.75;margin:0">${esc(l.summary)}</p></div>` : '' ) +
        ( chaps ? `<div style="margin-bottom:18px"><p style="font-weight:700;color:#15203a;margin:0 0 7px">📋 핵심 내용</p><ol style="margin:0;padding-left:20px">${chaps}</ol></div>` : '' ) +
        ( tags ? `<div style="margin-bottom:6px"><p style="font-weight:700;color:#15203a;margin:0 0 7px">🔑 키워드</p>${tags}</div>` : '' ) +
        noteFooter();
    }
    // 여러 문단 렌더(\n 기준 분리)
    function noteParas(t){
      return String(t || '').split(/\n+/).filter(x => x.trim()).map(p => `<p style="color:#44506a;line-height:1.85;margin:0 0 9px">${esc(p)}</p>`).join('');
    }
    // 풍성한 노트 — content/notes/<id>.json
    function richNoteHTML(l, n){
      let h = noteHeader() + titleBlock(l);
      if(n.thesis){
        h += `<div style="background:#faf6ea;border-left:4px solid #b8923f;border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:20px">
          <p style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#b8923f;margin:0 0 4px">핵심 한 문장</p>
          <p style="color:#2b3550;font-size:15px;font-weight:600;line-height:1.6;margin:0">${esc(n.thesis)}</p></div>`;
      }
      if(n.overview){
        h += `<div style="margin-bottom:22px"><p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:15px">📘 강의 개요</p>${noteParas(n.overview)}</div>`;
      }
      if(n.background){
        h += `<div style="margin-bottom:22px;background:#f7f9fc;border:1px solid #e8edf4;border-radius:12px;padding:15px 17px">
          <p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">📜 배경 — 역사적·신학적 맥락</p>${noteParas(n.background)}</div>`;
      }
      if(n.sections && n.sections.length){
        h += `<p style="font-weight:700;color:#15203a;margin:0 0 10px;font-size:15px">📑 핵심 내용 정리</p>`;
        n.sections.forEach((s, i) => {
          const pts = (s.points || []).map(p => `<li style="margin:5px 0;color:#44506a;line-height:1.6">${esc(p)}</li>`).join('');
          h += `<div style="margin:0 0 16px;padding:0 0 0 2px">
            <p style="margin:0 0 6px;color:#15203a;font-weight:700;font-size:14.5px">${ s.t ? `<span style="display:inline-block;background:#15203a;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:8px">${esc(s.t)}</span>` : '' }${esc(s.heading || '')}</p>
            ${ s.body ? noteParas(s.body) : '' }
            ${ pts ? `<ul style="margin:4px 0 2px;padding-left:20px">${pts}</ul>` : '' }
          </div>`;
        });
      }
      if(n.scriptures && n.scriptures.length){
        h += `<div style="margin:20px 0;background:#f7f9fc;border:1px solid #e8edf4;border-radius:12px;padding:14px 16px">
          <p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">📖 핵심 성구</p>` +
          n.scriptures.map(s => `<p style="margin:7px 0;color:#44506a;line-height:1.6"><b style="color:#1b2a4a">${esc(s.ref)}</b>${ s.note ? ` — ${esc(s.note)}` : '' }</p>`).join('') + `</div>`;
      }
      if(n.terms && n.terms.length){
        h += `<div style="margin:20px 0"><p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">📚 핵심 용어</p>` +
          n.terms.map(t => `<p style="margin:6px 0;color:#44506a;line-height:1.6"><b style="color:#8a6d2f">${esc(t.term)}</b> · ${esc(t.def)}</p>`).join('') + `</div>`;
      }
      if(n.misconceptions && n.misconceptions.length){
        h += `<div style="margin:20px 0"><p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">⚠️ 흔한 오해 vs 바른 이해</p>` +
          n.misconceptions.map(m => `<div style="border:1px solid #eee;border-radius:10px;padding:10px 13px;margin:0 0 8px">
            <p style="margin:0 0 4px;color:#b4453a;line-height:1.6"><b>❌ 오해</b> · ${esc(m.wrong)}</p>
            <p style="margin:0;color:#2f7d4f;line-height:1.6"><b>✅ 바른 이해</b> · ${esc(m.right)}</p>
          </div>`).join('') + `</div>`;
      }
      if(n.takeaways && n.takeaways.length){
        h += `<div style="margin:20px 0;background:#faf6ea;border-radius:12px;padding:14px 16px">
          <p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">✅ 한눈에 정리</p>
          <ul style="margin:0;padding-left:20px">` + n.takeaways.map(t => `<li style="margin:5px 0;color:#2b3550;line-height:1.65">${esc(t)}</li>`).join('') + `</ul></div>`;
      }
      if(n.application && n.application.length){
        h += `<div style="margin:20px 0"><p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">🌱 삶으로 가져가기</p>
          <ul style="margin:0;padding-left:20px">` + n.application.map(a => `<li style="margin:5px 0;color:#44506a;line-height:1.7">${esc(a)}</li>`).join('') + `</ul></div>`;
      }
      if(n.questions && n.questions.length){
        h += `<div style="margin:20px 0"><p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">💬 묵상·토론 질문</p>
          <ol style="margin:0;padding-left:20px">` + n.questions.map(q => `<li style="margin:6px 0;color:#44506a;line-height:1.65">${esc(q)}</li>`).join('') + `</ol></div>`;
      }
      if(n.furtherStudy && n.furtherStudy.length){
        h += `<div style="margin:20px 0;background:#faf6ea;border-radius:12px;padding:14px 16px"><p style="font-weight:700;color:#15203a;margin:0 0 8px;font-size:14.5px">📚 더 깊이 공부하려면</p>
          <ul style="margin:0;padding-left:20px">` + n.furtherStudy.map(f => `<li style="margin:5px 0;color:#44506a;line-height:1.65">${esc(f)}</li>`).join('') + `</ul></div>`;
      }
      const tags = (l.tags || []).map(t => `<span style="display:inline-block;background:#f4eedd;color:#8a6d2f;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;margin:3px 5px 3px 0">#${esc(t)}</span>`).join('');
      if(tags){ h += `<div style="margin:18px 0 4px"><p style="font-weight:700;color:#15203a;margin:0 0 7px;font-size:14px">🔑 키워드</p>${tags}</div>`; }
      return h + noteFooter();
    }
    function renderNote(l){
      const sheet = document.getElementById('noteSheet');
      if(!sheet) return;
      sheet.innerHTML = basicNoteHTML(l);           // 즉시 표시(폴백)
      const id = ytId(l.youtube); const at = cur;
      (async () => {
        let rich = NOTE_CACHE[id];
        if(rich === undefined){
          try { const r = await fetch('content/notes/' + id + '.json?t=' + Date.now()); rich = r.ok ? await r.json() : null; }
          catch(e){ rich = null; }
          NOTE_CACHE[id] = rich;
        }
        if(rich && cur === at){ sheet.innerHTML = richNoteHTML(l, rich); }   // 풍성한 노트로 업그레이드
      })();
    }
    function toggleNote(){
      const card = document.getElementById('noteCard');
      const btn = document.getElementById('noteToggleBtn');
      const show = card.style.display === 'none';
      card.style.display = show ? '' : 'none';
      if(btn) btn.textContent = show ? '📝 요약 노트 닫기' : '📝 요약 노트 보기';
      if(show) card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
    async function downloadNotePDF(){
      const card = document.getElementById('noteCard');
      const wasHidden = card.style.display === 'none';
      card.style.display = '';
      const l = lessons[cur] || {};
      const fname = ((l.title || '강의').replace(/[\\/:*?"<>|]/g, ' ').trim()) + ' 요약노트.pdf';
      const opt = {
        margin: [10, 10, 12, 10], filename: fname,
        image: { type: 'jpeg', quality: 0.97 },
        html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      };
      try { await html2pdf().set(opt).from(document.getElementById('noteSheet')).save(); }
      catch(e){ alert('PDF 생성 중 문제가 발생했어요. 다시 시도해 주세요.'); }
      if(wasHidden){ card.style.display = 'none'; }
    }
    function lessonShareUrl(){ return location.origin + location.pathname + '?l=' + cur; }
    function toggleShareMenu(ev){
      if(ev) ev.stopPropagation();
      document.getElementById('shareMenu').classList.toggle('hidden');
    }
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('shareMenu');
      if(menu && !menu.classList.contains('hidden') && !e.target.closest('#shareMenu') && !e.target.closest('[onclick^="toggleShareMenu"]')){
        menu.classList.add('hidden');
      }
    });
    function copyLink(url, kind){
      const msg = kind === 'insta' ? '링크를 복사했어요! 📷 인스타그램 앱에서 프로필/스토리에 붙여넣어 공유하세요.'
               : kind === 'cafe' ? '링크를 복사했어요! 🍃 원하는 네이버 카페 글쓰기에 붙여넣어 공유하세요.'
               : kind === 'kakao' ? '링크를 복사했어요! 💬 카카오톡 대화창에 붙여넣어 공유하세요.'
               : '강의 링크를 복사했어요!';
      const done = () => alert(msg);
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(()=>prompt('아래 링크를 복사하세요:', url)); }
      else { prompt('아래 링크를 복사하세요:', url); }
    }
    function shareTo(platform){
      const l = lessons[cur] || {};
      const url = lessonShareUrl();
      const title = (l.title || '오광일의 인사이트 브리핑');
      const eu = encodeURIComponent(url), et = encodeURIComponent(title), etxt = encodeURIComponent(title + ' ' + url);
      document.getElementById('shareMenu').classList.add('hidden');
      let target = '';
      switch(platform){
        case 'blog':     target = `https://blog.naver.com/openapi/share?url=${eu}&title=${et}`; break;
        case 'band':     target = `https://www.band.us/plugin/share?body=${etxt}&route=${eu}`; break;
        case 'threads':  target = `https://www.threads.net/intent/post?text=${etxt}`; break;
        case 'x':        target = `https://twitter.com/intent/tweet?text=${et}&url=${eu}`; break;
        case 'facebook': target = `https://www.facebook.com/sharer/sharer.php?u=${eu}`; break;
        case 'cafe':
        case 'insta':
        case 'kakao':
        case 'copy':     copyLink(url, platform); return;
      }
      window.open(target, '_blank', 'noopener,noreferrer,width=640,height=660');
    }
    async function shareNative(){
      document.getElementById('shareMenu').classList.add('hidden');
      const l = lessons[cur] || {};
      const url = lessonShareUrl();
      const data = { title: l.title || '오광일의 인사이트 브리핑', text: (l.summary || l.title || ''), url };
      try {
        if(navigator.share){ await navigator.share(data); }
        else { copyLink(url, 'copy'); }
      } catch(e){ /* 사용자가 취소 */ }
    }
    // 강사에게 질문하기 — 커뮤니티 Q&A에 강의 정보가 채워진 채로 이동
    function askInstructor(){
      const l = lessons[cur] || {};
      const ref = (l.title || '강의') + '\n🔗 ' + lessonShareUrl();
      window.open('community.html?board=qna&ask=' + encodeURIComponent(ref), '_blank');
    }
    function renderList(){
      let html = '', gi = 0;
      LEVELS.forEach(lv => {
        if(lv.name) html += `<li class="px-4 py-2.5 bg-ink/[0.04] flex items-baseline gap-2">
            <span class="text-xs font-bold text-gold tracking-wide">${esc(lv.name)}</span>
            ${ lv.desc ? `<span class="text-[11px] text-ink/45">· ${esc(lv.desc)}</span>` : '' }
          </li>`;
        lv.lessons.forEach(l => { html += lessonRow(l, gi++); });
      });
      document.getElementById('lessonList').innerHTML = html;
    }

    function loadLesson(i){
      if(i < 0 || i >= lessons.length) return;
      cur = i;
      const l = lessons[i];

      document.querySelectorAll('.lesson').forEach(el => { el.classList.remove('bg-gold/10','border-gold'); });
      const el = document.getElementById('lesson-' + i);
      if(el){ el.classList.add('bg-gold/10','border-gold'); el.scrollIntoView({ block:'nearest' }); }

      // 현재 강의 목차는 자동으로 펼치고, 나머지는 접기
      document.querySelectorAll('[id^="ch-list-"]').forEach(ul => {
        const idx = ul.id.replace('ch-list-', '');
        const show = (String(i) === idx);
        ul.classList.toggle('hidden', !show);
        const btn = document.querySelector('#lesson-' + idx + ' .chevC');
        if(btn) btn.style.transform = show ? 'rotate(180deg)' : '';
      });

      const player = document.getElementById('player');
      const id = ytId(l.youtube);
      if(l.free && id){
        player.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}?rel=0" title="${esc(l.title)}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      } else {
        player.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center text-paper gap-3 text-center px-6">
          <span class="text-4xl">🔒</span>
          <p class="font-semibold">정식 오픈 후 시청하실 수 있어요</p>
          <p class="text-paper/60 text-sm">미리 등록하면 출시 소식을 가장 먼저 받아보세요.</p>
          <a href="index.html#pricing" class="mt-2 bg-gold text-white font-semibold px-6 py-2.5 rounded-full text-sm hover:opacity-90">출시 알림 받기</a>
        </div>`;
      }

      document.getElementById('lessonTitle').textContent = l.title || '';
      const desc = document.getElementById('lessonDesc');
      if(l.summary){
        desc.style.display = '';
        desc.innerHTML = '<p class="font-semibold text-ink mb-2">📖 강의 소개</p>' + esc(l.summary).replace(/\n/g,'<br>');
      } else { desc.style.display = 'none'; }

      const tagBox = document.getElementById('lessonTags');
      if(l.tags && l.tags.length){
        tagBox.innerHTML = l.tags.map(t => `<span class="text-xs text-gold bg-gold/10 font-semibold px-2.5 py-1 rounded-full"># ${esc(t)}</span>`).join('');
      } else { tagBox.innerHTML = ''; }

      const ch = document.getElementById('lessonChapters');
      if(l.chapters && l.chapters.length){
        ch.style.display = '';
        ch.innerHTML = '<p class="font-semibold text-ink mb-3">📋 강의 목차</p><ol class="divide-y divide-ink/5">' +
          l.chapters.map((c, idx) => {
            const sec = parseT(c.t);
            const numHtml = `<span class="text-ink/35 font-bold text-sm w-6 shrink-0">${String(idx+1).padStart(2,'0')}</span>`;
            if(sec != null && l.free){
              return `<li onclick="seekTo(${sec})" class="flex items-center gap-3 py-2.5 px-2 -mx-2 rounded-lg cursor-pointer hover:bg-gold/[0.07] transition">${numHtml}<span class="text-sm flex-1 text-ink/80">${esc(c.label)}</span><span class="text-xs font-semibold text-gold shrink-0">${esc(c.t)} ▶</span></li>`;
            }
            return `<li class="flex items-center gap-3 py-2.5">${numHtml}<span class="text-sm flex-1 text-ink/75">${esc(c.label)}</span></li>`;
          }).join('') + '</ol>' +
          (l.chapters.every(c => !parseT(c.t)) ? '<p class="text-[11px] text-ink/35 mt-3">⏱ 타임스탬프(시간)를 입력하면 목차를 눌러 해당 장면으로 바로 이동할 수 있어요.</p>' : '');
      } else { ch.style.display = 'none'; }

      document.getElementById('lessonBadge').innerHTML = l.free
        ? '<span class="bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full">무료 공개</span>'
        : '<span class="bg-ink/10 text-ink/50 text-xs font-semibold px-2.5 py-1 rounded-full">🔒 오픈 예정</span>';

      renderNote(l);
      refreshLearningUI();
      const noteCard = document.getElementById('noteCard');
      const noteBtn = document.getElementById('noteToggleBtn');
      if(noteCard){ noteCard.style.display = 'none'; }
      if(noteBtn){ noteBtn.textContent = '📝 요약 노트 보기'; }

      document.getElementById('prevBtn').disabled = i <= 0;
      document.getElementById('nextBtn').disabled = i >= lessons.length - 1;
    }
    function prev(){ loadLesson(cur - 1); }
    function next(){ loadLesson(cur + 1); }

    // ===== 수강신청 / 학습 진도 =====
    const lsb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    let LUSER = null, ENROLLED = new Set(), DONE = new Set(), TABLES_READY = true;
    function curTrack(){ return LESSON_TRACK[cur] || ''; }
    function curId(){ return ytId((lessons[cur] || {}).youtube); }
    function tableErr(e){ return e && (e.code === '42P01' || /relation|does not exist|schema cache|find the table/i.test(e.message || '')); }
    function learnToast(msg, ok){
      const m = document.getElementById('learnMsg'); if(!m) return;
      m.style.display = ''; m.style.color = ok ? '#15803d' : '#dc2626';
      m.textContent = msg;
    }

    lsb.auth.onAuthStateChange((_e, s) => lAuth(s));
    lsb.auth.getSession().then(({ data:{ session } }) => lAuth(session));
    async function lAuth(session){
      LUSER = (session && session.user) || null;
      ENROLLED = new Set(); DONE = new Set(); TABLES_READY = true;
      if(LUSER){
        const { data, error } = await lsb.from('enrollments').select('track').eq('user_id', LUSER.id);
        if(error){ TABLES_READY = false; } else { (data||[]).forEach(e => ENROLLED.add(e.track)); }
        try { const { data: p } = await lsb.from('lesson_progress').select('lesson_id').eq('user_id', LUSER.id).eq('completed', true); (p||[]).forEach(x => DONE.add(x.lesson_id)); } catch(e){}
      }
      refreshLearningUI();
    }
    function refreshLearningUI(){
      const bar = document.getElementById('learnBar');
      if(!bar || !lessons.length) return;
      const myClass = '<a href="mylearning.html" class="inline-flex items-center gap-1.5 border border-ink/15 text-ink/70 font-semibold px-4 py-2 rounded-full hover:bg-ink/5 transition">📚 내 강의실</a>';
      const msgEl = '<p id="learnMsg" class="basis-full w-full text-sm font-semibold mt-1" style="display:none"></p>';
      if(!LUSER){
        bar.innerHTML = '<span class="text-ink/55">로그인하면 수강신청과 학습 체크를 이용할 수 있어요.</span>'
          + '<button onclick="lLogin()" class="inline-flex items-center gap-1.5 border border-ink/15 font-semibold px-4 py-2 rounded-full hover:bg-ink/5 transition">구글로 로그인</button>' + myClass + msgEl;
        return;
      }
      if(!TABLES_READY){
        bar.innerHTML = '<span class="text-amber-600 font-medium">⚠️ 수강신청·학습 체크 기능을 준비 중이에요. (관리자: Supabase 테이블 생성이 필요합니다)</span>' + myClass + msgEl;
        return;
      }
      const enrolled = ENROLLED.has(curTrack());
      const done = DONE.has(curId());
      const enrollBtn = enrolled
        ? `<span class="inline-flex items-center gap-1.5 bg-green-600 text-white font-semibold px-4 py-2 rounded-full">✓ 수강 중 · ${esc(curTrack())}</span>`
        : `<button onclick="enrollTrack()" class="inline-flex items-center gap-1.5 bg-gold text-white font-semibold px-4 py-2 rounded-full hover:opacity-90 transition">＋ 이 과정 수강신청</button>`;
      const doneBtn = done
        ? `<button onclick="toggleComplete()" class="inline-flex items-center gap-1.5 bg-green-600 text-white font-semibold px-4 py-2 rounded-full hover:opacity-90 transition">✅ 학습 완료됨</button>`
        : `<button onclick="toggleComplete()" class="inline-flex items-center gap-1.5 border border-ink/20 text-ink/80 font-semibold px-4 py-2 rounded-full hover:bg-ink/5 transition">⬜ 학습 완료 체크</button>`;
      bar.innerHTML = enrollBtn + doneBtn + myClass + msgEl;
    }
    async function lLogin(){ await lsb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href } }); }
    async function enrollTrack(){
      if(!LUSER){ lLogin(); return; }
      const t = curTrack(); if(!t) return;
      const { error } = await lsb.from('enrollments').insert({ user_id: LUSER.id, track: t });
      if(error && error.code !== '23505'){
        if(tableErr(error)){ TABLES_READY = false; refreshLearningUI(); learnToast('수강신청 기능이 아직 켜지지 않았어요. 관리자 설정(테이블 생성)이 필요합니다.', false); }
        else { learnToast('수강신청 오류: ' + error.message, false); }
        return;
      }
      ENROLLED.add(t); refreshLearningUI();
      learnToast('✓ 「' + t + '」 수강신청 완료! 📚 내 강의실에서 학습 현황을 볼 수 있어요.', true);
    }
    async function toggleComplete(){
      if(!LUSER){ lLogin(); return; }
      const id = curId(); if(!id) return;
      if(DONE.has(id)){
        const { error } = await lsb.from('lesson_progress').delete().eq('user_id', LUSER.id).eq('lesson_id', id);
        if(error){ learnToast('오류: ' + error.message, false); return; }
        DONE.delete(id); refreshLearningUI(); learnToast('학습 완료 표시를 해제했어요.', true);
      } else {
        const { error } = await lsb.from('lesson_progress').upsert({ user_id: LUSER.id, lesson_id: id, track: curTrack(), completed: true }, { onConflict: 'user_id,lesson_id' });
        if(error){
          if(tableErr(error)){ TABLES_READY = false; refreshLearningUI(); learnToast('학습 체크 기능이 아직 켜지지 않았어요. 관리자 설정이 필요합니다.', false); }
          else { learnToast('오류: ' + error.message, false); }
          return;
        }
        DONE.add(id);
        if(!ENROLLED.has(curTrack())){ try { await lsb.from('enrollments').insert({ user_id: LUSER.id, track: curTrack() }); ENROLLED.add(curTrack()); } catch(e){} }
        refreshLearningUI(); learnToast('✅ 이 강의를 학습 완료로 표시했어요! 📚 내 강의실에서 확인하세요.', true);
      }
    }
  </script>
  <script>
    fetch('content/site.json?t=' + Date.now()).then(r => r.json()).then(s => {
      const nav = document.getElementById('navmenu'); if(!nav || !s.menu) return;
      const cur = (location.pathname.split('/').pop() || 'index.html');
      nav.innerHTML = s.menu.map(m => {
        const hash = m.href.startsWith('#');
        const href = hash ? ('index.html' + m.href) : m.href;
        const active = !hash && (href.split('?')[0] === cur);
        return '<a href="' + href + '" class="' + (active ? 'text-gold font-semibold' : 'hover:text-gold') + '">' + m.label + '</a>';
      }).join('');
    }).catch(() => {});
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>
</html>

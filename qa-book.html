<body class="font-sans bg-paper text-neutral-900 antialiased min-h-screen">

  <div id="siteHeader" data-active="qa-book.html"></div>

  <!-- 히어로 + 검색 -->
  <section class="bg-white border-b border-ink/8">
    <div class="max-w-4xl mx-auto px-5 py-11 md:py-14 text-center">
      <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-3">Bible Q&amp;A by Book · 성경 권별</p>
      <h1 class="text-2xl md:text-[32px] font-bold leading-tight">성경 <span class="text-gold">권별</span> Q&amp;A</h1>
      <p class="text-neutral-900/60 text-sm md:text-[15px] mt-3 leading-relaxed max-w-xl mx-auto">창세기부터 요한계시록까지, <b class="text-neutral-900">각 권의 본문 궁금증</b>을 구절과 함께 풀이합니다. 원어와 성경에 근거해 균형 있게.</p>
      <div class="relative mt-6 max-w-lg mx-auto">
        <input id="q" type="search" autocomplete="off" placeholder="궁금한 것을 검색하세요 (예: 가인의 아내, 유월절, 토기장이…)" oninput="onSearch()" class="w-full border border-ink/15 rounded-full pl-12 pr-4 py-3.5 text-[15px] outline-none focus:border-gold shadow-soft bg-white" />
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-900/30"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg></span>
      </div>
    </div>
  </section>

  <div id="adminBar" class="hidden max-w-4xl mx-auto px-4 mt-4 flex items-center justify-between gap-2 bg-gold/[0.06] border border-gold/25 rounded-xl px-4 py-2.5">
    <span class="text-[12.5px] text-gold font-semibold">관리자 모드 · 권별 Q&amp;A를 직접 작성할 수 있어요</span>
    <button onclick="openEditor()" class="bg-gold text-white text-[12.5px] font-bold px-3.5 py-1.5 rounded-full hover:opacity-90 transition shrink-0">＋ 새 Q&amp;A 작성</button>
  </div>

  <main class="max-w-4xl mx-auto px-4 py-7">
    <!-- 상단 필터 툴바: 성경 책 드롭다운 + 주제 + 개수 -->
    <div class="flex flex-col sm:flex-row gap-2.5 sm:items-center mb-4">
      <div class="relative">
        <select id="bookSel" onchange="onBook()" class="appearance-none w-full sm:w-64 border border-ink/15 rounded-xl pl-4 pr-9 py-2.5 text-sm font-bold text-neutral-900 bg-white outline-none focus:border-gold cursor-pointer"></select>
        <span class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-900/40 text-[10px]">▼</span>
      </div>
      <div class="relative">
        <select id="topicSel" onchange="onTopic()" class="appearance-none w-full sm:w-auto border border-ink/15 rounded-xl pl-4 pr-9 py-2.5 text-sm text-neutral-900/80 bg-white outline-none focus:border-gold cursor-pointer"><option value="">전체 주제</option></select>
        <span class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-900/40 text-[10px]">▼</span>

      <p class="text-sm mt-1">다른 검색어로 찾아보시거나 곧 더 많은 질문이 추가됩니다.</p>

  <!-- 관리자 편집 모달 -->
  <div id="qaModal" class="hidden fixed inset-0 z-[120] bg-ink/40 backdrop-blur-sm flex items-start justify-center overflow-auto p-4">
    <div class="bg-white rounded-2xl shadow-card w-full max-w-lg my-8 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="qaModalTitle" class="text-lg font-bold">새 권별 Q&amp;A 작성</h3>
        <button onclick="closeEditor()" class="text-neutral-900/40 hover:text-neutral-900 text-xl">✕</button>
      </div>
      <div class="space-y-3">
        <div><label class="text-xs font-bold text-neutral-900/55">질문 *</label>
          <input id="fTerm" type="text" maxlength="140" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1" /></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-bold text-neutral-900/55">성경 책 *</label>
            <select id="fBook" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1 bg-white"></select></div>
          <div><label class="text-xs font-bold text-neutral-900/55">주제(분류)</label>
            <select id="fTopic" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1 bg-white"></select></div>
        </div>
        <div><label class="text-xs font-bold text-neutral-900/55">한마디 답 *</label>
          <textarea id="fDef" rows="2" maxlength="400" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1 resize-none"></textarea></div>
        <div><label class="text-xs font-bold text-neutral-900/55">자세한 답변</label>
          <p class="text-[11px] text-neutral-900/40 mb-1">문단은 빈 줄로 나눕니다. 소제목은 <b>소제목 | 내용</b> 형식.</p>
          <textarea id="fDeep" rows="7" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1 resize-y"></textarea></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-bold text-neutral-900/55">관련 성구</label>
            <input id="fScr" type="text" placeholder="예: 창4:17, 창5:4" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1" /></div>
          <div><label class="text-xs font-bold text-neutral-900/55">관련어</label>
            <input id="fRel" type="text" class="w-full border border-ink/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-gold mt-1" /></div>
        </div>
        <p id="fMsg" class="text-center text-sm text-gold min-h-[18px]"></p>
        <div class="flex gap-2 pt-1">
          <button onclick="saveQa()" id="fSave" class="flex-1 bg-gold text-white font-bold py-3 rounded-xl hover:opacity-90 transition">저장</button>
          <button onclick="closeEditor()" class="px-5 bg-white border border-ink/20 text-neutral-900/70 font-semibold rounded-xl hover:bg-neutral-50 transition text-sm">취소</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $=id=>document.getElementById(id);
    const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const SB='https://bmxkndkwefdgsomlznoo.supabase.co';
    const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJteGtuZGt3ZWZkZ3NvbWx6bm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzAwODIsImV4cCI6MjA5NjE0NjA4Mn0.l1yHhMVYwMqYSL8ub9PtrJPOl7CYr7yqstG2AER1EaU';
    const ADMIN='josephoh1611@gmail.com';
    const TOPICS=['구원·믿음','하나님·예수·삼위일체','성경·창조','신앙생활','교회·예배·헌금','성령·은사','윤리·관계·문화','죽음·종말·천국'];
    // 39 구약 + 27 신약 (한글명 · 정경 순서)
    const OT=['창세기','출애굽기','레위기','민수기','신명기','여호수아','사사기','룻기','사무엘상','사무엘하','열왕기상','열왕기하','역대상','역대하','에스라','느헤미야','에스더','욥기','시편','잠언','전도서','아가','이사야','예레미야','예레미야애가','에스겔','다니엘','호세아','요엘','아모스','오바댜','요나','미가','나훔','하박국','스바냐','학개','스가랴','말라기'];
    const NT=['마태복음','마가복음','누가복음','요한복음','사도행전','로마서','고린도전서','고린도후서','갈라디아서','에베소서','빌립보서','골로새서','데살로니가전서','데살로니가후서','디모데전서','디모데후서','디도서','빌레몬서','히브리서','야고보서','베드로전서','베드로후서','요한일서','요한이서','요한삼서','유다서','요한계시록'];
    const ABBR_F={'창':'Genesis','출':'Exodus','레':'Leviticus','민':'Numbers','신':'Deuteronomy','수':'Joshua','삿':'Judges','룻':'Ruth','삼상':'1Samuel','삼하':'2Samuel','왕상':'1Kings','왕하':'2Kings','대상':'1Chronicles','대하':'2Chronicles','스':'Ezra','느':'Nehemiah','에':'Esther','욥':'Job','시':'Psalms','잠':'Proverbs','전':'Ecclesiastes','아':'SongofSolomon','사':'Isaiah','렘':'Jeremiah','애':'Lamentations','겔':'Ezekiel','단':'Daniel','호':'Hosea','욜':'Joel','암':'Amos','옵':'Obadiah','욘':'Jonah','미':'Micah','나':'Nahum','합':'Habakkuk','습':'Zephaniah','학':'Haggai','슥':'Zechariah','말':'Malachi','마':'Matthew','막':'Mark','눅':'Luke','요':'John','행':'Acts','롬':'Romans','고전':'1Corinthians','고후':'2Corinthians','갈':'Galatians','엡':'Ephesians','빌':'Philippians','골':'Colossians','살전':'1Thessalonians','살후':'2Thessalonians','딤전':'1Timothy','딤후':'2Timothy','딛':'Titus','몬':'Philemon','히':'Hebrews','약':'James','벧전':'1Peter','벧후':'2Peter','요일':'1John','요이':'2John','요삼':'3John','유':'Jude','계':'Revelation'};
    let VERSE=[], QA_ADMIN=[], SEL='', TOPIC='', PAGE=1, EDIT_ID=null, KO2FILE={}; const PER=25;
    function qaSession(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!/auth-token/.test(k)) continue; var v=JSON.parse(localStorage.getItem(k)); var s=(v&&v.user)?v:(v&&v.currentSession)?v.currentSession:null; if(s&&s.user){ if(s.expires_at&&s.expires_at*1000<Date.now()) return null; return s; } } }catch(e){} return null; }
    function isAdmin(){ var s=qaSession(); return !!(s&&s.user&&s.user.email===ADMIN); }
    function renderAdminBar(){ var b=$('adminBar'); if(b) b.classList.toggle('hidden', !isAdmin()); }

    function onSearch(){ PAGE=1; render(); }
    function pickBook(b){ SEL=b; TOPIC=''; $('q').value=''; PAGE=1; var ts=$('topicSel'); if(ts) ts.value=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function searchFor(t){ $('q').value=t; SEL=''; PAGE=1; render(); window.scrollTo({top:0,behavior:'smooth'}); }

    $('results').innerHTML='<div class="text-center text-neutral-900/40 py-16"><p class="text-sm">질문을 불러오는 중…</p></div>';
    Promise.all([
      fetch('dictionary/entries.json').then(r=>r.json()).catch(()=>[]),
      fetch('bible/books.json').then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(SB+'/rest/v1/site_content?select=data&key=eq.qa_posts',{headers:{apikey:AK,Authorization:'Bearer '+AK}}).then(r=>r.ok?r.json():[]).catch(()=>[])
    ]).then(function(res){
      var d=res[0]||[], books=res[1]||[];
      books.forEach(function(b){ if(b.ko&&b.file) KO2FILE[b.ko]=b.file; });
      QA_ADMIN=(res[2]&&res[2][0]&&Array.isArray(res[2][0].data))?res[2][0].data:[];
      var faq=(Array.isArray(d)?d:[]).filter(e=>e.category==='자주 묻는 질문');
      // 권별 Q&A = book 태그 있는 것 + 관리자 작성 중 book 있는 것
      VERSE=QA_ADMIN.filter(e=>e.book).map(function(e){ e._admin=true; return e; }).concat(faq.filter(e=>e.book));
      buildFilters(); renderAdminBar();
      var sp=new URLSearchParams(location.search); var bk=sp.get('b'); if(bk){ SEL=bk; }
      render();
    }).catch(()=>{ $('results').innerHTML='<p class="text-center text-neutral-900/40 py-10">질문을 불러오지 못했어요.</p>'; });

    function hl(text,q){ if(!q) return esc(text); const safe=esc(text); try{ const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return safe.replace(re,'<mark>$1</mark>'); }catch(e){ return safe; } }

    // 드롭다운(책·주제) 채우기 — 각 항목에 질문 수 표시
    function buildFilters(){
      var bc={}; VERSE.forEach(e=>{ bc[e.book]=(bc[e.book]||0)+1; });
      function opts(list){ return list.filter(b=>bc[b]).map(b=>`<option value="${esc(b)}">${esc(b)} (${bc[b]})</option>`).join(''); }
      var bs=$('bookSel'); if(bs) bs.innerHTML=`<option value="">전체 성경 (${VERSE.length})</option>`
        + `<optgroup label="구약 39권">${opts(OT)}</optgroup><optgroup label="신약 27권">${opts(NT)}</optgroup>`;
      var ts=$('topicSel'); if(ts) ts.innerHTML='<option value="">전체 주제</option>'+TOPICS.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
    }
    function onBook(){ SEL=$('bookSel').value; $('q').value=''; PAGE=1; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function onTopic(){ TOPIC=$('topicSel').value; PAGE=1; render(); }

    // 현재 필터(검색어 > 책 + 주제)에 맞는 목록
    function currentList(){
      var q=($('q').value||'').trim().toLowerCase(), list=VERSE;
      if(q){ list=list.filter(function(e){ var deep=(e.deep||[]).map(s=>(s.h||'')+' '+(s.p||'')).join(' '); return ((e.term||'')+' '+(e.def||'')+' '+deep+' '+(e.book||'')).toLowerCase().indexOf(q)>=0; }); }
      else if(SEL){ list=list.filter(e=>e.book===SEL); }
      if(TOPIC){ list=list.filter(e=>e.faqTopic===TOPIC); }
      return {list:list, q:q};
    }
    function render(){
      $('empty').classList.add('hidden');
      var r=currentList(), list=r.list, q=r.q;
      var bs=$('bookSel'); if(bs) bs.value=q?'':SEL;   // 검색 중엔 책 선택 해제 표시
      $('listCount').textContent=list.length+'개 질문';
      if(!list.length){ $('results').innerHTML=''; $('pager').innerHTML=''; $('empty').classList.remove('hidden'); return; }
      var pages=Math.ceil(list.length/PER); if(PAGE>pages) PAGE=pages; if(PAGE<1) PAGE=1;
      var start=(PAGE-1)*PER, pageItems=list.slice(start,start+PER);
      var showBadge=(!SEL||!!q);   // 전체/검색 시 각 행에 책 배지
      $('results').innerHTML=qList(pageItems,q,start,showBadge);
      $('pager').innerHTML=pager(pages);
    }
    function goPage(p){ PAGE=p; render(); window.scrollTo({top:100,behavior:'smooth'}); }
    function pager(pages){
      if(pages<=1) return '';
      var win=2, s=Math.max(1,PAGE-win), e=Math.min(pages,PAGE+win), h='<div class="flex items-center justify-center gap-1.5 flex-wrap">';
      h+=`<button ${PAGE>1?`onclick="goPage(${PAGE-1})"`:'disabled'} class="pgbtn" aria-label="이전">‹</button>`;
      if(s>1){ h+='<button onclick="goPage(1)" class="pgbtn">1</button>'; if(s>2) h+='<span class="text-neutral-900/25 px-0.5">…</span>'; }
      for(var i=s;i<=e;i++) h+=`<button onclick="goPage(${i})" class="pgbtn ${i===PAGE?'pgon':''}">${i}</button>`;
      if(e<pages){ if(e<pages-1) h+='<span class="text-neutral-900/25 px-0.5">…</span>'; h+=`<button onclick="goPage(${pages})" class="pgbtn">${pages}</button>`; }
      h+=`<button ${PAGE<pages?`onclick="goPage(${PAGE+1})"`:'disabled'} class="pgbtn" aria-label="다음">›</button>`;
      return h+'</div>';
    }

    function qList(arr,q,startNum,showBadge){ return '<div class="bg-white rounded-2xl border border-ink/8 shadow-soft px-4 divide-y divide-ink/6">'+arr.map((e,i)=>qRow(e,q,(startNum||0)+i+1,showBadge)).join('')+'</div>'; }
    function qRow(e,q,num,showBadge){
      var ans=(e.def||'').replace(/^\s*한마디로\s*[—-]\s*/,'');
      var deepInner='';
      if(Array.isArray(e.deep)&&e.deep.length){
        deepInner='<div class="mt-3.5 space-y-3.5 border-l-2 border-sand pl-4">'+e.deep.map(function(s){
          if(s.h==='흔한 오해'||s.misc){ return `<div class="bg-[#faf5ec] border-l-2 border-gold/50 rounded-r-lg px-3.5 py-2.5"><p class="text-[12.5px] font-bold text-gold mb-0.5">${esc(s.h||'흔한 오해')}</p><p class="text-[13.5px] text-neutral-900/80">${esc(s.p||'')}</p></div>`; }
          return `<div>${s.h?`<h4 class="font-bold text-neutral-900 text-[14px] mb-1">${esc(s.h)}</h4>`:''}<p class="text-[13.5px] text-neutral-900/80">${esc(s.p||'')}</p></div>`;
        }).join('')+'</div>';
      }
      var scr=(e.scriptures||[]).map(s=>`<button type="button" class="scrchip inline-block bg-sand/70 hover:bg-gold/15 text-neutral-900/70 text-[11px] px-2 py-0.5 rounded mr-1 mb-1 transition" onclick="showScr(event,'${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('');
      var rel=(e.related||[]).map(r=>`<button onclick="searchFor('${esc(r).replace(/'/g,"\\'")}')" class="text-gold/90 text-xs hover:underline mr-2.5">${esc(r)}</button>`).join('');
      return `<details class="qrow">
        <summary class="cursor-pointer select-none flex items-center gap-3 py-3.5 hover:bg-sand/20 rounded-lg px-2 -mx-2 transition">
          <span class="text-[13px] font-semibold text-neutral-900/35 shrink-0 w-7 text-right" style="font-variant-numeric:tabular-nums">${num||''}</span>
          <span class="qtitle flex-1 min-w-0 font-semibold text-[15px] text-neutral-900 leading-snug transition">${hl(e.term||'',q)}</span>
          ${(showBadge&&e.book)?`<span class="shrink-0 text-[11px] font-semibold text-gold bg-gold/10 border border-gold/20 px-2 py-0.5 rounded-full whitespace-nowrap">${esc(e.book)}</span>`:''}
          <span class="qcaret text-neutral-900/25 shrink-0 text-xs transition">▼</span>
        </summary>
        <div class="qbody pl-10 pr-1 pb-5 pt-1">
          <p class="text-[14px] text-neutral-900/85 leading-[1.9]">${hl(ans,q)}</p>
          ${deepInner}
          ${scr?`<div class="mt-3.5">${scr}</div>`:''}
          <div class="flex items-center flex-wrap gap-x-1 gap-y-1 mt-2.5 text-xs">${rel}</div>
          ${(e._admin&&isAdmin())?`<div class="mt-2.5 flex gap-1.5"><button onclick="event.preventDefault();editQa('${e.id}')" class="text-[11px] text-gold border border-gold/30 rounded-full px-2.5 py-0.5 hover:bg-gold/10">수정</button><button onclick="event.preventDefault();deleteQa('${e.id}')" class="text-[11px] text-rose-500 border border-rose-200 rounded-full px-2.5 py-0.5 hover:bg-rose-50">삭제</button></div>`:''}
        </div>
      </details>`;
    }

    /* ===== 관리자 작성/수정/삭제 (site_content['qa_posts'] 공유) ===== */
    function openEditor(e){ EDIT_ID=(e&&e.id)?e.id:null;
      $('fBook').innerHTML=OT.concat(NT).map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
      $('fTopic').innerHTML=TOPICS.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
      $('qaModalTitle').textContent=e?'권별 Q&A 수정':'새 권별 Q&A 작성';
      $('fTerm').value=e?(e.term||''):''; $('fBook').value=e?(e.book||OT[0]):(SEL||OT[0]); $('fTopic').value=e?(e.faqTopic||TOPICS[2]):TOPICS[2];
      $('fDef').value=e?(e.def||'').replace(/^\s*한마디로\s*[—-]\s*/,''):'';
      $('fDeep').value=(e&&e.deep)?e.deep.map(s=>(s.h?s.h+' | ':'')+(s.p||'')).join('\n\n'):'';
      $('fScr').value=(e&&e.scriptures)?e.scriptures.join(', '):''; $('fRel').value=(e&&e.related)?e.related.join(', '):'';
      $('fMsg').textContent=''; $('qaModal').classList.remove('hidden');
    }
    function closeEditor(){ $('qaModal').classList.add('hidden'); EDIT_ID=null; }
    function parseDeep(txt){ return String(txt||'').split(/\n\s*\n/).map(function(b){ b=b.trim(); if(!b) return null; var i=b.indexOf('|'); if(i>0&&i<40) return {h:b.slice(0,i).trim(),p:b.slice(i+1).trim()}; return {p:b}; }).filter(Boolean); }
    function pushQa(arr,onOk){ var s=qaSession(); if(!s){ $('fMsg').textContent='로그인이 필요합니다'; return; }
      fetch(SB+'/rest/v1/site_content',{method:'POST',headers:{apikey:AK,Authorization:'Bearer '+(s.access_token||AK),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'qa_posts',data:arr,updated_at:new Date().toISOString()})})
        .then(function(r){ if(r.ok) onOk(); else return r.text().then(t=>{ $('fMsg').textContent='저장 오류: '+t.slice(0,90); }); }).catch(function(){ $('fMsg').textContent='네트워크 오류'; });
    }
    function reflectAdmin(arr){ QA_ADMIN=arr;
      var others=VERSE.filter(x=>!x._admin);
      VERSE=arr.filter(x=>x.book).map(function(x){x._admin=true;return x;}).concat(others);
    }
    function saveQa(){ var term=$('fTerm').value.trim(), def=$('fDef').value.trim();
      if(!term||!def){ $('fMsg').textContent='질문과 한마디 답은 필수입니다'; return; }
      var obj={ id:EDIT_ID||('a'+Date.now()), term:term, category:'자주 묻는 질문', book:$('fBook').value, faqTopic:$('fTopic').value,
        def: def.indexOf('한마디로')===0?def:('한마디로 — '+def), deep:parseDeep($('fDeep').value),
        scriptures:$('fScr').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean),
        related:$('fRel').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean), _admin:true, updated:new Date().toISOString() };
      obj=JSON.parse(JSON.stringify(obj).replace(/세례/g,'침례'));
      var arr=QA_ADMIN.slice(); var idx=arr.findIndex(x=>x.id===obj.id); if(idx>=0) arr[idx]=obj; else arr.unshift(obj);
      $('fSave').disabled=true; $('fMsg').textContent='저장 중…';
      pushQa(arr,function(){ $('fSave').disabled=false; reflectAdmin(arr); closeEditor(); SEL=obj.book; render(); });
    }
    function editQa(id){ var e=QA_ADMIN.find(x=>x.id===id); if(e) openEditor(e); }
    function deleteQa(id){ if(!confirm('이 Q&A를 삭제할까요?')) return; var arr=QA_ADMIN.filter(x=>x.id!==id); pushQa(arr,function(){ reflectAdmin(arr); render(); }); }

    /* ===== 성구 말풍선 ===== */
    (function(){ var st=document.createElement('style'); st.textContent=
      '.pgbtn{min-width:34px;height:34px;padding:0 9px;border-radius:9px;font-size:13px;font-weight:600;color:rgba(33,58,107,.62);background:#fff;border:1px solid rgba(33,58,107,.09);cursor:pointer;transition:all .12s}'
      +'.pgbtn:hover:not(:disabled){border-color:rgba(0,112,74,.42);color:#00704a}'
      +'.pgbtn:disabled{opacity:.32;cursor:default}'
      +'.pgbtn.pgon{background:#00704a;color:#fff;border-color:#00704a}'
      +'.scrchip{cursor:pointer;border:0}'
      +'#scrBubble{position:absolute;z-index:130;background:#fff;border:1px solid rgba(33,58,107,.12);border-radius:14px;box-shadow:0 14px 40px -10px rgba(21,32,58,.32);max-width:92vw}'
      +'#scrBubble .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;border-bottom:1px solid rgba(33,58,107,.07)}'
      +'#scrBubble .bh b{color:#00704a;font-size:12.5px}#scrBubble .bh button{border:0;background:transparent;color:rgba(33,58,107,.4);cursor:pointer;font-size:13px}'
      +'#scrBubble .bbody{padding:11px 14px 13px;max-height:48vh;overflow:auto}#scrBubble .bbody p{color:rgba(33,58,107,.88);line-height:1.78;font-size:13px;margin-bottom:5px}#scrBubble .bbody p b{color:#00704a;font-weight:700;margin-right:3px;font-size:11px}'
      +'#scrBubble .blink{display:inline-block;margin-top:6px;color:#00704a;font-weight:600;font-size:12.5px;text-decoration:none}';
      document.head.appendChild(st); })();
    var chCache={};
    function parseRef(s){ var m=String(s||'').trim().match(/^(.+?)\s*(\d+):(\d+)(?:[-~](\d+))?$/); if(!m) return null; var nm=m[1].trim(); var f=ABBR_F[nm]||KO2FILE[nm]; if(!f) return null; return {file:f,ch:+m[2],v1:+m[3],v2:m[4]?+m[4]:+m[3]}; }
    function getChapter(file,ch){ var k=file+'-'+ch; if(chCache[k]!==undefined) return Promise.resolve(chCache[k]); return fetch('bible/kr/'+k+'.json').then(r=>r.ok?r.json():null).then(j=>{chCache[k]=j;return j;}).catch(()=>{chCache[k]=null;return null;}); }
    function closeBubble(){ var b=$('scrBubble'); if(b) b.remove(); }
    function showBubble(anchor,title,html){ closeBubble(); var b=document.createElement('div'); b.id='scrBubble'; b.innerHTML='<div class="bh"><b>'+esc(title)+'</b><button type="button" onclick="closeBubble()">✕</button></div><div class="bbody">'+html+'</div>'; document.body.appendChild(b); var bw=Math.min(340,window.innerWidth-24); b.style.width=bw+'px'; var r=anchor.getBoundingClientRect(); var left=r.left+window.scrollX+r.width/2-bw/2; left=Math.max(window.scrollX+12,Math.min(left,window.scrollX+window.innerWidth-bw-12)); b.style.left=left+'px'; b.style.top=(r.bottom+window.scrollY+9)+'px'; var bh=b.offsetHeight; if(r.bottom+bh+16>window.innerHeight&&r.top-bh-9>0){ b.style.top=(r.top+window.scrollY-bh-9)+'px'; } }
    function showScr(ev,ref){ ev.stopPropagation(); var anchor=ev.currentTarget; var p=parseRef(ref); if(!p){ showBubble(anchor,ref,'<p>구절을 찾을 수 없어요.</p>'); return; } var link='bible.html?b='+p.file+'&c='+p.ch+'&v='+p.v1; var linkHtml='<a class="blink" href="'+link+'">본문에서 보기 →</a>'; showBubble(anchor,ref,'<p>불러오는 중…</p>'); getChapter(p.file,p.ch).then(function(ch){ var h=''; if(ch){ var lines=[]; for(var v=p.v1; v<=p.v2&&v<=p.v1+3; v++){ if(ch[v-1]) lines.push('<p><b>'+v+'</b>'+esc(ch[v-1])+'</p>'); } h=lines.length?lines.join(''):'<p>이 구절은 번역 준비 중입니다.</p>'; if(p.v2>p.v1+3) h+='<p style="color:rgba(33,58,107,.45)">…</p>'; } else h='<p>이 책은 곧 제공됩니다.</p>'; showBubble(anchor,ref,h+linkHtml); }); }
    document.addEventListener('click', function(e){ if(!e.target.closest('#scrBubble') && !e.target.closest('.scrchip')) closeBubble(); });
    setTimeout(renderAdminBar,1500);
    window.onSearch=onSearch; window.pickBook=pickBook; window.searchFor=searchFor; window.showScr=showScr; window.closeBubble=closeBubble;
    window.openEditor=openEditor; window.closeEditor=closeEditor; window.saveQa=saveQa; window.editQa=editQa; window.deleteQa=deleteQa;
  </script>

  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>

  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit', lock: async (_n, _t, fn) => await fn() } });
    let isAdmin = false, SESSION = null, COLS = [], current = null, editingId = null, quill = null;
    function myName(){ const u=SESSION&&SESSION.user; if(!u) return '회원'; return (u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||(u.email?u.email.split('@')[0]:'회원'); }
    function nl2(s){ return esc(s).replace(/\n/g,'<br>'); }

    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function plain(html){ const d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').trim(); }
    function sanitize(html){
      const d=document.createElement('div'); d.innerHTML=html||'';
      d.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,input,button,textarea,svg,math,frame,frameset,applet,noscript').forEach(n=>n.remove());
      d.querySelectorAll('*').forEach(el=>{
        [...el.attributes].forEach(a=>{
          const name=a.name.toLowerCase(), val=a.value||'';
          if(/^on/i.test(name)){ el.removeAttribute(a.name); return; }
          if(/^(href|src|xlink:href|formaction|action|srcdoc|srcset|data|background|poster)$/.test(name)){
            const v=val.replace(/\s+/g,'').toLowerCase(), okImg=(name==='src')&&/^data:image\//i.test(val.trim());
            if(!okImg && /^(javascript:|data:|vbscript:)/.test(v)){ el.removeAttribute(a.name); return; }
          }
          if(name==='style' && /expression\(|javascript:|behavior:|@import|url\(/i.test(val)){ el.removeAttribute(a.name); }
        });
        if(el.tagName==='A'){ el.setAttribute('rel','noopener noreferrer nofollow'); }
      });
      return d.innerHTML;
    }
    function timeAgo(iso){
      const diff=Date.now()-new Date(iso).getTime(); const day=Math.floor(diff/86400000);
      if(day<1) return '오늘'; if(day<7) return day+'일 전';
      return new Date(iso).toLocaleDateString('ko-KR');
    }
    function shareItem(title,url){
      const u=url||location.href;
      if(window.biblyShare){ biblyShare(title, u); return; }
      if(navigator.share){ navigator.share({title:title||document.title,url:u}).catch(()=>{}); }
      else { try{ navigator.clipboard.writeText(u); alert('링크가 복사되었어요!'); }catch(e){ prompt('링크 복사', u); } }
    }
    // 목록 카드에서 칼럼 공유 (해당 칼럼으로 바로 연결)
    function shareCol(el){
      shareItem(el.dataset.t, location.origin + location.pathname + '#col-' + el.dataset.id);
    }

    sb.auth.getSession().then(({data:{session}})=>setUser(session));
    sb.auth.onAuthStateChange((_e,session)=>setUser(session));
    function setUser(session){
      SESSION = session;
      isAdmin = !!(session && session.user && session.user.email === ADMIN_EMAIL);
      document.getElementById('writeBtn').classList.toggle('hidden', !isAdmin);
      { var _nu=document.getElementById('navUser'); if(_nu) _nu.innerHTML = isAdmin ? '<span class="text-gold font-semibold">관리자</span>' : ''; }
      if(current) renderCommentForm();
    }

    function showList(){ ['readView','editView'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('listView').classList.remove('hidden'); if(location.hash) history.replaceState(null,'',location.pathname); }
    function show(id){ ['listView','readView','editView'].forEach(x=>document.getElementById(x).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

    /* 목록: 제목만 번호와 함께 한 줄씩 · 10개마다 페이지 나눔.
       홈페이지 칼럼 + 네이버 블로그 글을 한 목록에 날짜순으로 합쳐 보여준다.
       (블로그 글은 본문을 복제하지 않고 링크로 연결 — 중복 콘텐츠 감점 방지) */
    const PER_PAGE = 10;
    let ROWS = [], PAGE = 1;

    async function loadList(){
      const wrap=document.getElementById('colList');
      const { data, error } = await sb.from('columns').select('id,title,excerpt,cover_url,created_at,author_name').order('created_at',{ascending:false});
      if(error){ wrap.innerHTML=`<p class="text-neutral-900/40 text-sm text-center py-8">불러오기 오류: ${esc(error.message)}</p>`; return; }
      COLS = data||[];

      // 네이버 블로그 최신글 — content/blog-feed.json (6시간마다 자동 갱신)
      let blog=[];
      try{
        const r=await fetch('content/blog-feed.json?t='+Date.now());
        if(r.ok){ const j=await r.json(); blog=(j.items||[]); }
      }catch(e){}

      ROWS = COLS.map(c=>({ kind:'col', id:c.id, title:c.title||'', date:c.created_at }))
        .concat(blog.map(b=>({ kind:'blog', link:b.link, title:b.title||'', date:(b.date||'')+'T09:00:00', cat:b.category })))
        .filter(r=>r.title)
        .sort((a,b)=> new Date(b.date) - new Date(a.date));

      if(!ROWS.length){
        wrap.innerHTML='<p class="text-neutral-900/40 text-sm text-center py-12">아직 칼럼이 없습니다.'+(isAdmin?' 첫 글을 써보세요!':'')+'</p>';
        document.getElementById('colPager').innerHTML=''; return;
      }
      PAGE = 1; renderPage();
    }

    function renderPage(){
      const wrap=document.getElementById('colList');
      const total=ROWS.length, pages=Math.max(1, Math.ceil(total/PER_PAGE));
      if(PAGE>pages) PAGE=pages;
      const start=(PAGE-1)*PER_PAGE;
      const rows=ROWS.slice(start, start+PER_PAGE);

      wrap.innerHTML = rows.map((r,i)=>{
        const no = total - start - i;                       // 최신 글이 가장 큰 번호
        const d  = new Date(r.date);
        const ds = isNaN(d) ? '' : `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
        const badge = r.kind==='blog'
          ? '<span class="shrink-0 rounded-full bg-gold/10 text-gold text-[11px] font-semibold px-2 py-0.5">블로그</span>' : '';
        const open = r.kind==='blog'
          ? `window.open('${r.link}','_blank','noopener')` : `openColumn('${r.id}')`;
        return `<div onclick="${open}" class="group flex items-center gap-2 sm:gap-3 px-4 sm:px-5 py-3.5 border-b border-ink/8 last:border-0 cursor-pointer hover:bg-sand/50 transition">
            <span class="w-7 shrink-0 text-center text-[13px] text-neutral-900/35 tabular-nums">${no}</span>
            <span class="min-w-0 flex-1 truncate font-semibold text-[15px] text-neutral-900/90 group-hover:text-gold transition">${esc(r.title)}</span>
            ${badge}
            <span class="shrink-0 text-xs text-neutral-900/40 tabular-nums hidden sm:block">${ds}</span>
          </div>`;
      }).join('');

      // 페이지 번호
      const pg=document.getElementById('colPager');
      if(pages<=1){ pg.innerHTML=''; return; }
      const btn=(label,p,on,dis)=>
        `<button ${dis?'disabled':`onclick="gotoPage(${p})"`} class="min-w-[34px] h-[34px] px-2 rounded-lg text-sm font-semibold transition ${
          on ? 'bg-gold text-white' : dis ? 'text-neutral-900/20 cursor-default' : 'text-neutral-900/60 hover:bg-sand'}">${label}</button>`;
      let h = btn('‹', PAGE-1, false, PAGE<=1);
      const from=Math.max(1, PAGE-2), to=Math.min(pages, from+4);
      for(let p=Math.max(1,to-4); p<=to; p++) h += btn(p, p, p===PAGE, false);
      h += btn('›', PAGE+1, false, PAGE>=pages);
      pg.innerHTML = h;
    }

    function gotoPage(p){
      PAGE=p; renderPage();
      document.getElementById('listView').scrollIntoView({behavior:'smooth', block:'start'});
    }

    async function openColumn(id){
      const { data, error } = await sb.from('columns').select('*').eq('id', id).single();
      if(error || !data){ alert('글을 불러오지 못했습니다.'); return; }
      current = data;
      history.replaceState(null,'','#col-'+id);
      document.getElementById('rTitle').textContent = data.title||'';
      document.getElementById('rDate').textContent = 'COLUMN';
      document.getElementById('rMeta').innerHTML = esc(data.author_name||'오광일') + ' · ' + new Date(data.created_at).toLocaleDateString('ko-KR') + ' · ' + ((Number(data.views)||0)+1).toLocaleString();
      document.getElementById('rBody').innerHTML = sanitize(data.body_html||'');
      const url = location.origin + location.pathname + '#col-' + id;
      document.getElementById('rShare').onclick = ()=>shareItem(data.title, url);
      document.getElementById('rAdmin').classList.toggle('hidden', !isAdmin);
      document.getElementById('rAdmin').classList.toggle('flex', isAdmin);
      try{ sb.rpc('bump_column_views', { p_id: id }); }catch(e){}
      renderCommentForm(); loadComments(id);
      show('readView'); window.scrollTo(0,0);
    }

    // ===== 댓글 =====
    function renderCommentForm(){
      const f = document.getElementById('cForm'); if(!f) return;
      if(SESSION && SESSION.user){
        f.innerHTML = `<div class="bg-white border border-ink/12 rounded-2xl p-4">
          <textarea id="cInput" rows="3" placeholder="댓글을 남겨 주세요…" class="w-full text-sm outline-none resize-none"></textarea>
          <div class="flex items-center justify-between mt-2 pt-2 border-t border-ink/8">
            <span class="text-xs text-neutral-900/40">${esc(myName())}님</span>
            <button onclick="addComment()" class="bg-gold text-white text-sm font-semibold px-4 py-2 rounded-full hover:opacity-90 transition">등록</button>
          </div></div>`;
      } else {
        f.innerHTML = `<div class="bg-ink/[0.03] border border-ink/8 rounded-2xl p-5 text-center text-sm text-neutral-900/55">댓글을 남기려면 <a href="index.html" class="text-gold font-semibold hover:underline">로그인</a> 해 주세요.</div>`;
      }
    }
    async function loadComments(colId){
      const list = document.getElementById('cList');
      const { data, error } = await sb.from('column_comments').select('*').eq('column_id', colId).order('created_at',{ascending:true});
      if(error){ list.innerHTML = `<p class="text-neutral-900/40 text-sm text-center py-4">댓글을 불러오지 못했습니다. (관리자: db/column_social.sql 실행 필요)</p>`; document.getElementById('cCount').textContent=''; return; }
      const rows = data||[];
      document.getElementById('cCount').textContent = rows.length || '';
      if(!rows.length){ list.innerHTML = '<p class="text-neutral-900/35 text-sm text-center py-6">첫 댓글을 남겨 보세요.</p>'; return; }
      const myId = SESSION&&SESSION.user&&SESSION.user.id;
      list.innerHTML = rows.map(c=>{
        const canDel = isAdmin || (myId && c.user_id===myId);
        return `<div class="bg-white border border-ink/8 rounded-2xl px-4 py-3.5">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="font-semibold text-sm">${esc(c.author_name||'회원')}</span>
            <span class="text-xs text-neutral-900/35">${timeAgo(c.created_at)}</span>
            ${canDel?`<button onclick="delComment('${c.id}')" class="ml-auto text-xs text-neutral-900/30 hover:text-red-500">삭제</button>`:''}
          </div>
          <p class="text-[15px] text-neutral-900/80 leading-relaxed">${nl2(c.content)}</p>
        </div>`;
      }).join('');
    }
    async function addComment(){
      if(!(SESSION&&SESSION.user) || !current) return;
      const el = document.getElementById('cInput'); const content = (el.value||'').trim();
      if(!content){ el.focus(); return; }
      const { error } = await sb.from('column_comments').insert({ column_id: current.id, user_id: SESSION.user.id, author_name: myName(), content });
      if(error){ alert('등록 오류: ' + error.message); return; }
      el.value=''; loadComments(current.id);
    }
    async function delComment(id){
      if(!confirm('이 댓글을 삭제할까요?')) return;
      const { error } = await sb.from('column_comments').delete().eq('id', id);
      if(error){ alert('삭제 오류: ' + error.message); return; }
      if(current) loadComments(current.id);
    }

    function registerQuillStyles(){ if(window.__qReg || !window.Quill) return; window.__qReg = true;
      /* 글자 크기·폰트 whitelist와 픽커 라벨/미리보기는 editor-enhance.js가 공통 등록 */

      /* 첨부파일 카드를 Quill 이 정식 요소로 다루게 하는 커스텀 블롯.
         이렇게 해야 저장·재편집을 반복해도 카드가 무너지지 않고, 본문(body_html)에
         그대로 남아 별도 DB 칼럼 없이 동작한다. */
      const BlockEmbed = Quill.import('blots/block/embed');
      class AttachBlot extends BlockEmbed {
        static create(v){
          const n = super.create();
          n.setAttribute('href', v.url);
          n.setAttribute('target', '_blank');
          n.setAttribute('rel', 'noopener noreferrer nofollow');
          n.setAttribute('data-kind', v.kind || 'file');
          n.setAttribute('data-name', v.name || '첨부파일');
          n.setAttribute('data-size', v.size || '');
          n.innerHTML =
            '<span class="cfIcon">' + esc((v.kind || 'file').toUpperCase()) + '</span>'
          + '<span class="cfBody"><span class="cfName">' + esc(v.name || '첨부파일') + '</span>'
          + '<span class="cfMeta">' + esc(v.size || '') + '</span></span>'
          + '<span class="cfGo">내려받기 ↓</span>';
          return n;
        }
        static value(n){
          return { url:n.getAttribute('href'), kind:n.getAttribute('data-kind'),
                   name:n.getAttribute('data-name'), size:n.getAttribute('data-size') };
        }
      }
      AttachBlot.blotName = 'biblyAttach';
      AttachBlot.tagName  = 'a';
      AttachBlot.className = 'colFile';
      Quill.register(AttachBlot);
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    // 확장자 → 카드 색상·라벨용 분류
    function fileKind(ext){
      ext = (ext||'').toLowerCase();
      if(ext==='pdf') return 'pdf';
      if(['doc','docx','rtf','odt'].includes(ext)) return 'doc';
      if(['xls','xlsx','csv','ods'].includes(ext)) return 'xls';
      if(['ppt','pptx','odp'].includes(ext)) return 'ppt';
      if(['hwp','hwpx'].includes(ext)) return 'hwp';
      if(['zip','7z','rar'].includes(ext)) return 'zip';
      if(['mp3','m4a','wav'].includes(ext)) return 'mp3';
      if(['txt','md'].includes(ext)) return 'txt';
      return ext ? ext.slice(0,4) : 'file';
    }
    function fileSize(bytes){
      if(!bytes && bytes!==0) return '';
      if(bytes < 1024) return bytes + ' B';
      if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
      return (bytes/1024/1024).toFixed(1) + ' MB';
    }
    function ensureQuill(){
      if(quill) return quill;
      registerQuillStyles();
      quill = new Quill('#editor', {
        theme:'snow',
        placeholder:'블로그처럼 자유롭게 작성하세요… (워드·한글 글 복붙 OK)',
        modules:{ toolbar:[
          [{ size: (window.BIBLY_EDITOR_SIZES || ['13px',false,'20px','24px']) }, { font: (window.BIBLY_EDITOR_FONTS || ['serif','monospace']) }],
          [{ header:[1,2,3,false] }],
          ['bold','italic','underline','strike'],
          [{ color:[] }, { background:[] }],
          [{ align:[] }],
          [{ list:'ordered' }, { list:'bullet' }],
          ['blockquote'],
          ['link','image','biblyAttach'],
          ['clean']
        ] }
      });
      // 첨부 버튼은 아이콘만 두면 눈에 띄지 않아 '파일 첨부' 글자를 함께 넣는다
      try{
        const btn = document.querySelector('.ql-toolbar .ql-biblyAttach');
        if(btn){
          btn.innerHTML = '<span class="cfClip">📎</span><span class="cfLabel">파일 첨부</span>';
          btn.title = 'PDF·한글·워드 등 자료를 본문에 첨부합니다 (20MB 이하)';
        }
      }catch(e){}
      // 이미지는 저장공간(community 버킷)에 업로드 후 본문에 삽입 (base64 방지·블로그식)
      quill.getModule('toolbar').addHandler('image', () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = async () => {
          const file = input.files[0]; if(!file) return;
          if(file.size > 5*1024*1024){ alert('이미지는 5MB 이하만 가능해요.'); return; }
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const path = `columns/${Date.now()}.${ext}`;
          const { error } = await sb.storage.from('community').upload(path, file);
          if(error){ alert('이미지 업로드 오류: ' + error.message); return; }
          const url = sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          const range = quill.getSelection(true);
          quill.insertEmbed(range.index, 'image', url);
          quill.setSelection(range.index + 1);
        };
        input.click();
      });
      // 파일 첨부 — 이미지와 같은 community 버킷에 올리고 본문에 첨부 카드로 삽입
      quill.getModule('toolbar').addHandler('biblyAttach', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.md,.zip,.mp3,.m4a';
        input.onchange = async () => {
          const file = input.files[0]; if(!file) return;
          if(file.size > 20*1024*1024){ alert('첨부파일은 20MB 이하만 가능해요.'); return; }
          const btn = document.querySelector('.ql-toolbar .ql-biblyAttach');
          if(btn){ btn.style.opacity='.4'; btn.style.pointerEvents='none'; }
          const ext  = (file.name.split('.').pop() || '').toLowerCase();
          // 한글 파일명은 저장소 경로에서 문제가 될 수 있어 경로는 안전한 이름으로,
          // 화면에 보이는 이름은 원본 그대로 카드에 담는다.
          const safe = file.name.replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').slice(0,40) || 'file';
          const path = `columns/files/${Date.now()}-${safe}.${ext || 'bin'}`;
          const { error } = await sb.storage.from('community').upload(path, file);
          if(btn){ btn.style.opacity=''; btn.style.pointerEvents=''; }
          if(error){ alert('파일 업로드 오류: ' + error.message); return; }
          const url = sb.storage.from('community').getPublicUrl(path).data.publicUrl;
          const range = quill.getSelection(true) || { index: quill.getLength() };
          quill.insertEmbed(range.index, 'biblyAttach', {
            url, kind:fileKind(ext), name:file.name, size:fileSize(file.size)
          }, 'user');
          quill.setSelection(range.index + 1, 0);
        };
        input.click();
      });
      // 편집 중에는 카드를 눌러도 파일이 열리지 않게 한다(선택·삭제 편의)
      quill.root.addEventListener('click', (e) => {
        const card = e.target.closest && e.target.closest('a.colFile');
        if(card){ e.preventDefault(); }
      });
      return quill;
    }
    function openEditor(){
      editingId=null; document.getElementById('eTitle').value=''; document.getElementById('eCover').value=''; document.getElementById('eMsg').textContent='';
      show('editView'); ensureQuill(); quill.setText(''); window.scrollTo(0,0);
    }
    function editCurrent(){
      if(!current) return;
      editingId=current.id; document.getElementById('eTitle').value=current.title||''; document.getElementById('eCover').value=current.cover_url||''; document.getElementById('eMsg').textContent='';
      show('editView'); ensureQuill(); quill.root.innerHTML = sanitize(current.body_html||''); window.scrollTo(0,0);
    }
    async function saveColumn(){
      const title=document.getElementById('eTitle').value.trim();
      const cover=document.getElementById('eCover').value.trim();
      const body=sanitize(quill.root.innerHTML);
      const msg=document.getElementById('eMsg'); const btn=document.getElementById('saveBtn');
      if(!title){ msg.textContent='제목을 입력하세요.'; return; }
      if(plain(body).length<1){ msg.textContent='내용을 입력하세요.'; return; }
      btn.disabled=true; btn.textContent='저장 중…'; msg.textContent='';
      const row={ title, body_html:body, excerpt:plain(body).slice(0,100), cover_url:cover||null };
      let res;
      if(editingId) res=await sb.from('columns').update(row).eq('id',editingId);
      else res=await sb.from('columns').insert(row);
      btn.disabled=false; btn.textContent='발행하기';
      if(res.error){ msg.textContent='저장 오류: '+res.error.message; return; }
      await loadList(); showList();
    }
    async function deleteCurrent(){
      if(!current || !confirm('이 칼럼을 삭제할까요?')) return;
      const { error } = await sb.from('columns').delete().eq('id', current.id);
      if(error){ alert('삭제 오류: '+error.message); return; }
      await loadList(); showList();
    }

    (async()=>{
      await loadList();
      const m = location.hash.match(/^#col-(.+)$/);
      if(m) openColumn(m[1]);
    })();
  </script>

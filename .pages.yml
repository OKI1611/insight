media:
  input: images
  output: /images

content:
  - name: posts
    label: 인사이트 글
    type: file
    path: content/posts.json
    fields:
      - name: posts
        label: 글 목록
        type: object
        list: true
        fields:
          - name: title
            label: 제목
            type: string
          - name: category
            label: 분류
            type: select
            options:
              values:
                - 인사이트
                - 자료실
          - name: date
            label: 날짜
            type: date
            options:
              format: yyyy-MM-dd
          - name: summary
            label: 한 줄 요약 (목록 카드에 표시)
            type: string
          - name: image
            label: 대표 이미지 (선택 — 없으면 기본 배경)
            type: image
          - name: body
            label: 본문
            type: rich-text

  - name: course
    label: 강의실 (단계별 강의)
    type: file
    path: content/course.json
    fields:
      - name: title
        label: 강의실 제목
        type: string
      - name: subtitle
        label: 부제
        type: string
      - name: instructor
        label: 강사
        type: string
      - name: levels
        label: 단계 (기초·초급·중급·고급)
        type: object
        list: true
        fields:
          - name: name
            label: 단계 이름 (예 기초)
            type: string
          - name: desc
            label: 단계 설명
            type: string
          - name: lessons
            label: 강의 목차
            type: object
            list: true
            fields:
              - name: title
                label: 강의 제목
                type: string
              - name: youtube
                label: 유튜브 링크 (또는 영상 ID)
                type: string
              - name: summary
                label: 강의 소개글 · 요약 (강의실에 표시)
                type: text
              - name: duration
                label: 시간 (예 약 40분)
                type: string
              - name: free
                label: 무료 공개 (체크=무료, 해제=오픈 예정)
                type: boolean

  - name: resources
    label: 자료실
    type: file
    path: content/resources.json
    fields:
      - name: resources
        label: 자료 목록
        type: object
        list: true
        fields:
          - name: title
            label: 자료 제목
            type: string
          - name: category
            label: 분류 (예 암송노트·강의노트·도표)
            type: string
          - name: desc
            label: 설명
            type: text
          - name: link
            label: 다운로드/보기 링크 (비우면 '준비 중')
            type: string

  - name: videos
    label: 유튜브 영상
    type: file
    path: content/videos.json
    fields:
      - name: videos
        label: 영상 목록
        type: object
        list: true
        fields:
          - name: title
            label: 제목
            type: string
          - name: youtube
            label: 유튜브 링크 (또는 영상 ID)
            type: string

  - name: site
    label: 사이트 설정 (메뉴·가격·후원)
    type: file
    path: content/site.json
    fields:
      - name: menu
        label: 상단 메뉴
        type: object
        list: true
        fields:
          - name: label
            label: 메뉴 이름
            type: string
          - name: href
            label: 이동 위치 (예 #catalog)
            type: string
      - name: pricing
        label: 수강권 가격 (숫자만, 비우면 ₩ — 로 표시)
        type: object
        fields:
          - name: light
            label: 라이트 가격
            type: string
          - name: standard
            label: 스탠다드 가격
            type: string
          - name: premium
            label: 프리미엄 가격
            type: string
      - name: instructor
        label: 강사 소개
        type: object
        fields:
          - name: photo
            label: 강사 사진
            type: image
      - name: leadmagnet
        label: 가입 선물 (리드 마그넷)
        type: object
        fields:
          - name: title
            label: 선물 이름 (가입창에 표시)
            type: string
          - name: file
            label: 선물 파일/링크 (PDF 주소 — 가입 완료 시 열림)
            type: string
      - name: support
        label: 후원 · 연락처
        type: object
        fields:
          - name: bank_name
            label: 은행명
            type: string
          - name: bank_account
            label: 계좌번호
            type: string
          - name: bank_holder
            label: 예금주
            type: string
          - name: simplepay_url
            label: 간편 송금 링크 (link2.my 등 — 비우면 버튼 숨김)
            type: string
          - name: kakaopay_url
            label: 카카오페이 송금 링크
            type: string
          - name: paypal_url
            label: PayPal 링크
            type: string
          - name: contact_email
            label: 문의 이메일
            type: string

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:'#213a6b', navy:'#182c54', gold:'#b8923f', sand:'#eaf0f8', paper:'#f7f9fc' },
      fontFamily: { sans:['Pretendard','system-ui','sans-serif'], display:['"Noto Serif KR"','Pretendard','serif'] },
      boxShadow: { soft:'0 2px 10px -4px rgba(21,32,58,.10)', card:'0 14px 40px -18px rgba(21,32,58,.22)' }
    }}}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = 'https://bmxkndkwefdgsomlznoo.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJteGtuZGt3ZWZkZ3NvbWx6bm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzAwODIsImV4cCI6MjA5NjE0NjA4Mn0.l1yHhMVYwMqYSL8ub9PtrJPOl7CYr7yqstG2AER1EaU';
  </script>
  <style>
    h1,h2{font-family:'Noto Serif KR',Pretendard,serif}

</head>
<body class="font-sans bg-paper text-ink antialiased min-h-screen">

  <div id="siteHeader" data-active="bible-plan.html"></div>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <div class="mb-6">
      <p class="text-gold text-xs font-bold tracking-[0.3em] mb-2">BIBLE READING PLAN</p>
      <h1 class="text-2xl md:text-3xl font-bold">성경 통독표 · 1년 1독</h1>
      <p class="text-ink/55 text-sm mt-2 leading-relaxed">하루 읽을 분량을 확인하고 ✓ 체크하며 통독 진도를 스스로 관리하세요.<br class="hidden sm:block"/>1독이 기본이지만, 원하면 2독·3독에 맞춰 하루 분량이 자동으로 다시 편성됩니다.</p>
    </div>

    <!-- 진행 요약 + 컨트롤 -->
    <div class="bg-white rounded-2xl border border-ink/8 shadow-card p-5 mb-5">
      <!-- 진도 바 -->
      <div class="flex items-end justify-between gap-3 mb-2">
        <div>
          <p class="text-sm text-ink/55">나의 통독 진도</p>
          <p class="text-2xl font-bold mt-0.5"><span id="pctText" class="text-gold">0%</span> <span id="doneText" class="text-base font-semibold text-ink/70">· 0 / 365일</span></p>
        </div>
        <div class="text-right">
          <p id="streakText" class="text-sm font-semibold text-ink/70">🔥 연속 0일</p>
          <p id="cloudText" class="text-[11px] text-ink/40 mt-0.5">기기에 저장됨</p>
        </div>
      </div>
      <div class="h-2.5 rounded-full bg-ink/8 overflow-hidden"><div id="pctBar" class="h-full bg-gold transition-all" style="width:0%"></div></div>

      <!-- 회독 선택 -->
      <div class="mt-5">
        <p class="text-xs font-semibold text-ink/60 mb-2">회독 선택 <span class="text-ink/40 font-normal">— 1년에 몇 번 통독할까요? (하루 분량이 자동 조정)</span></p>
        <div id="planBtns" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- 시작일 -->
      <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-2">
        <label class="text-xs font-semibold text-ink/60">시작일 <input id="startInput" type="date" class="ml-1 border border-ink/15 rounded-lg px-2.5 py-1.5 text-sm"/></label>
        <button onclick="goToday()" class="text-xs font-semibold text-gold hover:underline">오늘 분량으로 이동 ↓</button>
        <button onclick="resetPlan()" class="text-xs text-ink/40 hover:text-red-500 ml-auto">진도 초기화</button>
      </div>
    </div>

    <!-- 오늘의 분량 -->
    <div id="todayCard" class="bg-ink text-paper rounded-2xl shadow-card p-5 mb-6"></div>

    <!-- 로그인 안내 -->
    <div id="loginHint" class="hidden bg-gold/10 border border-gold/30 rounded-xl px-4 py-3 mb-6 text-sm text-ink/70">
      💡 <b class="text-ink">로그인</b>하면 진도가 계정에 저장되어 휴대폰·PC 어디서나 이어집니다. <a href="mylearning.html" class="text-gold font-semibold hover:underline">로그인하기 →</a>
    </div>

    <!-- 전체 통독표 -->
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold">전체 통독표 <span id="planLabel" class="text-sm font-semibold text-gold">1독</span></h2>
      <p class="text-xs text-ink/40">날짜를 눌러 ✓ 체크</p>
    </div>
    <div id="planList" class="space-y-1.5"></div>
  </main>

  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { flowType: 'implicit', autoRefreshToken: false, lock: async (_n,_t,fn)=>await fn() } });

    // ===== 성경 66권 (장수) — 총 1,189장 =====
    const BOOKS = [
      ['창세기',50],['출애굽기',40],['레위기',27],['민수기',36],['신명기',34],
      ['여호수아',24],['사사기',21],['룻기',4],['사무엘상',31],['사무엘하',24],
      ['열왕기상',22],['열왕기하',25],['역대상',29],['역대하',36],['에스라',10],
      ['느헤미야',13],['에스더',10],['욥기',42],['시편',150],['잠언',31],
      ['전도서',12],['아가',8],['이사야',66],['예레미야',52],['예레미야애가',5],
      ['에스겔',48],['다니엘',12],['호세아',14],['요엘',3],['아모스',9],
      ['오바댜',1],['요나',4],['미가',7],['나훔',3],['하박국',3],
      ['스바냐',3],['학개',2],['스가랴',14],['말라기',4],
      ['마태복음',28],['마가복음',16],['누가복음',24],['요한복음',21],['사도행전',28],
      ['로마서',16],['고린도전서',16],['고린도후서',13],['갈라디아서',6],['에베소서',6],
      ['빌립보서',4],['골로새서',4],['데살로니가전서',5],['데살로니가후서',3],['디모데전서',6],
      ['디모데후서',4],['디도서',3],['빌레몬서',1],['히브리서',13],['야고보서',5],
      ['베드로전서',5],['베드로후서',3],['요한일서',5],['요한이서',1],['요한삼서',1],
      ['유다서',1],['요한계시록',22]
    ];
    const CHAPTERS = []; // {b, c}
    BOOKS.forEach((bk, bi) => { for(let c=1;c<=bk[1];c++) CHAPTERS.push({b:bi, c}); });
    const TOTAL = CHAPTERS.length; // 1189
    const DAYS = 365;

    // 연속 장들을 책별 범위 문자열로 — 예: "창세기 1–4장", "창세기 50장 · 출애굽기 1–2장"
    function rangify(items){
      const parts=[]; let i=0;
      while(i<items.length){
        const b=items[i].b; let s=items[i].c, e=items[i].c; let j=i+1;
        while(j<items.length && items[j].b===b && items[j].c===e+1){ e=items[j].c; j++; }
        const name=BOOKS[b][0];
        parts.push(s===e ? `${name} ${s}장` : `${name} ${s}–${e}장`);
        i=j;
      }
      return parts.join(' · ');
    }
    // N독 → 365일 일일 분량 문자열 배열
    function buildPlan(N){
      const seqLen = TOTAL*N; const out=[];
      for(let d=0; d<DAYS; d++){
        const a=Math.floor(d*seqLen/DAYS), z=Math.floor((d+1)*seqLen/DAYS);
        const items=[]; for(let i=a;i<z;i++) items.push(CHAPTERS[i % TOTAL]);
        out.push(rangify(items));
      }
      return out;
    }

    // ===== 상태 =====
    const LS_KEY='biblyBiblePlan';
    let state = { plan:1, start:todayISO(), checked:new Set() };
    let PLAN = buildPlan(1);
    let USER = (readStoredSession()||{}).user || null;
    let saveTimer=null;

    function todayISO(){ const d=new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; } // 로컬 날짜(UTC 변환 금지)
    function readStoredSession(){ try{ for(const k of Object.keys(localStorage)){ if(!/auth-token/.test(k)) continue; const v=JSON.parse(localStorage.getItem(k)); const s=(v&&v.user)?v:(v&&v.currentSession)?v.currentSession:null; if(s&&s.user){ if(s.expires_at&&s.expires_at*1000<Date.now()) return null; return s; } } }catch(e){} return null; }
    function dateOf(dayNum){ const d=new Date(state.start+'T00:00:00'); d.setDate(d.getDate()+(dayNum-1)); return d; }
    const WD=['일','월','화','수','목','금','토'];
    function fmtDate(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; }
    function todayNum(){ const s=new Date(state.start+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.floor((t-s)/86400000)+1; }

    // ===== 저장/불러오기 =====
    function loadLocal(){ try{ const o=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(o){ state.plan=o.plan||1; state.start=o.start||todayISO(); state.checked=new Set(o.checked||[]); } }catch(e){} }
    function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({ plan:state.plan, start:state.start, checked:[...state.checked] })); }catch(e){} }
    function scheduleSave(){
      persistLocal();
      if(!USER) return;
      clearTimeout(saveTimer);
      saveTimer=setTimeout(async ()=>{
        try{ await sb.from('bible_reading').upsert({ user_id:USER.id, plan_reads:state.plan, start_date:state.start, checked:[...state.checked], updated_at:new Date().toISOString() }, { onConflict:'user_id' }); }catch(e){}
      }, 700);
    }
    async function loadCloud(){
      if(!USER) return;
      document.getElementById('cloudText').textContent='계정 동기화 중…';
      try{
        const { data } = await sb.from('bible_reading').select('plan_reads,start_date,checked').eq('user_id', USER.id).maybeSingle();
        if(data){
          state.plan=data.plan_reads||1; state.start=(data.start_date||todayISO()).slice(0,10); state.checked=new Set(data.checked||[]);
          PLAN=buildPlan(state.plan); persistLocal();
          document.getElementById('cloudText').textContent='✅ 계정에 저장됨';
        } else {
          // 클라우드에 없으면 로컬 진도를 올림
          document.getElementById('cloudText').textContent='✅ 계정에 저장됨';
          scheduleSave();
        }
      }catch(e){ document.getElementById('cloudText').textContent='기기에 저장됨'; }
      renderAll();
    }

    // ===== 렌더 =====
    function renderPlanBtns(){
      const box=document.getElementById('planBtns');
      box.innerHTML=[1,2,3,4,5].map(n=>{
        const on=state.plan===n;
        const perDay=Math.round(TOTAL*n/DAYS);
        return `<button onclick="setPlan(${n})" class="px-3.5 py-2 rounded-xl text-sm font-semibold border transition ${on?'bg-ink text-paper border-ink':'bg-white text-ink/70 border-ink/15 hover:border-gold'}">${n}독<span class="block text-[10px] font-normal ${on?'text-paper/60':'text-ink/40'}">하루 ~${perDay}장</span></button>`;
      }).join('');
    }
    function renderProgress(){
      const done=state.checked.size, pct=Math.round(done/DAYS*100);
      document.getElementById('pctText').textContent=pct+'%';
      document.getElementById('doneText').textContent=`· ${done} / ${DAYS}일`;
      document.getElementById('pctBar').style.width=pct+'%';
      // 연속 일수(오늘부터 거꾸로 연속 체크)
      let streak=0; const tn=todayNum();
      for(let d=Math.min(tn,DAYS); d>=1; d--){ if(state.checked.has(d)) streak++; else break; }
      document.getElementById('streakText').textContent=`🔥 연속 ${streak}일`;
      document.getElementById('planLabel').textContent=state.plan+'독';
    }
    function renderToday(){
      const tn=todayNum(); const card=document.getElementById('todayCard');
      if(tn<1){ card.innerHTML=`<p class="text-paper/70 text-sm">시작일이 아직 오지 않았어요. 시작일을 오늘로 바꾸면 바로 시작할 수 있어요.</p>`; return; }
      if(tn>DAYS){ card.innerHTML=`<p class="text-2xl">🎉</p><p class="font-bold text-lg mt-1">1년 통독 일정을 완주했습니다!</p><p class="text-paper/70 text-sm mt-1">새로운 회독을 원하면 시작일을 오늘로 바꿔 다시 시작하세요.</p>`; return; }
      const checked=state.checked.has(tn);
      card.innerHTML=`
        <div class="flex items-center justify-between gap-3 mb-1">
          <p class="text-gold text-xs font-bold tracking-widest">오늘 · DAY ${tn} <span class="text-paper/50 font-normal">/ ${fmtDate(dateOf(tn))}</span></p>
          <span class="text-paper/55 text-xs">${state.plan}독 기준</span>
        </div>
        <p class="text-xl md:text-2xl font-bold leading-snug">${PLAN[tn-1]}</p>
        <button onclick="toggleDay(${tn})" class="mt-4 w-full py-3 rounded-xl font-bold transition ${checked?'bg-paper/15 text-paper':'bg-gold text-white hover:opacity-90'}">${checked?'✓ 오늘 분량 완료됨 (취소)':'오늘 분량 읽음 ✓'}</button>`;
    }
    function renderList(){
      const tn=todayNum(); const box=document.getElementById('planList');
      let html='', lastMonth='';
      for(let d=1; d<=DAYS; d++){
        const dt=dateOf(d); const mk=`${dt.getFullYear()}-${dt.getMonth()}`;
        if(mk!==lastMonth){ lastMonth=mk; html+=`<p class="text-xs font-bold text-ink/40 pt-3 pb-1">${dt.getFullYear()}년 ${dt.getMonth()+1}월</p>`; }
        const checked=state.checked.has(d); const isToday=d===tn;
        html+=`<div id="day-${d}" class="day-row flex items-center gap-3 rounded-xl border px-3 py-2.5 cursor-pointer transition ${checked?'bg-gold/8 border-gold/30':'bg-white border-ink/8 hover:border-ink/20'} ${isToday?'ring-2 ring-gold':''}" onclick="toggleDay(${d})">
          <span class="shrink-0 w-6 h-6 rounded-md flex items-center justify-center text-sm font-bold ${checked?'bg-gold text-white':'bg-ink/8 text-ink/40'}">${checked?'✓':''}</span>
          <span class="shrink-0 text-[11px] text-ink/40 w-16">DAY ${d}<br>${dt.getMonth()+1}/${dt.getDate()}</span>
          <span class="text-sm ${checked?'text-ink/50 line-through':'text-ink/80'} ${isToday?'font-bold':''}">${PLAN[d-1]}</span>
          ${isToday?'<span class="ml-auto shrink-0 text-[10px] font-bold text-gold">오늘</span>':''}
        </div>`;
      }
      box.innerHTML=html;
    }
    function renderAll(){ renderPlanBtns(); renderProgress(); renderToday(); renderList(); document.getElementById('startInput').value=state.start; document.getElementById('loginHint').classList.toggle('hidden', !!USER); if(!USER) document.getElementById('cloudText').textContent='기기에 저장됨'; }

    // ===== 액션 =====
    function setPlan(n){ state.plan=n; PLAN=buildPlan(n); scheduleSave(); renderAll(); }
    function toggleDay(d){ if(state.checked.has(d)) state.checked.delete(d); else state.checked.add(d); scheduleSave(); renderProgress(); renderToday(); renderList(); }
    function goToday(){ const tn=todayNum(); const el=document.getElementById('day-'+Math.max(1,Math.min(tn,DAYS))); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }
    function resetPlan(){ if(!confirm('통독 진도(체크 표시)를 모두 초기화할까요?')) return; state.checked=new Set(); scheduleSave(); renderAll(); }
    document.getElementById('startInput').addEventListener('change', e=>{ if(e.target.value){ state.start=e.target.value; scheduleSave(); renderAll(); } });

    // ===== 부트 =====
    loadLocal(); PLAN=buildPlan(state.plan); renderAll();
    sb.auth.onAuthStateChange((_e,s)=>{ const u=(s&&s.user)||null; if(u){ USER=u; loadCloud(); } });
    if(USER) loadCloud();
  </script>
</body>
</html>
